CONSTANTS
  DischargeCompleteUnion = TRUE
  UseCanonicalStartupOrder = TRUE
  ResumeCompleteUnionAfterCrash = TRUE
  ResumeCanonicalOrderAfterCrash = TRUE
  PersistTerminalBeforeAdvance = TRUE
  BlockProducerWhileStartupPending = TRUE
  RequireExactReplayBinding = TRUE
  RejectOrphanTerminalWaiter = TRUE
  RejectNegativeTerminalWaiter = TRUE
  RejectOwnerRequestMismatchWaiter = TRUE
  RejectAdmissionTerminalDuplicate = TRUE
  ConvertRestartResponseOnDecision = TRUE
  ConvertLiveResponseBeforeOrdinal = TRUE
  PreservePreFenceResponseUntilCheckedDrain = TRUE
  RejectNegativeRetryBeforeOrdinal = TRUE
  BlockTerminalResurrection = TRUE
  RequireCanonicalBodyAtStartup = TRUE
  PrunePredecessorFamily = TRUE
  TerminalizeReceiverClose = TRUE
  UseFullFrozenRosterFanout = TRUE
  RequireQcSignerResponseAuthority = TRUE
  EnforceRawContextGate = TRUE
  AvoidTerminalReplayResigning = TRUE
  SignOnlyResponseStartupTerminals = TRUE
  CompletePreparedCarrierDecisionDrain = TRUE

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANT TypeInvariant
INVARIANT RestartUnionDischargesEveryAdmission
INVARIANT RestartUnionUsesCanonicalOrder
INVARIANT InterruptedDischargePersistsBeforeAdvance
INVARIANT InterruptedRestartResumesWithoutReopening
INVARIANT CrashResumeDischargesEveryRemainingAdmission
INVARIANT CrashResumeUsesCanonicalRemainingOrder
INVARIANT ProducerHiddenUntilStartupDischarged
INVARIANT TerminalReplayIsExactAndOrdinalStable
INVARIANT RestartDecisionSupersessionConvertsResponseAtomically
INVARIANT LiveDecisionSupersessionConvertsResponseBeforeOrdinal
INVARIANT PreFenceCarrierDefersDecisionRewriteUntilCheckedDrain
INVARIANT PreparedCarrierDecisionDrainIsAtomicAndOrdinalStable
INVARIANT CorruptTerminalWaiterFailStops
INVARIANT OwnerRequestMismatchWaiterFailStops
INVARIANT DuplicateAdmissionTerminalFailsStartupAndPreservesState
INVARIANT NegativeRetryConsumesNoFreshOrdinal
INVARIANT TerminalResponseRetryUsesFreshCarrierWithoutLifecycleResurrection
INVARIANT MissingOrCorruptBodyFailStopsAndPreservesState
INVARIANT SuccessorTerminalPrunesPredecessorFamily
INVARIANT ReceiverClosePublishesTypedTerminalWithoutDebt
INVARIANT CertifiedRequestFansOutToFullFrozenRoster
INVARIANT OnlyFrozenQcSignersCanRespond
INVARIANT RawContextGateSeparatesLifecycleAuthority
INVARIANT TerminalReplayAndDecisionConversionDoNotResignOrMintOrdinal
INVARIANT UnsealedRestartResponsesSignExactlyOnce
