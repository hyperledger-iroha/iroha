  DischargeCompleteUnion = TRUE
  UseCanonicalStartupOrder = TRUE
  ResumeCompleteUnionAfterCrash = TRUE
  ResumeCanonicalOrderAfterCrash = TRUE
  PersistTerminalBeforeAdvance = TRUE
  BlockProducerWhileStartupPending = TRUE
  RequireExactReplayBinding = TRUE
  RejectOrphanTerminalWaiter = TRUE
  RejectNegativeTerminalWaiter = TRUE
  RejectOwnerRequestMismatchWaiter = TRUE
  RejectAdmissionTerminalDuplicate = FALSE
  ConvertRestartResponseOnDecision = TRUE
  ConvertLiveResponseBeforeOrdinal = TRUE
  PreservePreFenceResponseUntilCheckedDrain = TRUE
  RejectNegativeRetryBeforeOrdinal = TRUE
  BlockTerminalResurrection = TRUE
  RequireCanonicalBodyAtStartup = TRUE
  PrunePredecessorFamily = TRUE
  TerminalizeReceiverClose = TRUE
  UseFullFrozenRosterFanout = TRUE
  RequireQcSignerResponseAuthority = TRUE
  EnforceRawContextGate = TRUE
  AvoidTerminalReplayResigning = TRUE
  SignOnlyResponseStartupTerminals = TRUE
  CompletePreparedCarrierDecisionDrain = TRUE

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANT TypeInvariant
