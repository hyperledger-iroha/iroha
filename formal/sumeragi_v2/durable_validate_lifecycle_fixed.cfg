INIT Init
NEXT Next

CONSTANTS
  EnabledScenarios = {
    "GuardedCompletion",
    "SidecarWake",
    "RejectedOutput",
    "RestartReplay",
    "AmbiguousPostFsync"
  }
  GuardExactCompletion = TRUE
  PreserveSidecarWaitingOrdinal = TRUE
  ReserveRejectedOutputBeforeClaim = TRUE
  RestoreReplayAuthorityAfterRestart = TRUE
  FailStopOnAmbiguousPostFsync = TRUE

CHECK_DEADLOCK FALSE

INVARIANT TypeInvariant
INVARIANT ReadyWaitingGuardedLifecycle
INVARIANT GuardedCompletionMatchesClaimedRow
INVARIANT ExactSidecarWakeReusesWaitingRow
INVARIANT RejectedResultClaimHasReservedOutput
INVARIANT RejectedOutputConsumesExactlyOneReservation
INVARIANT RestartReopensMandatoryReplayAuthority
INVARIANT AmbiguousPostFsyncRequiresFailStop
