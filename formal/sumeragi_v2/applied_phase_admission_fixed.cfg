INIT Init
NEXT Next

CONSTANTS
  EnabledScenarios = {
    "ExactAppliedRetry",
    "ConflictPayload",
    "ConflictPolarity",
    "MalformedPhaseTag",
    "StalePhaseTag"
  }
  SuppressAppliedBeforeOrdinalAllocation = TRUE
  ClearPhysicalOwnerOnApply = TRUE
  RejectConflictingEvidence = TRUE
  ValidatePhaseTagBeforeLookup = TRUE

