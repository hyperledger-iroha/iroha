INVARIANT TypeInvariant
INVARIANT PhaseEvidenceTracksIdentity
INVARIANT AtMostOnePhysicalOwnerPerPhase
INVARIANT UnseenPhaseIsMarkerFree
INVARIANT BusyUnappliedHasExactlyOneServiceableOwner
INVARIANT AppliedPhaseHasNoPhysicalOwner
INVARIANT BusyExactRetryKeepsOneServiceableOwner
INVARIANT AppliedExactRetryPreservesOrdinal
INVARIANT AppliedExactRetryDoesNotInsert
INVARIANT ConflictingEvidenceFailsClosed
INVARIANT MalformedPhaseTagFailsClosed
INVARIANT StalePhaseTagIsMarkerFree
INVARIANT StalePhaseTagPreservesOrdinal
