CONSTANTS
  Devices = {d1, d2}
  RequestIds = {q1, q2}
  CreditIds = {c1, c2, c3}
  MintIds = {m1, m2}
  VoucherIds = {v1, v2}
  RotationIds = {r1, r2}
  InitialOnlinePerDevice = 4
  MaxAmount = 4
  MaxLogicalSequence = 8
  MaxHardwareCounter = 3
  MaxEpoch = 3
  MaxTime = 40
  NoState = noState
  NoDigest = noDigest
  NoAck = noAck
  ConflictingDigest = conflictingDigest
  ModelDevice1 = d1
  ModelDevice2 = d2
  ModelRequest1 = q1
  ModelRequest2 = q2
  ModelCredit1 = c1
  ModelCredit2 = c2
  ModelCredit3 = c3
  ModelMint1 = m1
  ModelMint2 = m2
  ModelVoucher1 = v1
  ModelVoucher2 = v2
  ModelRotation1 = r1
  ModelRotation2 = r2

SPECIFICATION Spec

\* Every finite constant above exists only to make TLC exploration possible.
\* None is a protocol hop, history, receipt, fan-in, request-use, replay,
\* proof-depth, storage, or money-usage limit.
CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  ThreeMessageWireShape
  RequestsNeverBindReceiverState
  DistinctPaymentsMayShareARequest
  SenderCommitWithinRequestWindow
  PaymentsBindExactRequests
  HardwareAuthorityIsRecursive
  ReceiveFoldUsesReplayNonmembership
  ExactNextNonForking
  EveryTransitionWasPrepared
  SameIdDifferentBytesAreRejected
  AcknowledgementsFollowDurableStaging
  ExactDuplicateReturnsSameDurableAcknowledgement
  RotationCarriesCompleteState
  ReserveEquation
  LiabilityConservation
  TotalValueConservation
  SenderSplitIsConservative
  NoCountBasedReceiveRejection
  CommittedPaymentsRemainReceivable
  OutboxNeverFreezesSenderRemainder
  MintRequiresFinalityAndAuthorization
  RedemptionSplitsAreFullOrPartial
  AppliedRedemptionNullifiersAreUnique
  PublicStateAndProofShapeIsHistoryIndependent

PROPERTIES
  CumulativeEvidenceNeverShrinks
  PostCommitArtifactsNeverChange
