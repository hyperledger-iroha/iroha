  InitialActiveSuite = s1
  InitialOnlinePerDevice = 2
  MaxAmount = 4
  MaxSequence = 2
  InboxCapacity = 2
  OutboxCapacity = 2
  ModelDevice1 = d1
  ModelCredit1 = c1
  ModelCredit2 = c2
  ModelCredit3 = c3
  ModelCredit4 = c4
  ModelIntent1 = i1
  ModelIntent2 = i2
  ModelIntent3 = i3
  ModelIntent4 = i4
  ModelTicket1 = t1
