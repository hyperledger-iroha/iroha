[package]
name = "mochi-core"
autotests = false
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Shared-workspace desktop observations and transaction composition."

[lib]
path = "src/lib.rs"

[features]
test = []

[dependencies]
iroha_model_base = { workspace = true }
iroha_config.workspace = true
iroha = { workspace = true }
iroha_deploy = { workspace = true }
iroha_contract_deploy = { path = "../../crates/iroha_contract_deploy" }
musubi = { path = "../../crates/musubi" }
iroha_crypto = { workspace = true, features = ["consensus"], default-features = false }
iroha_data_model = { workspace = true, features = ["application-model", "http", "transparent_api"], default-features = false }
iroha_executor_data_model = { workspace = true }
iroha_primitives = { workspace = true }
iroha_test_samples = { workspace = true }
iroha_torii_shared = { workspace = true }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
thiserror = { workspace = true }
color-eyre = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tokio-stream = { workspace = true }
futures = { workspace = true, features = ["std", "async-await"] }
url = { workspace = true }
iroha_version = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
tempfile = { workspace = true }
httpmock = "0.8.2"

[[test]]
name = "composer_drafts"
path = "tests/composer_drafts.rs"
