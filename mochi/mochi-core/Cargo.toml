[package]
name = "mochi-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Core supervisor library for the MOCHI local Iroha network GUI."

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("compact-len"))',
    'cfg(feature, values("packed-struct"))',
    'cfg(feature, values("schema-structural"))',
] }

[lib]
path = "src/lib.rs"

[features]
default = ["governance", "bridge"]
governance = []
bridge = []
test-support = []

[dependencies]
iroha_crypto = { workspace = true, features = ["consensus"], default-features = false }
iroha_data_model = { workspace = true, features = ["application-model", "http", "transparent_api"], default-features = false }
iroha_executor_data_model = { workspace = true }
iroha_genesis = { workspace = true }
iroha_primitives = { workspace = true }
iroha_test_samples = { workspace = true }
iroha_telemetry = { workspace = true }
iroha_torii_shared = { workspace = true }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
thiserror = { workspace = true }
toml = { workspace = true }
color-eyre = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tokio-tungstenite = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true, features = ["std", "async-await"] }
url = { workspace = true }
iroha_version = { workspace = true }
once_cell = { workspace = true }
base64 = { workspace = true }
izanami = { path = "../../crates/izanami" }
blake3 = { workspace = true }
rand = { workspace = true }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc", "std"] }

[dev-dependencies]
tempfile = { workspace = true }
httpmock = "0.8.2"
# Preserve the reviewed lock graph without restoring retired production edges.
iroha_config.workspace = true
iroha_core.workspace = true
