[package]
name = "mochi-integration"
autobins = false
autotests = false
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Integration harnesses for the MOCHI supervisor and Torii client."

[lib]
path = "src/lib.rs"

[[bin]]
name = "kagami_mock"
path = "src/bin/kagami_mock.rs"
required-features = ["dev-tools"]

[features]
dev-tools = ["mochi-core/test"]

[dependencies]
color-eyre = { workspace = true }
eyre = { workspace = true }
axum = { workspace = true, features = ["http1", "macros", "tokio", "ws"] }
iroha_crypto = { workspace = true, features = ["consensus"], default-features = false }
iroha_data_model = { workspace = true, features = ["application-model"], default-features = false }
iroha_telemetry = { workspace = true }
iroha_torii_shared = { workspace = true }
mochi-core = { path = "../mochi-core" }
parking_lot = { workspace = true }
norito = { workspace = true, features = ["node-codec"], default-features = false }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }
# Preserve the reviewed lock graph without restoring retired production edges.
iroha_config.workspace = true
iroha_core = { workspace = true, default-features = false }
iroha_genesis.workspace = true

[[test]]
name = "readiness_smoke"
path = "tests/readiness_smoke.rs"

[[test]]
name = "supervisor"
path = "tests/supervisor.rs"
required-features = ["dev-tools"]
