groups:
  - name: sorafs-governance-dag
    interval: 1m
    rules:
      - alert: SoraFSGovernanceDagPublishFailures
        expr: increase(sorafs_governance_dag_publish_total{result="failure"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "SoraFS Governance DAG publication failures detected"
          description: |
            Governance DAG publication failed on sink {{ $labels.sink }} within the last
            15 minutes. Check the fixed-profile Kubo
            publisher and authenticated signed-head service before retrying the evidence bundle.
      - alert: SoraFSGovernanceDagValidationFailures
        expr: increase(sorafs_governance_dag_validation_failure_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "SoraFS Governance DAG validation failures detected"
          description: |
            The supervised Governance DAG service rejected authenticated publication or mirror
            state within the last 15 minutes. Investigate before restoring readiness.
      - alert: SoraFSGovernanceDagPinLagHigh
        expr: sorafs_governance_dag_ipfs_pin_lag_seconds > 1800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SoraFS Governance DAG Kubo pin lag is high"
          description: |
            Verified Kubo pin lag has exceeded 30 minutes for 10 minutes. Check authenticated
            Kubo ingress, object repair, and the rotating retained-object audit.
      - alert: SoraFSGovernanceDagMirrorDrift
        expr: sorafs_governance_dag_mirror_drift > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SoraFS Governance DAG mirror drift detected"
          description: |
            The supervised service has been unable to prove that its mirror, sealed checkpoint,
            and public objects are coherent for five minutes. Keep public reads unavailable until
            deterministic recovery and a complete coherent reconciliation succeed.
      - alert: SoraFSGovernanceDagBacklogHigh
        expr: sorafs_governance_dag_backlog > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SoraFS Governance DAG publication backlog is high"
          description: |
            Governance DAG sink {{ $labels.sink }} has more than ten queued publication items
            for 10 minutes. Check the publisher worker, mirror datastore, and pinning queue.
      - alert: SoraFSGovernanceDagHeadStale
        expr: sorafs_governance_dag_head_age_seconds > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "SoraFS Governance DAG head is stale"
          description: |
            Governance DAG sink {{ $labels.sink }} has not advanced its verified head for more
            than one hour. Confirm ingest is running and compare the head against local
            filesystem evidence.
      - alert: SoraFSGovernanceDagNoRecentPublish
        expr: time() - max by (sink) (sorafs_governance_dag_last_publish_timestamp_seconds) > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "SoraFS Governance DAG has no recent successful publication"
          description: |
            Governance DAG sink {{ $labels.sink }} has no successful publication timestamp
            within the last hour. Verify the fixed-profile Kubo publisher and authenticated
            signed-head service before publishing rollout evidence.
