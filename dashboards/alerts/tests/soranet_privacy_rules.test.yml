rule_files:
  - ../soranet_privacy_rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'soranet_privacy_circuit_events_total{kind="downgrade"}'
        values: '0 180 360 540 720 900 1080 1260 1440'
      - series: 'soranet_privacy_bucket_suppressed'
        values: '1 1 1 1 1 1 1 1 1'
      - series: 'soranet_privacy_last_poll_unixtime'
        values: '180 180 180 180 180 180 180 180 180'
      - series: 'soranet_privacy_collector_enabled'
        values: '1 1 1 0 0 0 0 0 0'
    alert_rule_test:
      - alertname: SoranetPrivacyDowngradeSpike
        eval_time: 4m
        exp_alerts: []
      - alertname: SoranetPrivacyDowngradeSpike
        eval_time: 9m
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Downgrade rejection spike"
              description: "Downgrade rejects are breaching the configured threshold."
      - alertname: SoranetPrivacySuppressedBuckets
        eval_time: 4m
        exp_alerts: []
      - alertname: SoranetPrivacySuppressedBuckets
        eval_time: 8m
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Privacy buckets suppressed"
              description: "All reported buckets are suppressed; investigate collector health and contributor thresholds."
      - alertname: SoranetPrivacyCollectorIdle
        eval_time: 4m
        exp_alerts: []
      - alertname: SoranetPrivacyCollectorIdle
        eval_time: 8m
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Privacy collector idle"
              description: "No SoraNet privacy polls have succeeded in the last 5 minutes."
      - alertname: SoranetPrivacyCollectorDisabled
        eval_time: 4m
        exp_alerts: []
      - alertname: SoranetPrivacyCollectorDisabled
        eval_time: 8m
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Privacy collector disabled"
              description: "The SoraNet privacy collector is disabled or failed to start; SNNet-5 guard adoption must block until it is re-enabled."
