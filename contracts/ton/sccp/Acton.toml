[package]
name = "iroha-sccp-ton"
description = "SCCP v1 TON destination: Taira XOR Jetton minter with the bridge built in, wallets and consumption buckets"
version = "1.0.0"
license = "Apache-2.0"

[toolchain]
acton = "1.2.0"

[contracts.SccpTairaXorMinter]
display-name = "SccpTairaXorMinter"
src = "contracts/SccpTairaXorMinter.tolk"
depends = []

[contracts.SccpTairaXorWallet]
display-name = "SccpTairaXorWallet"
src = "contracts/SccpTairaXorWallet.tolk"
depends = []

[contracts.SccpConsumedBucket]
display-name = "SccpConsumedBucket"
src = "contracts/SccpConsumedBucket.tolk"
depends = []

[test]
fail-on-diff = false

[fmt]
width = 100
ignore = ["wrappers"]

[import-mappings]
acton = ".acton"
contracts = "contracts"
gen = "gen"
tests = "tests"
wrappers = "wrappers"
