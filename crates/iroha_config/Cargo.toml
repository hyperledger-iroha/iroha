[package]
name = "iroha_config"
autotests = false

edition.workspace = true
version.workspace = true
authors.workspace = true

license.workspace = true

[lints]
workspace = true

[features]
default = ["gost", "sm"]
gost = ["iroha_crypto/gost", "iroha_data_model/gost"]
sm = ["iroha_crypto/sm", "iroha_data_model/sm"]
sm-ffi-openssl = ["sm", "iroha_crypto/sm-ffi-openssl"]

[[test]]
name = "iroha_config_integration"
path = "tests/iroha_config_integration.rs"

[[test]]
name = "taira_config_contracts"
path = "tests/taira_config_contracts.rs"

[[test]]
name = "compact_templates"
path = "tests/compact_templates.rs"

[[test]]
name = "sccp_node_config"
path = "tests/sccp_node_config.rs"

[[test]]
name = "lane_metadata_allocation"
path = "tests/lane_metadata_allocation.rs"

[dependencies]
iroha_allocation = { workspace = true }
iroha_accel = { workspace = true }
iroha_model_base = { workspace = true }
fastpq_isi = { path = "../fastpq_isi" }
iroha_service_model = { workspace = true }
iroha_config_base = { workspace = true }
iroha_data_model = { workspace = true, default-features = false }
iroha_primitives = { workspace = true }
iroha_crypto = { workspace = true, default-features = false, features = ["consensus", "pqc"] }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
error-stack = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "ansi", "env-filter"] }
log = "0.4.28"
url.workspace = true
strum = { workspace = true, features = ["derive", "std"] }
thiserror = { workspace = true }
nonzero_ext = { workspace = true }
hex = { workspace = true, features = ["std"] }
soranet_pq = { workspace = true }
iroha_torii_shared = { workspace = true }
sorafs_manifest = { path = "../sorafs_manifest", default-features = false }
toml = { workspace = true }
zeroize = { workspace = true }


[dev-dependencies]
expect-test = { workspace = true }
assertables = { workspace = true }
iroha_crypto = { workspace = true, default-features = false, features = ["consensus", "gost"] }
# The checked-in Taira validator template admits the BLS curve id (3) in
# `crypto.curves.allowed_curve_ids`; the data model's curve registry knows it only with `bls`.
iroha_data_model = { workspace = true, default-features = false, features = ["bls"] }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
