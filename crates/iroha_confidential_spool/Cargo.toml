[package]
name = "iroha_confidential_spool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Authenticated process-local storage for bounded confidential chunks"
repository.workspace = true

[lints]
workspace = true

[dependencies]
aead = { version = "0.6.0-rc.3", default-features = false, features = ["alloc"] }
blake3 = { workspace = true }
chacha20poly1305 = { version = "0.11.0-rc.2", default-features = false, features = ["alloc", "getrandom", "rand_core", "zeroize"] }
# The AEAD crate does not forward its zeroize feature to Poly1305. This direct
# edge feature-unifies its internal Poly1305 instance so retained MAC state is
# wiped on drop.
poly1305 = { version = "0.9.1", default-features = false, features = ["zeroize"] }
rand_core = { version = "0.9.3", default-features = false, features = ["os_rng", "std"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc", "std"] }
