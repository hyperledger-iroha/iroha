[package]
name = "ivm_abi"
version.workspace = true
edition = "2024"
authors = ["Iroha Contributors"]
description = "Shared ABI definitions for the Iroha Virtual Machine"
license = "Apache-2.0"
repository = "https://github.com/hyperledger-iroha/iroha"
documentation = "https://docs.rs/ivm_abi"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("compact-len"))',
    'cfg(feature, values("packed-struct"))',
    'cfg(feature, values("schema-structural"))',
] }

[dependencies]
iroha_data_model = { path = "../iroha_data_model", default-features = false, features = ["transparent_api", "json", "governance"] }
iroha_crypto = { path = "../iroha_crypto", default-features = false, features = ["std", "json"] }
norito = { path = "../norito", default-features = false, features = ["node-codec"] }
