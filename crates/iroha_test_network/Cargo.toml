[package]
name = "iroha_test_network"

edition.workspace = true
version.workspace = true
authors.workspace = true

license.workspace = true

[features]
default = []
# Explicit developer-only artifact selection; native protocol behavior is unchanged.
dev-tools = []

[[bin]]
name = "taira_beacon_bootstrap"
path = "src/bin/taira_beacon_bootstrap.rs"
required-features = ["dev-tools"]

[[test]]
name = "taira_consensus_contracts"
path = "tests/taira_consensus_contracts.rs"

[dependencies]
iroha_allocation = { workspace = true }
iroha_model_base = { workspace = true }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
iroha.workspace = true

iroha_executor_data_model.workspace = true
iroha_crypto = { workspace = true, features = ["consensus"], default-features = false }
iroha_config.workspace = true
iroha_data_model = { workspace = true, features = ["application-model", "transparent_api"], default-features = false }
iroha_primitives.workspace = true
iroha_genesis.workspace = true
iroha_core = { workspace = true, default-features = false, features = ["node"] }
iroha_core_zk = { workspace = true, default-features = false }
iroha_version = { workspace = true }
iroha_test_samples.workspace = true
iroha_torii_shared.workspace = true
base64.workspace = true
url.workspace = true

color-eyre.workspace = true
p256 = { version = "0.13.2", default-features = false, features = ["std", "ecdsa"] }
rand.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "process", "sync", "io-util", "net", "signal"] }
futures = { workspace = true, features = ["std", "async-await"] }
toml = { workspace = true }
fslock = "0.2.1"
nix = { version = "0.30.1", features = ["signal", "resource", "fs", "user"] }
petname = "2.0.2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nonzero_ext = { workspace = true }
zeroize.workspace = true

[dev-dependencies]
iroha_sumeragi = { workspace = true }
iroha_core = { workspace = true, default-features = false, features = ["iroha-core-tests"] }
irohad_lib = { path = "../irohad", default-features = false, features = ["daemon"] }
