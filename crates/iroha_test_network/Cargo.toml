[package]
name = "iroha_test_network"

edition.workspace = true
version.workspace = true
authors.workspace = true

license.workspace = true

[features]
default = []
# The only workspace edge allowed to expose core's deterministic release
# evidence API. The daemon intentionally has no corresponding forwarding
# feature.
privacy-release-evidence = ["iroha_core/privacy-release-evidence"]

[[bin]]
name = "taira_privacy_release_runner"
path = "src/bin/taira_privacy_release_runner.rs"
required-features = ["privacy-release-evidence"]

[dependencies]
norito = { workspace = true, default-features = false, features = ["node-codec"] }
iroha.workspace = true

iroha_executor_data_model.workspace = true
iroha_crypto = { workspace = true, features = ["consensus"], default-features = false }
iroha_config.workspace = true
iroha_data_model = { workspace = true, features = ["application-model", "transparent_api"], default-features = false }
iroha_primitives.workspace = true
iroha_genesis.workspace = true
iroha_core = { workspace = true, default-features = false, features = ["node"] }
iroha_version = { workspace = true, features = ["json"] }
iroha_futures.workspace = true
iroha_test_samples.workspace = true
iroha_telemetry.workspace = true
base64.workspace = true
url.workspace = true

color-eyre.workspace = true
rand.workspace = true
tempfile.workspace = true
unique_port = "0.2.1"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "process", "sync", "io-util", "net", "signal"] }
futures = { workspace = true, features = ["std", "async-await"] }
toml = { workspace = true }
fslock = "0.2.1"
derive_more = { workspace = true }
nix = { version = "0.30.1", features = ["signal", "resource", "fs"] }
petname = "2.0.2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nonzero_ext = { workspace = true }
