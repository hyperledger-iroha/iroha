[package]
name = "iroha_core"
autotests = false
autobins = false
build = "build.rs"

edition.workspace = true
version.workspace = true
authors.workspace = true

description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

license.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "fastpq_fixture_capture"
path = "src/bin/fastpq_fixture_capture.rs"
required-features = ["dev-tools"]

[[bin]]
name = "pk2_bridge_finality_verify"
path = "src/bin/pk2_bridge_finality_verify.rs"
required-features = ["dev-tools"]

[[bin]]
name = "privacy_exact12_action_driver"
path = "src/bin/privacy_exact12_action_driver.rs"
required-features = ["privacy-release-evidence"]

[lints]
workspace = true

[features]
# The node surface is selected explicitly by shipping leaves. `runtime` keeps
# the mandatory first-release Halo2/IPA policy intact; STARK support remains a
# named proof aggregate rather than workspace-wide inheritance.
# Portable node semantics are usable independently by integration and recovery
# corridors; ordinary Core builds additionally select the optional accelerator.
default = ["node", "simd"]
dev-tools = []
# Non-shipping, feature-isolated process-cut hooks used by the dedicated
# `iroha_test_network` daemon. The default/node feature graph never enables
# these hooks.
test-network-native-amx-fault-injection = ["json"]
# Non-shipping, read-only private-settlement state commitments used only by
# adversarial real-process release tests. Shipping/default feature graphs must
# never expose the diagnostic surface that consumes this evidence.
test-network-private-settlement-evidence = []
# Non-shipping Parliament integration-test provider. The isolated test daemon
# uses this to derive proof-valid beacon and TLE shares for its exact validator seat;
# default/node/release feature sets never include it.
test-network-parliament-signers = []
runtime = ["json", "bls", "proofs-halo2"]
node = [
    "runtime",
    "proofs-stark",
    "app_api",
    "gost",
    "sm",
    "telemetry",
    "zk-preverify",
]
proofs-halo2 = ["zk-halo2", "zk-halo2-ipa", "zk-ipa-native", "circuit-params"]
proofs-stark = ["zk-stark"]
proofs-full = ["proofs-halo2", "proofs-stark"]
# Enable QUIC transport helpers for Norito Streaming.
quic = ["iroha_p2p/quic"]
# Enable Norito-backed JSON helpers throughout the core crate.
json = [
    "iroha_data_model/json",
    "iroha_crypto/json",
    "iroha_primitives/json",
]
# Enable Chinese SM algorithm family plumbing in dependent crates.
sm = [
    "iroha_config/sm",
    "iroha_crypto/sm",
    "iroha_data_model/sm",
]
# Enable TC26 GOST algorithm family plumbing in dependent crates.
gost = [
    "iroha_config/gost",
    "iroha_crypto/gost",
    "iroha_data_model/gost",
]
# Optional OpenSSL/Tongsuo SM provider remains a separately qualified preview.
sm-ffi-openssl = [
    "sm",
    "iroha_config/sm-ffi-openssl",
    "iroha_crypto/sm-ffi-openssl",
]
# Enable app-facing convenience helpers (testing utilities shared with Torii).
app_api = []
# Support lightweight telemetry, including diagnostics
telemetry = ["ivm/telemetry"]
# Support Prometheus metrics. See https://prometheus.io/.
expensive-telemetry = ["telemetry", "iroha_telemetry/metric-instrumentation"]
# Enable stable fixed-width Core kernels and primitives SIMD backends.
simd = ["iroha_primitives/simd-accel"]
profiling = []
# Enable FASTPQ GPU helper paths used by the daemon feature of the same name.
fastpq-gpu = ["fastpq_prover/fastpq-gpu"]
# Enable benchmark-only helpers used by this crate's Criterion targets.
bench = []
# Enable IDs-only query projections
ids_projection = ["iroha_data_model/ids_projection"]
# Enable deterministic mock verifier for Kaigi privacy-mode tests.
kaigi_privacy_mocks = []
# ZK verifier feature flags ship enabled by default.
zk-halo2 = ["dep:kaigi_zk"]
zk-stark = []
# Non-shipping native privacy release evidence. This is deliberately not a
# default feature and is forwarded only by explicit release runners and
# integration gates; it enables only the exact-12 conformance generator and
# sealed canonical-action builders, never the data model's general fixture
# constructors or block-tampering helpers.
privacy-release-evidence = [
    "zk-stark",
    "json",
    "iroha_data_model/privacy-exact12-conformance",
]
# Transparent Halo2 (IPA over Pasta). Default-on.
zk-halo2-ipa = ["zk-ipa-native"]
# Native IPA polynomial-opening verifier (no external halo2 libs). Default-on.
zk-ipa-native = []
# Temporary helper to match halo2's default circuit-params toggle.
circuit-params = ["halo2_proofs/circuit-params"]
# Enable stateless advisory pre-verification, deduplication, and trace diagnostics.
# Ledger execution still runs the authoritative guarded cryptographic verifier.
zk-preverify = []
# Gate zk-heavy tests; enable with `--features zk-tests` when needed
zk-tests = ["iroha-core-tests"]
# Enable developer Halo2 test vectors (heavy tooling, opt-in only).
halo2-dev-tests = []
# Compile the large private Sumeragi main-loop unit-test harness. This remains
# opt-in so plain `cargo test` does not require a ~10 GiB rustc test-harness
# compile on WSL and memory-constrained developer machines.
sumeragi-main-loop-tests = []
cuda = ["ivm/cuda"]

# Prototype: index ZK1 TLV tags per ProofId in WSV for future proof list/count filters.
zk-proof-tags = []

# Test/developer helper: scale Sumeragi timers inside tests to accelerate timeouts
dev-tests = []

# Enable internal test helpers (e.g., Topology and synthetic executor fixtures)
# when building core tests. Production node builds must leave this disabled so
# every user-provided executor path runs the admitted guest bytecode.
iroha-core-tests = []

# Allow offline balance proof verification bypass + dummy backend in dev builds.

# Enable BLS admission-time micro-batching (deterministic grouping + bisection path in block validation).
# This forwards to `iroha_crypto/bls` and compiles the non-SCCP BLS paths in
# `block.rs` guarded by `#[cfg(feature = "bls")]`. SCCP verification itself is
# mandatory in every `iroha_sccp` build and is deliberately not feature-gated.
bls = ["iroha_crypto/bls", "iroha_data_model/bls"]
goldilocks_backend = ["iroha_zkp_halo2/goldilocks_backend", "ivm/goldilocks_backend"]

[badges]
is-it-maintained-issue-resolution = { repository = "https://github.com/hyperledger-iroha/iroha" }
is-it-maintained-open-issues = { repository = "https://github.com/hyperledger-iroha/iroha" }
maintenance = { status = "actively-developed" }

[dependencies]
norito = { workspace = true, default-features = false, features = ["node-codec"] }
iroha_data_model = { workspace = true, default-features = false, features = ["transparent_api", "json", "bridge", "governance"] }
iroha_macro = { workspace = true }
iroha_p2p = { workspace = true }
iroha_logger = { workspace = true }
iroha_crypto = { workspace = true, default-features = false, features = ["consensus"] }
iroha_version = { workspace = true }
iroha_config = { workspace = true }
iroha_futures = { workspace = true }
iroha_telemetry = { workspace = true }
time = { workspace = true }
iroha_primitives = { workspace = true }
iroha_genesis = { workspace = true }
iroha_torii_shared = { workspace = true }
iroha_executor_data_model = { workspace = true }
ivm = { workspace = true }
fastpq_prover = { path = "../fastpq_prover" }
mv = { workspace = true }
iroha_schema = { workspace = true }
sorafs_manifest = { path = "../sorafs_manifest", default-features = false }
settlement_router = { path = "../settlement_router" }
iroha_sccp = { path = "../iroha_sccp" }
tracing = { workspace = true }
sha2 = { version = "0.10.9", default-features = false, features = ["compress"] }
sha3 = { version = "0.10.8", default-features = false, features = ["std"] }
soranet_pq = { workspace = true }
chacha20poly1305 = { version = "0.11.0-rc.2", default-features = false, features = ["alloc", "getrandom", "rand_core", "zeroize"] }
rayon = { workspace = true }
base64 = { workspace = true }
rust_decimal = { workspace = true }
regex = "1.11.0"
http = "1.3.1"
halo2_proofs = { version = "0.5.1", package = "halo2-axiom", features = ["batch", "multicore"] }
ff = "0.13.1"
# Kagemusha V1's paired-Pasta recursive backend uses the Axiom Poseidon
# transcript and IPA verifier in production. These revisions are pinned by the
# workspace lockfile so consensus verification never depends on a test-only
# feature surface.
halo2-base = { git = "https://github.com/axiom-crypto/halo2-lib.git", tag = "v0.5.3", default-features = false, features = ["halo2-axiom"] }
halo2-ecc = { git = "https://github.com/axiom-crypto/halo2-lib.git", tag = "v0.5.3", default-features = false, features = ["halo2-axiom"] }
snark-verifier = { git = "https://github.com/axiom-crypto/snark-verifier.git", rev = "bbfcc721d714bea0d44a27c8fc6c4736e73ca853", default-features = false, features = ["loader_halo2", "halo2-axiom"] }
iroha_zkp_halo2 = { path = "../iroha_zkp_halo2" }
kaigi_zk = { path = "../kaigi_zk", optional = true }
orchard = { git = "https://github.com/zcash/orchard.git", rev = "9d07047d32c4787e1b7964b4cf4fa0286c93824c", default-features = false, features = ["circuit", "multicore", "std"] }
incrementalmerkletree = "=0.8.2"
nonempty = "=0.11.0"

dashmap = { workspace = true }
eyre = { workspace = true }
futures = { workspace = true, features = ["std", "async-await"] }
rand = { workspace = true }
rand_core_06 = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "io-util", "rt-multi-thread", "macros", "fs"] }
crossbeam-queue = { workspace = true }
thiserror = { workspace = true }
displaydoc = { workspace = true }
parking_lot = { workspace = true, features = ["deadlock_detection"] }
derive_more = { workspace = true }
nonzero_ext = { workspace = true }
hex = { workspace = true }
tempfile = { workspace = true }
blake3 = "1.8.2"
zstd = { workspace = true }
curve25519-dalek = "4.1.3"
blake2 = { workspace = true }
iroha_file_mmap = { path = "../iroha_file_mmap" }
ciborium = { version = "0.2.2", default-features = false, features = ["std"] }
x509-parser = { version = "0.18.0", default-features = false, features = ["verify"] }
p256 = { version = "0.13.2", default-features = false, features = ["std", "ecdsa", "pkcs8", "hash2curve", "expose-field"] }
der-parser = "10.0.0"
signature = { version = "2.2.0", default-features = false, features = ["std"] }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc", "std"] }
once_cell = { workspace = true }
yasna = "0.5.2"
indexmap = "2.12.0"
arc-swap = "1.7.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
criterion = { workspace = true }
iroha_p2p = { workspace = true, features = ["test-fixtures"] }
iroha_test_samples = { workspace = true }
iroha_config_base = { workspace = true }
iroha_sccp = { path = "../iroha_sccp", features = ["test-fixtures"] }
hex = { workspace = true }
expect-test = { workspace = true }
rcgen = "0.14.5"
rand_08 = { package = "rand", version = "=0.8.7" }

