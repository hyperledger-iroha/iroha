[package]
name = "iroha_wallet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Private developer wallet custody and exact native account operations"

[lints]
workspace = true

[dependencies]
iroha = { workspace = true }
iroha_fs = { workspace = true }
iroha_operation_journal = { workspace = true }
iroha_crypto = { workspace = true, default-features = false, features = ["json", "rand"] }
iroha_data_model = { workspace = true, default-features = false }
iroha_executor_data_model = { workspace = true }
iroha_model_base = { workspace = true }
iroha_primitives = { workspace = true }
iroha_torii_shared = { workspace = true }
iroha_version = { workspace = true }
norito = { workspace = true, default-features = false, features = ["json"] }
eyre = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
scrypt = { workspace = true }
sorafs_manifest = { workspace = true }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
toml = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
iroha_data_model = { workspace = true, default-features = false, features = ["test-fixtures"] }
tempfile = { workspace = true }
iroha_test_samples = { workspace = true }
