[package]
name = "iroha_kagemusha_issuer"
description = "Reference issuer service for the KAGEMUSHA V1 attested-app suite."
autobins = false
autotests = false

edition.workspace = true
version.workspace = true
authors.workspace = true

repository.workspace = true
homepage.workspace = true
documentation.workspace = true

license.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# The dependency list is frozen with the workspace lockfile. Implementation
# changes belong in `src/`; feature selections may change without a lock update.
[dependencies]
iroha_kagemusha_attested = { path = "../iroha_kagemusha_attested" }
iroha = { workspace = true }
iroha_crypto = { workspace = true, default-features = false, features = ["application"] }
iroha_data_model = { workspace = true, default-features = false, features = ["application-model", "http", "transparent_api"] }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
axum = { workspace = true, features = ["tokio", "http1", "matched-path"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util", "process"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["timeout", "limit", "trace"] }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
url = { workspace = true }
p256 = { version = "0.13.2", default-features = false, features = ["std", "ecdsa", "pkcs8"] }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
hex = { workspace = true, features = ["std"] }
base64 = { workspace = true, features = ["std"] }
rand = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
eyre = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "kagemusha-issuer"
path = "src/main.rs"
