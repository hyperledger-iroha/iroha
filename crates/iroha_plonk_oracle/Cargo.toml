[package]
name = "iroha_plonk_oracle"
edition.workspace = true
version.workspace = true
authors.workspace = true
description = "Temporary differential test oracle comparing the vendored halo2 stack with the Iroha-native PLONK/IPA crates"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
license.workspace = true
keywords.workspace = true
categories = ["cryptography"]
# Test infrastructure only. Use it as a dev-dependency; no shipping crate may
# depend on it. It is deleted together with the vendored halo2 stack.
publish = false

[lints]
workspace = true

[features]
default = ["circuit-params"]
# Mirrors halo2-axiom's `circuit-params`, which is always enabled below. The
# vendored goldens (`tests/vendored_goldens.rs` includes
# vendor/halo2-axiom/tests/golden_proof_bytes.rs through `#[path]`) declare
# `type Params = ()` under `#[cfg(feature = "circuit-params")]`; compiled here,
# that cfg names this crate's feature. It changes no behaviour. Without it the
# `vendored_goldens` target is skipped (see `[[test]]` below) instead of failing
# to compile.
circuit-params = []

[[test]]
name = "vendored_goldens"
path = "tests/vendored_goldens.rs"
required-features = ["circuit-params"]

# The vendored crates resolve through the workspace `[patch]` tables, with the
# same revisions and features that iroha_core_zk uses, so the oracle observes
# the exact production behaviour. Every entry is already in the lockfile.
[dependencies]
iroha_pasta = { workspace = true }
halo2-axiom = { version = "0.5.1", features = ["batch", "multicore", "circuit-params"] }
halo2-base = { git = "https://github.com/axiom-crypto/halo2-lib.git", tag = "v0.5.3", default-features = false, features = ["halo2-axiom"] }
snark-verifier = { git = "https://github.com/axiom-crypto/snark-verifier.git", rev = "bbfcc721d714bea0d44a27c8fc6c4736e73ca853", default-features = false, features = ["loader_halo2", "halo2-axiom"] }
# `pools` runs every parity comparison in Rayon pools of 1, 2, 4 and 7 threads.
rayon = { workspace = true }

# rand_chacha, rand_core and sha2 are imports of the vendored golden runner
# (vendor/halo2-axiom/tests/golden_proof_bytes.rs) and seed the parity inputs;
# norito::json reads and writes fixtures/native_prover/kats_v1.json.
[dev-dependencies]
# tests/plonk_cs_parity.rs compares the native constraint system, selector
# compression and SimpleFloorPlanner layout with the vendored ones.
iroha_plonk = { workspace = true }
norito = { workspace = true, default-features = false, features = ["base-codec"] }
rand_chacha = "0.3.1"
rand_core = "0.6.4"
sha2 = "0.10.9"
