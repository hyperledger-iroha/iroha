[package]
name = "fastpq-prover-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4.13", features = ["arbitrary-derive"] }
arbitrary = { version = "1.5.0", features = ["derive"] }
fastpq_prover = { path = "..", features = ["dev-tools"] }
fastpq_isi = { path = "../../fastpq_isi" }

[workspace]
members = ["."]

[patch.crates-io]
# Preserve applicable root workspace source and allocation custody patches.
num-bigint = { path = "../../../vendor/num-bigint-0.5.1" }
ark-ff = { path = "../../../vendor/ark-ff-0.5.0" }
ark-bls12-381 = { path = "../../../vendor/ark-bls12-381-0.5.0" }
halo2curves = { path = "../../../vendor/halo2curves-0.10.0" }
[[bin]]
name = "trace_builder"
path = "fuzz_targets/trace_builder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "merkle_paths"
path = "fuzz_targets/merkle_paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lookup_grand_product"
path = "fuzz_targets/lookup_grand_product.rs"
test = false
doc = false
bench = false
