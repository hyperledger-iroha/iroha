[package]
name = "fastpq-prover-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4.10", features = ["arbitrary-derive"] }
arbitrary = { version = "1.4.2", features = ["derive"] }
fastpq_prover = { path = "..", features = ["dev-tools"] }
fastpq_isi = { path = "../../fastpq_isi" }

[workspace]
members = ["."]

# This nested workspace does not inherit the repository root's patches. Keep
# FastPQ fuzzing on the same reviewed Halo2 sources as normal workspace builds.
[patch.crates-io]
halo2-axiom = { path = "../../../vendor/halo2-axiom" }
halo2curves-axiom = { path = "../../../vendor/halo2curves-axiom" }

[[bin]]
name = "trace_builder"
path = "fuzz_targets/trace_builder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "merkle_paths"
path = "fuzz_targets/merkle_paths.rs"
test = false
doc = false
bench = false
