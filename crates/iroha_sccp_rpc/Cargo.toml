[package]
name = "iroha_sccp_rpc"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "SCCP v1 network I/O: public-RPC endpoints and untrusted evidence builders"

[lints]
workspace = true

[dependencies]
iroha_config = { workspace = true }
norito = { workspace = true, default-features = false, features = ["base-codec"] }
# Blocking HTTP over rustls only; JSON is parsed with `norito::json`, never reqwest's `json`.
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
hex = { workspace = true, features = ["std"] }
zeroize = { workspace = true }
