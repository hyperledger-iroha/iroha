[package]
name = "connect_norito_bridge"
autobins = false
version.workspace = true
edition = "2024"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("schema-structural"))',
] }

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "kagemusha_candidate_scenario_validator"
path = "src/bin/kagemusha_candidate_scenario_validator.rs"
required-features = ["dev-tools", "kagemusha-candidate-evidence-lab"]

[[bin]]
name = "soracloud_request_signer"
path = "src/bin/soracloud_request_signer.rs"
required-features = ["dev-tools"]

[[bin]]
name = "swift_parity_regen"
path = "src/bin/swift_parity_regen.rs"
required-features = ["dev-tools"]

[features]
dev-tools = []
# Enable real halo2/ipa proving and verification for confidential-transfer-v2 and unshield.
# OFF by default; flip on only when all production gates have passed.
privacy-production-enabled = ["iroha_data_model/kagemusha-production-enabled"]
# Non-shipping physical-device evidence harness. Candidate symbols, state, and
# JNI exports are absent unless this feature is selected explicitly; enabling
# it does not change the production Kagemusha capability gate.
kagemusha-candidate-evidence-lab = ["iroha_core/kagemusha-candidate-evidence-lab"]
# Build the JNI acceleration surface against IVM's real CUDA backend. This is
# selected only by hardware-qualified release validation; the default bridge
# keeps the deterministic CPU fallback.
cuda = ["ivm/cuda"]

[dependencies]
norito = { path = "../norito", version = "2.0.0-rc.2.0", default-features = false, features = ["node-codec"] }
# Keep the bridge feature closure explicit so it does not silently inherit a
# daemon consensus mode. Core currently requires BLS and unconditionally uses
# its JSON/canonical-query surfaces; the production bridge additionally needs the
# complete Halo2/IPA circuit-parameter and STARK/FRI verifier paths.
iroha_core = { path = "../iroha_core", default-features = false, features = ["node"] }
iroha_zkp_halo2 = { workspace = true }
iroha_torii_shared = { workspace = true }
fastpq_prover = { workspace = true }
iroha_crypto = { workspace = true, default-features = false, features = ["consensus", "gost", "sm"] }
# The bridge ships the exact-12 KAT generator/validator, but must not expose the
# data model's general fixture constructors or block-tampering helpers.
iroha_data_model = { workspace = true, features = ["application-model", "sm", "privacy-exact12-conformance"], default-features = false }
iroha_executor_data_model = { workspace = true }
iroha_primitives = { workspace = true }
iroha_version = { workspace = true }
ivm = { workspace = true }
libc = "0.2.177"
blake3.workspace = true
base64 = { workspace = true }
hex = "0.4"
x25519-dalek = "2.0.1"
sorafs_car = { workspace = true, features = ["manifest"] }
sorafs_manifest = { workspace = true }
sha2 = { version = "0.10.8", default-features = false, features = ["std"] }
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "zeroize"] }
blake2 = { version = "0.10.6", default-features = false, features = ["std"] }
rand = { version = "0.9.3", default-features = false, features = ["std", "std_rng"] }
p256 = { version = "0.13.2", default-features = false, features = ["std", "ecdsa"] }
tracing.workspace = true
zeroize = { version = "1.8.2", default-features = false, features = ["alloc", "std"] }
tempfile = { workspace = true }

[dev-dependencies]
iroha_core = { path = "../iroha_core", default-features = false, features = ["node", "iroha-core-tests"] }
sorafs_chunker = { workspace = true }

[build-dependencies]
sha2 = { version = "0.10.8", default-features = false, features = ["std"] }

[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
jni = { version = "0.21.1", default-features = false }
