[package]
name = "gpuzstd_cuda"
version.workspace = true
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["cuda-kernel"]
cuda-kernel = []

[dependencies]
# Shared deterministic frame encoder/decoder and sequence layout. The Metal
# crate's `c-abi` exports are not needed here. CUDA uses owner-qualified C
# symbols so feature unification can also enable Metal's exports safely.
gpuzstd_metal = { path = "../gpuzstd_metal", default-features = false }
zstd.workspace = true

[build-dependencies]
cc = "1.2.45"

[dev-dependencies]
zstd.workspace = true
