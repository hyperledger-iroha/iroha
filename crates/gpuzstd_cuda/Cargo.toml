[package]
name = "gpuzstd_cuda"
version.workspace = true
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["cuda-kernel"]
cuda-kernel = []

[dependencies]
# Shared frame coding has no device code or C exports. Building both backend
# packages together therefore cannot import the Metal plugin into this artifact.
gpuzstd_codec = { path = "../gpuzstd_codec" }
zstd.workspace = true

[build-dependencies]
cc = "1.2.45"

[dev-dependencies]
zstd.workspace = true
