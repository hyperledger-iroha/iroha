[package]
name = "iroha_release_bundle"
autobins = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Retained native publication and admission of Iroha release executable bundles"
publish = false

[lints]
workspace = true

[features]
default = []
# The publisher command is an explicit release tool, never a default workspace
# binary; the library stays ungated for iroha_test_network.
dev-tools = []
tokio = ["dep:tokio"]

[[bin]]
name = "iroha_release_bundle"
path = "src/bin/iroha_release_bundle.rs"
required-features = ["dev-tools"]

[dependencies]
iroha_fs.workspace = true
norito = { workspace = true, default-features = false, features = ["json"] }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
hex = { workspace = true, features = ["alloc"] }
tokio = { workspace = true, optional = true, features = ["process", "io-util", "macros"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
