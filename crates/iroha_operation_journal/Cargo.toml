[package]
name = "iroha_operation_journal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Descriptor-anchored immutable native operation evidence"

[lints]
workspace = true

[dependencies]
iroha_fs = { workspace = true }
norito = { workspace = true, default-features = false, features = ["json"] }
eyre = { workspace = true }
# Canonical submission digests return lowercase owned strings independently of consumer features.
hex = { workspace = true, features = ["alloc"] }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = { workspace = true }
