[package]
name = "iroha_kagemusha_attested"
description = "KAGEMUSHA V1 attested-app suite: canonical wire types, P-256 verification, the device ledger engine and conformance vectors."
autobins = false
autotests = false

edition.workspace = true
version.workspace = true
authors.workspace = true

repository.workspace = true
homepage.workspace = true
documentation.workspace = true

license.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# Builds the deterministic conformance-vector generator binary.
dev-tools = []

[dependencies]
norito = { workspace = true, default-features = false, features = ["base-codec"] }
p256 = { version = "0.13.2", default-features = false, features = ["std", "ecdsa"] }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
hex = { workspace = true, features = ["std"] }
base64 = { workspace = true, features = ["std"] }

[[bin]]
name = "kagemusha_attested_vectors"
path = "src/bin/kagemusha_attested_vectors.rs"
required-features = ["dev-tools"]

[[test]]
name = "attested_vectors"
path = "tests/attested_vectors.rs"

[[test]]
name = "attested_ledger"
path = "tests/attested_ledger.rs"
