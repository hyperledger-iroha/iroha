[package]
name = "sorafs_orchestrator"
autotests = false
autobins = false
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "High-level SoraFS orchestrator facade built on top of sorafs_car"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("schema-structural"))',
] }

[features]
default = ["cli-orchestrator"]
dev-tools = []
cli-orchestrator = [
    "dep:iroha_config",
    "dep:sha2",
    "dep:sorafs_chunker",
    "dep:sorafs_manifest",
    "dep:toml",
]
local-quic-proxy = ["dep:quinn", "dep:rcgen", "dep:sha2"]

[dependencies]
iroha_model_base = { workspace = true }
iroha_service_model = { workspace = true }
sorafs_car = { path = "../sorafs_car", features = ["manifest", "cli"] }
norito = { path = "../norito", features = ["node-codec"], default-features = false }
prost = "0.14.3"
thiserror = "2.0.17"
rust_decimal = { workspace = true }
iroha_telemetry = { path = "../iroha_telemetry" }
tracing = { workspace = true }
iroha_data_model = { path = "../iroha_data_model", default-features = false, features = ["application-model"] }
iroha_primitives = { path = "../iroha_primitives" }
soranet_incentives = { workspace = true }
blake3 = "1.8.2"
hex = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
rand = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync", "net", "io-util", "fs"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
reqwest = { workspace = true, features = ["rustls-tls", "blocking"] }
quinn = { version = "0.11.9", default-features = false, features = ["rustls", "runtime-tokio"], optional = true }
rcgen = { version = "=0.14.5", optional = true }
futures = { workspace = true }
sha2 = { version = "0.10.9", default-features = false, features = ["std"], optional = true }
sha3 = { version = "0.10.8", default-features = false, features = ["std"] }
url = { workspace = true }
iroha_version = { path = "../iroha_version" }
sorafs_chunker = { path = "../sorafs_chunker", optional = true }
sorafs_manifest = { path = "../sorafs_manifest", optional = true }
iroha_crypto = { path = "../iroha_crypto", default-features = false, features = ["application"] }
iroha_config = { path = "../iroha_config", optional = true }
toml = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
iroha_logger = { workspace = true }
futures = "0.3.31"
tempfile = "3.23.0"
hex = "0.4.3"
assert_cmd = "2.1.1"
httpmock = "0.8.2"
sorafs_manifest = { path = "../sorafs_manifest" }
soranet_pq = { path = "../soranet_pq" }

[[bin]]
name = "sorafs_cli"
path = "src/bin/sorafs_cli.rs"
required-features = ["cli-orchestrator"]

[[bin]]
name = "taikai_viewer"
path = "src/bin/taikai_viewer.rs"
required-features = ["cli-orchestrator", "dev-tools"]

[[test]]
name = "orchestrator_parity"
path = "tests/orchestrator_parity.rs"

[[test]]
name = "sorafs_cli"
path = "tests/sorafs_cli.rs"
