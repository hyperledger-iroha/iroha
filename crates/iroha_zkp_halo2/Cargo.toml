[package]
name = "iroha_zkp_halo2"
autotests = false
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "Transparent (untrusted setup) Halo2-style proof system skeleton with IPA polynomial commitments"
repository = "https://github.com/hyperledger-iroha/iroha"
categories = ["cryptography"]

[lib]
name = "iroha_zkp_halo2"
path = "src/lib.rs"

[dependencies]
tiny-keccak = { workspace = true }
thiserror = { workspace = true, default-features = false }
norito = { workspace = true, default-features = false, features = ["base-codec"] }
iroha_crypto = { workspace = true, default-features = false }
iroha_schema = { workspace = true, optional = true }
halo2curves = { workspace = true }
hex = { workspace = true, features = ["alloc"] }
rayon = { workspace = true, optional = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
poseidon-primitives = "0.2.0"

[dev-dependencies]
criterion = { workspace = true }
hex-literal = { workspace = true }

[features]
default = []
bench = []
# Mirror Norito derive cfgs so the derive macro can see destination-crate features
schema-structural = ["dep:iroha_schema", "norito/schema-structural"]
parallel = ["dep:rayon"]
goldilocks_backend = []
# Non-shipping candidate-only entry points used by the Exact12 evidence
# corridor. Production prove/verify APIs retain their readiness gate.
privacy-release-evidence = []

[[bench]]
name = "bench_ipa"
harness = false

[[test]]
name = "vega_engine_reachability"
path = "tests/vega_engine_reachability.rs"
