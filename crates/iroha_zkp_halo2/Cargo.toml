[package]
name = "iroha_zkp_halo2"
autotests = false
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "Transparent (untrusted setup) Halo2-style proof system skeleton with IPA polynomial commitments"
repository = "https://github.com/hyperledger-iroha/iroha"
categories = ["cryptography"]

[lib]
name = "iroha_zkp_halo2"
path = "src/lib.rs"

[dependencies]
tiny-keccak = { workspace = true, optional = true }
thiserror = { workspace = true, default-features = false, optional = true }
norito = { workspace = true, default-features = false, features = ["base-codec"], optional = true }
iroha_schema = { workspace = true, optional = true }
halo2curves = { workspace = true }
hex = { workspace = true, features = ["alloc"], optional = true }
rayon = { workspace = true, optional = true }
once_cell = { workspace = true }
parking_lot = { workspace = true, optional = true }
poseidon-primitives = "0.2.0"

[dev-dependencies]
criterion = { workspace = true }
hex-literal = { workspace = true }

[features]
default = ["full", "parallel"]
# Lightweight, consensus-visible primitives used by the public data model.
model-primitives = []
# Complete proof engine used by node, CLI, and direct crate consumers.
full = [
    "model-primitives",
    "dep:tiny-keccak",
    "dep:thiserror",
    "dep:norito",
    "dep:hex",
    "dep:parking_lot",
]
bench = ["full"]
# Mirror Norito derive cfgs so the derive macro can see destination-crate features
schema-structural = ["full", "dep:iroha_schema", "norito/schema-structural"]
parallel = ["full", "dep:rayon"]
goldilocks_backend = ["full"]

[[bench]]
name = "bench_ipa"
harness = false
required-features = ["full"]

[[test]]
name = "vega_engine_reachability"
path = "tests/vega_engine_reachability.rs"
required-features = ["full"]

[[test]]
name = "ipa_minimum_dimension"
path = "tests/ipa_minimum_dimension.rs"
required-features = ["full"]
