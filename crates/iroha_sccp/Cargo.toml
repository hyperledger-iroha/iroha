[package]
name = "iroha_sccp"
autobins = false
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
dev-tools = []
test-fixtures = [
    "iroha_data_model/test-fixtures",
    "iroha_data_model/transparent_api",
]

[[bin]]
name = "sccp_release_evidence"
path = "src/bin/sccp_release_evidence.rs"
required-features = ["dev-tools"]

[dependencies]
blake3 = { workspace = true }
blake2 = { version = "0.10.6", default-features = false }
tiny-keccak = { version = "2.0.2", default-features = false, features = ["keccak"] }
sha2 = { version = "0.10.9", default-features = false }
bs58 = { version = "0.5.1", default-features = false, features = ["alloc"] }
norito = { path = "../norito", default-features = false, features = ["base-codec"] }
halo2curves = { workspace = true }
iroha_crypto = { path = "../iroha_crypto", features = ["node-crypto"], default-features = false }
iroha_data_model = { path = "../iroha_data_model", default-features = false, features = ["json"] }

[dev-dependencies]
# Unit-test builds compile the deterministic fixture module under `cfg(test)`.
# Enable only the data-model construction surface that those test-only fixtures
# require; downstream production users still receive the minimal dependency.
iroha_data_model = { path = "../iroha_data_model", default-features = false, features = ["json", "test-fixtures", "transparent_api"] }
