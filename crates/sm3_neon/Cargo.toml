[package]
name = "sm3-neon"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "NEON helpers for SM3 hashing used by Iroha"
publish = false
readme = "README.md"

[features]
default = []
force-neon = []
bench = []

[dependencies]

[dev-dependencies]
sm3 = "0.5.0"
criterion = { workspace = true }
rand = { version = "0.10.3", default-features = false, features = ["std", "std_rng", "alloc"] }

[[bench]]
name = "digest"
harness = false

[lints.clippy]
# Reported by the Rust 1.99.1 clippy at the toolchain bump. TODO: fix the
# flagged sites and remove each allow.
chunks_exact_to_as_chunks = "allow"
