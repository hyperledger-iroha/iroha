[package]
name = "sorafs_car"
autobins = false
autotests = false
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Planning utilities for assembling CARv2 archives for SoraFS."

[features]
default = []
dev-tools = []
manifest = [
    "dep:sorafs_manifest",
    "dep:iroha_data_model",
    "dep:iroha_crypto",
    "dep:ed25519-dalek",
    "dep:httpdate",
    "dep:url",
    "dep:zstd",
    "dep:toml",
]
da_harness = [
    "manifest",
    "dep:eyre",
    "dep:clap",
    "dep:iroha_crypto",
    "dep:iroha_primitives",
]
cli = [
    "dep:iroha_model_base",
    "manifest",
    "sorafs_manifest/pqc",
    "dep:ed25519-dalek",
    "dep:iroha_crypto",
    "dep:iroha_data_model",
    "dep:iroha_primitives",
    "dep:eyre",
    "dep:clap",
]
fetch_cli = ["cli"]
[dependencies]
iroha_fs = { workspace = true }
iroha_model_base = { workspace = true, optional = true }
iroha_service_model = { workspace = true }
sorafs_chunker = { path = "../sorafs_chunker" }
blake3 = "1.8.2"
thiserror = "2.0.17"
norito = { workspace = true, default-features = false, features = ["base-codec"] }
futures = { version = "0.3.31", default-features = false, features = ["std", "executor"] }
futures-timer = "3.0.4"
tokio = { workspace = true, features = ["time", "rt", "macros"] }
tempfile = "3.23.0"
ed25519-dalek = { version = "2.2.0", optional = true, default-features = false, features = ["std"] }
sorafs_manifest = { path = "../sorafs_manifest", default-features = false, optional = true }
iroha_crypto = { workspace = true, optional = true, default-features = false, features = ["application"] }
iroha_data_model = { workspace = true, optional = true, default-features = false, features = ["application-model"] }
iroha_primitives = { workspace = true, optional = true, features = ["simd-accel"] }
eyre = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive"], optional = true }
hex = "0.4.3"
httpdate = { version = "1.0.3", optional = true }
reqwest = { workspace = true, features = ["rustls-tls", "blocking"] }
base64 = { version = "0.22.1" }
url = { workspace = true, optional = true }
rand = { workspace = true }
flate2 = "1.1.5"
zstd = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
iroha_model_base = { workspace = true }
assert_cmd = "2.1.1"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
sorafs_orchestrator = { workspace = true }

[[bin]]
name = "sorafs_chunk_store"
path = "src/bin/sorafs_chunk_store.rs"
required-features = ["dev-tools"]

[[bin]]
name = "sorafs_fetch"
path = "src/bin/sorafs_fetch.rs"
required-features = ["cli"]

[[bin]]
name = "sorafs_manifest_builder"
path = "src/bin/sorafs_manifest_builder.rs"
required-features = ["cli"]

[[bin]]
name = "sorafs_manifest_chunk_store"
path = "src/bin/sorafs_manifest_chunk_store.rs"
required-features = ["cli", "dev-tools"]

[[bin]]
name = "sorafs_provider_advert"
path = "src/bin/sorafs_provider_advert.rs"
required-features = ["cli", "dev-tools"]

[[bin]]
name = "provider_admission_fixtures"
path = "src/bin/provider_admission_fixtures.rs"
required-features = ["dev-tools", "manifest"]

[[bin]]
name = "taikai_car"
path = "src/bin/taikai_car.rs"
required-features = ["cli", "dev-tools"]

[[bin]]
name = "da_reconstruct"
path = "src/bin/da_reconstruct.rs"
required-features = ["dev-tools", "da_harness"]

[[bin]]
name = "soranet_trustless_verifier"
path = "src/bin/soranet_trustless_verifier.rs"
required-features = ["cli", "dev-tools"]

[[test]]
name = "sorafs_car_integration"
path = "tests/sorafs_car_integration.rs"

[[test]]
name = "sorafs_fetch_cli"
path = "tests/sorafs_fetch_cli.rs"
required-features = ["cli"]
