[package]
name = "gpuzstd_metal"
version.workspace = true
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["c-abi"]
c-abi = []

[dependencies]
gpuzstd_codec = { path = "../gpuzstd_codec" }
zstd = { workspace = true }

[build-dependencies]
cc = "1.2.45"

[dev-dependencies]
gpuzstd_codec = { path = "../gpuzstd_codec", features = ["fixtures"] }
