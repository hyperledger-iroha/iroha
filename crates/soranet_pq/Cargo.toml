[package]
name = "soranet_pq"
autotests = false
build = false

edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = ["pqc"]
pqc = ["dep:ml-dsa", "dep:ml-kem"]

[lints]
workspace = true

[dependencies]
shake = { version = "0.1.0", default-features = false, features = ["zeroize"] }
blake3 = { workspace = true, features = ["zeroize"] }
hkdf = { version = "0.13.0", default-features = false, features = [] }
ml-dsa = { workspace = true, optional = true }
ml-kem = { workspace = true, optional = true }
rand = { workspace = true, default-features = false, features = ["std_rng", "std"] }
rand_chacha = { version = "0.10.0", default-features = false, features = ["std"] }
rand_core = { version = "0.10.1", default-features = false, features = [] }
sha3 = { version = "0.12.0", default-features = false, features = ["zeroize", "alloc"] }
thiserror = { workspace = true }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
hex = { workspace = true }
norito = { workspace = true, default-features = false, features = ["base-codec"] }

[[test]]
name = "kat_vectors"
path = "tests/kat_vectors.rs"
