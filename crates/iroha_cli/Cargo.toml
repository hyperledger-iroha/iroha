[package]
name = "iroha_cli"
autobins = false

edition.workspace = true
version.workspace = true
authors.workspace = true

build = "../build-support/script.rs"

description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

license.workspace = true
keywords.workspace = true
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]

[lints]
workspace = true

[badges]
is-it-maintained-issue-resolution = { repository = "https://github.com/hyperledger-iroha/iroha" }
is-it-maintained-open-issues = { repository = "https://github.com/hyperledger-iroha/iroha" }
maintenance = { status = "actively-developed" }

[features]
default = ["cli"]
cli = [
    "iroha_core/node",
    "iroha_crypto/consensus",
    "iroha_data_model/json",
    "ivm/runtime",
    "norito/node-codec",
]
dev-tools = ["cli"]
offline-visual-codecs = ["dep:image"]
# Experimental selector support. Forwarded to client/data-model crates when enabled.
ids_projection = ["iroha/ids_projection", "iroha_data_model/ids_projection"]
# Hooks used only by integration tests.
cli_integration_harness = []
bridge = []

[[bin]]
name = "iroha"
path = "src/bin/iroha.rs"
required-features = ["cli"]

[[bin]]
name = "ivm_execution_keygen"
path = "src/bin/ivm_execution_keygen.rs"
required-features = ["dev-tools"]

[[bin]]
name = "account_literal_reencode"
path = "src/bin/account_literal_reencode.rs"
required-features = ["dev-tools"]

[[bin]]
name = "gov_instruction"
path = "src/bin/gov_instruction.rs"
required-features = ["dev-tools"]

[[bin]]
name = "ivm_contract_deploy"
path = "src/bin/ivm_contract_deploy.rs"
required-features = ["dev-tools"]

[[bin]]
name = "taira_fee_sponsor_program"
path = "src/bin/taira_fee_sponsor_program.rs"
required-features = ["dev-tools"]

[dependencies]
iroha = { workspace = true }
iroha_sccp = { workspace = true }
iroha_primitives = { workspace = true }
ivm = { workspace = true, default-features = false }
iroha_crypto = { workspace = true, default-features = false, features = ["sm"] }
iroha_core = { workspace = true, default-features = false }
fastpq_prover = { path = "../fastpq_prover" }
iroha_config = { workspace = true }
iroha_zkp_halo2 = { workspace = true }
iroha_data_model = { workspace = true, default-features = false }
iroha_torii_shared = { workspace = true }
iroha_version = { workspace = true }
url = { workspace = true }

thiserror = { workspace = true }
error-stack = { workspace = true, features = ["eyre"] }
eyre = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap-markdown = "0.1.5"
humantime = { workspace = true }
norito = { workspace = true, default-features = false }
supports-color = { workspace = true }
derive_more = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
futures = { workspace = true }
base64 = { workspace = true }
blake2 = { workspace = true }
hex = { workspace = true }
bs58 = "0.5.1"
iroha_i18n = { workspace = true }
rand = { version = "0.9.3", features = ["std"] }
sorafs_manifest = { workspace = true }
sorafs_car = { workspace = true, features = ["cli"] }
sorafs_chunker = { workspace = true }
sorafs_orchestrator = { workspace = true }
soranet_pq = { workspace = true }
time = { workspace = true }
zeroize = { version = "1.8.2", default-features = false, features = ["std"] }
blake3 = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
toml = { workspace = true }
tiny-keccak = { workspace = true }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
scrypt = { workspace = true }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
image = { version = "0.25.9", default-features = false, features = ["png", "gif"], optional = true }
png = "0.18.0"
pathdiff = "0.2.3"

[build-dependencies]
build-support = { path = "../build-support", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
iroha_test_samples = { workspace = true }
