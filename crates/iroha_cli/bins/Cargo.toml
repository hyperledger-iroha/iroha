[package]
name = "iroha_cli"
autobins = false
autotests = false
autoexamples = false
autobenches = false
default-run = "iroha"
edition.workspace = true
version.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
build = "../../build-support/script.rs"

[lints]
workspace = true

[features]
default = ["cli", "bridge", "offline-visual-codecs"]
cli = []
bridge = ["iroha_cli_lib/bridge"]
offline-visual-codecs = ["iroha_cli_lib/offline-visual-codecs"]
dev-tools = ["cli"]
ids_projection = ["iroha_cli_lib/ids_projection"]
cli_integration_harness = ["iroha_cli_lib/cli_integration_harness"]

[[bin]]
name = "iroha"
path = "src/bin/iroha.rs"
required-features = ["cli"]

[[bin]]
name = "account_literal_reencode"
path = "src/bin/account_literal_reencode.rs"
required-features = ["dev-tools"]

[[bin]]
name = "gov_instruction"
path = "src/bin/gov_instruction.rs"
required-features = ["dev-tools"]

[[bin]]
name = "taira_fee_sponsor_program"
path = "src/bin/taira_fee_sponsor_program.rs"
required-features = ["dev-tools"]

[dependencies]
iroha_cli_lib = { path = "..", default-features = false }
iroha_core = { workspace = true, default-features = false }
clap = { workspace = true, features = ["derive"] }
iroha = { workspace = true }
iroha_primitives = { workspace = true }
iroha_model_base = { workspace = true }
iroha_service_model = { workspace = true }
eyre = { workspace = true }
norito = { workspace = true, default-features = false }
base64 = { workspace = true }
hex = { workspace = true }
toml = { workspace = true }
sorafs_manifest = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
rustix = { version = "1.1.4", features = ["event", "fs", "process"] }
assert_cmd = "2.1.1"
sorafs_orchestrator = { workspace = true }
iroha_test_samples = { workspace = true }
kotodama_lang = { workspace = true }
iroha_data_model = { workspace = true, default-features = false, features = ["test-fixtures", "transparent_api"] }
iroha_crypto = { workspace = true, default-features = false, features = ["sm"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
blake3 = { workspace = true }

[[test]]
name = "cli_smoke"
path = "tests/cli_smoke.rs"
required-features = ["cli"]

[[test]]
name = "sorafs_instruction_cli"
path = "tests/sorafs_instruction_cli.rs"
required-features = ["cli"]

[[test]]
name = "sorafs_validate_cli"
path = "tests/sorafs_validate_cli.rs"
required-features = ["cli"]

[[test]]
name = "taikai_policy"
path = "tests/taikai_policy.rs"
required-features = ["cli"]

[build-dependencies]
build-support = { path = "../../build-support", default-features = false }
