[package]
name = "iroha_telemetry"

edition.workspace = true
version.workspace = true
authors.workspace = true

build = "../build-support/script.rs"

license.workspace = true

[lints]
workspace = true

[features]
# Send structured events to the configured WebSocket collector.
event-exporter = [
    "dep:chrono",
    "dep:futures",
    "dep:iroha_logger",
    "dep:libc",
    "dep:rustix",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:url",
    "tokio/fs",
    "tokio/io-util",
    "tokio/macros",
    "tokio/net",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
]
# Support developer-specific telemetry.
# Should not be enabled on production builds.
dev-telemetry = [
    "dep:chrono",
    "dep:iroha_futures",
    "dep:iroha_logger",
    "dep:libc",
    "dep:rustix",
    "dep:tokio",
    "iroha_futures/telemetry",
    "tokio/fs",
    "tokio/io-util",
    "tokio/macros",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
]
# Export Prometheus metrics. See https://prometheus.io/.
metric-instrumentation = ["iroha_telemetry_derive/metric-instrumentation"]
telegram = [
    "dep:iroha_logger",
    "dep:reqwest",
    "dep:tokio",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
]

[dependencies]
norito = { workspace = true, default-features = false, features = ["node-codec"] }
iroha_telemetry_derive = { path = "../iroha_telemetry_derive" }

iroha_config = { workspace = true }
iroha_logger = { workspace = true, optional = true }
iroha_futures = { workspace = true, optional = true }
iroha_schema = { workspace = true }
iroha_data_model = { workspace = true, default-features = false, features = ["json"] }

chrono = { version = "0.4.38", optional = true }
eyre = { workspace = true }
futures = { workspace = true, features = ["std", "async-await"], optional = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true, features = ["rustls-tls-native-roots"] }
url = { workspace = true, optional = true }
prometheus = { workspace = true }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
blake3 = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.177", optional = true }
rustix = { version = "1.1.4", features = ["process"], optional = true }

[build-dependencies]
build-support = { path = "../build-support", default-features = false }

[dev-dependencies]
expect-test = { workspace = true }
