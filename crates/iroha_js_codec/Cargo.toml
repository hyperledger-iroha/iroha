[package]
name = "iroha_js_codec"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Canonical account and strict instruction codecs shared by JavaScript platform adapters"

[lints]
workspace = true

[dependencies]
iroha_crypto = { workspace = true, features = ["json", "gost", "sm", "bls", "pqc"] }
