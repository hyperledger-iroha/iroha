[package]
name = "iroha_deploy"

edition.workspace = true
version.workspace = true
authors.workspace = true

description = "Network and dataspace deployment engine behind `iroha network` and `iroha dataspace`."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

license.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
iroha_config_base = { workspace = true }
iroha_crypto = { workspace = true, default-features = false, features = ["json"] }
iroha_data_model = { workspace = true, default-features = false }
iroha_model_base = { workspace = true }
iroha_primitives = { workspace = true }
norito = { workspace = true, default-features = false, features = ["base-codec"] }

base64 = { workspace = true, features = ["std"] }
error-stack = { workspace = true }
humantime = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
url = { workspace = true }

[dev-dependencies]
halo2curves = { workspace = true }
iroha_data_model = { workspace = true, default-features = false, features = ["test-fixtures", "transparent_api"] }
iroha_sumeragi = { workspace = true }
tempfile = { workspace = true }
