[package]
name = "iroha_derive"
autotests = false

edition.workspace = true
version.workspace = true
authors.workspace = true

license.workspace = true

[lints]
workspace = true

# The macro surface is feature-free: toggling it per consumer would split the
# proc-macro artifact and rebuild everything above norito. Telemetry
# instrumentation is selected by `iroha_futures/telemetry` instead.
[features]
default = []
trybuild-tests = ["dep:trybuild"]

[lib]
proc-macro = true

[dependencies]

syn = { workspace = true, features = ["default", "full"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }
manyhow = { workspace = true }
iroha_derive_primitives = { path = "../iroha_derive_primitives" }
trybuild = { workspace = true, optional = true }

[dev-dependencies]
iroha_macro = { workspace = true }
iroha_config_base = { workspace = true }

impls = { workspace = true }
expect-test = { workspace = true }

[[test]]
name = "container_enum_from_variant"
path = "tests/container_enum_from_variant.rs"

[[test]]
name = "ui"
path = "tests/ui.rs"
required-features = ["trybuild-tests"]
