[package]
name = "iroha_monitor"
autotests = false
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
eyre = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "signal", "process"] }
clap = { workspace = true, features = ["derive"] }
reqwest = { workspace = true, features = ["rustls"] }
axum = { workspace = true, features = ["json", "tokio", "http1"] }
crossterm = { version = "0.29" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
norito = { workspace = true, default-features = false, features = ["node-codec"] }

[dev-dependencies]
rcgen = "0.14.10"
tokio = { workspace = true, features = ["io-util", "net"] }
tokio-rustls = { workspace = true, features = ["aws-lc-rs"] }

[features]
default = []
linux-builtin-synth = []

[[test]]
name = "smoke"
path = "tests/smoke.rs"
