[package]
name = "iroha_monitor"
autotests = false
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
eyre = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "signal", "process"] }
clap = { workspace = true, features = ["derive"] }
attohttpc = { version = "0.30.1", default-features = false }
axum = { workspace = true, features = ["json", "tokio", "http1"] }
crossterm = { version = "0.29" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
unicode-width = "0.2"

[features]
default = []
linux-builtin-synth = []

[[test]]
name = "smoke"
path = "tests/smoke.rs"
