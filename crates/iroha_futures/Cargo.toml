[package]
name = "iroha_futures"

edition.workspace = true
version.workspace = true
authors.workspace = true

license.workspace = true

[lints]
workspace = true

[features]
default = []
# Support lightweight telemetry, including diagnostics. Selects the
# instrumented `__telemetry_future_body!` expansion of `#[telemetry_future]`.
telemetry = []

[dependencies]
iroha_derive = { workspace = true }

iroha_logger = { workspace = true }
norito = { workspace = true, default-features = false, features = ["base-codec"] }

tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal", "time"] }
tokio-util = { workspace = true }
thiserror = { workspace = true }
error-stack = { workspace = true }

[dev-dependencies]
tokio-stream = { version = "0.1.17", features = ["sync"] }
