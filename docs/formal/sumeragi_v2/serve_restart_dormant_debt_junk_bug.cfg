\* Mutation: restart turns a lifecycleOrdinal=0 stale/conflicting policy
\* rejection into dormant scheduler debt.
CONSTANTS
  PreserveRestartDebt = TRUE
  PreserveRetryIds = TRUE
  BlockCompletedResurrection = TRUE
  BlockDormantProducerChurn = TRUE
  RejectLaterDormantRetry = TRUE
  DropRejectedJunk = FALSE
  RetireDrainedScheduler = TRUE
  PreserveCommittedRollbackLifecycle = TRUE

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANT RestartDropsLifecycleZeroPolicyRejection
