\* Mutation: a physically drained occurrence reuses its consumed scheduler
\* ordinal after restart instead of taking a fresh actor-global position.
CONSTANTS
  PreserveRestartDebt = TRUE
  PreserveRetryIds = TRUE
  BlockCompletedResurrection = TRUE
  BlockDormantProducerChurn = TRUE
  RejectLaterDormantRetry = TRUE
  DropRejectedJunk = TRUE
  RetireDrainedScheduler = FALSE
  PreserveCommittedRollbackLifecycle = TRUE

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANT PostDrainRetryRetainsLifecycleWithFreshScheduler
