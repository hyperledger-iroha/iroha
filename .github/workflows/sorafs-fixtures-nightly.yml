name: SoraFS fixture conformance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sorafs-fixtures-nightly.yml"
      - "ci/check_sorafs_fixtures.sh"
      - "crates/sorafs_chunker/**"
      - "crates/sorafs_car/**"
      - "crates/sorafs_manifest/**"
      - "crates/iroha_core/src/smartcontracts/isi/mod.rs"
      - "crates/iroha_core/src/smartcontracts/isi/escrow.rs"
      - "crates/iroha_data_model/src/bin/cancel_asset_lock_fixtures.rs"
      - "crates/iroha_data_model/src/escrow.rs"
      - "crates/iroha_data_model/src/events/data/escrow.rs"
      - "crates/iroha_data_model/src/isi/mod.rs"
      - "crates/iroha_data_model/src/isi/escrow.rs"
      - "crates/iroha_data_model/src/isi/registry.rs"
      - "crates/iroha_data_model/src/testing/cancel_asset_lock.rs"
      - "crates/iroha_core/**"
      - "crates/iroha_core_privacy/**"
      - "crates/iroha_core_timed_ovn/**"
      - "crates/iroha_core_zk/**"
      - "crates/iroha_panic_hook/**"
      - "crates/kotodama_lang/src/samples/native_escrow.ko"
      - "crates/kotodama_lang/src/samples/native_escrow.to"
      - "fixtures/sorafs_chunker/**"
      - "fixtures/sorafs_manifest/**"
      - "fixtures/sorafs_manifest/appeal_finance/**"
      - "fixtures/sorafs_manifest/provider_admission/**"
      - "fixtures/sorafs_manifest/reference_sdk/**"
      - "fixtures/sorafs_manifest/reference_sdk_validation_inventory_v1.json"
      - "fuzz/sorafs_chunker/**"
      - "integration_tests/tests/native_escrow.rs"
      - "scripts/check_sorafs_reference_sdk_fixtures.py"
      - "scripts/tests/check_sorafs_fixture_workflow_contract_test.py"
      - "scripts/tests/check_sorafs_reference_sdk_fixtures_test.py"
      - "scripts/check_sf1_vectors.mjs"
      - "scripts/tests/check_sf1_vectors.test.mjs"
      - "javascript/iroha_js/test/sorafsChunker.oneGib.test.js"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fixture-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_NET_OFFLINE: "false"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: sorafs-fixtures
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: fixtures/sorafs_chunker/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - name: Verify deterministic signed fixtures and 1 GiB parity
        run: |
          mkdir -p artifacts/sorafs-fixtures
          bash ci/check_sorafs_fixtures.sh 2>&1 | tee artifacts/sorafs-fixtures/conformance.log
      - name: Upload conformance log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sorafs-fixture-conformance-${{ github.run_id }}
          path: artifacts/sorafs-fixtures/conformance.log
          if-no-files-found: error
          retention-days: 30
