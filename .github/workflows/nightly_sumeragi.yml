name: Nightly Sumeragi Qualification

# Sumeragi qualification (specs/sumeragi.md §13, specs/sumeragi_goals.md S1): every fault
# scenario of the deterministic simulator at 10 000 seeds, and the §13.4 mutation gate with every
# mutation killed by its named test.

on:
  schedule:
    - cron: "40 1 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-sumeragi
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NORITO_SKIP_BINDINGS_SYNC: "1"

jobs:
  simulator:
    name: Simulator (10 000 seeds per scenario)
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
      - name: Run every fault scenario at 10 000 seeds
        env:
          SUMERAGI_SIM_SEEDS: "10000"
        run: "cargo test --locked -p iroha_sumeragi --release --features sim --lib -- sim::"

  mutation_gate:
    name: Mutation gate (§13.4)
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
      - name: Kill every mutation with its named test
        run: python3 scripts/sumeragi_mutation_gate.py --jobs 4 --strict
      - name: Upload the gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sumeragi-mutation-gate-${{ github.run_id }}
          path: |
            target/sumeragi-mutants/report.json
            target/sumeragi-mutants/logs
          if-no-files-found: warn
          retention-days: 14

  core_mutation_gate:
    name: Core evidence and custody mutations (§13.4)
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
      - name: Kill every registered Core rule with its named test
        env:
          CARGO_BUILD_JOBS: "2"
        run: python3 scripts/sumeragi_mutation_gate.py --core --jobs 1 --strict --fast
      - name: Upload the Core gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sumeragi-core-mutation-gate-${{ github.run_id }}
          path: |
            target/sumeragi-core-mutants/report.json
            target/sumeragi-core-mutants/logs
          if-no-files-found: warn
          retention-days: 14

  daemon_mutation_gate:
    name: Daemon beacon custody mutations (§13.4)
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
      - name: Kill every registered daemon rule with its named test
        env:
          CARGO_BUILD_JOBS: "2"
        run: python3 scripts/sumeragi_mutation_gate.py --daemon --jobs 1 --strict --fast
      - name: Upload the daemon gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sumeragi-daemon-mutation-gate-${{ github.run_id }}
          path: |
            target/sumeragi-daemon-mutants/report.json
            target/sumeragi-daemon-mutants/logs
          if-no-files-found: warn
          retention-days: 14
