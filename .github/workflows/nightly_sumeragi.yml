name: Nightly Sumeragi Qualification

# Sumeragi qualification (specs/sumeragi.md §13, specs/sumeragi_goals.md S1): every fault
# scenario of the deterministic simulator at 10 000 seeds, and the §13.4 mutation gate with every
# mutation killed by its named test.

on:
  schedule:
    - cron: "40 1 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-sumeragi
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NORITO_SKIP_BINDINGS_SYNC: "1"

jobs:
  ci_image:
    uses: ./.github/workflows/ci_image_preflight.yml
    permissions:
      contents: read

  simulator:
    needs: ci_image
    name: Simulator (10 000 seeds per scenario)
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: ${{ needs.ci_image.outputs.image }}
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: "false"
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
      - name: Run every fault scenario at 10 000 seeds
        env:
          SUMERAGI_SIM_SEEDS: "10000"
        run: "env -u SUMERAGI_SIM_SEED -u SUMERAGI_SIM_SEED_BASE cargo test --locked -p iroha_sumeragi --release --features sim --lib -- sim::"

  mutation_gate:
    needs: ci_image
    name: Mutation gate (§13.4)
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: ${{ needs.ci_image.outputs.image }}
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: "false"
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
      - name: Kill every mutation with its named test
        run: python3 scripts/sumeragi_mutation_gate.py --jobs 4 --strict
      - name: Upload the gate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sumeragi-mutation-gate-${{ github.run_id }}
          path: |
            target/sumeragi-mutants/report.json
            target/sumeragi-mutants/logs
          if-no-files-found: warn
          retention-days: 14

  core_mutation_gate:
    needs: ci_image
    name: Core evidence and custody mutations (§13.4)
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: ${{ needs.ci_image.outputs.image }}
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: "false"
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
      - name: Kill every registered Core rule with its named test
        env:
          CARGO_BUILD_JOBS: "2"
        # Dependency decode counters and debug-only controls require the test profile.
        # Optimized daemon artifacts receive separate production qualification.
        run: python3 scripts/sumeragi_mutation_gate.py --core --core-profile test --jobs 1 --strict --fast
      - name: Upload the Core gate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sumeragi-core-mutation-gate-${{ github.run_id }}
