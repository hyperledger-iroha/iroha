  privacy_jvm_sdk_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: "temurin"
          java-version: "21"
      - id: privacy-jvm-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          update-environment: false
      - name: Install host-qualified privacy JVM Rust toolchain
        shell: bash
        run: |
          env -i \
            HOME="${HOME}" \
            RUSTUP_DIST_SERVER="https://static.rust-lang.org" \
            "${HOME}/.cargo/bin/rustup" toolchain install \
              "1.93.1-x86_64-unknown-linux-gnu" \
              --profile minimal \
              --no-self-update
      - name: Provision private privacy JVM Cargo lock
        shell: bash
        run: |
          env -u PKG_CONFIG_PATH -u LD_LIBRARY_PATH \
            ci/privacy_sdk_cargo_lockfile.sh provision-ci \
            "${GITHUB_WORKSPACE}" \
            "${RUNNER_TEMP}/iroha-privacy-jvm-cargo" \
            "${GITHUB_ENV}" \
            "${GITHUB_PATH}" \
            "${HOME}/.cargo/bin/rustup" \
            "1.93.1-x86_64-unknown-linux-gnu" \
            "${{ steps.privacy-jvm-python.outputs.python-path }}"
      - name: Verify privacy JVM Cargo lock isolation
        run: ci/privacy_sdk_cargo_lockfile.sh verify-ci "${GITHUB_WORKSPACE}" "${{ steps.privacy-jvm-python.outputs.python-path }}"
      - name: Prime privacy JVM native dependencies
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: Privacy JVM and Java SDK native ABI22 tests
        env:
          PRIVACY_JVM_SDK_PYTHON_BIN: ${{ steps.privacy-jvm-python.outputs.python-path }}
          PRIVACY_JVM_NATIVE_EXPORT_DIR: ${{ runner.temp }}/privacy-jvm-native-abi22
        run: ci/check_privacy_jvm_sdk.sh
      - name: Upload source-bound privacy JVM native ABI22 input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: privacy-jvm-native-abi22-${{ github.sha }}
          path: ${{ runner.temp }}/privacy-jvm-native-abi22
          if-no-files-found: error
          retention-days: 1
      - name: Verify final privacy JVM Cargo lock isolation
        if: always()
        run: ci/privacy_sdk_cargo_lockfile.sh verify-ci "${GITHUB_WORKSPACE}" "${{ steps.privacy-jvm-python.outputs.python-path }}"

  privacy_csharp_sdk_tests:
    needs: privacy_jvm_sdk_tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IROHA_REQUIRE_PRIVACY_EXACT12_NATIVE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Bind authenticated privacy-native runtime path
        shell: bash
        run: |
          if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" != /* || -z "${GITHUB_ENV:-}" ]]; then
            echo "GitHub runner paths are unavailable; refusing an unauthenticated privacy-native fallback" >&2
            exit 1
          fi
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/privacy-jvm-native-abi22" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - id: privacy-csharp-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          update-environment: false
      - name: Download source-bound privacy native ABI22 input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: privacy-jvm-native-abi22-${{ github.sha }}
          path: ${{ runner.temp }}/privacy-jvm-native-abi22
      - name: Authenticate exact ABI22 C# privacy input
        env:
          PRIVACY_CSHARP_PYTHON: ${{ steps.privacy-csharp-python.outputs.python-path }}
        run: |
          input="$RUNNER_TEMP/privacy-jvm-native-abi22"
          [[ "$("$PRIVACY_CSHARP_PYTHON" -I -S -c 'import hashlib,pathlib,sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$input/Cargo.lock")" == "ccf4acebfe63ad981193b87afd559c195d8a67642d9536b8082f77bbf24a11f0" ]]
          [[ "$("$PRIVACY_CSHARP_PYTHON" -I -S -c 'import hashlib,pathlib; print(hashlib.sha256(pathlib.Path("Cargo.lock").read_bytes()).hexdigest())')" == "ad0d209abaa51d4c77a9e67ccbb0c7660a0f8b7b5dbe3e3fbe4a70e142711bf7" ]]
          "$PRIVACY_CSHARP_PYTHON" -I -S scripts/check_native_sdk_abi22_artifact.py verify \
            --artifact "$input/libconnect_norito_bridge.so" \
            --manifest "$input/native-sdk-abi22-csharp.json" \
            --source-root "$GITHUB_WORKSPACE"
      - name: Privacy C# SDK tests through authenticated ABI22
        env:
          PRIVACY_CSHARP_NATIVE_ARTIFACT: ${{ runner.temp }}/privacy-jvm-native-abi22/libconnect_norito_bridge.so
          PRIVACY_CSHARP_NATIVE_MANIFEST: ${{ runner.temp }}/privacy-jvm-native-abi22/native-sdk-abi22-csharp.json
          PRIVACY_CSHARP_PYTHON_BIN: ${{ steps.privacy-csharp-python.outputs.python-path }}
        run: ci/check_privacy_csharp_sdk.sh
      - name: Revalidate ABI22 C# privacy input after execution
        if: always()
        env:
          PRIVACY_CSHARP_PYTHON: ${{ steps.privacy-csharp-python.outputs.python-path }}
        run: |
          input="$RUNNER_TEMP/privacy-jvm-native-abi22"
          "$PRIVACY_CSHARP_PYTHON" -I -S scripts/check_native_sdk_abi22_artifact.py verify \
            --artifact "$input/libconnect_norito_bridge.so" \
            --manifest "$input/native-sdk-abi22-csharp.json" \
            --source-root "$GITHUB_WORKSPACE"

  privacy_javascript_sdk_tests:
    needs: privacy_jvm_sdk_tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - id: privacy-js-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          update-environment: false
      - name: Install host-qualified privacy N-API Rust toolchain
        shell: bash
        run: |
          env -i \
            HOME="${HOME}" \
            RUSTUP_DIST_SERVER="https://static.rust-lang.org" \
            "${HOME}/.cargo/bin/rustup" toolchain install \
              "1.93.1-x86_64-unknown-linux-gnu" \
              --profile minimal \
              --no-self-update
      - name: Download frozen source-bound privacy lock input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: privacy-jvm-native-abi22-${{ github.sha }}
          path: ${{ runner.temp }}/privacy-jvm-native-abi22
      - name: Authenticate distinct privacy release lock
        env:
          PRIVACY_JS_PYTHON: ${{ steps.privacy-js-python.outputs.python-path }}
        run: |
          release_lock="$RUNNER_TEMP/privacy-jvm-native-abi22/Cargo.lock"
          [[ "$("$PRIVACY_JS_PYTHON" -I -S -c 'import hashlib,pathlib,sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$release_lock")" == "ccf4acebfe63ad981193b87afd559c195d8a67642d9536b8082f77bbf24a11f0" ]]
          [[ "$("$PRIVACY_JS_PYTHON" -I -S -c 'import hashlib,pathlib; print(hashlib.sha256(pathlib.Path("Cargo.lock").read_bytes()).hexdigest())')" == "ad0d209abaa51d4c77a9e67ccbb0c7660a0f8b7b5dbe3e3fbe4a70e142711bf7" ]]
          ! cmp -s "$release_lock" Cargo.lock
          echo "IROHA_PRIVACY_RELEASE_CARGO_LOCKFILE_PATH=$release_lock" >> "$GITHUB_ENV"
      - name: Prime privacy N-API dependencies from the frozen lock
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo fetch --locked -Z unstable-options --lockfile-path "$IROHA_PRIVACY_RELEASE_CARGO_LOCKFILE_PATH"
      - name: Install JavaScript SDK dependencies
        run: npm ci --prefix javascript/iroha_js
      - name: Privacy JavaScript SDK tests through authenticated N-API ABI22
        env:
          PRIVACY_JS_SDK_PYTHON_BIN: ${{ steps.privacy-js-python.outputs.python-path }}
        run: ci/check_privacy_js_sdk.sh
      - name: Revalidate frozen JavaScript lock inputs
        if: always()
        env:
          PRIVACY_JS_PYTHON: ${{ steps.privacy-js-python.outputs.python-path }}
        run: |
          [[ "$("$PRIVACY_JS_PYTHON" -I -S -c 'import hashlib,pathlib; print(hashlib.sha256(pathlib.Path("Cargo.lock").read_bytes()).hexdigest())')" == "ad0d209abaa51d4c77a9e67ccbb0c7660a0f8b7b5dbe3e3fbe4a70e142711bf7" ]]
          [[ "$("$PRIVACY_JS_PYTHON" -I -S -c 'import hashlib,pathlib,sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$IROHA_PRIVACY_RELEASE_CARGO_LOCKFILE_PATH")" == "ccf4acebfe63ad981193b87afd559c195d8a67642d9536b8082f77bbf24a11f0" ]]

