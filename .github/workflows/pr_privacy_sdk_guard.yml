  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  privacy_native_bridge_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install host-qualified privacy SDK Rust toolchain
        shell: bash
        run: |
          env -i \
            HOME="${HOME}" \
            RUSTUP_DIST_SERVER="https://static.rust-lang.org" \
            "${HOME}/.cargo/bin/rustup" toolchain install \
              "1.93.1-x86_64-unknown-linux-gnu" \
              --profile minimal \
              --no-self-update
      - name: Provision private privacy SDK Cargo lock
        shell: bash
        run: |
          env -u PKG_CONFIG_PATH -u LD_LIBRARY_PATH \
            ci/privacy_sdk_cargo_lockfile.sh provision-ci \
            "${GITHUB_WORKSPACE}" \
            "${RUNNER_TEMP}/iroha-privacy-sdk-cargo" \
            "${GITHUB_ENV}" \
            "${GITHUB_PATH}" \
            "${HOME}/.cargo/bin/rustup" \
            "1.93.1-x86_64-unknown-linux-gnu"
      - name: Verify privacy SDK Cargo lock isolation
        run: ci/privacy_sdk_cargo_lockfile.sh verify-ci "${GITHUB_WORKSPACE}"
      - name: Prime privacy native Cargo dependencies
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: Privacy native bridge tests
        run: |
          cargo test -p connect_norito_bridge privacy_ --lib -- --test-threads=1
          cargo build --locked --release -p connect_norito_bridge
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "${host_target}" != "x86_64-unknown-linux-gnu" ]]; then
            echo "privacy C# bridge host ${host_target} is not the required Linux x86_64 target" >&2
            exit 1
          fi
          artifact_dir="${RUNNER_TEMP}/iroha-privacy-csharp-native"
          artifact="${artifact_dir}/libconnect_norito_bridge.so"
          manifest="${artifact_dir}/native-sdk-abi21.json"
          mkdir -p "${artifact_dir}"
          cp "${CARGO_TARGET_DIR}/release/libconnect_norito_bridge.so" "${artifact}"
          python3 -I -B scripts/check_native_sdk_abi21_artifact.py record \
            --artifact "${artifact}" \
            --manifest "${manifest}" \
            --source-root "${GITHUB_WORKSPACE}" \
            --sdk csharp \
            --target "${host_target}"
          python3 -I -B scripts/check_native_sdk_abi21_artifact.py verify \
            --artifact "${artifact}" \
            --manifest "${manifest}" \
            --source-root "${GITHUB_WORKSPACE}"
      - name: Verify final privacy SDK Cargo lock isolation
        if: always()
        run: ci/privacy_sdk_cargo_lockfile.sh verify-ci "${GITHUB_WORKSPACE}"
      - name: Upload authenticated C# privacy bridge
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: privacy-csharp-native-${{ github.sha }}
          path: ${{ runner.temp }}/iroha-privacy-csharp-native
          if-no-files-found: error
          retention-days: 1

  privacy_swift_sdk_parse:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Privacy Swift SDK parse
        run: ci/check_privacy_swift_sdk.sh

  privacy_jvm_sdk_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Privacy JVM and Java SDK tests
        run: ci/check_privacy_jvm_sdk.sh

  privacy_csharp_sdk_tests:
    needs: privacy_native_bridge_tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - name: Download authenticated C# privacy bridge
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: privacy-csharp-native-${{ github.sha }}
          path: ${{ runner.temp }}/iroha-privacy-csharp-native
      - name: C# privacy native fail-closed contract
        run: python3 -I -B scripts/tests/check_privacy_csharp_native_contract_test.py
      - name: Privacy C# SDK tests
        env:
          IROHA_REQUIRE_PRIVACY_EXACT12_NATIVE: "1"
          LD_LIBRARY_PATH: ${{ runner.temp }}/iroha-privacy-csharp-native
          PRIVACY_CSHARP_NATIVE_ARTIFACT: ${{ runner.temp }}/iroha-privacy-csharp-native/libconnect_norito_bridge.so
          PRIVACY_CSHARP_NATIVE_MANIFEST: ${{ runner.temp }}/iroha-privacy-csharp-native/native-sdk-abi21.json
          PRIVACY_CSHARP_PYTHON_BIN: python3
        run: ci/check_privacy_csharp_sdk.sh

  privacy_javascript_sdk_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - name: Install JavaScript SDK dependencies
        run: npm ci --prefix javascript/iroha_js
      - name: Privacy JavaScript SDK tests
        run: ci/check_privacy_js_sdk.sh

  privacy_python_sdk_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install host-qualified privacy SDK Rust toolchain
        shell: bash
        run: |
          env -i \
            HOME="${HOME}" \
            RUSTUP_DIST_SERVER="https://static.rust-lang.org" \
            "${HOME}/.cargo/bin/rustup" toolchain install \
              "1.93.1-x86_64-unknown-linux-gnu" \
              --profile minimal \
              --no-self-update
      - id: privacy-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          update-environment: false
      - name: Provision private privacy SDK Cargo lock
        shell: bash
        run: |
          env -u PKG_CONFIG_PATH -u LD_LIBRARY_PATH \
            ci/privacy_sdk_cargo_lockfile.sh provision-ci \
            "${GITHUB_WORKSPACE}" \
            "${RUNNER_TEMP}/iroha-privacy-sdk-cargo" \
            "${GITHUB_ENV}" \
            "${GITHUB_PATH}" \
            "${HOME}/.cargo/bin/rustup" \
            "1.93.1-x86_64-unknown-linux-gnu" \
            "${{ steps.privacy-python.outputs.python-path }}"
      - name: Verify privacy SDK Cargo lock isolation
        run: ci/privacy_sdk_cargo_lockfile.sh verify-ci "${GITHUB_WORKSPACE}" "${{ steps.privacy-python.outputs.python-path }}"
      - name: Prime privacy Python SDK Cargo dependencies
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: Privacy Python SDK tests
        run: env -u PKG_CONFIG_PATH -u LD_LIBRARY_PATH ci/check_privacy_python_sdk.sh
      - name: Verify final privacy SDK Cargo lock isolation
        if: always()
        run: ci/privacy_sdk_cargo_lockfile.sh verify-ci "${GITHUB_WORKSPACE}" "${{ steps.privacy-python.outputs.python-path }}"

  privacy-sdk-guard:
    needs: [privacy_native_bridge_tests, privacy_swift_sdk_parse, privacy_jvm_sdk_tests, privacy_csharp_sdk_tests, privacy_javascript_sdk_tests, privacy_python_sdk_tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install host-qualified privacy SDK Rust toolchain
        shell: bash
        run: |
          env -i \
            HOME="${HOME}" \
            RUSTUP_DIST_SERVER="https://static.rust-lang.org" \
            "${HOME}/.cargo/bin/rustup" toolchain install \
              "1.93.1-x86_64-unknown-linux-gnu" \
              --profile minimal \
              --no-self-update
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - id: privacy-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          update-environment: false
      - name: Bind the canonical mobile Python
        env:
          SETUP_PYTHON_PATH: ${{ steps.privacy-python.outputs.python-path }}
        run: |
          mobile_python="$("$SETUP_PYTHON_PATH" -I -S -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))')"
          [[ "$("$mobile_python" -I -S -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == "3.12" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
      - name: Provision private privacy SDK Cargo lock
        shell: bash
        run: |
          env -u PKG_CONFIG_PATH -u LD_LIBRARY_PATH \
            ci/privacy_sdk_cargo_lockfile.sh provision-ci \
            "${GITHUB_WORKSPACE}" \
            "${RUNNER_TEMP}/iroha-privacy-sdk-cargo" \
            "${GITHUB_ENV}" \
            "${GITHUB_PATH}" \
            "${HOME}/.cargo/bin/rustup" \
            "1.93.1-x86_64-unknown-linux-gnu" \
            "${{ steps.privacy-python.outputs.python-path }}"
      - name: Verify privacy SDK Cargo lock isolation
        run: ci/privacy_sdk_cargo_lockfile.sh verify-ci "${GITHUB_WORKSPACE}" "${{ steps.privacy-python.outputs.python-path }}"
      - name: Prime privacy Python SDK Cargo dependencies
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: Install JavaScript SDK dependencies
        run: npm ci --prefix javascript/iroha_js
      - name: NoritoBridge privacy header parity
        run: ci/check_connect_norito_bridge_header.sh
      - name: NoritoBridge privacy header negative controls
        run: |
          ci/check_connect_norito_bridge_header.sh --self-test-missing-privacy-header-symbol
          ci/check_connect_norito_bridge_header.sh --self-test-bad-privacy-signature
          ci/check_connect_norito_bridge_header.sh --self-test-missing-privacy-rust-symbol
      - name: Reject tracked Python bytecode
        run: bash ci/check_no_tracked_python_bytecode.sh
      - name: Mobile SDK artifact readiness checker self-test
        # This fixture generator writes only its own temporary Cargo.lock. Keep
        # the job-wide wrapper reserved for commands against the real workspace.
        run: PATH="$(dirname "${IROHA_PRIVACY_REAL_CARGO}"):${PATH}" bash scripts/check_mobile_sdk_artifacts_test.sh
      - name: Privacy SDK authenticated Cargo lock self-test
        run: env -u PKG_CONFIG_PATH -u LD_LIBRARY_PATH PRIVACY_SDK_LOCK_TEST_PYTHON_BIN="${{ steps.privacy-python.outputs.python-path }}" bash ci/privacy_sdk_cargo_lockfile_test.sh
      - name: Privacy SDK guard negative controls
        run: |
          ci/check_privacy_sdk_guard.sh --negative-control-js-privacy-abi-drift
          ci/check_privacy_sdk_guard.sh --negative-control-python-privacy-abi-drift
          ci/check_privacy_sdk_guard.sh --negative-control-cargo-lock-native-workflow
          ci/check_privacy_sdk_guard.sh --negative-control-cargo-lock-python-workflow
          ci/check_privacy_sdk_guard.sh --negative-control-cargo-lock-guard-workflow
          ci/check_privacy_sdk_guard.sh --negative-control-cargo-lock-helper-generation
          ci/check_privacy_sdk_guard.sh --negative-control-cargo-config-workflow-path
          ci/check_privacy_sdk_guard.sh --negative-control-native-crates-workflow-path
          ci/check_privacy_sdk_guard.sh --negative-control-rust-toolchain-workflow-path
          ci/check_privacy_sdk_guard.sh --negative-control-cargo-lock-workflow-path
          ci/check_privacy_sdk_guard.sh --negative-control-cargo-manifest-workflow-path
          ci/check_privacy_sdk_guard.sh --negative-control-exact12-bridge-test-fixtures
          ci/check_privacy_sdk_guard.sh --negative-control-exact12-conformance-rand-edge
          ci/check_privacy_sdk_guard.sh --negative-control-exact12-release-evidence-test-fixtures
          ci/check_privacy_sdk_guard.sh --negative-control-vendor-workflow-path
          ci/check_privacy_sdk_guard.sh --negative-control-rust-toolchain-install-workflow
          ci/check_privacy_sdk_guard.sh --negative-control-cargo-fetch-workflow
          ci/check_privacy_sdk_guard.sh --negative-control-python-setup-cache-workflow
          ci/check_privacy_sdk_guard.sh --negative-control-python-path-threading-workflow
          ci/check_privacy_sdk_guard.sh --negative-control-bridge-header-workflow-path
          ci/check_privacy_sdk_guard.sh --negative-control-bridge-header-command-workflow
          ci/check_privacy_sdk_guard.sh --negative-control-bridge-header-negative-controls-workflow
          ci/check_privacy_sdk_guard.sh --negative-control-bytecode-workflow
          ci/check_privacy_sdk_guard.sh --negative-control-mobile-sdk-artifacts-selftest-workflow
          ci/check_privacy_sdk_guard.sh --negative-control-workflow-path
          ci/check_privacy_sdk_guard.sh --negative-control-workflow-command
          ci/check_privacy_sdk_guard.sh --negative-control-backend-tag-workflow-path
          ci/check_privacy_sdk_guard.sh --negative-control-browser-test-workflow-path
          ci/check_privacy_sdk_guard.sh --negative-control-negative-controls-workflow
          ci/check_privacy_sdk_guard.sh --negative-control-negative-controls-comment-workflow
          ci/check_privacy_sdk_guard.sh --negative-control-negative-controls-order-workflow
          ci/check_privacy_sdk_guard.sh --negative-control-negative-controls-inventory-parity
          ci/check_privacy_sdk_guard.sh --negative-control-readme-boundary
          ci/check_privacy_sdk_guard.sh --negative-control-readme-api
          ci/check_privacy_sdk_guard.sh --negative-control-zk-ace-proof-builder-coverage
