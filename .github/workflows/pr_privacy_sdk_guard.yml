  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APPLE_PRIVACY_PRODUCTION_ENABLED: "false"

jobs:
  privacy_native_bridge_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install host-qualified privacy SDK Rust toolchain
        shell: bash
        run: |
          env -i \
            HOME="${HOME}" \
            RUSTUP_DIST_SERVER="https://static.rust-lang.org" \
            "${HOME}/.cargo/bin/rustup" toolchain install \
              "1.93.1-x86_64-unknown-linux-gnu" \
              --profile minimal \
              --no-self-update
      - name: Provision private privacy SDK Cargo lock
        shell: bash
        run: |
          env -u PKG_CONFIG_PATH -u LD_LIBRARY_PATH \
            ci/privacy_sdk_cargo_lockfile.sh provision-ci \
            "${GITHUB_WORKSPACE}" \
            "${RUNNER_TEMP}/iroha-privacy-sdk-cargo" \
            "${GITHUB_ENV}" \
            "${GITHUB_PATH}" \
            "${HOME}/.cargo/bin/rustup" \
            "1.93.1-x86_64-unknown-linux-gnu"
      - name: Verify privacy SDK Cargo lock isolation
        run: ci/privacy_sdk_cargo_lockfile.sh verify-ci "${GITHUB_WORKSPACE}"
      - name: Prime privacy native Cargo dependencies
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: Privacy native bridge tests
        run: cargo test -p connect_norito_bridge privacy_ --lib -- --test-threads=1
      - name: Verify final privacy SDK Cargo lock isolation
        if: always()
        run: ci/privacy_sdk_cargo_lockfile.sh verify-ci "${GITHUB_WORKSPACE}"
  privacy_swift_sdk_slice:
    needs: privacy_jvm_sdk_tests
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        slice:
          - ios-arm64
          - ios-sim-arm64
          - ios-sim-x64
          - macos-arm64
          - macos-x64
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NORITO_BRIDGE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NORITO_BRIDGE_SLICE_BUILD_ID: ${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind reviewed Apple privacy mode
        shell: bash
        run: |
          if [[ -z "${GITHUB_ENV:-}" ]]; then
            echo "GITHUB_ENV is unavailable; refusing to guess the Apple privacy mode" >&2
            exit 1
          fi
          case "${APPLE_PRIVACY_PRODUCTION_ENABLED:-}" in
            true|false) ;;
            *)
