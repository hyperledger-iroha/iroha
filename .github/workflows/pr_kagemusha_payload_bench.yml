  workflow_dispatch:

concurrency:
  group: kagemusha-first-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Exact API, bridge, SDK, and artifact inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned Python SDK test dependencies
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          -r python/iroha_python/requirements-ci.lock
      - name: Build and install the exact native Python SDK
        env:
          IROHA_PYTHON_SKIP_RUNTIME_LINK: "1"
        run: |
          python -m pip install --no-deps -e python/norito_py -e python/iroha_torii_client
          wheel_dir="$(mktemp -d)"
          (
            cd python/iroha_python
            python -m maturin build --locked --release --interpreter python --out "${wheel_dir}"
          )
          python -m pip install --no-deps "${wheel_dir}"/iroha_python-*.whl
      - name: Enforce the Kagemusha Python SDK boundary
        env:
          KAGEMUSHA_RECURSIVE_SPEND_PYTHON_BIN: python
        run: |
          ci/check_kagemusha_recursive_spend_python_sdk.sh
          ci/check_kagemusha_recursive_spend_python_sdk.sh --self-test
      - run: ci/check_connect_norito_bridge_header.sh
      - run: ci/check_connect_norito_bridge_header.sh --self-test
      - run: python3 scripts/check_swift_offline_device_attestation_fixture.py
      - run: python3 -m pytest -q scripts/tests/check_swift_offline_device_attestation_fixture_test.py
      - run: ci/check_kagemusha_production_readiness.sh candidate
      - run: ci/check_kagemusha_production_readiness.sh candidate --self-test
      - run: ci/check_authenticated_tool_controller.sh
      - run: ci/check_kagemusha_recursive_spend_v4_sdk_contract.sh
      - run: ci/check_kagemusha_recursive_spend_v4_sdk_contract.sh --self-test
      - run: ci/check_kagemusha_candidate_android_lab.sh
      - run: ci/check_kagemusha_recursive_spend_policy.sh
      - run: ci/check_kagemusha_recursive_spend_policy.sh --self-test
      - run: python -m unittest scripts.tests.check_android_device_lab_slot_test
      - name: Run Kagemusha release-tool regression suites
        run: >-
          python -m pytest -q
          scripts/tests/build_kagemusha_v4_candidate_bundle_test.py
          scripts/tests/build_kagemusha_production_ios_policy_test.py
          scripts/tests/check_kagemusha_candidate_ios_evidence_test.py
          scripts/tests/kagemusha_app_attest_freshness_authority_test.py
          scripts/tests/kagemusha_production_app_attest_lab_source_test.py
          scripts/tests/measure_kagemusha_production_app_attest_bundle_test.py
          scripts/tests/sign_kagemusha_production_ios_evidence_test.py
          scripts/tests/kagemusha_source_tree_seal_test.py
          scripts/tests/produce_kagemusha_v4_source_seal_projection_test.py
          scripts/tests/kagemusha_staged_resource_guard_test.py
          scripts/tests/kagemusha_production_promotion_workflow_test.py
          scripts/tests/stage_kagemusha_candidate_android_artifacts_test.py
          scripts/tests/stage_kagemusha_candidate_android_lab_test.py
          pytests/scripts/run_kagemusha_v4_generation_test.py
          pytests/scripts/run_kagemusha_v4_generation_benchmark_test.py
      - name: Run Taira devnet orchestration regressions
        run: python -m pytest -q scripts/tests/taira_devnet_test.py
      - run: python -m pytest -q python/iroha_torii_client/tests/test_client.py

  rust:
    name: Typed lifecycle and Torii contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test -p iroha_data_model kagemusha_v4 --lib --tests
      - run: cargo test -p iroha_data_model --test iroha_data_model_group_02 offline_public_schema_golden -- --nocapture
      - run: cargo test -p iroha_data_model --lib --features transparent_api canary_ -- --nocapture
      - run: cargo test -p iroha_data_model --lib --features transparent_api post_canary_liveness_rejects_receipt_and_transaction_wire_anchor_splices -- --nocapture
      - run: cargo test -p iroha_data_model --lib --features transparent_api kagemusha_post_canary_validator_liveness -- --nocapture
      - run: cargo test -p iroha_data_model receiver_snapshot --lib
      - run: cargo test -p iroha_core kagemusha_v4 --lib
      - run: cargo test -p iroha_core --lib taira_canary -- --nocapture
      - run: cargo test -p iroha_core --lib autonomous_merge_admission_intent_ -- --nocapture
      - run: cargo test -p iroha_core offline_device_attestation_policy --lib
      - run: cargo test -p iroha_core device_registration_ --lib
      - run: cargo test -p iroha_core kagemusha_online_registration_ --lib
      - run: cargo test -p iroha_core active_receiver_snapshot_ --lib
      - run: cargo test -p iroha_core --features "dev-tools,zk-halo2-ipa,kagemusha-candidate-evidence-lab" --bin kagemusha_recursive_spend_v4_bundle final_release_inventory_is_exact_and_includes_recursive_qualification_receipt
      - run: cargo test -p iroha_core sparse_confidential_subtree_roots_match_dense_reference --lib
      - run: cargo test -p iroha_core next_zero_confidential_path_matches_padded_tree_path --lib
      - run: cargo test -p iroha_core sequential_append_paths --lib
      - run: cargo test -p iroha_core recursive_state_vector_is_exact_and_zero_padded --lib
      - run: cargo test -p iroha_core output_membership --lib
      - run: cargo test -p iroha_core v4_eq_frontier_copy_constraints --lib
      - run: cargo test -p iroha_core v4_manifest_preserves_exact_little_endian_state_limbs --lib
      - run: cargo test -p iroha_core v4_eq_and_ep_public_columns_share_the_v2_result_frontier_limb --lib
      - run: cargo test -p iroha_core kagemusha_terminal_registry_v4 --lib
      - run: cargo test -p iroha_kagami --bin kagami harden_private_tree
      - run: cargo test -p iroha_kagami --bin kagami private_custody_readme_invokes_non_executable_scripts_through_bash
      - run: cargo test -p iroha_kagami --bin kagami raw_npos_genesis_receives_the_chain_bound_localnet_epoch_seed
      - run: cargo test -p iroha_kagami --bin kagami atomic_activation_
      - run: cargo test -p iroha_kagami --bin kagami backing_
      - run: cargo test -p iroha_torii_shared offline_api --lib
      - run: cargo test -p iroha_torii generated_spec_documents_strict_typed_offline_request_schemas_and_states
      - run: cargo test -p iroha_torii generated_spec_offline
      - run: cargo test -p iroha_torii generated_spec_matches_offline_negotiation_and_operation_lifecycle
      - run: cargo test -p iroha_torii --lib bridge_finality_attestation_route_tests -- --nocapture
      - run: cargo test -p iroha_torii readiness_authenticates_exact_release_without_global_backend_flag
      - run: cargo test -p iroha_torii v4_snapshot_admission_authenticates_exact_release_without_global_backend_flag
      - run: cargo test -p iroha_torii offline_commands --lib -- --nocapture
      - run: cargo test -p iroha_config settlement_offline_tests -- --nocapture
      - run: cargo test -p iroha_config torii_kagemusha_commands_tests -- --nocapture
      - run: cargo test -p connect_norito_bridge recursive_spend_v4
      - run: cargo test -p connect_norito_bridge output_membership_local_carrier --lib
      - run: cargo test -p iroha_cli --bin iroha kagemusha_rollout -- --nocapture

  swift:
    name: Swift lifecycle surface
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Bind the canonical mobile Python
        shell: bash
        run: |
          mobile_python="$(python3 -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))')"
          [[ "$("$mobile_python" -I -S -B -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == "3.12" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Apple Rust targets and prefetch locked dependencies
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
          cargo fetch --locked
      - name: Bind the first-release Apple Cargo envelope
        run: |
          cargo_target="$RUNNER_TEMP/iroha-kagemusha-apple-cargo"
          mkdir -p "$cargo_target"
          cargo_target="$("$MOBILE_SDK_PYTHON_BINARY" -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$cargo_target")"
          rustc_path="$(rustup which --toolchain 1.93.1 rustc)"
          rustdoc_path="$(rustup which --toolchain 1.93.1 rustdoc)"
          echo "CARGO_BUILD_JOBS=1" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$cargo_target" >> "$GITHUB_ENV"
          echo "RUSTC=$rustc_path" >> "$GITHUB_ENV"
          echo "RUSTC_BOOTSTRAP=1" >> "$GITHUB_ENV"
          echo "RUSTDOC=$rustdoc_path" >> "$GITHUB_ENV"
      - name: Prepare external Apple native artifact roots
        run: |
          artifact_dir="$RUNNER_TEMP/iroha-kagemusha-apple-artifacts"
          build_dir="$RUNNER_TEMP/iroha-kagemusha-apple-build"
          scratch_dir="$RUNNER_TEMP/iroha-kagemusha-swift-tests"
          mkdir -p "$artifact_dir" "$build_dir" "$scratch_dir"
          echo "MOBILE_SDK_APPLE_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_REQUIRE_EXTERNAL_APPLE_ARTIFACT=1" >> "$GITHUB_ENV"
          echo "NORITO_BRIDGE_OUT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "NORITO_BRIDGE_BUILD_DIR=$build_dir" >> "$GITHUB_ENV"
          echo "KAGEMUSHA_RECURSIVE_SPEND_SWIFT_SCRATCH_PATH=$scratch_dir" >> "$GITHUB_ENV"
      - name: Make reviewed Iroha source read-only
        run: chmod -R a-w "$GITHUB_WORKSPACE"
      - name: Build exact ABI-22 NoritoBridge XCFramework
        run: scripts/build_norito_xcframework.sh
      - name: Authenticate Apple native artifact
        run: bash scripts/check_mobile_sdk_artifacts.sh --apple-only
      - run: ci/check_kagemusha_recursive_spend_swift_sdk.sh

  kotlin-java:
    name: Kotlin/JDK8 and mirrored Java Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Prefetch locked Rust dependency graph
        run: cargo fetch --locked
      - name: Warm dependencies, then compile the Android candidate lab offline
        env:
          KAGEMUSHA_CANDIDATE_COMPILE_WARM_GRADLE_CACHE: "1"
        run: ci/check_kagemusha_candidate_android_lab_compile.sh
      - name: Require fresh ABI-22 JNI bridge in complete Kotlin and Java suites
        run: >-
          NORITO_MOBILE_JAVA_HOME="$JAVA_HOME"
          NORITO_MOBILE_ANDROID_HOME="$ANDROID_HOME"
          bash ci/check_kagemusha_jvm_native_bridge.sh

  csharp-torii:
    name: C# ABI-21/V4 Torii DTOs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - run: ci/check_kagemusha_recursive_spend_csharp_sdk.sh

  javascript-torii:
    name: JavaScript ABI-21/V4 Torii DTOs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: javascript/iroha_js
      - run: npm run build:dist
        working-directory: javascript/iroha_js
      - run: ci/check_kagemusha_recursive_spend_javascript_sdk.sh
