  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  kagemusha_native_bridge_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Kagemusha recursive spend native bridge smoke tests
        run: |
          cargo test -p connect_norito_bridge kagemusha_recursive_spend_ffi_rejects_invalid_archives_without_output --lib -- --test-threads=1
          cargo test -p connect_norito_bridge kagemusha_recursive_spend_ffi_rejects_empty_nested_pallas_archives_without_output --lib -- --test-threads=1
          cargo test -p connect_norito_bridge kagemusha_recursive_spend_lineage_witness_ffi_rejects_invalid_inputs_without_output --lib -- --test-threads=1
          cargo test -p connect_norito_bridge kagemusha_recursive_spend_lineage_append_boundary_ffi_rejects_semantic_profile_archives --lib -- --test-threads=1
          cargo test -p iroha_js_host kagemusha_recursive_spend_lineage_append_boundary_rejects_duplicate_current_outputs --lib -- --test-threads=1
          cargo test -p connect_norito_bridge kagemusha_compact_ffi_rejects_oversized_lengths_without_output --lib -- --test-threads=1
          cargo test -p connect_norito_bridge kagemusha_verified_compact_token_ffi_rejects --lib -- --test-threads=1
          cargo test -p connect_norito_bridge kagemusha_unanchored_compact_token_ffi_rejects_valid_bundle_without_records --lib -- --test-threads=1
          cargo test -p connect_norito_bridge kagemusha_verified_record_compact_token_ffi_rejects_bad_records --lib -- --test-threads=1
          cargo test -p connect_norito_bridge kagemusha_verified_record_recursive_aggregation_proof_bundle_ffi_rejects_adversarial_inputs --lib -- --test-threads=1
          cargo test -p connect_norito_bridge kagemusha_recursive_compact_ffi_rejects_windowed_records_before_unavailable --lib -- --test-threads=1
          RUST_MIN_STACK=67108864 CARGO_PROFILE_TEST_OPT_LEVEL=3 CARGO_PROFILE_TEST_DEBUG=0 cargo test -p connect_norito_bridge kagemusha_recursive_compact_ffi_fails_closed_and_rejects_adversarial_inputs --lib -- --test-threads=1

  kagemusha_swift_sdk_parse:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Kagemusha recursive spend Swift SDK parse
        run: ci/check_kagemusha_recursive_spend_swift_sdk.sh

  kagemusha_csharp_sdk_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Kagemusha recursive spend C# SDK tests
        run: ci/check_kagemusha_recursive_spend_csharp_sdk.sh

  kagemusha_javascript_sdk_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - name: Install JavaScript SDK dependencies
        run: npm ci --prefix javascript/iroha_js
      - name: Kagemusha recursive spend JavaScript SDK tests
        run: ci/check_kagemusha_recursive_spend_js_sdk.sh

  kagemusha_jvm_sdk_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Kagemusha recursive spend JVM SDK tests
        run: ci/check_kagemusha_recursive_spend_jvm_sdk.sh

  kagemusha_python_sdk_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python recursive spend PyO3 host tests
        run: cargo test -p iroha_python_rs kagemusha_recursive_spend_lineage_append_boundary_python_rejects_duplicate_current_outputs --lib -- --test-threads=1
      - name: Python recursive spend SDK tests
        run: ci/check_kagemusha_recursive_spend_python_sdk.sh

  kagemusha_payload_bench:
    needs: [kagemusha_native_bridge_tests, kagemusha_swift_sdk_parse, kagemusha_csharp_sdk_tests, kagemusha_javascript_sdk_tests, kagemusha_jvm_sdk_tests, kagemusha_python_sdk_tests]
    runs-on: ubuntu-latest
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: NoritoBridge recursive spend header parity
        run: ci/check_connect_norito_bridge_header.sh
      - name: NoritoBridge recursive spend header negative controls
        run: |
          ci/check_connect_norito_bridge_header.sh --negative-control-missing-recursive-header
          ci/check_connect_norito_bridge_header.sh --negative-control-bad-recursive-signature
          ci/check_connect_norito_bridge_header.sh --negative-control-missing-rust-export
          ci/check_connect_norito_bridge_header.sh --negative-control-umbrella-drift
      - name: Reject tracked Python bytecode
        run: bash ci/check_no_tracked_python_bytecode.sh
      - name: Kagemusha recursive spend SDK parity negative controls
        run: |
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-workflow
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-native-manifest-workflow
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-js-browser-helper
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-js-lineage-key-artifact-copy
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-js-lineage-key-package-binding
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-js-kagemusha-instruction-transaction-builder
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-python-lineage-key-package-binding
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-csharp-lineage-key-package-binding
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-swift-lineage-key-package-binding
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-csharp-lineage-witness-availability-probe
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-csharp-lineage-witness-append-availability-probe
