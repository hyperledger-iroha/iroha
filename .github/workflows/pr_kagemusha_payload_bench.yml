name: Kagemusha first-release contract

on:
  pull_request:
    paths:
      - ".github/workflows/pr_kagemusha_payload_bench.yml"
      - "ci/check_connect_norito_bridge_header.sh"
      - "ci/check_kagemusha_*.sh"
      - "crates/connect_norito_bridge/**"
      - "crates/iroha/src/client.rs"
      - "crates/iroha_core/src/zk/**"
      - "crates/iroha_core/src/bin/kagemusha_recursive_spend_v3_bundle.rs"
      - "crates/iroha_data_model/src/offline/**"
      - "crates/iroha_torii/**"
      - "crates/iroha_torii_shared/**"
      - "IrohaSwift/**"
      - "java/iroha_android/**"
      - "kotlin/core-jvm/**"
      - "python/iroha_torii_client/**"
      - "docs/source/offline_kagemusha*.md"
      - "docs/portal/static/openapi/torii.json"
      - "scripts/check_android_device_lab_slot.py"
      - "scripts/tests/check_android_device_lab_slot_test.py"
  workflow_dispatch:

concurrency:
  group: kagemusha-first-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Exact API, bridge, SDK, and artifact inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: ci/check_connect_norito_bridge_header.sh
      - run: ci/check_connect_norito_bridge_header.sh --self-test
      - run: ci/check_kagemusha_recursive_spend_policy.sh
      - run: ci/check_kagemusha_recursive_spend_policy.sh --self-test
      - run: python -m unittest scripts.tests.check_android_device_lab_slot_test
      - run: python -m pytest -q python/iroha_torii_client/tests/test_client.py

  rust:
    name: Typed lifecycle and Torii contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p iroha_torii_shared offline_api --lib
      - run: cargo test -p iroha_torii generated_spec_documents_direct_offline_dtos_and_operation_states
      - run: cargo test -p iroha_torii generated_spec_offline
      - run: cargo test -p iroha_torii generated_spec_matches_offline_negotiation_and_operation_lifecycle
      - run: cargo test -p connect_norito_bridge recursive_spend_v3_artifact --features privacy-production-enabled

  swift:
    name: Swift lifecycle surface
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ci/check_kagemusha_recursive_spend_swift_sdk.sh
