  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  kagemusha_native_bridge_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Kagemusha recursive spend native bridge smoke tests
        run: cargo test -p connect_norito_bridge kagemusha_recursive_spend_ffi_rejects_invalid_archives_without_output --lib -- --test-threads=1

  kagemusha_swift_sdk_parse:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Kagemusha recursive spend Swift SDK parse
        run: ci/check_kagemusha_recursive_spend_swift_sdk.sh

  kagemusha_csharp_sdk_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Kagemusha recursive spend C# SDK tests
        run: ci/check_kagemusha_recursive_spend_csharp_sdk.sh

  kagemusha_javascript_sdk_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - name: Install JavaScript SDK dependencies
        run: npm ci --prefix javascript/iroha_js
      - name: Kagemusha recursive spend JavaScript SDK tests
        run: ci/check_kagemusha_recursive_spend_js_sdk.sh

  kagemusha_jvm_sdk_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Kagemusha recursive spend JVM SDK tests
        run: ci/check_kagemusha_recursive_spend_jvm_sdk.sh

  kagemusha_python_sdk_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python recursive spend SDK tests
        run: ci/check_kagemusha_recursive_spend_python_sdk.sh

  kagemusha_payload_bench:
    needs: [kagemusha_native_bridge_tests, kagemusha_swift_sdk_parse, kagemusha_csharp_sdk_tests, kagemusha_javascript_sdk_tests, kagemusha_jvm_sdk_tests, kagemusha_python_sdk_tests]
    runs-on: ubuntu-latest
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: NoritoBridge recursive spend header parity
        run: ci/check_connect_norito_bridge_header.sh
      - name: NoritoBridge recursive spend header negative controls
        run: |
          ci/check_connect_norito_bridge_header.sh --negative-control-missing-recursive-header
          ci/check_connect_norito_bridge_header.sh --negative-control-bad-recursive-signature
          ci/check_connect_norito_bridge_header.sh --negative-control-missing-rust-export
          ci/check_connect_norito_bridge_header.sh --negative-control-umbrella-drift
      - name: Reject tracked Python bytecode
        run: bash ci/check_no_tracked_python_bytecode.sh
      - name: Kagemusha recursive spend SDK parity negative controls
        run: |
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-workflow
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-native-manifest-workflow
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-js-browser-helper
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-sdk-helper-surface
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-sdk-readme-boundary
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-sdk-readme-availability-surface
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-sdk-readme-stale-future-lineage
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-cross-sdk-helper-bodies
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-recursive-compact-verifier-surface
          ci/check_kagemusha_recursive_spend_sdk_parity.sh --negative-control-kagemusha-abi-probe-bounds
