name: Numeric V1 architecture parity

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: numeric-v1-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  numeric_v1_architecture_parity:
    name: Numeric V1 parity (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-14
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
          shared-key: numeric-v1-${{ matrix.runner }}
      - name: Verify canonical numeric fixtures and consensus behavior
        run: |
          cargo test --locked -p ivm --test ivm_group_06 numeric_
          cargo test --locked -p ivm --test ivm_group_01 abi_hash_versions::
          cargo test --locked -p ivm --test ivm_group_03 gas_schedule_hash
          cargo run --locked -p ivm --features dev-tools --bin gen_abi_hash_doc -- --check
          cargo test --locked -p ivm --test ivm_group_05 kotodama_checked_arithmetic::
          cargo test --locked -p iroha_primitives randomized_decimal_arithmetic_matches_independent_rational_reference
