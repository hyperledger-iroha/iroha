name: SoraFS CLI release candidate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sorafs-cli-release.yml"
      - ".github/workflows/sorafs-fixtures-nightly.yml"
      - ".github/workflows/sorafs-orchestrator-sdk.yml"
      - "ci/check_sorafs_cli_release.sh"
      - "scripts/check_sorafs_release_automation.py"
      - "scripts/check_sorafs_release_version_map.py"
      - "scripts/requirements.txt"
      - "scripts/package_sorafs_validate_release.sh"
      - "scripts/release_sorafs_cli.sh"
      - "scripts/tests/check_sorafs_release_version_map_test.py"
      - "scripts/tests/check_sorafs_release_automation_test.py"
      - "scripts/tests/package_sorafs_validate_release_test.py"
      - "scripts/tests/release_sorafs_cli_test.py"
      - "release/version-map.toml"
      - "crates/sorafs_car/**"
      - "crates/sorafs_chunker/**"
      - "crates/sorafs_manifest/**"
      - "crates/sorafs_orchestrator/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  push:
    tags:
      - "sorafs-cli-v*"
  workflow_dispatch:
    inputs:
      sign_artifacts:
        description: Keyless-sign release-candidate files with GitHub OIDC
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_NET_OFFLINE: "false"
      CARGO_TERM_COLOR: never
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: sorafs-cli-release
      - name: Install script test dependencies
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Validate cross-package version map
        id: version
        run: |
          python3 scripts/check_sorafs_release_automation.py | tee release-automation-summary.json
          python3 scripts/check_sorafs_release_version_map.py | tee version-map-summary.json
          release_version="$(python3 -c 'from scripts.check_sorafs_release_version_map import validate_version_map; from pathlib import Path; print(validate_version_map(Path.cwd())["release_version"])')"
          echo "version=${release_version}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "sorafs-cli-v${release_version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match version-map release ${release_version}" >&2
            exit 1
          fi
      - name: Run strict CLI release gate
        run: bash ci/check_sorafs_cli_release.sh
      - name: Prepare release evidence directory
        run: mkdir -p artifacts/sorafs-release
      - name: Generate release dependency SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/sorafs-release/sorafs-release.spdx.json
          syft-version: v1.44.0
          upload-artifact: false
          upload-release-assets: false
      - name: Reject high or critical known vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          grype-version: v0.112.0
          sbom: artifacts/sorafs-release/sorafs-release.spdx.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: artifacts/sorafs-release/sorafs-release-vulnerabilities.sarif
          cache-db: true
      - name: Upload gate summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sorafs-cli-release-gate-${{ github.run_id }}
          path: |
            release-automation-summary.json
            version-map-summary.json
            artifacts/sorafs-release/sorafs-release.spdx.json
            artifacts/sorafs-release/sorafs-release-vulnerabilities.sarif
          if-no-files-found: error
          retention-days: 30

  package:
    needs: release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            binary_suffix: ""
          - os: macos-14
            platform: macos
            binary_suffix: ""
          - os: windows-latest
            platform: windows
            binary_suffix: ".exe"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_NET_OFFLINE: "false"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: sorafs-cli-package-${{ matrix.os }}
      - name: Download validated release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sorafs-cli-release-gate-${{ github.run_id }}
          path: artifacts/release-gate
      - name: Build CLI release binaries
        shell: bash
        run: |
          cargo build --locked --release -p sorafs_orchestrator --bin sorafs_cli
          cargo build --locked --release -p sorafs_car --features cli --bin sorafs_fetch
          cargo build --locked --release -p sorafs_manifest --bin sorafs-validate
          mkdir -p artifacts/sorafs-cli
          suffix="${{ matrix.binary_suffix }}"
          cp "target/release/sorafs_cli${suffix}" "artifacts/sorafs-cli/sorafs_cli${suffix}"
          cp "target/release/sorafs_fetch${suffix}" "artifacts/sorafs-cli/sorafs_fetch${suffix}"
          cp "target/release/sorafs-validate${suffix}" "artifacts/sorafs-cli/sorafs-validate${suffix}"
          "artifacts/sorafs-cli/sorafs_cli${suffix}" --help > artifacts/sorafs-cli/sorafs_cli.help.txt
          "artifacts/sorafs-cli/sorafs_fetch${suffix}" --help > artifacts/sorafs-cli/sorafs_fetch.help.txt
          "artifacts/sorafs-cli/sorafs-validate${suffix}" --help > artifacts/sorafs-cli/sorafs-validate.help.txt
          cp release/version-map.toml artifacts/sorafs-cli/version-map.toml
          cp artifacts/release-gate/artifacts/sorafs-release/sorafs-release.spdx.json artifacts/sorafs-cli/
          cp artifacts/release-gate/artifacts/sorafs-release/sorafs-release-vulnerabilities.sarif artifacts/sorafs-cli/

      - name: Package reference validator and FFI header
        shell: bash
        run: |
          suffix="${{ matrix.binary_suffix }}"
          bash scripts/package_sorafs_validate_release.sh \
            --version "${{ needs.release-gate.outputs.version }}" \
            --binary "artifacts/sorafs-cli/sorafs-validate${suffix}" \
            --out-dir dist/sorafs-validate-release
          mkdir -p artifacts/sorafs-cli/reference-validator
          cp -R dist/sorafs-validate-release/. artifacts/sorafs-cli/reference-validator/
      - name: Generate platform binary SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: artifacts/sorafs-cli
          format: spdx-json
          output-file: artifacts/sorafs-cli/sorafs-cli-${{ matrix.platform }}.spdx.json
          syft-version: v1.44.0
          upload-artifact: false
          upload-release-assets: false
      - name: Scan platform binary SBOM
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          grype-version: v0.112.0
          sbom: artifacts/sorafs-cli/sorafs-cli-${{ matrix.platform }}.spdx.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: artifacts/sorafs-cli/sorafs-cli-${{ matrix.platform }}-vulnerabilities.sarif
          cache-db: true
      - name: Finalize platform checksums
        shell: bash
        run: |
          cd artifacts/sorafs-cli
          find . -type f ! -name SHA256SUMS -print | LC_ALL=C sort | while IFS= read -r file; do
            file="${file#./}"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$file"
            else
              shasum -a 256 "$file"
            fi
          done > SHA256SUMS
      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sorafs-cli-${{ needs.release-gate.outputs.version }}-${{ matrix.platform }}
          path: artifacts/sorafs-cli/
          if-no-files-found: error
          retention-days: 30

  sign:
    if: ${{ startsWith(github.ref, 'refs/tags/sorafs-cli-v') || inputs.sign_artifacts }}
    needs: [release-gate, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sorafs-cli-*
          path: signed-input
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
      - name: Verify platform package checksums before signing
        run: |
          mapfile -d '' checksum_files < <(find signed-input -type f -name SHA256SUMS -print0)
          if [[ "${#checksum_files[@]}" -ne 3 ]]; then
            echo "expected exactly three platform SHA256SUMS files" >&2
            exit 1
          fi
          for checksum_file in "${checksum_files[@]}"; do
            checksum_dir="$(dirname "$checksum_file")"
            (
              cd "$checksum_dir"
              sha256sum --check SHA256SUMS
              actual_files="$(mktemp)"
              listed_files="$(mktemp)"
              unique_listed_files="$(mktemp)"
              find . -type f ! -name SHA256SUMS -printf '%P\n' | LC_ALL=C sort > "$actual_files"
              sed -E 's/^[0-9a-f]{64} [ *]//' SHA256SUMS | LC_ALL=C sort > "$listed_files"
              LC_ALL=C sort -u "$listed_files" > "$unique_listed_files"
              if ! cmp -s "$listed_files" "$unique_listed_files"; then
                echo "SHA256SUMS contains duplicate file entries" >&2
                exit 1
              fi
              if ! cmp -s "$actual_files" "$listed_files"; then
                echo "SHA256SUMS does not cover the exact platform candidate file set" >&2
                exit 1
              fi
            )
          done
      - name: Attest release-candidate build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: signed-input/**/*
      - name: Stage offline provenance bundles
        run: |
          attestation_list="${RUNNER_TEMP}/created_attestation_paths.txt"
          if [[ ! -f "$attestation_list" || -L "$attestation_list" ]]; then
            echo "GitHub attestation action did not emit a regular bundle list" >&2
            exit 1
          fi
          mkdir -p signed-input/github-attestations
          count=0
          while IFS= read -r attestation_path; do
            [[ -n "$attestation_path" ]] || continue
            if [[ "$attestation_path" != "${RUNNER_TEMP}/"* || ! -f "$attestation_path" || -L "$attestation_path" ]]; then
              echo "attestation bundle path escaped the runner temporary directory" >&2
              exit 1
            fi
            count=$((count + 1))
            if [[ "$count" -gt 16 ]]; then
              echo "attestation bundle count exceeds the release ceiling" >&2
              exit 1
            fi
            cp -- "$attestation_path" "signed-input/github-attestations/provenance-${count}.json"
          done < "$attestation_list"
          if [[ "$count" -lt 1 ]]; then
            echo "no offline provenance bundle was generated" >&2
            exit 1
          fi
      - name: Keyless-sign every release-candidate file
        run: |
          find signed-input -type f ! -name '*.sigstore.json' -print0 | while IFS= read -r -d '' file; do
            bundle="${file}.sigstore.json"
            cosign sign-blob --yes --bundle "$bundle" "$file"
            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/sorafs-cli-release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$file"
          done
      - name: Upload signed release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sorafs-cli-${{ needs.release-gate.outputs.version }}-signed
          path: signed-input/
          if-no-files-found: error
          retention-days: 90
