name: Linux observer publication candidate

# Produces review material only. It does not load, approve or deploy its bridge.
on:
  pull_request:
    paths:
      - ".github/workflows/linux_observer_candidate.yml"
      - "scripts/prepare_linux_observer_candidate.py"
      - "scripts/tests/prepare_linux_observer_candidate_test.py"
      - "docs/validation/linux_observer_candidate.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-observer-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out candidate driver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: candidate-driver
          persist-credentials: false
      - name: Check out the fixed observer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3743ff550ca3632e92b23e5d60d084b41a069b29
          path: observer-source
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.99.1
          cache: "false"
          rustflags: ""
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Exercise candidate protocol and custody controls
        working-directory: candidate-driver
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==9.0.3
          python -m pytest -q scripts/tests/prepare_linux_observer_candidate_test.py
      - name: Build and normally publish the review candidate
        env:
          DRIVER_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          cargo_bin="$(rustup which --toolchain 1.99.1 cargo)"
          rustc_bin="$(rustup which --toolchain 1.99.1 rustc)"
          python candidate-driver/scripts/prepare_linux_observer_candidate.py \
            --source-root "$GITHUB_WORKSPACE/observer-source" \
            --output-root "$RUNNER_TEMP/linux-observer-candidate" \
            --cargo-home "$HOME/.cargo" \
            --cargo-bin "$cargo_bin" --rustc-bin "$rustc_bin" \
            --driver-revision "$DRIVER_REVISION"
      - name: Preserve candidate and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-observer-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/linux-observer-candidate/review/
            ${{ runner.temp }}/linux-observer-candidate/logs/
          if-no-files-found: error
          retention-days: 30
