name: Torii OpenAPI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, optimizations]
    paths:
      - ".cargo/config.toml"
      - ".github/workflows/openapi.yml"
      - ".github/actions/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "IrohaSwift/**"
      - "Makefile"
      - "rust-toolchain.toml"
      - "ci/**"
      - "ci/check_android_codegen.sh"
      - "crates/**"
      - "xtask/**"
      - "ci/check_openapi_spec.sh"
      - "csharp/**"
      - "data_model/**"
      - "artifacts/openapi/**"
      - "specs/sdk/android/generated/**"
      - "fixtures/**"
      - "integration_tests/**"
      - "java/iroha_android/**"
      - "java/norito_java/**"
      - "javascript/iroha_js/**"
      - "kotlin/**"
      - "mochi/**"
      - "python/iroha_python/**"
      - "python/iroha_torii_client/**"
      - "python/norito_py/**"
      - "release/openapi-cargo-lock-v1.txt"
      - "release/openapi-generator-inputs-v1.txt"
      - "release/version-map.toml"
      - "scripts/android_codegen_docs.py"
      - "scripts/android_codegen_replay_sorafs_fixture.py"
      - "scripts/check_android_codegen_parity.py"
      - "scripts/check_sorafs_release_version_map.py"
      - "scripts/**"
      - "tools/**"
      - "vendor/**"
  push:
    branches: [main, optimizations]
    paths:
      - ".cargo/config.toml"
      - ".github/workflows/openapi.yml"
      - ".github/actions/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "IrohaSwift/**"
      - "Makefile"
      - "rust-toolchain.toml"
      - "ci/**"
      - "ci/check_android_codegen.sh"
      - "crates/**"
      - "xtask/**"
      - "ci/check_openapi_spec.sh"
      - "csharp/**"
      - "data_model/**"
      - "artifacts/openapi/**"
      - "specs/sdk/android/generated/**"
      - "fixtures/**"
      - "integration_tests/**"
      - "java/iroha_android/**"
      - "java/norito_java/**"
      - "javascript/iroha_js/**"
      - "kotlin/**"
      - "mochi/**"
      - "python/iroha_python/**"
      - "python/iroha_torii_client/**"
      - "python/norito_py/**"
      - "release/openapi-cargo-lock-v1.txt"
      - "release/openapi-generator-inputs-v1.txt"
      - "release/version-map.toml"
      - "scripts/android_codegen_docs.py"
      - "scripts/android_codegen_replay_sorafs_fixture.py"
      - "scripts/check_android_codegen_parity.py"
      - "scripts/check_sorafs_release_version_map.py"
      - "scripts/**"
      - "tools/**"
      - "vendor/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binding-parity:
    name: Complete Norito binding parity
    runs-on: ubuntu-24.04
    env:
      IROHA_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/target/debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-native-ci
      # The build script also invokes binding checks. Bootstrap their mandatory
      # JNI address validator first, then run every strict parity lane below.
      - name: Build same-source native address validator
        env:
          NORITO_SKIP_BINDINGS_SYNC: "1"
        run: cargo build --locked -p connect_norito_bridge --lib
      - name: Require the built JNI library
        run: test -s "$IROHA_NATIVE_LIBRARY_PATH/libconnect_norito_bridge.so"
      - name: Run Python, Java, and Kotlin parity with no capability skips
        run: bash ci/check_norito_bindings_sync.sh

  metadata:
    name: OpenAPI metadata and release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/openapi/package-lock.json
      - name: Install the deterministic OpenAPI dependency graph
        working-directory: tools/openapi
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the lockfile is reproducible
        working-directory: tools/openapi
        run: |
          npm install --ignore-scripts --package-lock-only --no-audit --no-fund
          git diff --exit-code -- package-lock.json
      - name: Audit the OpenAPI dependency graph
        working-directory: tools/openapi
        run: npm audit --audit-level=low
      - name: Test OpenAPI artifact tooling
        run: >-
          node --test
          tools/openapi/scripts/__tests__/sync-openapi.test.mjs
          tools/openapi/scripts/__tests__/verify-openapi-versions.test.mjs
          tools/openapi/scripts/__tests__/verify-musubi-v1-contract.test.mjs
          tools/openapi/scripts/__tests__/check-openapi-signatures.test.mjs
          tools/openapi/scripts/__tests__/openapi-manifest-v2.test.mjs
          tools/openapi/scripts/__tests__/openapi-release-inputs.test.mjs
          tools/openapi/scripts/__tests__/openapi-release-contract.test.mjs
          tools/openapi/scripts/__tests__/openapi-safe-file.test.mjs
          tools/openapi/scripts/__tests__/provision-openapi-cargo-lock.test.mjs
          tools/openapi/scripts/__tests__/openapi-signature.test.mjs
      - name: Verify unsigned development artifact metadata
        run: |
          node tools/openapi/scripts/verify-openapi-release-inputs.mjs
          node tools/openapi/scripts/verify-openapi-versions.mjs --allow-unsigned
          node tools/openapi/scripts/check-openapi-signatures.mjs \
            --allow-unsigned=latest \
            --allow-unsigned=current

  canonical-spec:
    name: Canonical Torii static-authority parity
    needs: [metadata]
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      NORITO_SKIP_BINDINGS_SYNC: "1"
      OPENAPI_REQUIRE_SIGNED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-native-ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/openapi/package-lock.json
      - name: Validate the pre-existing pinned OpenAPI Cargo lock
        run: |
          repo_root="$(pwd -P)"
          node tools/openapi/scripts/provision-openapi-cargo-lock.mjs pin \
            --source="${repo_root}/Cargo.lock" \
            --check="${repo_root}/release/openapi-cargo-lock-v1.txt"
      - name: Exercise replay provisioning and failure contracts
        run: >-
          python3 -m pytest -q
          scripts/tests/check_openapi_fail_closed_test.py
          scripts/tests/check_android_codegen_release_gate_test.py
          scripts/tests/ci_image_preflight_test.py
      - name: Select installed Cargo and Rustc executables for sealed replay
        shell: bash
        run: |
          set -euo pipefail
          release_cargo="$(rustup which cargo)"
          # A registry dependency can carry a different rust-toolchain.toml.
          # Keep Cargo's compiler independent of each dependency's working directory.
          release_rustc="$(rustup which rustc)"
          python3 -I -S - "$release_cargo" "$release_rustc" "$GITHUB_ENV" <<'PY'
          import os
          import stat
          import sys

          cargo, rustc, environment_file = sys.argv[1:]
          for path in (cargo, rustc):
              metadata = os.lstat(path)
              if (
                  not os.path.isabs(path)
                  or os.path.abspath(path) != path
                  or os.path.realpath(path) != path
                  or any(character in path for character in "\r\n")
                  or not stat.S_ISREG(metadata.st_mode)
                  or stat.S_ISLNK(metadata.st_mode)
                  or not os.access(path, os.X_OK)
              ):
                  raise SystemExit("Replay tools must be canonical executable regular files")
          with open(environment_file, "a", encoding="utf-8") as stream:
              stream.write(f"IROHA_RELEASE_CARGO_BIN={cargo}\nRUSTC={rustc}\n")
          PY
      - name: Prefetch committed native dependencies before offline replay
        shell: bash
        run: |
          set -euo pipefail
          native_target="$("$RUSTC" -vV | sed -n 's/^host: //p')"
          test -n "$native_target"
          "$IROHA_RELEASE_CARGO_BIN" fetch --locked --target "$native_target"
      - name: Verify Cargo lock validation and prefetch keep the checkout clean
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Install the deterministic OpenAPI dependency graph
        working-directory: tools/openapi
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Replay and verify canonical OpenAPI authorities
        run: bash ci/check_openapi_spec.sh
      - name: Regenerate Android bindings twice from the pinned commit
        run: bash ci/check_android_codegen.sh
