name: Torii OpenAPI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/openapi.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "IrohaSwift/**"
      - "Makefile"
      - "rust-toolchain.toml"
      - "ci/**"
      - "ci/check_android_codegen.sh"
      - "crates/**"
      - "xtask/**"
      - "ci/check_openapi_spec.sh"
      - "csharp/**"
      - "data_model/**"
      - "docs/i18n/**"
      - "docs/portal/package.json"
      - "docs/portal/package-lock.json"
      - "docs/portal/scripts/**"
      - "docs/portal/static/openapi/**"
      - "docs/source/sdk/android/generated/**"
      - "fixtures/**"
      - "integration_tests/**"
      - "java/iroha_android/**"
      - "java/norito_java/**"
      - "javascript/iroha_js/**"
      - "kotlin/**"
      - "mochi/**"
      - "python/iroha_python/**"
      - "release/openapi-generator-inputs-v1.txt"
      - "release/version-map.toml"
      - "scripts/android_codegen_docs.py"
      - "scripts/android_codegen_replay_sorafs_fixture.py"
      - "scripts/check_android_codegen_parity.py"
      - "scripts/check_sorafs_release_version_map.py"
      - "scripts/**"
      - "tools/**"
      - "vendor/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/openapi.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "IrohaSwift/**"
      - "Makefile"
      - "rust-toolchain.toml"
      - "ci/**"
      - "ci/check_android_codegen.sh"
      - "crates/**"
      - "xtask/**"
      - "ci/check_openapi_spec.sh"
      - "csharp/**"
      - "data_model/**"
      - "docs/i18n/**"
      - "docs/portal/package.json"
      - "docs/portal/package-lock.json"
      - "docs/portal/scripts/**"
      - "docs/portal/static/openapi/**"
      - "docs/source/sdk/android/generated/**"
      - "fixtures/**"
      - "integration_tests/**"
      - "java/iroha_android/**"
      - "java/norito_java/**"
      - "javascript/iroha_js/**"
      - "kotlin/**"
      - "mochi/**"
      - "python/iroha_python/**"
      - "release/openapi-generator-inputs-v1.txt"
      - "release/version-map.toml"
      - "scripts/android_codegen_docs.py"
      - "scripts/android_codegen_replay_sorafs_fixture.py"
      - "scripts/check_android_codegen_parity.py"
      - "scripts/check_sorafs_release_version_map.py"
      - "scripts/**"
      - "tools/**"
      - "vendor/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: OpenAPI metadata and portal tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/portal/package-lock.json
      - name: Install the deterministic portal dependency graph
        working-directory: docs/portal
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the lockfile is reproducible
        working-directory: docs/portal
        run: |
          npm install --ignore-scripts --package-lock-only --no-audit --no-fund
          git diff --exit-code -- package-lock.json
      - name: Audit the portal dependency graph
        working-directory: docs/portal
        run: npm audit --audit-level=low
      - name: Test OpenAPI artifact tooling
        run: >-
          node --test
          docs/portal/scripts/__tests__/sync-openapi.test.mjs
          docs/portal/scripts/__tests__/verify-openapi-versions.test.mjs
          docs/portal/scripts/__tests__/check-openapi-signatures.test.mjs
          docs/portal/scripts/__tests__/openapi-manifest-v2.test.mjs
          docs/portal/scripts/__tests__/openapi-release-inputs.test.mjs
          docs/portal/scripts/__tests__/openapi-release-contract.test.mjs
          docs/portal/scripts/__tests__/openapi-safe-file.test.mjs
          docs/portal/scripts/__tests__/openapi-signature.test.mjs
      - name: Verify unsigned development artifact metadata
        run: |
          node docs/portal/scripts/verify-openapi-release-inputs.mjs
          node docs/portal/scripts/verify-openapi-versions.mjs --allow-unsigned
          node docs/portal/scripts/check-openapi-signatures.mjs \
            --allow-unsigned=2025-q2 \
            --allow-unsigned=latest \
            --allow-unsigned=current
      - name: Preserve the immutable 2025-q2 snapshot
        run: >-
          printf '%s  %s\n'
          'fead7abd7a092d1acb9f9750ad09bcdb0da4c3e86f0f966478d7e7ba8045adc0'
          'docs/portal/static/openapi/versions/2025-q2/torii.json'
          | sha256sum --check --strict

  canonical-spec:
    name: Canonical Torii generator parity
    needs: metadata
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: target/openapi-ci
      NORITO_SKIP_BINDINGS_SYNC: "1"
      OPENAPI_REQUIRE_SIGNED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
          shared-key: torii-openapi
      - name: Regenerate and verify canonical OpenAPI artifacts
        run: bash ci/check_openapi_spec.sh
