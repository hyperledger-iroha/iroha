name: Numeric V1 SDK parity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: numeric-v1-sdk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-fixture-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
          shared-key: numeric-v1-sdk-rust
      - name: Verify Rust-authored fixture freshness and outcomes
        run: cargo test --locked -p ivm --test ivm_group_06 numeric_v1_sdk_fixture

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: javascript/iroha_js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Build the published distribution
        run: npm run build:dist
      - name: Verify pure source numeric paths
        run: node --test test/numericV1.test.js
      - name: Verify pure browser numeric paths
        run: >-
          node --test
          --test-name-pattern="encodeQuantityNoritoValue enforces the nominal Quantity boundary|root entrypoints expose every declared typed Norito value encoder"
          test/norito.test.js
      - name: Verify pure quantity builder boundaries
        run: >-
          node --test
          --test-name-pattern="smart-contract manifest type declarations reject retired numeric names|CastPlainBallot pure-JS Norito codec preserves strict fractional Quantity|retired generic confidential instructions stay absent from builders and codec discriminants"
          test/instructionBuilders.test.js
      - name: Verify packaged quantity boundaries
        run: >-
          node --test
          --test-name-pattern="package dist quantity builders reject numbers and noncanonical strings"
          test/package_dist.test.js
      - name: Verify exact dynamic-access manifest policies
        run: >-
          node --test
          --test-name-pattern="dynamic-access|dynamic access|compiler manifest boundary rejects unknown"
          test/kotodamaCompiler.test.js
          test/toriiClient.test.js

  javascript-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: javascript/iroha_js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.93.1-x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
          shared-key: numeric-v1-sdk-js-native
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Provision the authenticated external Cargo lock
        working-directory: ${{ github.workspace }}
        run: >-
          env -u PKG_CONFIG_PATH -u LD_LIBRARY_PATH
          ci/privacy_sdk_cargo_lockfile.sh provision-ci
          "${GITHUB_WORKSPACE}"
          "${RUNNER_TEMP}/iroha-numeric-v1-sdk-cargo"
          "${GITHUB_ENV}"
          "${GITHUB_PATH}"
          "${HOME}/.cargo/bin/rustup"
          "1.93.1-x86_64-unknown-linux-gnu"
      - name: Verify Cargo lock isolation
        working-directory: ${{ github.workspace }}
        run: ci/privacy_sdk_cargo_lockfile.sh verify-ci "${GITHUB_WORKSPACE}"
      - name: Prime locked Cargo dependencies for the sealed offline build
        working-directory: ${{ github.workspace }}
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: Build and publish the authenticated V3 native binding
        run: >-
          env
          PATH="${IROHA_PRIVACY_REAL_CARGO%/cargo}:${PATH}"
          npm run build:native
      - name: Verify native numeric builders and compiler bridge
        run: >-
          node --test
          test/instructionBuilders.test.js
          test/kotodamaCompiler.native.test.js
      - name: Verify final Cargo lock isolation
        if: always()
        working-directory: ${{ github.workspace }}
        run: ci/privacy_sdk_cargo_lockfile.sh verify-ci "${GITHUB_WORKSPACE}"

  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Verify Kotlin Numeric V1, quantity builders, and manifest policies
        run: >-
          ./gradlew :core-jvm:test
          --tests org.hyperledger.iroha.sdk.client.ContractManifestTest
          --tests org.hyperledger.iroha.sdk.numeric.NumericV1Test
          --tests org.hyperledger.iroha.sdk.core.model.instructions.InstructionQuantityTest
          --tests org.hyperledger.iroha.sdk.nexus.UaidJsonParserQuantityTest
          --console=plain

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: java/iroha_android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Verify Java Numeric V1, quantity builders, and manifest policies
        env:
          ANDROID_HARNESS_MAINS: org.hyperledger.iroha.android.client.ContractManifestTests,org.hyperledger.iroha.android.client.SubscriptionToriiClientTests,org.hyperledger.iroha.android.nexus.UaidJsonParserTests
        run: >-
          ./gradlew :core:test
          --tests org.hyperledger.iroha.android.GradleHarnessTests
          --tests org.hyperledger.iroha.android.numeric.NumericV1Tests
          --tests org.hyperledger.iroha.android.model.instructions.InstructionQuantityTests
          --console=plain

  swift:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: IrohaSwift
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify Swift Numeric V1, quantity builders, and manifest policies
        run: |
          swift test --filter NumericV1Tests
          swift test --filter TransactionEncoderValidationTests
          swift test --filter ToriiQuantityReadbackTests
          swift test --filter testContractManifestDynamicAccessHints

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python/iroha_python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/iroha_python/requirements-ci.lock
      - name: Install hash-locked Python test dependencies
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          -r requirements-ci.lock
      - name: Verify Python Numeric V1 fixture and manifest policy parity
        env:
          PYTHONPATH: src:../norito_py/src:..
        run: >-
          python -m pytest
          tests/client_contract_manifest_test.py
          tests/dependency_lock_test.py
          tests/numeric_v1_test.py
          tests/numeric_v1_quantity_test.py

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - name: Verify .NET Numeric V1, quantity builders, and manifest policies
        run: >-
          dotnet test tests/Hyperledger.Iroha.Sdk.Tests/Hyperledger.Iroha.Sdk.Tests.csproj
          --configuration Release
          --
          --filter-class Hyperledger.Iroha.Sdk.Tests.NumericV1Tests
          --filter-class Hyperledger.Iroha.Sdk.Tests.AssetQuantityInstructionTests
          --filter-class Hyperledger.Iroha.Sdk.Tests.ContractManifestTests
