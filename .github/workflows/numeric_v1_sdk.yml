name: Numeric V1 SDK parity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: numeric-v1-sdk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-fixture-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
          shared-key: numeric-v1-sdk-rust
      - name: Verify Rust-authored fixture freshness and outcomes
        run: cargo test --locked -p ivm --test ivm_group_06 numeric_v1_sdk_fixture

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: javascript/iroha_js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Build the published distribution
        run: npm run build:dist
      - name: Verify source, browser, builder, and packaged numeric paths
        run: node --test test/numericV1*.test.js test/instructionBuilders.test.js

  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Verify Kotlin Numeric V1 and quantity builders
        run: >-
          ./gradlew :core-jvm:test
          --tests org.hyperledger.iroha.sdk.numeric.NumericV1Test
          --tests org.hyperledger.iroha.sdk.core.model.instructions.InstructionQuantityTest
          --tests org.hyperledger.iroha.sdk.nexus.UaidJsonParserQuantityTest
          --console=plain

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: java/iroha_android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Verify Java Numeric V1 and quantity builders
        run: >-
          ./gradlew :core:test
          --tests org.hyperledger.iroha.android.numeric.NumericV1Tests
          --tests org.hyperledger.iroha.android.model.instructions.InstructionQuantityTests
          --tests org.hyperledger.iroha.android.nexus.UaidJsonParserTests
          --console=plain

  swift:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: IrohaSwift
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify Swift Numeric V1 and quantity builders
        run: |
          swift test --filter NumericV1Tests
          swift test --filter TransactionEncoderValidationTests
          swift test --filter ToriiQuantityReadbackTests

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python/iroha_python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/iroha_python/pyproject.toml
      - run: python -m pip install pytest
      - name: Verify Python Numeric V1 fixture parity
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/numeric_v1_test.py
          python -m pytest tests/client_ledger_helpers_test.py -k \
            'asset_quantity_builder_boundary_is_exact_and_canonical or repo_and_settlement_quantity_builders_reject_alternate_inputs or repo_agreement_readback_rejects_noncanonical_quantities or repo_agreement_readback_requires_quantity_fields'

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - name: Verify .NET Numeric V1 and quantity builders
        run: >-
          dotnet test tests/Hyperledger.Iroha.Sdk.Tests/Hyperledger.Iroha.Sdk.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~NumericV1Tests|FullyQualifiedName~AssetQuantityInstructionTests"
