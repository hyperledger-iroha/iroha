name: SCCP Production Corridor

on:
  workflow_dispatch:
    inputs:
      phase:
        description: SCCP corridor phase to run
        required: true
        default: all
        type: choice
        options:
          - all
          - rust-sccp
          - evidence-scripts
          - js-sdk
          - python-sdk
          - swift-sdk
          - kotlin-sdk
          - java-android
          - dotnet-sdk
          - contract-smoke
          - tvm-contract-smoke
          - core-admission
          - runtime-api
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sccp_production_corridor.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "contracts/evm/sccp/**"
      - "contracts/bsc/sccp/**"
      - "contracts/ethereum/sccp/**"
      - "contracts/tron/sccp/**"
      - "crates/iroha/**"
      - "crates/iroha_cli/**"
      - "crates/iroha_config/**"
      - "crates/iroha_sccp/**"
      - "crates/iroha_core/**"
      - "crates/iroha_data_model/**"
      - "crates/iroha_js_host/**"
      - "crates/iroha_torii/**"
      - "crates/connect_norito_bridge/**"
      - "csharp/**"
      - "specs/bridge_proofs.md"
      - "fixtures/sccp/**"
      - "integration_tests/**"
      - "IrohaSwift/**"
      - "java/iroha_android/**"
      - "javascript/iroha_js/**"
      - "kotlin/**"
      - "python/iroha_python/requirements-ci.lock"
      - "python/iroha_torii_client/**"
      - "artifacts/openapi/**"
      - "pytests/scripts/check_sccp_production_corridor_test.py"
      - "pytests/scripts/sccp_release_readiness_report_test.py"
      - "pytests/scripts/sccp_*"
      - "roadmap.md"
      - "scripts/check_sccp_production_corridor.sh"
      - "scripts/build_norito_xcframework.sh"
      - "scripts/archive_norito_xcframework.py"
      - "scripts/check_mobile_sdk_artifacts.sh"
      - "scripts/check_mobile_sdk_artifact_pin_commit.py"
      - "scripts/exec_with_file_lock.py"
      - "scripts/norito_bridge_source_seal.py"
      - "scripts/run_mobile_hermetic_command.py"
      - "scripts/update_norito_bridge_swift_pins.py"
      - "scripts/validate_norito_bridge_xcframework.py"
      - "scripts/ci/run_xcframework_smoke.sh"
      - "scripts/sccp_evm_contract_smoke.sh"
      - "scripts/contract_artifact_corridor.py"
      - "scripts/contract_soljson_runner.js"
      - "scripts/contract_tvm_runner.sh"
      - "scripts/contract_tvm_receipts.mjs"
      - "scripts/contract_tvm_smoke.mjs"
      - "scripts/contract_tooling/**"
      - "scripts/tests/contract_artifact_corridor_test.py"
      - "scripts/tests/contract_tvm_receipts_test.mjs"
      - "scripts/sccp_release_readiness_report.py"
      - "scripts/sccp_*"
      - "status.md"
  schedule:
    - cron: "37 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NORITO_SKIP_BINDINGS_SYNC: "1"

jobs:
  runner-self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python3 -m pip install --upgrade pip pytest
      - name: SCCP corridor runner self-check
        run: python3 -m pytest -q pytests/scripts/check_sccp_production_corridor_test.py

  rust-sccp:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'rust-sccp' }}
    needs: runner-self-check
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
      - name: Rust SCCP no-default feature matrix
        run: |
          cargo test -p iroha_sccp --lib --no-default-features
      - name: Rust SCCP verifier corridor
        run: |
          set -o pipefail
          mkdir -p dist/sccp-production-corridor
          bash scripts/check_sccp_production_corridor.sh --phase rust-sccp 2>&1 | tee dist/sccp-production-corridor/rust-sccp.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sccp-production-corridor-rust-sccp
          path: dist/sccp-production-corridor/rust-sccp.log
          if-no-files-found: error

  evidence-scripts:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'evidence-scripts' }}
    needs: runner-self-check
    runs-on: ubuntu-latest
    # Full local evidence suites currently take roughly 100 minutes. Keep enough
    # headroom for shared-runner variance and continued adversarial coverage.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
      - name: Install evidence script dependencies
        run: |
          python3 -m pip install --upgrade pip pytest
          python3 -m pip install -r scripts/requirements.txt
      - name: Operator evidence corridor
        run: |
          set -o pipefail
          mkdir -p dist/sccp-production-corridor
          bash scripts/check_sccp_production_corridor.sh --phase evidence-scripts 2>&1 | tee dist/sccp-production-corridor/evidence-scripts.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sccp-production-corridor-evidence-scripts
          path: dist/sccp-production-corridor/evidence-scripts.log
          if-no-files-found: error

  js-sdk:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'js-sdk' }}
    needs: runner-self-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - name: Install JavaScript SDK dependencies
        run: npm ci --prefix javascript/iroha_js
      - name: Build JavaScript SDK dist package
        run: npm --prefix javascript/iroha_js run build:dist
      - name: JavaScript SCCP prover corridor
        run: |
          set -o pipefail
          mkdir -p dist/sccp-production-corridor
          bash scripts/check_sccp_production_corridor.sh --phase js-sdk 2>&1 | tee dist/sccp-production-corridor/js-sdk.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sccp-production-corridor-js-sdk
          path: dist/sccp-production-corridor/js-sdk.log
          if-no-files-found: error

  python-sdk:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'python-sdk' }}
    needs: runner-self-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/iroha_python/requirements-ci.lock
      - name: Install hash-locked Python SDK test dependencies
        run: >-
          python3 -m pip install
          --require-hashes
          --only-binary=:all:
          -r python/iroha_python/requirements-ci.lock
      - name: Python SCCP prover corridor
        run: |
          set -o pipefail
          mkdir -p dist/sccp-production-corridor
          bash scripts/check_sccp_production_corridor.sh --phase python-sdk 2>&1 | tee dist/sccp-production-corridor/python-sdk.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sccp-production-corridor-python-sdk
          path: dist/sccp-production-corridor/python-sdk.log
          if-no-files-found: error

  swift-sdk:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'swift-sdk' }}
    needs: runner-self-check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.93.1
      - name: Provision exact Apple targets and locked dependencies
        run: |
          mobile_python="$(python3 -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))')"
          rustup_source="$(command -v rustup)"
          rustup_source="$("$mobile_python" -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$rustup_source")"
          [[ "$rustup_source" == /* && -f "$rustup_source" && ! -L "$rustup_source" && -x "$rustup_source" ]]
          rustup_tools="$RUNNER_TEMP/iroha-sccp-apple-tools"
          mkdir -p "$rustup_tools"
          chmod 0700 "$rustup_tools"
          rustup_path="$rustup_tools/rustup"
          test ! -e "$rustup_path"
          /bin/cp "$rustup_source" "$rustup_path"
          chmod 0700 "$rustup_path"
          rustup_path="$("$mobile_python" -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$rustup_path")"
          [[ "$rustup_path" == /* && "${rustup_path##*/}" == rustup && -f "$rustup_path" && ! -L "$rustup_path" && -x "$rustup_path" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_RUSTUP_BINARY=$rustup_path" >> "$GITHUB_ENV"
          "$rustup_path" target add --toolchain 1.93.1 aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
          cargo fetch --locked
      - name: Bind the first-release Swift bridge envelope
        run: |
          cargo_target="$RUNNER_TEMP/iroha-sccp-apple-cargo"
          bridge_artifacts="$RUNNER_TEMP/iroha-sccp-apple-artifacts"
          bridge_build="$RUNNER_TEMP/iroha-sccp-apple-build"
          mkdir -p "$cargo_target" "$bridge_artifacts" "$bridge_build"
          cargo_target="$("$MOBILE_SDK_PYTHON_BINARY" -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$cargo_target")"
          bridge_artifacts="$("$MOBILE_SDK_PYTHON_BINARY" -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$bridge_artifacts")"
          bridge_build="$("$MOBILE_SDK_PYTHON_BINARY" -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$bridge_build")"
          rustc_path="$("$MOBILE_SDK_RUSTUP_BINARY" which --toolchain 1.93.1 rustc)"
          rustdoc_path="$("$MOBILE_SDK_RUSTUP_BINARY" which --toolchain 1.93.1 rustdoc)"
          echo "CARGO_BUILD_JOBS=1" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$cargo_target" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_APPLE_ARTIFACT_DIR=$bridge_artifacts" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_REQUIRE_EXTERNAL_APPLE_ARTIFACT=1" >> "$GITHUB_ENV"
          echo "NORITO_BRIDGE_OUT_DIR=$bridge_artifacts" >> "$GITHUB_ENV"
          echo "NORITO_BRIDGE_BUILD_DIR=$bridge_build" >> "$GITHUB_ENV"
          echo "RUSTC=$rustc_path" >> "$GITHUB_ENV"
          echo "RUSTC_BOOTSTRAP=1" >> "$GITHUB_ENV"
          echo "RUSTDOC=$rustdoc_path" >> "$GITHUB_ENV"
      - name: Swift SCCP prover corridor
        run: |
          set -o pipefail
          mkdir -p dist/sccp-production-corridor
          bash scripts/check_sccp_production_corridor.sh --phase swift-sdk 2>&1 | tee dist/sccp-production-corridor/swift-sdk.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sccp-production-corridor-swift-sdk
          path: dist/sccp-production-corridor/swift-sdk.log
          if-no-files-found: error

  kotlin-sdk:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'kotlin-sdk' }}
    needs: runner-self-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - name: Kotlin SCCP prover corridor
        run: |
          set -o pipefail
          mkdir -p dist/sccp-production-corridor
          bash scripts/check_sccp_production_corridor.sh --phase kotlin-sdk 2>&1 | tee dist/sccp-production-corridor/kotlin-sdk.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sccp-production-corridor-kotlin-sdk
          path: dist/sccp-production-corridor/kotlin-sdk.log
          if-no-files-found: error

  java-android:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'java-android' }}
    needs: runner-self-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - name: Java Android SCCP prover corridor
        run: |
          set -o pipefail
          mkdir -p dist/sccp-production-corridor
          bash scripts/check_sccp_production_corridor.sh --phase java-android 2>&1 | tee dist/sccp-production-corridor/java-android.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sccp-production-corridor-java-android
          path: dist/sccp-production-corridor/java-android.log
          if-no-files-found: error

  dotnet-sdk:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'dotnet-sdk' }}
    needs: runner-self-check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          cache: "false"
          toolchain: "1.93.1-x86_64-pc-windows-msvc"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"
      - name: .NET SCCP native facade corridor
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist/sccp-production-corridor
          bash scripts/check_sccp_production_corridor.sh --phase dotnet-sdk 2>&1 | tee dist/sccp-production-corridor/dotnet-sdk.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sccp-production-corridor-dotnet-sdk
          path: dist/sccp-production-corridor/dotnet-sdk.log
          if-no-files-found: error

  contract-smoke:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'contract-smoke' || github.event.inputs.phase == 'tvm-contract-smoke' }}
    needs: runner-self-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Build authenticated EVM and TVM artifact manifest
        run: |
          python3 scripts/contract_artifact_corridor.py build \
            --repo-root . \
            --output-dir "$RUNNER_TEMP/sccp-contract-artifacts" \
            --node node
      - name: Authenticated EVM and TVM compiler artifact corridor
        env:
          SCCP_CONTRACT_ARTIFACT_DIR: ${{ runner.temp }}/sccp-contract-artifacts
        run: |
          set -o pipefail
          mkdir -p dist/sccp-production-corridor
          bash scripts/check_sccp_production_corridor.sh --phase contract-smoke 2>&1 | tee dist/sccp-production-corridor/contract-smoke.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sccp-production-corridor-contract-smoke
          path: dist/sccp-production-corridor/contract-smoke.log
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sccp-production-corridor-contract-manifest
          path: ${{ runner.temp }}/sccp-contract-artifacts/sccp-contract-artifacts-v1.json
          if-no-files-found: error

  tvm-contract-smoke:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'tvm-contract-smoke' }}
    needs: [runner-self-check, contract-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCCP_TVM_IMAGE: tronbox/tre@sha256:e57deeb0d8201498549dbec28e7c329d8647ef0976b547cfbb6fa6a41a10f491
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sccp-production-corridor-contract-manifest
          path: ${{ runner.temp }}/sccp-contract-artifacts
      - name: Execute locked TRON artifact on official TRE TVM
        run: |
          set -o pipefail
          mkdir -p dist/sccp-production-corridor
          bash scripts/contract_tvm_runner.sh \
            --manifest "$RUNNER_TEMP/sccp-contract-artifacts/sccp-contract-artifacts-v1.json" \
            2>&1 | tee dist/sccp-production-corridor/tvm-contract-smoke.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sccp-production-corridor-tvm-contract-smoke
          path: dist/sccp-production-corridor/tvm-contract-smoke.log
          if-no-files-found: error

  core-admission:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'core-admission' }}
    needs: runner-self-check
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
      - name: Core SCCP governance, bridge-proof, and four-peer admission corridor
        run: |
          set -o pipefail
          mkdir -p dist/sccp-production-corridor
          bash scripts/check_sccp_production_corridor.sh --phase core-admission 2>&1 | tee dist/sccp-production-corridor/core-admission.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sccp-production-corridor-core-admission
          path: dist/sccp-production-corridor/core-admission.log
          if-no-files-found: error

  runtime-api:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'runtime-api' }}
    needs: runner-self-check
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
      - name: SCCP runtime, API, finality, and generated-spec corridor
        run: |
          set -o pipefail
          mkdir -p dist/sccp-production-corridor
          bash scripts/check_sccp_production_corridor.sh --phase runtime-api 2>&1 | tee dist/sccp-production-corridor/runtime-api.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sccp-production-corridor-runtime-api
          path: dist/sccp-production-corridor/runtime-api.log
          if-no-files-found: error

  sccp-production-corridor:
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.phase == 'all') }}
    needs: [runner-self-check, rust-sccp, evidence-scripts, js-sdk, python-sdk, swift-sdk, kotlin-sdk, java-android, dotnet-sdk, contract-smoke, tvm-contract-smoke, core-admission, runtime-api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every SCCP corridor phase
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "One or more SCCP production corridor phases failed, were cancelled, or were skipped."
          exit 1
      - name: SCCP production corridor aggregate
        run: echo "All SCCP production corridor phases completed successfully."
