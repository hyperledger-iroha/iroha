            --java "$KAGEMUSHA_ANDROID_JAVA" \
            --java-sha256 "$KAGEMUSHA_ANDROID_JAVA_SHA256" \
            --apksigner-jar "$KAGEMUSHA_ANDROID_APKSIGNER_JAR" \
            --apksigner-jar-sha256 "$KAGEMUSHA_ANDROID_APKSIGNER_JAR_SHA256" \
            --openssl "$KAGEMUSHA_ANDROID_OPENSSL" \
            --openssl-sha256 "$KAGEMUSHA_ANDROID_OPENSSL_SHA256" \
            --android-attestation-trust-root \
              "$KAGEMUSHA_ANDROID_ATTESTATION_TRUST_ROOT" \
            --android-attestation-trust-root-sha256 \
