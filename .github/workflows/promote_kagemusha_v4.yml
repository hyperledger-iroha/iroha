          KAGEMUSHA_ANDROID_DEVICE_EVIDENCE_TRUSTED_SIGNER_PUBLIC_KEY: ${{ vars.KAGEMUSHA_ANDROID_DEVICE_EVIDENCE_TRUSTED_SIGNER_PUBLIC_KEY }}
          KAGEMUSHA_ANDROID_JAVA: ${{ vars.KAGEMUSHA_ANDROID_JAVA }}
          KAGEMUSHA_ANDROID_JAVA_SHA256: ${{ vars.KAGEMUSHA_ANDROID_JAVA_SHA256 }}
