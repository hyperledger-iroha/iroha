          KAGEMUSHA_ANDROID_OPENSSL: ${{ vars.KAGEMUSHA_ANDROID_OPENSSL }}
          KAGEMUSHA_ANDROID_OPENSSL_SHA256: ${{ vars.KAGEMUSHA_ANDROID_OPENSSL_SHA256 }}
          KAGEMUSHA_ANDROID_ATTESTATION_TRUST_ROOT: ${{ vars.KAGEMUSHA_ANDROID_ATTESTATION_TRUST_ROOT }}
          KAGEMUSHA_ANDROID_ATTESTATION_TRUST_ROOT_SHA256: ${{ vars.KAGEMUSHA_ANDROID_ATTESTATION_TRUST_ROOT_SHA256 }}
          KAGEMUSHA_ANDROID_ATTESTATION_REVOCATION_STATUS: ${{ vars.KAGEMUSHA_ANDROID_ATTESTATION_REVOCATION_STATUS }}
          KAGEMUSHA_ANDROID_ATTESTATION_REVOCATION_STATUS_SHA256: ${{ vars.KAGEMUSHA_ANDROID_ATTESTATION_REVOCATION_STATUS_SHA256 }}
          KAGEMUSHA_ANDROID_ATTESTATION_STATUS_CAPTURE_RECEIPT: ${{ vars.KAGEMUSHA_ANDROID_ATTESTATION_STATUS_CAPTURE_RECEIPT }}
          KAGEMUSHA_ANDROID_ATTESTATION_STATUS_CAPTURE_RECEIPT_SHA256: ${{ vars.KAGEMUSHA_ANDROID_ATTESTATION_STATUS_CAPTURE_RECEIPT_SHA256 }}
          PROMOTION_GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          PROMOTION_GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = hyperledger-iroha/iroha
          test "$GITHUB_REF" = refs/heads/main
          test "$PROMOTION_GITHUB_REF_PROTECTED" = true
          test "$PROMOTION_GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(/usr/bin/shasum -a 256 "$KAGEMUSHA_PRODUCTION_READINESS_PYTHON" | /usr/bin/awk '{print $1}')" = \
            "$KAGEMUSHA_PRODUCTION_READINESS_PYTHON_SHA256"
          authorization_dir="$RUNNER_TEMP/kagemusha-mobile-android-authorization"
