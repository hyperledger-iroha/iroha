name: Kotodama performance gate

on:
  pull_request:
    paths:
      - ".github/workflows/kotodama_perf.yml"
      - ".github/actions/setup-native-ci/**"
      - "scripts/ci_private_fixture_root.py"
      - "pytests/scripts/ci_private_fixture_root_test.py"
      - "crates/ivm/benches/bench_kotodama.rs"
      - "crates/ivm/Cargo.toml"
      - "crates/ivm/src/**"
      - "crates/ivm_abi/src/**"
      - "crates/ivm_artifact_admission/**"
      - "crates/iroha_fs/**"
      - "crates/iroha_primitives/**"
      - "crates/iroha_data_model/**"
      - "crates/iroha_data_model_derive/**"
      - "crates/norito/**"
      - "crates/norito_derive/**"
      - "crates/kotodama_lang/Cargo.toml"
      - "crates/kotodama_lang/src/**"
      - "crates/kotodama_surface/Cargo.toml"
      - "crates/kotodama_surface/src/**"
      - "crates/kotodama_toolchain/Cargo.toml"
      - "crates/kotodama_toolchain/src/**"
      - "crates/iroha_core/src/**"
      - "crates/iroha_core/benches/kotodama_runtime_cache.rs"
      - "crates/iroha_core/benches/queries.rs"
      - "crates/iroha_core/Cargo.toml"
      - "crates/iroha_torii/src/**"
      - "crates/iroha_cli/src/**"
      - "crates/iroha_js_host/src/**"
      - "javascript/iroha_js/**"
      - "scripts/sorafs_javascript_native_cache.mjs"
      - "crates/irohad/src/soracloud_runtime.rs"
      - "scripts/check_kotodama_perf.py"
      - "scripts/kotodama_query_driver.py"
      - "scripts/kotodama_perf_bundle.py"
      - "scripts/check_kotodama_docs.py"
      - "scripts/regenerate_kotodama_goldens.py"
      - "scripts/ivm_artifacts.tsv"
      - "pytests/scripts/check_kotodama_perf_test.py"
      - "pytests/scripts/kotodama_query_driver_test.py"
      - "pytests/scripts/kotodama_perf_bundle_test.py"
      - "pytests/scripts/check_kotodama_docs_test.py"
      - "pytests/scripts/regenerate_kotodama_goldens_test.py"
      - "**/*.ko"
      - "**/*.to"
      - "demo/*.manifest.json"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotodama-perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-and-codec-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject retired codecs
        run: bash scripts/check_no_legacy_codec.sh
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
          shared-key: kotodama-js-native
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - name: Validate the SDK Node engine contract
        run: node javascript/iroha_js/scripts/check-node-engine.mjs
      - name: Install JavaScript SDK dependencies
        run: npm ci --ignore-scripts --prefix javascript/iroha_js
      - name: Prime locked Cargo dependencies for the offline native build
        run: cargo fetch --locked
      - name: Build the Rust native binding and run the zero-skip hermetic JavaScript suite
        run: >-
          env -u CARGO_PROFILE_DEV_DEBUG -u CARGO_BUILD_WARNINGS
          CARGO_BUILD_JOBS=1
          CARGO_INCREMENTAL=0
          CARGO_NET_OFFLINE=true
          CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target"
          IROHA_JS_CARGO_LOCKFILE_PATH="${GITHUB_WORKSPACE}/Cargo.lock"
          IROHA_JS_CARGO_PATH="$(rustup which --toolchain 1.99.1 cargo)"
          RUSTC="$(rustup which --toolchain 1.99.1 rustc)"
          RUSTDOC="$(rustup which --toolchain 1.99.1 rustdoc)"
          npm test --prefix javascript/iroha_js

  javascript-provenance-platforms:
    name: JavaScript native provenance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - name: Validate the SDK Node engine contract
        run: node javascript/iroha_js/scripts/check-node-engine.mjs
      - name: Install JavaScript SDK dependencies
        run: npm ci --ignore-scripts --prefix javascript/iroha_js
      - name: Enforce platform-selected provenance tests with zero skips
        run: npm run test:native-provenance --prefix javascript/iroha_js

  prepare-baseline:
    # Compile only: no samples from these independent runners may qualify.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      artifact-id: ${{ steps.prepared.outputs.artifact-id }}
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-kotodama-perf
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
      - name: Check out comparison base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 06912ee4f8f9423b458d72039dbd0a1c8fde7b43
          path: baseline
      - name: Install native benchmark prerequisites
        uses: ./candidate/.github/actions/setup-native-ci
        with:
          working-directory: candidate
          toolchain: 1.99.1
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
          cache-workspace-crates: "true"
          shared-key: kotodama-preparation-base
          workspaces: |
            baseline -> ../target-kotodama-perf
      - name: Clear cached measurement and preparation evidence
        run: rm -rf "$CARGO_TARGET_DIR/criterion" "$CARGO_TARGET_DIR/kotodama-query-drivers" "$CARGO_TARGET_DIR/kotodama-prepared"
      - name: Prepare exact base benchmarks
        shell: bash
        run: |
          set -euo pipefail
          unset CARGO_BUILD_WARNINGS
          python3 candidate/scripts/kotodama_perf_bundle.py prepare \
            --revision-root baseline --candidate-root candidate \
            --expected-candidate-commit "${{ github.sha }}" --label base \
            --output "$CARGO_TARGET_DIR/kotodama-prepared/base"
      - name: Upload prepared executables
        id: prepared
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kotodama-prepared-base-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target-kotodama-perf/kotodama-prepared/base.tar
          if-no-files-found: error
          retention-days: 3

  prepare-candidate:
    # Compile only: no samples from these independent runners may qualify.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      artifact-id: ${{ steps.prepared.outputs.artifact-id }}
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-kotodama-perf
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
      - name: Check out comparison base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 06912ee4f8f9423b458d72039dbd0a1c8fde7b43
          path: baseline
      - name: Install native benchmark prerequisites
        uses: ./candidate/.github/actions/setup-native-ci
        with:
          working-directory: candidate
          toolchain: 1.99.1
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
          cache-workspace-crates: "true"
          shared-key: kotodama-preparation-candidate
          workspaces: |
            candidate -> ../target-kotodama-perf
      - name: Clear cached measurement and preparation evidence
        run: rm -rf "$CARGO_TARGET_DIR/criterion" "$CARGO_TARGET_DIR/kotodama-query-drivers" "$CARGO_TARGET_DIR/kotodama-prepared"
      - name: Prepare exact candidate benchmarks
        shell: bash
        run: |
          set -euo pipefail
          unset CARGO_BUILD_WARNINGS
          python3 candidate/scripts/kotodama_perf_bundle.py prepare \
            --revision-root candidate --candidate-root candidate \
            --expected-candidate-commit "${{ github.sha }}" --label candidate \
            --output "$CARGO_TARGET_DIR/kotodama-prepared/candidate"
      - name: Upload prepared executables
        id: prepared
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kotodama-prepared-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target-kotodama-perf/kotodama-prepared/candidate.tar
          if-no-files-found: error
          retention-days: 3

  representative-regression:
    needs: [prepare-baseline, prepare-candidate, kotodama-artifact-gate]
    # Both revision-native runtimes are measured serially on this same hosted VM.
    # Source checkouts remain immutable; typed queries use the separately
    # attested typed dispatch and identical untimed fixture-reader grant below.
    # Conservative median confidence bounds must establish the unchanged 5%
    # ceiling; noisy/inconclusive paired runs cannot qualify. List retains its
    # zero-slowdown median policy and reports interval overlap separately.
    # This component comparison is not named-hardware release calibration.
    runs-on: ubuntu-24.04
    # Compilation has its own bounded jobs. Both revisions are timed here,
    # sequentially, after all transfers and executable admission have finished.
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-kotodama-perf
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate

      - name: Check out comparison base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 06912ee4f8f9423b458d72039dbd0a1c8fde7b43
          path: baseline

      - name: Require regular revision lockfiles
        shell: bash
        run: |
          set -euo pipefail
          for lock in candidate/Cargo.lock baseline/Cargo.lock; do
            if [[ ! -f "$lock" || -L "$lock" ]]; then
              echo "::error file=$lock::required revision Cargo.lock is missing, non-regular, or a symlink" >&2
              exit 1
            fi
          done

      - name: Install native benchmark prerequisites
        uses: ./candidate/.github/actions/setup-native-ci
        with:
          working-directory: candidate
          toolchain: 1.99.1

      - name: Test regression checker
        working-directory: candidate
        run: |
          python3 pytests/scripts/check_kotodama_perf_test.py
          python3 pytests/scripts/kotodama_query_driver_test.py
          python3 pytests/scripts/kotodama_perf_bundle_test.py

      # Rust build caches may retain Criterion output from an older workflow
      # run. Performance evidence must be produced by this exact base/candidate
      # pair, so remove only the generated Criterion results before sampling.
      - name: Clear cached benchmark evidence
        run: rm -rf "$CARGO_TARGET_DIR/criterion" "$CARGO_TARGET_DIR/kotodama-query-drivers"

      # Runtime and original benchmark sources remain revision-native. The external
      # query driver selects typed dispatch and grants its fixture reader the same
      # ledger-read permission before setup assertions and timing on both revisions.
      # Original/derived bytes and the fresh compiled artifact are independently admitted.
      # The policy also requires the
      # exact selected Git commit and the policy-pinned digest of that
      # revision's original Cargo.lock before any timing comparison.
      - name: Require authenticated baseline provenance
        run: |
          python3 - <<'PY'
          import runpy
          from pathlib import Path

          policy = runpy.run_path("candidate/scripts/check_kotodama_perf.py")
          base_sources = (
              Path("baseline/crates/ivm/benches/bench_kotodama.rs"),
              Path("baseline/crates/iroha_core/benches/kotodama_runtime_cache.rs"),
              Path("baseline/crates/iroha_core/benches/queries.rs"),
          )
          candidate_sources = (
              Path("candidate/crates/ivm/benches/bench_kotodama.rs"),
              Path("candidate/crates/iroha_core/benches/kotodama_runtime_cache.rs"),
              Path("candidate/crates/iroha_core/benches/queries.rs"),
          )
          policy["validate_revision_inventories"](
              base_sources=base_sources,
              candidate_sources=candidate_sources,
          )
          policy["validate_baseline_provenance"](
              baseline_root=Path("baseline"),
              candidate_sources=candidate_sources,
          )
          PY

      - name: Require exact same-run preparation artifact IDs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ needs.prepare-baseline.outputs.artifact-id }}" =~ ^[0-9]+$ ]]
          [[ "${{ needs.prepare-candidate.outputs.artifact-id }}" =~ ^[0-9]+$ ]]
          test "${{ needs.prepare-baseline.outputs.artifact-id }}" != "${{ needs.prepare-candidate.outputs.artifact-id }}"
      - name: Download exact baseline preparation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare-baseline.outputs.artifact-id }}
          path: prepared-downloads/base
      - name: Download exact candidate preparation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare-candidate.outputs.artifact-id }}
          path: prepared-downloads/candidate
      - name: Admit both complete preparations before timing
        shell: bash
        run: |
          set -euo pipefail
          unset CARGO_BUILD_WARNINGS
          test -n "${{ needs.prepare-baseline.outputs.artifact-id }}"
          test -n "${{ needs.prepare-candidate.outputs.artifact-id }}"
          for label in base candidate; do
            python3 candidate/scripts/kotodama_perf_bundle.py unpack \
              --archive "prepared-downloads/$label/$label.tar" \
              --output "$CARGO_TARGET_DIR/kotodama-prepared/$label"
            revision=candidate
            if [[ "$label" == base ]]; then revision=baseline; fi
            python3 candidate/scripts/kotodama_perf_bundle.py admit \
              --revision-root "$revision" --candidate-root candidate \
              --expected-candidate-commit "${{ github.sha }}" --label "$label" \
              --output "$CARGO_TARGET_DIR/kotodama-prepared/$label"
          done

      - name: Measure base revision
        shell: bash
        run: |
          set -euo pipefail
          unset CARGO_BUILD_WARNINGS
          python3 candidate/scripts/kotodama_perf_bundle.py measure \
            --revision-root baseline --candidate-root candidate \
            --expected-candidate-commit "${{ github.sha }}" --label base \
            --output "$CARGO_TARGET_DIR/kotodama-prepared/base"

      # Criterion writes a `new` sample even while saving the named `base`.
      # Delete those current slots so a benchmark omitted by the candidate
      # cannot pass by reusing the base revision's or a cached run's evidence.
      - name: Clear base current samples
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          criterion = Path(os.environ["CARGO_TARGET_DIR"]) / "criterion"
          for current in sorted(criterion.rglob("new")):
              if current.is_dir():
                  shutil.rmtree(current)
          PY

      - name: Measure candidate revision
        shell: bash
        run: |
          set -euo pipefail
          unset CARGO_BUILD_WARNINGS
          python3 candidate/scripts/kotodama_perf_bundle.py measure \
            --revision-root candidate --candidate-root candidate \
            --expected-candidate-commit "${{ github.sha }}" --label candidate \
            --output "$CARGO_TARGET_DIR/kotodama-prepared/candidate"

      - name: Enforce five-percent ceiling
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          evidence="../target-kotodama-perf/kotodama-perf-evidence"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          python3 scripts/check_kotodama_perf.py \
            --criterion-dir ../target-kotodama-perf/criterion \
            --query-driver-root ../target-kotodama-perf/kotodama-query-drivers \
            --baseline-root ../baseline \
            --candidate-root . \
            --expected-candidate-commit "${{ github.sha }}" \
            --json-output "$evidence/report.json" \
            --threshold 0.05 \
            2>&1 | tee "$evidence/checker.log"

      - name: Seal complete performance evidence
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          BASE_PREPARATION_ARTIFACT_ID: ${{ needs.prepare-baseline.outputs.artifact-id }}
          CANDIDATE_PREPARATION_ARTIFACT_ID: ${{ needs.prepare-candidate.outputs.artifact-id }}
        run: |
          set -euo pipefail
          evidence="$CARGO_TARGET_DIR/kotodama-perf-evidence"
          test -f "$evidence/report.json" && test ! -L "$evidence/report.json"
          {
            rustc -Vv
            cargo -Vv
            python3 --version
            uname -a
            if command -v lscpu >/dev/null 2>&1; then lscpu; fi
          } > "$evidence/toolchain-and-host.txt"
          mkdir -p "$evidence/preparations"
          for label in base candidate; do
            cp "$CARGO_TARGET_DIR/kotodama-prepared/$label/manifest.json" "$evidence/preparations/$label.json"
          done
          git -C candidate rev-parse --verify HEAD > "$evidence/candidate-head.txt"
          git -C baseline rev-parse --verify HEAD > "$evidence/baseline-head.txt"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          target = Path(os.environ["CARGO_TARGET_DIR"])
          criterion = target / "criterion"
          drivers = target / "kotodama-query-drivers"
          evidence = target / "kotodama-perf-evidence"
          if criterion.is_symlink() or not criterion.is_dir():
              raise SystemExit("Criterion evidence directory is absent or a symlink")
          if evidence.is_symlink() or not evidence.is_dir():
              raise SystemExit("performance evidence directory is absent or a symlink")
          if drivers.is_symlink() or not drivers.is_dir():
              raise SystemExit("derived query driver directory is absent or a symlink")
          workflow = {
              "schema": "iroha.kotodama.performance.workflow.v1",
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "repository": os.environ["WORKFLOW_REPOSITORY"],
              "ref": os.environ["WORKFLOW_REF"],
              "event": os.environ["WORKFLOW_EVENT"],
              "run_id": os.environ["WORKFLOW_RUN_ID"],
              "run_attempt": os.environ["WORKFLOW_RUN_ATTEMPT"],
              "runner": {
                  "name": os.environ["RUNNER_NAME_VALUE"],
                  "os": os.environ["RUNNER_OS_VALUE"],
                  "arch": os.environ["RUNNER_ARCH_VALUE"],
              },
              "preparation_artifact_ids": {
                  "base": os.environ["BASE_PREPARATION_ARTIFACT_ID"],
                  "candidate": os.environ["CANDIDATE_PREPARATION_ARTIFACT_ID"],
              },
              "cargo": {
                  "build_jobs": os.environ["CARGO_BUILD_JOBS"],
                  "incremental": os.environ["CARGO_INCREMENTAL"],
                  "target_dir": os.environ["CARGO_TARGET_DIR"],
                  "toolchain": os.environ["RUSTUP_TOOLCHAIN"],
              },
          }
          (evidence / "workflow.json").write_text(
              json.dumps(workflow, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          manifest = evidence / "SHA256SUMS"
          entries = []
          for label, root in (("criterion", criterion), ("evidence", evidence),
                              ("derived-query-drivers", drivers)):
              for path in sorted(root.rglob("*")):
                  if path == manifest:
                      continue
                  if path.is_symlink():
                      raise SystemExit(f"non-regular evidence path: {path}")
                  if path.is_dir():
                      continue
                  if not path.is_file():
                      raise SystemExit(f"non-regular evidence path: {path}")
                  relative = f"{label}/{path.relative_to(root).as_posix()}"
                  entries.append(
                      f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {relative}"
                  )
          if not entries:
              raise SystemExit("performance evidence is empty")
          manifest.write_text("\n".join(entries) + "\n", encoding="utf-8")
          PY

      - name: Upload complete performance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kotodama-performance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target-kotodama-perf/criterion
            target-kotodama-perf/kotodama-perf-evidence
            target-kotodama-perf/kotodama-query-drivers
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      # Partial samples and failed checker output are diagnostic only. They do
      # not enter the success-only complete-evidence seal or qualify this run.
      # An early failure may have no samples; hosted termination may prevent
      # this best-effort upload or the cache action's post-job save entirely.
      - name: Upload nonqualifying performance diagnostics
        if: ${{ !success() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kotodama-performance-nonqualifying-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target-kotodama-perf/criterion
            target-kotodama-perf/kotodama-perf-evidence
            target-kotodama-perf/kotodama-query-drivers
          if-no-files-found: warn
          retention-days: 14

  kotodama-artifact-gate:
    # Required alongside the paired comparison; dev-profile tools have a separate budget.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-kotodama-perf
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
      - name: Install native benchmark prerequisites
        uses: ./candidate/.github/actions/setup-native-ci
        with:
          working-directory: candidate
          toolchain: 1.99.1
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
          cache-workspace-crates: "true"
          shared-key: kotodama-artifact-gate
          workspaces: |
            candidate -> ../target-kotodama-perf
      - name: Build canonical Kotodama release tools
        working-directory: candidate
        run: cargo build --locked -p kotodama_toolchain --bin koto -p ivm_artifact_admission --features ivm_artifact_admission/dev-tools --bin ivm_artifact_admit

      - name: Compile every Kotodama documentation source
        working-directory: candidate
        run: >-
          python3 scripts/check_kotodama_docs.py
          --koto ../target-kotodama-perf/debug/koto

      - name: Enforce complete artifact release gate
        working-directory: candidate
        run: >-
