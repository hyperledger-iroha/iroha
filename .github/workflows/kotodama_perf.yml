name: Kotodama performance gate

on:
  pull_request:
    paths:
      - ".github/workflows/kotodama_perf.yml"
      - "crates/ivm/benches/bench_kotodama.rs"
      - "crates/ivm/Cargo.toml"
      - "crates/ivm/src/**"
      - "crates/ivm_abi/src/**"
      - "crates/iroha_primitives/**"
      - "crates/iroha_data_model/**"
      - "crates/iroha_data_model_derive/**"
      - "crates/norito/**"
      - "crates/norito_derive/**"
      - "crates/kotodama_lang/Cargo.toml"
      - "crates/kotodama_lang/src/**"
      - "crates/iroha_core/src/**"
      - "crates/iroha_core/benches/kotodama_runtime_cache.rs"
      - "crates/iroha_core/benches/queries.rs"
      - "crates/iroha_core/Cargo.toml"
      - "crates/iroha_torii/src/**"
      - "crates/iroha_cli/src/**"
      - "crates/iroha_js_host/src/**"
      - "crates/irohad/src/soracloud_runtime.rs"
      - "scripts/check_kotodama_perf.py"
      - "scripts/check_kotodama_docs.py"
      - "scripts/regenerate_kotodama_goldens.py"
      - "scripts/ivm_artifacts.tsv"
      - "scripts/kotodama_v1_size_baseline.json"
      - "pytests/scripts/check_kotodama_perf_test.py"
      - "pytests/scripts/check_kotodama_docs_test.py"
      - "pytests/scripts/regenerate_kotodama_goldens_test.py"
      - "**/*.ko"
      - "**/*.to"
      - "demo/*.manifest.json"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotodama-perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-and-codec-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject retired codecs
        run: bash scripts/check_no_legacy_codec.sh
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
          shared-key: kotodama-js-native
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - name: Install JavaScript SDK dependencies
        run: npm ci --ignore-scripts --prefix javascript/iroha_js
      - name: Build the Rust native binding and run the complete JavaScript suite
        run: npm test --prefix javascript/iroha_js

  representative-regression:
    # Benchmark the base and candidate on the same controlled Iroha runner.
    # Shared GitHub-hosted runners have enough host-to-host variance to make a
    # five-percent regression ceiling meaningless.
    runs-on: [self-hosted, Linux, iroha2]
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-kotodama-perf
      RUSTUP_TOOLCHAIN: "1.93.1"
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: candidate

      - name: Check out comparison base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a9dbbe91eb86765b1226ba071b30d2e3b4ab20ab
          path: baseline

      - name: Require regular revision lockfiles
        shell: bash
        run: |
          set -euo pipefail
          for lock in candidate/Cargo.lock baseline/Cargo.lock; do
            if [[ ! -f "$lock" || -L "$lock" ]]; then
              echo "::error file=$lock::required revision Cargo.lock is missing, non-regular, or a symlink" >&2
              exit 1
            fi
          done

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.1

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            candidate -> ../target-kotodama-perf
            baseline -> ../target-kotodama-perf

      - name: Test regression checker
        working-directory: candidate
        run: python3 pytests/scripts/check_kotodama_perf_test.py

      # Rust build caches may retain Criterion output from an older workflow
      # run. Performance evidence must be produced by this exact base/candidate
      # pair, so remove only the generated Criterion results before sampling.
      - name: Clear cached benchmark evidence
        run: rm -rf "$CARGO_TARGET_DIR/criterion"

      # Benchmark sources are revision-native. The policy also requires the
      # exact selected Git commit and an independently authenticated digest of
      # that revision's original Cargo.lock before any timing comparison. The
      # digest is deliberately unavailable today, so this step preserves the
      # documented release blocker rather than accepting a copied lockfile.
      - name: Require authenticated predecessor provenance
        run: |
          python3 - <<'PY'
          import runpy
          from pathlib import Path

          policy = runpy.run_path("candidate/scripts/check_kotodama_perf.py")
          base_sources = (
              Path("baseline/crates/ivm/benches/bench_kotodama.rs"),
              Path("baseline/crates/iroha_core/benches/kotodama_runtime_cache.rs"),
              Path("baseline/crates/iroha_core/benches/queries.rs"),
          )
          candidate_sources = (
              Path("candidate/crates/ivm/benches/bench_kotodama.rs"),
              Path("candidate/crates/iroha_core/benches/kotodama_runtime_cache.rs"),
              Path("candidate/crates/iroha_core/benches/queries.rs"),
          )
          policy["validate_revision_inventories"](
              base_sources=base_sources,
              candidate_sources=candidate_sources,
          )
          policy["validate_predecessor_provenance"](
              predecessor_root=Path("baseline"),
              candidate_sources=candidate_sources,
          )
          PY

      - name: Measure base revision
        working-directory: baseline
        run: |
          cargo bench --locked -p ivm --bench bench_kotodama -- --save-baseline base
          cargo bench --locked -p iroha_core --bench kotodama_runtime_cache -- --save-baseline base
          cargo bench --locked -p iroha_core --bench queries -- typed_core_query_ --save-baseline base

      # Criterion writes a `new` sample even while saving the named `base`.
      # Delete those current slots so a benchmark omitted by the candidate
      # cannot pass by reusing the base revision's or a cached run's evidence.
      - name: Clear base current samples
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          criterion = Path(os.environ["CARGO_TARGET_DIR"]) / "criterion"
          for current in sorted(criterion.rglob("new")):
              if current.is_dir():
                  shutil.rmtree(current)
          PY

      - name: Measure candidate revision
        working-directory: candidate
        run: |
          cargo bench --locked -p ivm --bench bench_kotodama -- --save-baseline candidate
          cargo bench --locked -p iroha_core --bench kotodama_runtime_cache -- --save-baseline candidate
          cargo bench --locked -p iroha_core --bench queries -- typed_core_query_ --save-baseline candidate

      - name: Enforce five-percent ceiling
        working-directory: candidate
        run: >-
          python3 scripts/check_kotodama_perf.py
          --criterion-dir ../target-kotodama-perf/criterion
          --predecessor-root ../baseline
          --threshold 0.05

      - name: Build canonical Kotodama release tools
        working-directory: candidate
        run: cargo build --locked -p ivm --bin koto -p iroha_cli --bin iroha

      - name: Compile every Kotodama documentation source
        working-directory: candidate
        run: >-
          python3 scripts/check_kotodama_docs.py
          --koto ../target-kotodama-perf/debug/koto

      - name: Enforce complete artifact release gate
        working-directory: candidate
        run: >-
          python3 scripts/regenerate_kotodama_goldens.py
          --check
          --koto ../target-kotodama-perf/debug/koto
          --iroha ../target-kotodama-perf/debug/iroha
