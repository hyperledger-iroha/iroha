name: Publish (custom)

on:
  workflow_dispatch:
    inputs:
      image_type:
        description: "Type of the image to build"
        required: true
        type: choice
        options:
          - profiling
          - glibc
          - alpine
          - iroha3-taira
        default: glibc
      checkout_ref:
        description: "The branch, tag or SHA to checkout"
        required: true
        type: string
        default: main
      tag_suffix:
        description: "Optional image tag suffix for the Taira image. Defaults to the checked-out short SHA."
        required: false
        type: string
      push_latest:
        description: "Also push the rolling `taira-latest` tags for the Taira image"
        required: false
        type: boolean
        default: false
      skip_taira_smoke:
        description: "Skip the local Taira smoke image build before publishing"
        required: false
        type: boolean
        default: false
      validator_lock_ref:
        description: "DPN API branch, tag, or SHA containing the reviewed Taira validator lock"
        required: true
        type: string
        default: master

env:
  DEFAULTS_DIR: defaults
  WASM_TARGET_DIR: wasm/target/prebuilt
  DPN_VALIDATOR_LOCK_SHA256: 08c939a65668814951adbd6f09ec4589a368dc41a7daac3cb3e8a096d8679986

jobs:
  build_wasm_libs:
    if: ${{ inputs.image_type != 'iroha3-taira' }}
    runs-on: ubuntu-latest
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.checkout_ref }}
      - name: Build wasm libs
        run: ./scripts/build_wasm.sh libs
      - name: Upload wasm libs to reuse in other jobs
        uses: actions/upload-artifact@v4
        with:
          name: wasm-libs
          path: ${{ env.WASM_TARGET_DIR }}/libs
          retention-days: 1

  image:
    needs: build_wasm_libs
    if: ${{ inputs.image_type != 'iroha3-taira' }}
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.checkout_ref }}
      - name: Resolve checkout metadata
        id: checkout_meta
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          if git_tag="$(git describe --tags --exact-match 2>/dev/null)"; then
            echo "tag=$git_tag" >>"$GITHUB_OUTPUT"
          fi
      - name: Download wasm libs
        uses: actions/download-artifact@v4
        with:
          name: wasm-libs
          path: ${{ env.DEFAULTS_DIR }}/libs
      - name: Move the default executor
        run: mv ${{ env.DEFAULTS_DIR }}/libs/default_executor.wasm ${{ env.DEFAULTS_DIR }}/executor.wasm
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Soramitsu Harbor
        uses: docker/login-action@v3
        with:
          registry: docker.soramitsu.co.jp
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}
      - name: Set up Docker Buildx
        id: buildx
        if: always()
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          install: true

      # glibc
      - name: Build and push iroha:glibc image
        uses: docker/build-push-action@v6
        if: ${{ inputs.image_type == 'glibc' }}
        with:
          push: true
          tags: docker.soramitsu.co.jp/iroha2/iroha:glibc-${{ steps.checkout_meta.outputs.sha }}
          labels: commit=${{ steps.checkout_meta.outputs.sha }}
          context: .

      # Profiling
      - name: Get the release tag
        if: ${{ inputs.image_type == 'profiling' }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="${{ steps.checkout_meta.outputs.tag }}"
          if [[ -z "$RELEASE_VERSION" ]]; then
            RELEASE_VERSION="${{ github.event.inputs.checkout_ref }}"
          fi
          RELEASE_VERSION="${RELEASE_VERSION#refs/tags/}"
          PREFIX='v'
          TAG=${RELEASE_VERSION#$PREFIX}
          echo "TAG=$TAG" >>$GITHUB_ENV
      - name: Build and push iroha:profiling-tag-sha image
        uses: docker/build-push-action@v6
        if: ${{ inputs.image_type == 'profiling' }}
        with:
          push: true
          tags: docker.soramitsu.co.jp/iroha2/iroha:profiling-${{ env.TAG }}-${{ steps.checkout_meta.outputs.sha }}
          labels: commit=${{ steps.checkout_meta.outputs.sha }}
          build-args: |
            "PROFILE=profiling"
            "RUSTFLAGS=-C force-frame-pointers=on"
            "FEATURES=profiling"
            "CARGOFLAGS=-Z build-std"
          context: .

      # Alpine (difference from glibc is the use of Dockerfile.musl)
      - name: Build and push iroha:alpine-sha image
        if: ${{ inputs.image_type == 'alpine' }}
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: docker.soramitsu.co.jp/iroha2/iroha:alpine-${{ steps.checkout_meta.outputs.sha }}
          labels: commit=${{ steps.checkout_meta.outputs.sha }}
          file: Dockerfile.musl
          context: .

  taira_image:
    if: ${{ inputs.image_type == 'iroha3-taira' }}
    runs-on: ubuntu-latest
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.checkout_ref }}

      - name: Install reviewed DPN validator lock
        shell: bash
        run: |
          set -Eeuo pipefail
          lock_ref='${{ inputs.validator_lock_ref }}'
          if [[ ! "$lock_ref" =~ ^[A-Za-z0-9._/-]+$ || "$lock_ref" == *..* ]]; then
            echo "validator_lock_ref contains unsupported characters" >&2
            exit 1
          fi
          lock_url="https://raw.githubusercontent.com/soramitsu/dpn-api-rust/${lock_ref}/ops/iroha/taira-validator.Cargo.lock"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --location --retry 3 --output Cargo.lock "$lock_url"
          printf '%s  %s\n' "$DPN_VALIDATOR_LOCK_SHA256" Cargo.lock | sha256sum -c -

      - name: Resolve checkout metadata
        id: checkout_meta
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >>"$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Soramitsu Harbor
        id: harbor_login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: docker.soramitsu.co.jp
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          install: true

      - name: Resolve Taira image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          raw_suffix="${{ inputs.tag_suffix }}"
          if [[ -z "$raw_suffix" ]]; then
            raw_suffix="${{ steps.checkout_meta.outputs.short_sha }}"
          fi

          suffix="$(printf '%s' "$raw_suffix" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [[ -z "$suffix" ]]; then
            echo "resolved tag suffix is empty" >&2
            exit 1
          fi

          {
            echo "dockerhub_tags<<EOF"
            echo "hyperledger/iroha:taira-$suffix"
            if [[ "${{ inputs.push_latest }}" == "true" ]]; then
              echo "hyperledger/iroha:taira-latest"
            fi
            echo "EOF"
            echo "harbor_tags<<EOF"
            echo "docker.soramitsu.co.jp/iroha3/iroha:taira-$suffix"
            if [[ "${{ inputs.push_latest }}" == "true" ]]; then
              echo "docker.soramitsu.co.jp/iroha3/iroha:taira-latest"
            fi
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Build local Taira smoke image
        if: ${{ !inputs.skip_taira_smoke }}
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/taira-validator:smoke
          build-args: |
            "PROFILE=release"
            "CONFIG_PROFILE=taira"
            "FEATURES=embedded-soracloud-runtime"
            "CARGO_BUILD_JOBS=1"
            "BINARIES=irohad kagami"
            "VALIDATOR_LOCK_SHA256=${{ env.DPN_VALIDATOR_LOCK_SHA256 }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Taira image default entrypoint
        if: ${{ !inputs.skip_taira_smoke }}
        shell: bash
        run: bash scripts/taira_image_smoke.sh --image local/taira-validator:smoke --timeout 120

      - name: Build and push Taira validator image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.dockerhub_tags }}
          labels: commit=${{ steps.checkout_meta.outputs.sha }}
          build-args: |
            "PROFILE=release"
            "CONFIG_PROFILE=taira"
            "FEATURES=embedded-soracloud-runtime"
            "CARGO_BUILD_JOBS=1"
            "BINARIES=irohad"
            "VALIDATOR_LOCK_SHA256=${{ env.DPN_VALIDATOR_LOCK_SHA256 }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Taira validator image to Harbor
        if: ${{ steps.harbor_login.outcome == 'success' }}
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.harbor_tags }}
          labels: commit=${{ steps.checkout_meta.outputs.sha }}
          build-args: |
            "PROFILE=release"
            "CONFIG_PROFILE=taira"
            "FEATURES=embedded-soracloud-runtime"
            "CARGO_BUILD_JOBS=1"
            "BINARIES=irohad"
            "VALIDATOR_LOCK_SHA256=${{ env.DPN_VALIDATOR_LOCK_SHA256 }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
