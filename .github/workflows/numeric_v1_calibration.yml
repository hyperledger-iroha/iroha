name: Numeric V1 release calibration

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Future candidate release tag, which must not exist yet
        required: true
        type: string
      expected_commit:
        description: Lowercase full SHA of the untagged release commit
        required: true
        type: string
      evidence_release_tag:
        description: Tag of the dedicated unpublished calibration-evidence release
        required: true
        default: numeric-v1-calibration-evidence-v1
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Future candidate release tag, which must not exist yet
        required: true
        type: string
      expected_commit:
        description: Lowercase full SHA of the untagged release commit
        required: true
        type: string
      evidence_release_tag:
        description: Tag of the dedicated unpublished calibration-evidence release
        required: false
        default: numeric-v1-calibration-evidence-v1
        type: string

concurrency:
  group: numeric-v1-release-calibration-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  reference_calibration:
    name: Apple M1 Ultra (Mac13,2) reference calibration
    # All three custom labels are intentional. The hardware check below is still
    # authoritative and rejects a mislabeled or re-provisioned runner.
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - numeric-v1-release-calibration
      - apple-m1-ultra
      - mac13-2
    timeout-minutes: 180
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      CARGO_ENCODED_RUSTFLAGS: ""
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EVIDENCE_RELEASE_TAG: ${{ inputs.evidence_release_tag }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RUSTFLAGS: ""
      RUST_TOOLCHAIN: 1.93.1
    steps:
      - name: Validate pre-tag release inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_commit must be a lowercase full Git SHA" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "release_tag contains unsupported characters" >&2
            exit 1
          fi
          if [[ ! "$EVIDENCE_RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "evidence_release_tag contains unsupported characters" >&2
            exit 1
          fi
          if [[ "$EVIDENCE_RELEASE_TAG" == "$RELEASE_TAG" ]]; then
            echo "the evidence archive tag must differ from the future release tag" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "release calibration must run from an untagged branch commit" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_PROTECTED" != "true" ]]; then
            echo "release calibration must run from a protected branch" >&2
            exit 1
          fi
          if [[ "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "expected_commit must equal the workflow source commit $GITHUB_SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_commit }}

      - name: Verify untagged source and durable evidence archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "checked-out commit $actual_commit does not match $EXPECTED_COMMIT" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "release tag $RELEASE_TAG already exists locally" >&2
            exit 1
          fi
          tag_status="$(curl --silent --show-error --output "$RUNNER_TEMP/tag.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")"
          if [[ "$tag_status" != "404" ]]; then
            echo "expected future tag to be absent; Git ref API returned $tag_status" >&2
            exit 1
          fi
          gh api "repos/$GH_REPO/releases/tags/$EVIDENCE_RELEASE_TAG" \
            > target-evidence-release.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("target-evidence-release.json").read_text())
          expected_tag = os.environ["EVIDENCE_RELEASE_TAG"]
          if release.get("tag_name") != expected_tag:
              raise SystemExit("calibration-evidence archive tag mismatch")
          if release.get("draft") is not True:
              raise SystemExit("calibration-evidence archive must remain an unpublished draft")
          PY
          rm target-evidence-release.json

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.93.1

      - name: Capture and validate reference-host identity
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          rm -rf target/numeric-v1-calibration target/criterion
          mkdir -p target/numeric-v1-calibration
          /usr/sbin/system_profiler SPHardwareDataType -json \
            > "$RUNNER_TEMP/numeric-v1-hardware.json"
          rustc -Vv > target/numeric-v1-calibration/rustc.txt
          python3 - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          hardware = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "numeric-v1-hardware.json")
              .read_text(encoding="utf-8")
          )
          entries = hardware.get("SPHardwareDataType")
          if not isinstance(entries, list) or len(entries) != 1:
              raise SystemExit("system_profiler returned no unique hardware record")
          entry = entries[0]
          rustc_lines = Path("target/numeric-v1-calibration/rustc.txt").read_text(
              encoding="utf-8"
          ).splitlines()
          rustc = {
              key.strip(): value.strip()
              for key, value in (line.split(":", 1) for line in rustc_lines if ":" in line)
          }
          metadata = {
              "format": "iroha.numeric-v1.reference-host.v1",
              "hardware_model": entry.get("machine_model", ""),
              "chip": entry.get("chip_type", ""),
              "architecture": platform.machine(),
              "runner_os": os.environ.get("RUNNER_OS", ""),
              "runner_arch": os.environ.get("RUNNER_ARCH", ""),
              "runner_name": os.environ.get("RUNNER_NAME", ""),
              "rustc_release": rustc.get("release", ""),
              "rustc_host": rustc.get("host", ""),
              "rustc_commit_hash": rustc.get("commit-hash", ""),
              "rustc_commit_date": rustc.get("commit-date", ""),
              "source_commit": os.environ["EXPECTED_COMMIT"],
              "release_tag": os.environ["RELEASE_TAG"],
              "repository": os.environ["REPOSITORY"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "workflow_repository": os.environ["WORKFLOW_REPOSITORY"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }
          Path("target/numeric-v1-calibration/host.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          rm "$RUNNER_TEMP/numeric-v1-hardware.json"
          python3 scripts/check_numeric_v1_calibration.py \
            --host-metadata target/numeric-v1-calibration/host.json \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-release-tag "$RELEASE_TAG" \
            --expected-repository "$REPOSITORY" \
            --validate-host-only

      - name: Run release calibration
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "cargo +$RUST_TOOLCHAIN bench -p ivm --bench gas_calibration --locked -- --sample-size 100 --warm-up-time 3 --measurement-time 5 --noplot --save-baseline numeric-v1-release"
          } > target/numeric-v1-calibration/command.txt
          cargo "+$RUST_TOOLCHAIN" bench -p ivm --bench gas_calibration --locked -- \
            --sample-size 100 \
            --warm-up-time 3 \
            --measurement-time 5 \
            --noplot \
            --save-baseline numeric-v1-release \
            2>&1 | tee target/numeric-v1-calibration/console.log

      - name: Verify consensus weights and safety margin
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/check_numeric_v1_calibration.py target/criterion \
            --host-metadata target/numeric-v1-calibration/host.json \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-release-tag "$RELEASE_TAG" \
            --expected-repository "$REPOSITORY" \
            --json-output target/numeric-v1-calibration/report.json \
            2>&1 | tee target/numeric-v1-calibration/verification.log

      - name: Package complete calibration evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          roots = (Path("target/criterion"), Path("target/numeric-v1-calibration"))
          manifest = Path("target/numeric-v1-calibration/SHA256SUMS")
          paths = sorted(
              path
              for root in roots
              for path in root.rglob("*")
              if path.is_file() and path != manifest
          )
          if not paths:
              raise SystemExit("calibration evidence is empty")
          lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.as_posix()}"
              for path in paths
          ]
          manifest.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          base="numeric-v1-calibration-$EXPECTED_COMMIT-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          bundle="$RUNNER_TEMP/$base.tar.gz"
          checksum="$bundle.sha256"
          tar -czf "$bundle" target/criterion target/numeric-v1-calibration
          digest="$(shasum -a 256 "$bundle" | awk '{print $1}')"
          printf '%s  %s\n' "$digest" "$(basename "$bundle")" > "$checksum"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "asset_name=$(basename "$bundle")" >> "$GITHUB_OUTPUT"

      - name: Attest release-calibration evidence
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.evidence.outputs.bundle }}

      - name: Archive accepted evidence on the dedicated draft release
        shell: bash
        env:
          ASSET_NAME: ${{ steps.evidence.outputs.asset_name }}
          BUNDLE: ${{ steps.evidence.outputs.bundle }}
          CHECKSUM: ${{ steps.evidence.outputs.checksum }}
          EXPECTED_DIGEST: ${{ steps.evidence.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag_status="$(curl --silent --show-error --output "$RUNNER_TEMP/tag-before-upload.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")"
          if [[ "$tag_status" != "404" ]]; then
            echo "release tag appeared before evidence upload; refusing evidence" >&2
            exit 1
          fi
          gh api "repos/$GH_REPO/releases/tags/$EVIDENCE_RELEASE_TAG" \
            > "$RUNNER_TEMP/numeric-v1-release-before.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "numeric-v1-release-before.json")
              .read_text(encoding="utf-8")
          )
          if release.get("draft") is not True:
              raise SystemExit("calibration-evidence archive is no longer a draft")
          if release.get("tag_name") != os.environ["EVIDENCE_RELEASE_TAG"]:
              raise SystemExit("calibration-evidence archive tag changed")
          PY
          gh release upload "$EVIDENCE_RELEASE_TAG" "$BUNDLE" "$CHECKSUM"
          gh api "repos/$GH_REPO/releases/tags/$EVIDENCE_RELEASE_TAG" \
            > "$RUNNER_TEMP/numeric-v1-release.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "numeric-v1-release.json")
              .read_text(encoding="utf-8")
          )
          if release.get("draft") is not True:
              raise SystemExit("calibration-evidence archive ceased to be a draft")
          if release.get("tag_name") != os.environ["EVIDENCE_RELEASE_TAG"]:
              raise SystemExit("calibration-evidence archive tag changed")
          matching = [
              asset
              for asset in release.get("assets", [])
              if asset.get("name") == os.environ["ASSET_NAME"]
          ]
          if len(matching) != 1:
              raise SystemExit("uploaded calibration bundle is not unique")
          asset = matching[0]
          if asset.get("state") != "uploaded":
              raise SystemExit("calibration bundle did not finish uploading")
          expected = "sha256:" + os.environ["EXPECTED_DIGEST"]
          if asset.get("digest") != expected:
              raise SystemExit(
                  f"release asset digest mismatch: expected {expected}, "
                  f"found {asset.get('digest')!r}"
              )
          PY
          tag_status="$(curl --silent --show-error --output "$RUNNER_TEMP/tag-after.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")"
          if [[ "$tag_status" != "404" ]]; then
            echo "release tag appeared during calibration; refusing evidence" >&2
            exit 1
          fi

      - name: Upload short-lived diagnostic copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numeric-v1-calibration-debug-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/criterion
            target/numeric-v1-calibration
          if-no-files-found: warn
          retention-days: 14
