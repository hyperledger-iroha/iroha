name: Capture Taira native privacy expectations and evidence

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Lowercase full Iroha commit containing this workflow
        required: true
        type: string
      validator_release_ref:
        description: Exact 40-character DPN commit containing the reviewed source bundle and Cargo.lock
        required: true
        type: string
      expected_validator_source_tree_sha256:
        description: Reviewed DPN validator source-tree SHA-256 before expectation installation
        required: true
        type: string
      expected_cargo_lock_sha256:
        description: Reviewed SHA-256 of the DPN Cargo.lock
        required: true
        type: string
      expected_exact12_sha256:
        description: Reviewed SHA-256 of fixtures/privacy/exact12_v1.tsv
        required: true
        type: string
      elapsed_ceiling_ms:
        description: Reviewed generic per-stage wall-clock ceiling in canonical decimal milliseconds
        required: true
        type: string
      peak_rss_ceiling_bytes:
        description: Reviewed generic per-stage peak-RSS ceiling in canonical decimal bytes
        required: true
        type: string
      address_space_ceiling_bytes:
        description: Reviewed generic per-stage address-space ceiling in canonical decimal bytes
        required: true
        type: string

concurrency:
  group: taira-privacy-native-capture-${{ inputs.expected_commit }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "1"
  CARGO_ENCODED_RUSTFLAGS: ""
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: ""
  RUST_TOOLCHAIN: "1.93.1"
  TAIRA_INPUT_ADDRESS_SPACE_CEILING_BYTES: ${{ inputs.address_space_ceiling_bytes }}
  TAIRA_INPUT_ELAPSED_CEILING_MS: ${{ inputs.elapsed_ceiling_ms }}
  TAIRA_INPUT_EXACT12_SHA256: ${{ inputs.expected_exact12_sha256 }}
  TAIRA_INPUT_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
  TAIRA_INPUT_LOCK_SHA256: ${{ inputs.expected_cargo_lock_sha256 }}
  TAIRA_INPUT_PEAK_RSS_CEILING_BYTES: ${{ inputs.peak_rss_ceiling_bytes }}
  TAIRA_INPUT_SOURCE_TREE_SHA256: ${{ inputs.expected_validator_source_tree_sha256 }}
  TAIRA_INPUT_VALIDATOR_RELEASE_REF: ${{ inputs.validator_release_ref }}

jobs:
  capture:
    name: Native ARM64 expectation capture and final evidence
    environment: taira-privacy-native-release
    env:
      TAIRA_APPROVED_DPN_SIGNER_FINGERPRINT: ${{ vars.TAIRA_PRIVACY_DPN_SIGNER_FINGERPRINT }}
      TAIRA_APPROVED_DPN_SIGNER_PRINCIPAL: ${{ vars.TAIRA_PRIVACY_DPN_SIGNER_PRINCIPAL }}
      TAIRA_APPROVED_DPN_SIGNER_PUBLIC_KEY: ${{ vars.TAIRA_PRIVACY_DPN_SIGNER_PUBLIC_KEY }}
      TAIRA_APPROVED_IROHA_SIGNER_FINGERPRINT: ${{ vars.TAIRA_PRIVACY_IROHA_SIGNER_FINGERPRINT }}
      TAIRA_APPROVED_IROHA_SIGNER_PRINCIPAL: ${{ vars.TAIRA_PRIVACY_IROHA_SIGNER_PRINCIPAL }}
      TAIRA_APPROVED_IROHA_SIGNER_PUBLIC_KEY: ${{ vars.TAIRA_PRIVACY_IROHA_SIGNER_PUBLIC_KEY }}
      TAIRA_APPROVED_RUST_SYSROOT_TREE_SHA256: ${{ vars.TAIRA_PRIVACY_RUST_SYSROOT_TREE_SHA256 }}
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - numeric-v1-release-calibration
      - numeric-v1-slowest-supported-tier
      - aws-graviton3
      - c7g-4xlarge
    timeout-minutes: 360
    steps:
      - name: Validate immutable dispatch pins
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -Eeuo pipefail
          require_sha256() {
            local label="$1"
            local value="$2"
            if [[ ! "$value" =~ ^[0-9a-f]{64}$ \
              || "$value" = "$(printf '0%.0s' {1..64})" ]]; then
              echo "$label must be one nonzero lowercase SHA-256" >&2
              exit 1
            fi
          }
          require_commit() {
            local label="$1"
            local value="$2"
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ \
              || "$value" = "$(printf '0%.0s' {1..40})" ]]; then
              echo "$label must be one nonzero lowercase full Git commit" >&2
              exit 1
            fi
          }
          require_decimal() {
            local label="$1"
            local value="$2"
            if [[ ! "$value" =~ ^(0|[1-9][0-9]*)$ ]]; then
              echo "$label must be canonical unsigned decimal" >&2
              exit 1
            fi
          }

          require_commit expected_commit "$TAIRA_INPUT_EXPECTED_COMMIT"
          require_commit validator_release_ref "$TAIRA_INPUT_VALIDATOR_RELEASE_REF"
          require_sha256 expected_validator_source_tree_sha256 \
            "$TAIRA_INPUT_SOURCE_TREE_SHA256"
          require_sha256 expected_cargo_lock_sha256 "$TAIRA_INPUT_LOCK_SHA256"
          require_sha256 expected_exact12_sha256 "$TAIRA_INPUT_EXACT12_SHA256"
          require_decimal elapsed_ceiling_ms "$TAIRA_INPUT_ELAPSED_CEILING_MS"
          require_decimal peak_rss_ceiling_bytes \
            "$TAIRA_INPUT_PEAK_RSS_CEILING_BYTES"
          require_decimal address_space_ceiling_bytes \
            "$TAIRA_INPUT_ADDRESS_SPACE_CEILING_BYTES"

          if [[ "$TAIRA_INPUT_EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "expected_commit must equal the workflow source commit $GITHUB_SHA" >&2
            exit 1
          fi
          if [[ "$WORKFLOW_SHA" != "$TAIRA_INPUT_EXPECTED_COMMIT" ]]; then
            echo "workflow definition SHA does not equal expected_commit" >&2
            exit 1
          fi

          require_sha256 approved_rust_sysroot_tree_sha256 \
            "$TAIRA_APPROVED_RUST_SYSROOT_TREE_SHA256"
          python3 -I -S - <<'PY'
          import base64
          import hashlib
          import os
          import re
          import struct

          principal_pattern = re.compile(r"[A-Za-z0-9][A-Za-z0-9._@+-]{0,127}")
          fingerprint_pattern = re.compile(r"SHA256:[A-Za-z0-9+/]{43}")

          def take_string(blob, offset):
              if offset + 4 > len(blob):
                  raise SystemExit("approved SSH public key blob is truncated")
              length = struct.unpack(">I", blob[offset : offset + 4])[0]
              offset += 4
              end = offset + length
              if end > len(blob):
                  raise SystemExit("approved SSH public key blob is truncated")
              return blob[offset:end], end

          for role in ("IROHA", "DPN"):
              principal = os.environ[f"TAIRA_APPROVED_{role}_SIGNER_PRINCIPAL"]
              public_key = os.environ[f"TAIRA_APPROVED_{role}_SIGNER_PUBLIC_KEY"]
              fingerprint = os.environ[
                  f"TAIRA_APPROVED_{role}_SIGNER_FINGERPRINT"
              ]
              if principal_pattern.fullmatch(principal) is None:
                  raise SystemExit(f"approved {role} signer principal is not canonical")
              parts = public_key.split(" ")
              if len(parts) != 2 or parts[0] != "ssh-ed25519":
                  raise SystemExit(
                      f"approved {role} signer public key must be canonical ssh-ed25519"
                  )
              try:
                  blob = base64.b64decode(parts[1], validate=True)
              except ValueError as error:
                  raise SystemExit(
                      f"approved {role} signer public key is not canonical Base64"
                  ) from error
              if base64.b64encode(blob).decode("ascii") != parts[1]:
                  raise SystemExit(
                      f"approved {role} signer public key is not canonical Base64"
                  )
              algorithm, offset = take_string(blob, 0)
              key, offset = take_string(blob, offset)
              if algorithm != b"ssh-ed25519" or len(key) != 32 or offset != len(blob):
                  raise SystemExit(
                      f"approved {role} signer public key is not one Ed25519 key"
                  )
              observed = "SHA256:" + base64.b64encode(
                  hashlib.sha256(blob).digest()
              ).decode("ascii").rstrip("=")
              if (
                  fingerprint_pattern.fullmatch(fingerprint) is None
                  or fingerprint == "SHA256:" + "A" * 43
                  or fingerprint != observed
              ):
                  raise SystemExit(
                      f"approved {role} signer fingerprint does not match its key"
                  )
          PY

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_commit }}

      - name: Authenticate and reconstruct the reviewed DPN source
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$TAIRA_INPUT_EXPECTED_COMMIT"
          if [[ -e Cargo.lock || -L Cargo.lock ]]; then
            echo "Cargo.lock unexpectedly exists before reviewed lock installation" >&2
            exit 1
          fi

          release_root="$(mktemp -d "${RUNNER_TEMP}/taira-privacy-dpn-source.XXXXXXXXXX")"
          source_bundle="$release_root/source-bundle"
          authentication_root="$release_root/authentication"
          dpn_repository="$release_root/dpn.git"
          mkdir "$source_bundle" "$authentication_root"
          chmod 0700 "$authentication_root"

          git_bin="$(command -v git)"
          ssh_keygen_bin="$(command -v ssh-keygen)"
          test -x "$git_bin"
          test -x "$ssh_keygen_bin"
          git_closed=(
            env
            -i
            LANG=C
            LC_ALL=C
            PATH=/usr/local/bin:/usr/bin:/bin
            GIT_CONFIG_NOSYSTEM=1
            GIT_CONFIG_GLOBAL=/dev/null
            GIT_CONFIG_SYSTEM=/dev/null
            GIT_NO_REPLACE_OBJECTS=1
            GIT_TERMINAL_PROMPT=0
            GIT_ASKPASS=/bin/false
            "$git_bin"
          )

          python3 -I -S - "$authentication_root" <<'PY'
          import os
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])

          def create(name, payload):
              path = root / name
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(path, flags, 0o400)
              try:
                  view = memoryview(payload)
                  while view:
                      count = os.write(descriptor, view)
                      view = view[count:]
                  os.fchmod(descriptor, 0o400)
                  os.fsync(descriptor)
              finally:
                  os.close(descriptor)

          for prefix, role in (("iroha", "IROHA"), ("dpn", "DPN")):
              principal = os.environ[f"TAIRA_APPROVED_{role}_SIGNER_PRINCIPAL"]
              public_key = os.environ[f"TAIRA_APPROVED_{role}_SIGNER_PUBLIC_KEY"]
              create(f"{prefix}-signer.pub", f"{public_key}\n".encode("ascii"))
              create(
                  f"{prefix}-allowed-signers",
                  (
                      f'{principal} namespaces="git" {public_key}\n'
                  ).encode("ascii"),
              )
          create("ssh-revocation", b"")
          descriptor = os.open(root, os.O_RDONLY | getattr(os, "O_DIRECTORY", 0))
          try:
              os.fsync(descriptor)
          finally:
              os.close(descriptor)
          PY

          for role in iroha dpn; do
            if [[ "$role" = iroha ]]; then
              expected_fingerprint="$TAIRA_APPROVED_IROHA_SIGNER_FINGERPRINT"
            else
              expected_fingerprint="$TAIRA_APPROVED_DPN_SIGNER_FINGERPRINT"
            fi
            key_report="$(
              LC_ALL=C "$ssh_keygen_bin" \
                -l -E sha256 -f "$authentication_root/${role}-signer.pub"
            )"
            test "$(awk '{print $2}' <<<"$key_report")" = "$expected_fingerprint"
            test "$(wc -l <<<"$key_report" | tr -d ' ')" = "1"
          done

          verify_signed_commit() {
            local repository="$1"
            local commit="$2"
            local prefix="$3"
            local principal="$4"
            local fingerprint="$5"
            local allowed_signers="$authentication_root/${prefix}-allowed-signers"
            local revocation="$authentication_root/ssh-revocation"
            local metadata="$authentication_root/${prefix}-signature-metadata.bin"
            local raw_commit="$authentication_root/${prefix}-commit.raw"
            local transcript="$authentication_root/${prefix}-verify-commit.log"
            local -a signature_config=(
              -c gpg.format=ssh
              -c gpg.minTrustLevel=fully
              -c "gpg.ssh.program=$ssh_keygen_bin"
              -c "gpg.ssh.allowedSignersFile=$allowed_signers"
              -c "gpg.ssh.revocationFile=$revocation"
              -c "gpg.program=$ssh_keygen_bin"
              -c "gpg.openpgp.program=$ssh_keygen_bin"
              -c "gpg.x509.program=$ssh_keygen_bin"
            )

            test "$(
              "${git_closed[@]}" -C "$repository" \
                rev-parse --verify "${commit}^{commit}"
            )" = "$commit"
            "${git_closed[@]}" -C "$repository" cat-file commit "$commit" \
              >"$raw_commit"
            python3 -I -S - "$raw_commit" <<'PY'
          from pathlib import Path
          import sys

          raw = Path(sys.argv[1]).read_bytes()
          if raw.count(b"-----BEGIN SSH SIGNATURE-----") != 1:
              raise SystemExit("source commit is not signed by exactly one SSH signature")
          for marker in (
              b"-----BEGIN PGP SIGNATURE-----",
              b"-----BEGIN SIGNED MESSAGE-----",
              b"-----BEGIN CERTIFICATE-----",
          ):
              if marker in raw:
                  raise SystemExit("source commit contains a forbidden signature format")
          PY
            if ! "${git_closed[@]}" -C "$repository" \
              "${signature_config[@]}" verify-commit --raw "$commit" \
              >"$transcript" 2>&1; then
              tail -c 4096 "$transcript" >&2
              return 1
            fi
            "${git_closed[@]}" -C "$repository" \
              "${signature_config[@]}" show --no-patch \
              '--format=%G?%x00%GF%x00%GP%x00%GS%x00' "$commit" \
              >"$metadata"
            python3 -I -S - "$metadata" "$fingerprint" "$principal" <<'PY'
          from pathlib import Path
          import sys

          path, fingerprint, principal = sys.argv[1:]
          expected = (
              b"G\0"
              + fingerprint.encode("ascii")
              + b"\0\0"
              + principal.encode("ascii")
              + b"\0\n"
          )
          if Path(path).read_bytes() != expected:
              raise SystemExit("SSH signature metadata is not the approved identity")
          PY
            chmod 0400 "$raw_commit" "$transcript" "$metadata"
          }

          verify_signed_commit \
            "$GITHUB_WORKSPACE" \
            "$TAIRA_INPUT_EXPECTED_COMMIT" \
            iroha \
            "$TAIRA_APPROVED_IROHA_SIGNER_PRINCIPAL" \
            "$TAIRA_APPROVED_IROHA_SIGNER_FINGERPRINT"
          toolchain_hasher_oid="$(
            "${git_closed[@]}" -C "$GITHUB_WORKSPACE" rev-parse --verify \
              "$TAIRA_INPUT_EXPECTED_COMMIT:scripts/hash_taira_rust_toolchain.py"
          )"
          test "$(
            "${git_closed[@]}" -C "$GITHUB_WORKSPACE" cat-file -t \
              "$toolchain_hasher_oid"
          )" = blob
          toolchain_hasher_bytes="$(
            "${git_closed[@]}" -C "$GITHUB_WORKSPACE" cat-file -s \
              "$toolchain_hasher_oid"
          )"
          if [[ ! "$toolchain_hasher_bytes" =~ ^[1-9][0-9]*$ ]] \
            || (( toolchain_hasher_bytes > 1048576 )); then
            echo "signed toolchain hasher is outside its fixed byte bound" >&2
            exit 1
          fi
          "${git_closed[@]}" -C "$GITHUB_WORKSPACE" cat-file blob \
            "$toolchain_hasher_oid" \
            >"$authentication_root/hash_taira_rust_toolchain.py"
          chmod 0400 "$authentication_root/hash_taira_rust_toolchain.py"
          test "$(stat -c '%s' "$authentication_root/hash_taira_rust_toolchain.py")" \
            = "$toolchain_hasher_bytes"
          test "$(stat -c '%h' "$authentication_root/hash_taira_rust_toolchain.py")" \
            = 1

          "${git_closed[@]}" init --bare --object-format=sha1 "$dpn_repository"
          "${git_closed[@]}" -C "$dpn_repository" remote add origin \
            https://github.com/soramitsu/dpn-api-rust.git
          "${git_closed[@]}" -C "$dpn_repository" fetch \
            --no-tags \
            --depth=1 \
            origin \
            "$TAIRA_INPUT_VALIDATOR_RELEASE_REF"
          test "$(
            "${git_closed[@]}" -C "$dpn_repository" \
              rev-parse --verify 'FETCH_HEAD^{commit}'
          )" = "$TAIRA_INPUT_VALIDATOR_RELEASE_REF"
          "${git_closed[@]}" -C "$dpn_repository" \
            fsck --strict --no-dangling "$TAIRA_INPUT_VALIDATOR_RELEASE_REF"
          verify_signed_commit \
            "$dpn_repository" \
            "$TAIRA_INPUT_VALIDATOR_RELEASE_REF" \
            dpn \
            "$TAIRA_APPROVED_DPN_SIGNER_PRINCIPAL" \
            "$TAIRA_APPROVED_DPN_SIGNER_FINGERPRINT"
          "${git_closed[@]}" -C "$dpn_repository" remote remove origin

          python3 -I -S - \
            "$git_bin" \
            "$dpn_repository" \
            "$TAIRA_INPUT_VALIDATOR_RELEASE_REF" \
            "$release_root" <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          git, repository, commit, release_root_raw = sys.argv[1:]
          release_root = Path(release_root_raw)
          paths = {
              "scripts/iroha_source_bundle.py": (
                  release_root / "iroha_source_bundle.py",
                  16 * 1024 * 1024,
              ),
              "ops/iroha/taira-validator-source/provenance.json": (
                  release_root / "source-bundle/provenance.json",
                  64 * 1024 * 1024,
              ),
              "ops/iroha/taira-validator-source/tracked.patch": (
                  release_root / "source-bundle/tracked.patch",
                  1024 * 1024 * 1024,
              ),
              "ops/iroha/taira-validator-source/untracked.tar": (
                  release_root / "source-bundle/untracked.tar",
                  8 * 1024 * 1024 * 1024,
              ),
              "ops/iroha/taira-validator-source/untracked.manifest.json": (
                  release_root / "source-bundle/untracked.manifest.json",
                  64 * 1024 * 1024,
              ),
              "ops/iroha/taira-validator-source/source.manifest.json": (
                  release_root / "source-bundle/source.manifest.json",
                  64 * 1024 * 1024,
              ),
              "ops/iroha/taira-validator.Cargo.lock": (
                  release_root / "Cargo.lock",
                  128 * 1024 * 1024,
              ),
          }
          environment = {
              "GIT_CONFIG_GLOBAL": "/dev/null",
              "GIT_CONFIG_NOSYSTEM": "1",
              "GIT_CONFIG_SYSTEM": "/dev/null",
              "GIT_NO_REPLACE_OBJECTS": "1",
              "LANG": "C",
              "LC_ALL": "C",
          }

          def git_output(*arguments, maximum):
              result = subprocess.run(
                  [git, "-C", repository, *arguments],
                  check=False,
                  stdin=subprocess.DEVNULL,
                  capture_output=True,
                  env=environment,
              )
              if result.returncode != 0 or result.stderr or len(result.stdout) > maximum:
                  raise SystemExit("DPN Git object query failed closed")
              return result.stdout

          total = 0
          for source_path, (destination, maximum) in paths.items():
              tree = git_output(
                  "ls-tree",
                  "-z",
                  "--full-tree",
                  commit,
                  "--",
                  source_path,
                  maximum=8192,
              )
              match = re.fullmatch(
                  rb"(100644|100755) blob ([0-9a-f]{40})\t"
                  + re.escape(source_path.encode("ascii"))
                  + rb"\0",
                  tree,
              )
              if match is None:
                  raise SystemExit(f"DPN release path is not one regular blob: {source_path}")
              oid = match.group(2).decode("ascii")
              size_raw = git_output("cat-file", "-s", oid, maximum=128)
              if re.fullmatch(rb"(0|[1-9][0-9]*)\n", size_raw) is None:
                  raise SystemExit("DPN release blob has a noncanonical size")
              size = int(size_raw)
              total += size
              if size == 0 or size > maximum or total > 10 * 1024 * 1024 * 1024:
                  raise SystemExit("DPN release blob is outside its fixed byte bound")
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(destination, flags, 0o600)
              process = None
              try:
                  process = subprocess.Popen(
                      [git, "-C", repository, "cat-file", "blob", oid],
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      env=environment,
                  )
                  if process.stdout is None:
                      raise SystemExit("DPN release blob pipe was not created")
                  remaining = size
                  while remaining:
                      chunk = process.stdout.read(min(1024 * 1024, remaining))
                      if not chunk:
                          raise SystemExit("DPN release blob ended early")
                      view = memoryview(chunk)
                      while view:
                          count = os.write(descriptor, view)
                          view = view[count:]
                      remaining -= len(chunk)
                  if process.stdout.read(1):
                      raise SystemExit("DPN release blob exceeded its declared size")
                  process.stdout.close()
                  if process.wait() != 0:
                      raise SystemExit("DPN release blob extraction failed")
                  os.fchmod(descriptor, 0o600)
                  os.fsync(descriptor)
              except BaseException:
                  if process is not None and process.poll() is None:
                      process.kill()
                      process.wait()
                  destination.unlink(missing_ok=True)
                  raise
              finally:
                  os.close(descriptor)
          for parent in (release_root / "source-bundle", release_root):
              descriptor = os.open(
                  parent, os.O_RDONLY | getattr(os, "O_DIRECTORY", 0)
              )
              try:
                  os.fsync(descriptor)
              finally:
                  os.close(descriptor)
          PY

          for release_input in \
            "$release_root/iroha_source_bundle.py" \
            "$release_root/Cargo.lock" \
            "$source_bundle/provenance.json" \
            "$source_bundle/tracked.patch" \
            "$source_bundle/untracked.tar" \
            "$source_bundle/untracked.manifest.json" \
            "$source_bundle/source.manifest.json"; do
            if [[ ! -f "$release_input" || -L "$release_input" ]] \
              || [[ "$(stat -c '%h' "$release_input")" != "1" ]]; then
              echo "DPN release input is not a singly linked regular file: $release_input" >&2
              exit 1
            fi
          done
          printf '%s  %s\n' \
            "$TAIRA_INPUT_LOCK_SHA256" \
            "$release_root/Cargo.lock" \
            | sha256sum -c -

          observed_source_tree="$(
            python3 -I -S - "$source_bundle/provenance.json" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              payload = json.load(stream)
          value = payload.get("source_tree_sha256")
          if not isinstance(value, str) or re.fullmatch(r"[0-9a-f]{64}", value) is None:
              raise SystemExit("DPN source provenance has no canonical source_tree_sha256")
          print(value)
          PY
          )"
          test "$observed_source_tree" = "$TAIRA_INPUT_SOURCE_TREE_SHA256"
          iroha_allowed_signers_sha="$(
            sha256sum "$authentication_root/iroha-allowed-signers" | awk '{print $1}'
          )"
          dpn_allowed_signers_sha="$(
            sha256sum "$authentication_root/dpn-allowed-signers" | awk '{print $1}'
          )"
          python3 -I -S - \
            "$authentication_root" \
            "$git_bin" \
            "$ssh_keygen_bin" \
            "$iroha_allowed_signers_sha" \
            "$dpn_allowed_signers_sha" \
            "$observed_source_tree" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])
          git = Path(sys.argv[2])
          ssh_keygen = Path(sys.argv[3])
          iroha_policy_sha, dpn_policy_sha, source_tree_sha = sys.argv[4:]

          def digest(path):
              hasher = hashlib.sha256()
              with path.open("rb") as stream:
                  while chunk := stream.read(1024 * 1024):
                      hasher.update(chunk)
              return hasher.hexdigest()

          for value in (iroha_policy_sha, dpn_policy_sha, source_tree_sha):
              if re.fullmatch(r"[0-9a-f]{64}", value) is None or value == "0" * 64:
                  raise SystemExit("source authentication digest is not canonical")
          payload = {
              "schema": "iroha.taira.privacy-native-source-authentication.v1",
              "iroha_source": {
                  "allowed_signers_sha256": iroha_policy_sha,
                  "commit": os.environ["TAIRA_INPUT_EXPECTED_COMMIT"],
                  "raw_commit_sha256": digest(root / "iroha-commit.raw"),
                  "signature_format": "ssh",
                  "signer_fingerprint": os.environ[
                      "TAIRA_APPROVED_IROHA_SIGNER_FINGERPRINT"
                  ],
                  "signer_principal": os.environ[
                      "TAIRA_APPROVED_IROHA_SIGNER_PRINCIPAL"
                  ],
              },
              "validator_source": {
                  "allowed_signers_sha256": dpn_policy_sha,
                  "commit": os.environ["TAIRA_INPUT_VALIDATOR_RELEASE_REF"],
                  "raw_commit_sha256": digest(root / "dpn-commit.raw"),
                  "signature_format": "ssh",
                  "signer_fingerprint": os.environ[
                      "TAIRA_APPROVED_DPN_SIGNER_FINGERPRINT"
                  ],
                  "signer_principal": os.environ[
                      "TAIRA_APPROVED_DPN_SIGNER_PRINCIPAL"
                  ],
                  "source_tree_sha256": source_tree_sha,
              },
              "verification_tools": {
                  "git_path": str(git),
                  "git_sha256": digest(git),
                  "ssh_keygen_path": str(ssh_keygen),
                  "ssh_keygen_sha256": digest(ssh_keygen),
                  "toolchain_hasher_sha256": digest(
                      root / "hash_taira_rust_toolchain.py"
                  ),
              },
          }
          path = root / "source-authentication.json"
          encoded = json.dumps(payload, indent=2, sort_keys=True).encode() + b"\n"
          descriptor = os.open(
              path,
              os.O_WRONLY
              | os.O_CREAT
              | os.O_EXCL
              | getattr(os, "O_NOFOLLOW", 0),
              0o400,
          )
          try:
              with os.fdopen(descriptor, "wb") as stream:
                  stream.write(encoded)
                  stream.flush()
                  os.fchmod(stream.fileno(), 0o400)
                  os.fsync(stream.fileno())
          except BaseException:
              path.unlink(missing_ok=True)
              raise
          PY

          python3 -I -S - "$release_root/Cargo.lock" Cargo.lock <<'PY'
          import os
          import sys

          source_path, destination_path = sys.argv[1:]
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
          if hasattr(os, "O_NOFOLLOW"):
              flags |= os.O_NOFOLLOW
          source = os.open(source_path, os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0))
          destination = os.open(destination_path, flags, 0o600)
          try:
              while chunk := os.read(source, 1024 * 1024):
                  view = memoryview(chunk)
                  while view:
                      written = os.write(destination, view)
                      view = view[written:]
              os.fsync(destination)
          finally:
              os.close(source)
              os.close(destination)
          PY
          python3 -I -S "$release_root/iroha_source_bundle.py" reconstruct \
            --repo "$GITHUB_WORKSPACE" \
            --bundle-dir "$source_bundle"
          python3 -I -S "$release_root/iroha_source_bundle.py" verify \
            --repo "$GITHUB_WORKSPACE" \
            --bundle-dir "$source_bundle"
          test "$(git rev-parse HEAD)" = "$TAIRA_INPUT_EXPECTED_COMMIT"
          printf '%s  %s\n' "$TAIRA_INPUT_LOCK_SHA256" Cargo.lock | sha256sum -c -

          {
            echo "TAIRA_DPN_RELEASE_ROOT=$release_root"
            echo "TAIRA_DPN_SOURCE_BUNDLE=$source_bundle"
            echo "TAIRA_DPN_ALLOWED_SIGNERS_SHA256=$dpn_allowed_signers_sha"
            echo "TAIRA_IROHA_ALLOWED_SIGNERS_SHA256=$iroha_allowed_signers_sha"
          } >>"$GITHUB_ENV"

      - name: Allocate a canonical evidence root
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          evidence_root="$(
            mktemp -d "${RUNNER_TEMP}/taira-privacy-native-evidence.XXXXXXXXXX"
          )"
          evidence_root="$(cd "$evidence_root" && pwd -P)"
          mkdir -p \
            "$evidence_root/bin" \
            "$evidence_root/provenance/authenticated-origins" \
            "$evidence_root/provenance/privacy-native" \
            "$evidence_root/provenance/source-bundle"
          echo "TAIRA_EVIDENCE_ROOT=$evidence_root" >>"$GITHUB_ENV"

      - name: Enforce native Graviton3 kernel and resource prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          x509_environment="$TAIRA_EVIDENCE_ROOT/provenance/x509-resource-environment.json"
          bash ci/check_taira_privacy_native_host.sh \
            --metadata-out "$TAIRA_EVIDENCE_ROOT/provenance/native-host.json" \
            --x509-environment-out "$x509_environment"
          echo "TAIRA_X509_RESOURCE_ENVIRONMENT=$x509_environment" >>"$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.93.1

      - name: Authenticate the installed Rust toolchain tree
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          rust_sysroot="$(rustc --print sysroot)"
          rust_sysroot="$(cd "$rust_sysroot" && pwd -P)"
          test -x "$rust_sysroot/bin/rustc"
          test -x "$rust_sysroot/bin/cargo"
          toolchain_manifest="$TAIRA_EVIDENCE_ROOT/provenance/rust-toolchain-tree-v1.json"
          observed_toolchain_sha="$(
            python3 -I -S \
              "$TAIRA_DPN_RELEASE_ROOT/authentication/hash_taira_rust_toolchain.py" \
              --sysroot "$rust_sysroot" \
              --manifest-out "$toolchain_manifest"
          )"
          if [[ ! "$observed_toolchain_sha" =~ ^[0-9a-f]{64}$ \
            || "$observed_toolchain_sha" != \
              "$TAIRA_APPROVED_RUST_SYSROOT_TREE_SHA256" ]]; then
            echo "installed Rust sysroot does not match the protected tree seal" >&2
            exit 1
          fi
          test "$(
            python3 -I -S - "$toolchain_manifest" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              print(json.load(stream)["tree_sha256"])
          PY
          )" = "$observed_toolchain_sha"
          printf '%s\n' "$observed_toolchain_sha" \
            >"$TAIRA_EVIDENCE_ROOT/provenance/rust-toolchain-tree-v1.sha256"
          {
            echo "TAIRA_AUTHENTICATED_RUST_SYSROOT=$rust_sysroot"
            echo "TAIRA_RUST_TOOLCHAIN_TREE_SHA256=$observed_toolchain_sha"
            echo "RUSTC=$rust_sysroot/bin/rustc"
            echo "CARGO=$rust_sysroot/bin/cargo"
          } >>"$GITHUB_ENV"
          echo "$rust_sysroot/bin" >>"$GITHUB_PATH"

      - name: Freeze and verify the pre-capture source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          rustc -Vv >"$TAIRA_EVIDENCE_ROOT/provenance/rustc.txt"
          cargo -Vv >"$TAIRA_EVIDENCE_ROOT/provenance/cargo.txt"
          cc --version >"$TAIRA_EVIDENCE_ROOT/provenance/cc.txt"
          ld --version >"$TAIRA_EVIDENCE_ROOT/provenance/ld.txt"
          readelf --version >"$TAIRA_EVIDENCE_ROOT/provenance/readelf.txt"
          getconf GNU_LIBC_VERSION \
            >"$TAIRA_EVIDENCE_ROOT/provenance/libc.txt"
          grep -Fx 'release: 1.93.1' \
            "$TAIRA_EVIDENCE_ROOT/provenance/rustc.txt"
          grep -Fx \
            'commit-hash: 01f6ddf7588f42ae2d7eb0a2f21d44e8e96674cf' \
            "$TAIRA_EVIDENCE_ROOT/provenance/rustc.txt"
          grep -Fx 'commit-date: 2026-02-11' \
            "$TAIRA_EVIDENCE_ROOT/provenance/rustc.txt"
          grep -Fx 'host: aarch64-unknown-linux-gnu' \
            "$TAIRA_EVIDENCE_ROOT/provenance/rustc.txt"
          test "$(command -v rustc)" = "$TAIRA_AUTHENTICATED_RUST_SYSROOT/bin/rustc"
          test "$(command -v cargo)" = "$TAIRA_AUTHENTICATED_RUST_SYSROOT/bin/cargo"
          for one_shot_fixture in \
            fixtures/privacy/native_release_expectations_v1.norito \
            fixtures/privacy/native_release_expectations_v1.json \
            fixtures/privacy/zk_x509_native_resource_v1.norito \
            fixtures/privacy/zk_x509_native_resource_v1.json; do
            if [[ -e "$one_shot_fixture" || -L "$one_shot_fixture" ]]; then
              echo "one-shot native fixture already exists: $one_shot_fixture" >&2
              exit 1
            fi
          done
          python3 -I -S - <<'PY'
          from pathlib import Path

          profile = Path(
              "crates/iroha_core/src/privacy_engines/zk_x509/profile.rs"
          ).read_text(encoding="utf-8")
          profile_declarations = (
              (
                  "ZK_X509_RELEASE_KAT_EXPECTED_PROOF_BYTES_V1",
                  "pub(crate) const "
                  "ZK_X509_RELEASE_KAT_EXPECTED_PROOF_BYTES_V1: u32 = 0;",
              ),
              (
                  "ZK_X509_RELEASE_KAT_EXPECTED_PROOF_SHA256_V1",
                  "pub(crate) const "
                  "ZK_X509_RELEASE_KAT_EXPECTED_PROOF_SHA256_V1: "
                  "[u8; 32] = [0; 32];",
              ),
              (
                  "ZK_X509_NATIVE_RELEASE_EXPECTATIONS_NORITO_SHA256_V1",
                  "pub(crate) const "
                  "ZK_X509_NATIVE_RELEASE_EXPECTATIONS_NORITO_SHA256_V1: "
                  "[u8; 32] = [0; 32];",
              ),
              (
                  "ZK_X509_NATIVE_RELEASE_EXPECTATIONS_JSON_SHA256_V1",
                  "pub(crate) const "
                  "ZK_X509_NATIVE_RELEASE_EXPECTATIONS_JSON_SHA256_V1: "
                  "[u8; 32] = [0; 32];",
              ),
          )
          for name, declaration in profile_declarations:
              if profile.count(declaration) != 1:
                  raise SystemExit(f"{name} is not in the unique all-zero bootstrap state")

          readiness = Path(
              "crates/iroha_core/src/privacy_engines/zk_x509/"
              "profile/readiness_certificates.rs"
          ).read_text(encoding="utf-8")
          for name in (
              "ZK_X509_RESOURCE_POSITIVE_ELAPSED_MILLIS_V1",
              "ZK_X509_RESOURCE_POSITIVE_PEAK_RSS_BYTES_V1",
              "ZK_X509_RESOURCE_POSITIVE_PEAK_ADDRESS_SPACE_BYTES_V1",
              "ZK_X509_RESOURCE_MAXIMUM_ELAPSED_MILLIS_V1",
              "ZK_X509_RESOURCE_MAXIMUM_PEAK_RSS_BYTES_V1",
              "ZK_X509_RESOURCE_MAXIMUM_PEAK_ADDRESS_SPACE_BYTES_V1",
          ):
              declaration = f"pub(crate) const {name}: u64 = 0;"
              if readiness.count(declaration) != 1:
                  raise SystemExit(f"{name} is not in the unique all-zero bootstrap state")
          digest_name = "ZK_X509_RESOURCE_CERTIFICATE_SHA256_V1"
          digest_declaration = (
              f"pub(crate) const {digest_name}: [u8; 32] = [0; 32];"
          )
          if readiness.count(digest_declaration) != 1:
              raise SystemExit(
                  f"{digest_name} is not in the unique all-zero bootstrap state"
              )
          PY

          printf '%s  %s\n' \
            "$TAIRA_INPUT_EXACT12_SHA256" \
            fixtures/privacy/exact12_v1.tsv \
            | sha256sum -c -
          printf '%s  %s\n' "$TAIRA_INPUT_LOCK_SHA256" Cargo.lock | sha256sum -c -
          bootstrap_source_sha="$(
            python3 -I -S scripts/compute_workspace_source_manifest.py \
              --root "$GITHUB_WORKSPACE"
          )"
          if [[ ! "$bootstrap_source_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "pre-capture workspace source identity is not canonical" >&2
            exit 1
          fi
          printf '%s\n' "$bootstrap_source_sha" \
            >"$TAIRA_EVIDENCE_ROOT/provenance/source-before-expectations.sha256"
          printf '%s\n' "$TAIRA_INPUT_SOURCE_TREE_SHA256" \
            >"$TAIRA_EVIDENCE_ROOT/provenance/dpn-source-tree.sha256"
          printf '%s  %s\n' "$TAIRA_INPUT_LOCK_SHA256" Cargo.lock \
            >"$TAIRA_EVIDENCE_ROOT/provenance/cargo-lock.sha256"
          printf '%s  %s\n' \
            "$TAIRA_INPUT_EXACT12_SHA256" \
            fixtures/privacy/exact12_v1.tsv \
            >"$TAIRA_EVIDENCE_ROOT/provenance/exact12.sha256"
          install -m 0444 \
            crates/iroha_core/src/privacy_engines/zk_x509/profile.rs \
            "$TAIRA_EVIDENCE_ROOT/provenance/zk-x509-profile.before.rs"
          install -m 0444 \
            crates/iroha_core/src/privacy_engines/zk_x509/profile/readiness_certificates.rs \
            "$TAIRA_EVIDENCE_ROOT/provenance/zk-x509-readiness-certificates.before.rs"
          echo "TAIRA_BOOTSTRAP_SOURCE_SHA256=$bootstrap_source_sha" >>"$GITHUB_ENV"

      - name: Run fail-fast installer, soundness, and deterministic KAT gates
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          bootstrap_target="$(
            mktemp -d "${RUNNER_TEMP}/taira-privacy-bootstrap-target.XXXXXXXXXX"
          )"
          bootstrap_target="$(cd "$bootstrap_target" && pwd -P)"

          printf '%s\n' \
            'PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider pytests/scripts/install_taira_privacy_native_expectations_test.py' \
            >"$TAIRA_EVIDENCE_ROOT/provenance/pre-capture-installer-test-command.txt"
          PYTHONDONTWRITEBYTECODE=1 \
            python3 -m pytest \
              -q \
              -p no:cacheprovider \
              pytests/scripts/install_taira_privacy_native_expectations_test.py \
            2>&1 | tee \
              "$TAIRA_EVIDENCE_ROOT/provenance/pre-capture-installer-tests.log"

          printf '%s\n' \
            'CARGO_BUILD_JOBS=1 RAYON_NUM_THREADS=4 RUST_MIN_STACK=8388608 cargo test --locked --release -p iroha_core --lib --features privacy-release-evidence privacy_engines::zk_x509::profile::readiness_certificates::tests::installed_soundness_pin_matches_the_current_compiled_profile -- --exact --nocapture --test-threads=1' \
            >"$TAIRA_EVIDENCE_ROOT/provenance/pre-capture-soundness-test-command.txt"
          CARGO_TARGET_DIR="$bootstrap_target" \
            CARGO_BUILD_JOBS=1 \
            RAYON_NUM_THREADS=4 \
            RUST_MIN_STACK=8388608 \
            cargo test \
              --locked \
              --release \
              -p iroha_core \
              --lib \
              --features privacy-release-evidence \
              privacy_engines::zk_x509::profile::readiness_certificates::tests::installed_soundness_pin_matches_the_current_compiled_profile \
              -- \
              --exact \
              --nocapture \
              --test-threads=1 \
            2>&1 | tee \
              "$TAIRA_EVIDENCE_ROOT/provenance/pre-capture-soundness-test.log"

          printf '%s\n' \
            'CARGO_BUILD_JOBS=1 RAYON_NUM_THREADS=4 RUST_MIN_STACK=8388608 cargo test --locked --release -p iroha_core --lib --features privacy-release-evidence privacy_release_evidence::zk_x509::release_kat_tests::positive_release_stage_is_the_sole_kat_producer -- --ignored --exact --nocapture --test-threads=1' \
            >"$TAIRA_EVIDENCE_ROOT/provenance/pre-capture-kat-test-command.txt"
          CARGO_TARGET_DIR="$bootstrap_target" \
            CARGO_BUILD_JOBS=1 \
            RAYON_NUM_THREADS=4 \
            RUST_MIN_STACK=8388608 \
            cargo test \
              --locked \
              --release \
              -p iroha_core \
              --lib \
              --features privacy-release-evidence \
              privacy_release_evidence::zk_x509::release_kat_tests::positive_release_stage_is_the_sole_kat_producer \
              -- \
              --ignored \
              --exact \
              --nocapture \
              --test-threads=1 \
            2>&1 | tee \
              "$TAIRA_EVIDENCE_ROOT/provenance/pre-capture-kat-test.log"

          test "$(
            python3 -I -S scripts/compute_workspace_source_manifest.py \
              --root "$GITHUB_WORKSPACE"
          )" = "$TAIRA_BOOTSTRAP_SOURCE_SHA256"
          printf '%s  %s\n' "$TAIRA_INPUT_LOCK_SHA256" Cargo.lock | sha256sum -c -
          echo "TAIRA_BOOTSTRAP_TARGET=$bootstrap_target" >>"$GITHUB_ENV"

      - name: Build and attest the zero-pin static capture runner
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          bootstrap_target="$TAIRA_BOOTSTRAP_TARGET"
          if [[ ! -d "$bootstrap_target" || -L "$bootstrap_target" ]]; then
            echo "bootstrap target is not an owned directory" >&2
            exit 1
          fi
          printf '%s\n' \
            'CARGO_BUILD_JOBS=1 cargo rustc --locked --release -p iroha_test_network --bin taira_privacy_release_runner --features privacy-release-evidence -- -C target-feature=+crt-static' \
            >"$TAIRA_EVIDENCE_ROOT/provenance/bootstrap-build-command.txt"
          CARGO_TARGET_DIR="$bootstrap_target" \
            CARGO_BUILD_JOBS=1 \
            cargo rustc \
              --locked \
              --release \
              -p iroha_test_network \
              --bin taira_privacy_release_runner \
              --features privacy-release-evidence \
              -- \
              -C target-feature=+crt-static \
            2>&1 | tee "$TAIRA_EVIDENCE_ROOT/provenance/bootstrap-build.log"
          bootstrap_runner="$bootstrap_target/release/taira_privacy_release_runner"
          if [[ ! -x "$bootstrap_runner" || -L "$bootstrap_runner" ]] \
            || [[ "$(stat -c '%h' "$bootstrap_runner")" != "1" ]]; then
            echo "bootstrap runner is not a singly linked executable regular file" >&2
            exit 1
          fi
          readelf --program-headers --wide "$bootstrap_runner" \
            >"$TAIRA_EVIDENCE_ROOT/provenance/bootstrap-runner.program-headers.txt"
          readelf --dynamic --wide "$bootstrap_runner" \
            >"$TAIRA_EVIDENCE_ROOT/provenance/bootstrap-runner.dynamic.txt"
          if grep -E '(^|[[:space:]])INTERP([[:space:]]|$)' \
            "$TAIRA_EVIDENCE_ROOT/provenance/bootstrap-runner.program-headers.txt"; then
            echo "bootstrap privacy runner contains PT_INTERP" >&2
            exit 1
          fi
          if grep -E '\(NEEDED\)' \
            "$TAIRA_EVIDENCE_ROOT/provenance/bootstrap-runner.dynamic.txt"; then
            echo "bootstrap privacy runner contains DT_NEEDED" >&2
            exit 1
          fi
          if grep -E \
            '(^|[[:space:]])(LOAD|GNU_STACK).*(RWE|R[[:space:]]+W[[:space:]]+E)' \
            "$TAIRA_EVIDENCE_ROOT/provenance/bootstrap-runner.program-headers.txt"; then
            echo "bootstrap privacy runner contains a writable executable segment" >&2
            exit 1
          fi
          install -m 0444 "$bootstrap_runner" \
            "$TAIRA_EVIDENCE_ROOT/provenance/bootstrap-runner.elf"
          cmp "$bootstrap_runner" \
            "$TAIRA_EVIDENCE_ROOT/provenance/bootstrap-runner.elf"
          bootstrap_runner_sha="$(
            sha256sum \
              "$TAIRA_EVIDENCE_ROOT/provenance/bootstrap-runner.elf" \
              | awk '{print $1}'
          )"
          if [[ ! "$bootstrap_runner_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "bootstrap runner SHA-256 is not canonical" >&2
            exit 1
          fi
          printf '%s  %s\n' \
            "$bootstrap_runner_sha" \
            provenance/bootstrap-runner.elf \
            >"$TAIRA_EVIDENCE_ROOT/provenance/bootstrap-runner.sha256"
          test "$(
            python3 -I -S scripts/compute_workspace_source_manifest.py \
              --root "$GITHUB_WORKSPACE"
          )" = "$TAIRA_BOOTSTRAP_SOURCE_SHA256"
          printf '%s  %s\n' "$TAIRA_INPUT_LOCK_SHA256" Cargo.lock | sha256sum -c -
          {
            echo "TAIRA_BOOTSTRAP_RUNNER=$bootstrap_runner"
            echo "TAIRA_BOOTSTRAP_RUNNER_SHA256=$bootstrap_runner_sha"
            echo "TAIRA_BOOTSTRAP_TARGET=$bootstrap_target"
          } >>"$GITHUB_ENV"

      - name: Capture, validate, hash, and install the native fixture set
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          capture_root="$(
            mktemp -d "${RUNNER_TEMP}/taira-privacy-expectations.XXXXXXXXXX"
          )"
          capture_root="$(cd "$capture_root" && pwd -P)"
          captured_norito="$capture_root/native_release_expectations_v1.norito"
          captured_json="$capture_root/native_release_expectations_v1.json"
          captured_resource_norito="$capture_root/zk_x509_native_resource_v1.norito"
          captured_resource_json="$capture_root/zk_x509_native_resource_v1.json"
          printf '%s\n' \
            'taira_privacy_release_runner capture-expectations --exact12-matrix fixtures/privacy/exact12_v1.tsv --expectations-norito-out <capture>/native_release_expectations_v1.norito --expectations-json-out <capture>/native_release_expectations_v1.json --x509-resource-host-metadata provenance/x509-resource-environment.json --x509-resource-norito-out <capture>/zk_x509_native_resource_v1.norito --x509-resource-json-out <capture>/zk_x509_native_resource_v1.json --elapsed-ceiling-ms <reviewed> --peak-rss-ceiling-bytes <reviewed> --address-space-ceiling-bytes <reviewed>' \
            >"$TAIRA_EVIDENCE_ROOT/provenance/capture-command.txt"
          "$TAIRA_BOOTSTRAP_RUNNER" capture-expectations \
            --exact12-matrix "$GITHUB_WORKSPACE/fixtures/privacy/exact12_v1.tsv" \
            --expectations-norito-out "$captured_norito" \
            --expectations-json-out "$captured_json" \
            --x509-resource-host-metadata "$TAIRA_X509_RESOURCE_ENVIRONMENT" \
            --x509-resource-norito-out "$captured_resource_norito" \
            --x509-resource-json-out "$captured_resource_json" \
            --elapsed-ceiling-ms "$TAIRA_INPUT_ELAPSED_CEILING_MS" \
            --peak-rss-ceiling-bytes "$TAIRA_INPUT_PEAK_RSS_CEILING_BYTES" \
            --address-space-ceiling-bytes "$TAIRA_INPUT_ADDRESS_SPACE_CEILING_BYTES" \
            2>&1 | tee "$TAIRA_EVIDENCE_ROOT/provenance/capture.log"
          for captured in \
            "$captured_norito" \
            "$captured_json" \
            "$captured_resource_norito" \
            "$captured_resource_json"; do
            if [[ ! -s "$captured" || -L "$captured" ]] \
              || [[ "$(stat -c '%h' "$captured")" != "1" ]]; then
              echo "capture did not emit one singly linked regular artifact: $captured" >&2
              exit 1
            fi
          done
          sha256sum \
            "$captured_norito" \
            "$captured_json" \
            "$captured_resource_norito" \
            "$captured_resource_json" \
            >"$TAIRA_EVIDENCE_ROOT/provenance/captured-native-fixtures.sha256"
          test "$(
            python3 -I -S scripts/compute_workspace_source_manifest.py \
              --root "$GITHUB_WORKSPACE"
          )" = "$TAIRA_BOOTSTRAP_SOURCE_SHA256"
          printf '%s  %s\n' "$TAIRA_INPUT_LOCK_SHA256" Cargo.lock | sha256sum -c -

          python3 -I -S scripts/install_taira_privacy_native_expectations.py \
            --repo "$GITHUB_WORKSPACE" \
            --native-verifier "$TAIRA_BOOTSTRAP_RUNNER" \
            --native-verifier-sha256 "$TAIRA_BOOTSTRAP_RUNNER_SHA256" \
            --exact12-matrix "$GITHUB_WORKSPACE/fixtures/privacy/exact12_v1.tsv" \
            --captured-norito "$captured_norito" \
            --captured-json "$captured_json" \
            --captured-x509-resource-norito "$captured_resource_norito" \
            --captured-x509-resource-json "$captured_resource_json" \
            --manifest-out \
              "$TAIRA_EVIDENCE_ROOT/provenance/expectation-installation.json" \
            --authenticated-iroha-source-commit "$TAIRA_INPUT_EXPECTED_COMMIT" \
            --authenticated-iroha-signer-principal \
              "$TAIRA_APPROVED_IROHA_SIGNER_PRINCIPAL" \
            --authenticated-iroha-signer-fingerprint \
              "$TAIRA_APPROVED_IROHA_SIGNER_FINGERPRINT" \
            --authenticated-iroha-allowed-signers-sha256 \
              "$TAIRA_IROHA_ALLOWED_SIGNERS_SHA256" \
            --authenticated-validator-source-commit \
              "$TAIRA_INPUT_VALIDATOR_RELEASE_REF" \
            --authenticated-validator-signer-principal \
              "$TAIRA_APPROVED_DPN_SIGNER_PRINCIPAL" \
            --authenticated-validator-signer-fingerprint \
              "$TAIRA_APPROVED_DPN_SIGNER_FINGERPRINT" \
            --authenticated-validator-allowed-signers-sha256 \
              "$TAIRA_DPN_ALLOWED_SIGNERS_SHA256" \
            --authenticated-validator-source-tree-sha256 \
              "$TAIRA_INPUT_SOURCE_TREE_SHA256" \
            --authenticated-bootstrap-source-tree-sha256 \
              "$TAIRA_BOOTSTRAP_SOURCE_SHA256" \
            --authenticated-cargo-lock-sha256 "$TAIRA_INPUT_LOCK_SHA256" \
            --authenticated-rust-toolchain-tree-sha256 \
              "$TAIRA_RUST_TOOLCHAIN_TREE_SHA256"
          cmp "$captured_norito" \
            fixtures/privacy/native_release_expectations_v1.norito
          cmp "$captured_json" \
            fixtures/privacy/native_release_expectations_v1.json
          cmp "$captured_resource_norito" \
            fixtures/privacy/zk_x509_native_resource_v1.norito
          cmp "$captured_resource_json" \
            fixtures/privacy/zk_x509_native_resource_v1.json

          final_source_sha="$(
            python3 -I -S scripts/compute_workspace_source_manifest.py \
              --root "$GITHUB_WORKSPACE" \
              --write-path-list \
                "$TAIRA_EVIDENCE_ROOT/provenance/workspace-source-paths-v1.bin"
          )"
          if [[ ! "$final_source_sha" =~ ^[0-9a-f]{64}$ ]] \
            || [[ "$final_source_sha" = "$TAIRA_BOOTSTRAP_SOURCE_SHA256" ]]; then
            echo "expectation installation did not establish a new source identity" >&2
            exit 1
          fi
          printf '%s\n' "$final_source_sha" \
            >"$TAIRA_EVIDENCE_ROOT/provenance/workspace-source-manifest.sha256"
          sha256sum fixtures/privacy/native_release_expectations_v1.norito \
            fixtures/privacy/native_release_expectations_v1.json \
            fixtures/privacy/zk_x509_native_resource_v1.norito \
            fixtures/privacy/zk_x509_native_resource_v1.json \
            >"$TAIRA_EVIDENCE_ROOT/provenance/installed-native-fixtures.sha256"
          install -m 0444 \
            crates/iroha_core/src/privacy_engines/zk_x509/profile.rs \
            "$TAIRA_EVIDENCE_ROOT/provenance/zk-x509-profile.after.rs"
          install -m 0444 \
            crates/iroha_core/src/privacy_engines/zk_x509/profile/readiness_certificates.rs \
            "$TAIRA_EVIDENCE_ROOT/provenance/zk-x509-readiness-certificates.after.rs"
          pins_patch="$TAIRA_EVIDENCE_ROOT/provenance/native-capture-pins.patch"
          if diff -u \
            --label zk-x509-profile.before.rs \
            --label zk-x509-profile.after.rs \
            "$TAIRA_EVIDENCE_ROOT/provenance/zk-x509-profile.before.rs" \
            "$TAIRA_EVIDENCE_ROOT/provenance/zk-x509-profile.after.rs" \
            >"$pins_patch"; then
            echo "expectation installation did not change the X509 profile" >&2
            exit 1
          else
            diff_status="$?"
            if [[ "$diff_status" != "1" ]]; then
              echo "cannot render the exact expectation-pin patch" >&2
              exit "$diff_status"
            fi
          fi
          if diff -u \
            --label zk-x509-readiness-certificates.before.rs \
            --label zk-x509-readiness-certificates.after.rs \
            "$TAIRA_EVIDENCE_ROOT/provenance/zk-x509-readiness-certificates.before.rs" \
            "$TAIRA_EVIDENCE_ROOT/provenance/zk-x509-readiness-certificates.after.rs" \
            >>"$pins_patch"; then
            echo "installation did not change the X509 resource certificate pins" >&2
            exit 1
          else
            diff_status="$?"
            if [[ "$diff_status" != "1" ]]; then
              echo "cannot render the exact resource-certificate pin patch" >&2
              exit "$diff_status"
            fi
          fi
          test -s "$pins_patch"
          printf '%s  %s\n' "$TAIRA_INPUT_LOCK_SHA256" Cargo.lock | sha256sum -c -
          echo "TAIRA_FINAL_SOURCE_SHA256=$final_source_sha" >>"$GITHUB_ENV"

      - name: Verify feature separation and build fresh final binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          final_target="$(
            mktemp -d "${RUNNER_TEMP}/taira-privacy-final-target.XXXXXXXXXX"
          )"
          final_target="$(cd "$final_target" && pwd -P)"
          validator_features="embedded-soracloud-runtime,zk-stark"
          CARGO_TARGET_DIR="$final_target" \
            cargo tree \
              --locked \
              -e features,no-dev \
              -p irohad \
              --features "$validator_features" \
              -i iroha_core \
            >"$TAIRA_EVIDENCE_ROOT/provenance/irohad-iroha-core-feature-tree.txt"
          if grep -F 'privacy-release-evidence' \
            "$TAIRA_EVIDENCE_ROOT/provenance/irohad-iroha-core-feature-tree.txt"; then
            echo "irohad feature graph contains privacy-release-evidence" >&2
            exit 1
          fi
          grep -F 'irohad feature "zk-stark"' \
            "$TAIRA_EVIDENCE_ROOT/provenance/irohad-iroha-core-feature-tree.txt"
          grep -F 'iroha_core feature "zk-stark"' \
            "$TAIRA_EVIDENCE_ROOT/provenance/irohad-iroha-core-feature-tree.txt"

          CARGO_TARGET_DIR="$final_target" \
            cargo tree \
              --locked \
              -e features,no-dev \
              -p iroha_test_network \
              --features privacy-release-evidence \
              -i iroha_core \
            >"$TAIRA_EVIDENCE_ROOT/provenance/runner-iroha-core-feature-tree.txt"
          grep -F 'iroha_test_network feature "privacy-release-evidence"' \
            "$TAIRA_EVIDENCE_ROOT/provenance/runner-iroha-core-feature-tree.txt"
          grep -F 'iroha_core feature "privacy-release-evidence"' \
            "$TAIRA_EVIDENCE_ROOT/provenance/runner-iroha-core-feature-tree.txt"

          printf '%s\n' \
            'CARGO_BUILD_JOBS=1 RAYON_NUM_THREADS=4 RUST_MIN_STACK=8388608 cargo test --locked --release -p iroha_core --lib --features privacy-release-evidence <post-install-x509-filter> -- --test-threads=1' \
            >"$TAIRA_EVIDENCE_ROOT/provenance/post-install-x509-test-command.txt"
          post_install_x509_filters=(
            privacy_engines::zk_x509::profile
            privacy_release_evidence::zk_x509::resource_certificate_tests
            privacy_profiles::tests::zk_x509_compiled_activation_is_complete_and_immutable
          )
          post_install_x509_log_index=0
          for post_install_x509_filter in "${post_install_x509_filters[@]}"; do
            post_install_x509_log_index=$((post_install_x509_log_index + 1))
            CARGO_TARGET_DIR="$final_target" \
              CARGO_BUILD_JOBS=1 \
              RAYON_NUM_THREADS=4 \
              RUST_MIN_STACK=8388608 \
              cargo test \
                --locked \
                --release \
                -p iroha_core \
                --lib \
                --features privacy-release-evidence \
                "$post_install_x509_filter" \
                -- \
                --test-threads=1 \
              2>&1 | tee \
                "$TAIRA_EVIDENCE_ROOT/provenance/post-install-x509-${post_install_x509_log_index}.log"
          done
          printf '%s\n' \
            'CARGO_BUILD_JOBS=1 RAYON_NUM_THREADS=4 RUST_MIN_STACK=8388608 cargo test --locked --release -p iroha_test_network --bin taira_privacy_release_runner --features privacy-release-evidence -- --test-threads=1' \
            >"$TAIRA_EVIDENCE_ROOT/provenance/post-install-runner-test-command.txt"
          CARGO_TARGET_DIR="$final_target" \
            CARGO_BUILD_JOBS=1 \
            RAYON_NUM_THREADS=4 \
            RUST_MIN_STACK=8388608 \
            cargo test \
              --locked \
              --release \
              -p iroha_test_network \
              --bin taira_privacy_release_runner \
              --features privacy-release-evidence \
              -- \
              --test-threads=1 \
            2>&1 | tee \
              "$TAIRA_EVIDENCE_ROOT/provenance/post-install-runner-tests.log"
          test "$(
            python3 -I -S scripts/compute_workspace_source_manifest.py \
              --root "$GITHUB_WORKSPACE"
          )" = "$TAIRA_FINAL_SOURCE_SHA256"
          printf '%s  %s\n' "$TAIRA_INPUT_LOCK_SHA256" Cargo.lock | sha256sum -c -

          printf '%s\n' \
            'CARGO_BUILD_JOBS=1 cargo build --locked --release -p irohad --bin irohad --features embedded-soracloud-runtime,zk-stark' \
            >"$TAIRA_EVIDENCE_ROOT/provenance/final-irohad-build-command.txt"
          CARGO_TARGET_DIR="$final_target" \
            CARGO_BUILD_JOBS=1 \
            cargo build \
              --locked \
              --release \
              -p irohad \
              --bin irohad \
              --features "$validator_features" \
            2>&1 | tee "$TAIRA_EVIDENCE_ROOT/provenance/final-irohad-build.log"
          printf '%s\n' \
            'CARGO_BUILD_JOBS=1 cargo rustc --locked --release -p iroha_test_network --bin taira_privacy_release_runner --features privacy-release-evidence -- -C target-feature=+crt-static' \
            >"$TAIRA_EVIDENCE_ROOT/provenance/final-runner-build-command.txt"
          CARGO_TARGET_DIR="$final_target" \
            CARGO_BUILD_JOBS=1 \
            cargo rustc \
              --locked \
              --release \
              -p iroha_test_network \
              --bin taira_privacy_release_runner \
              --features privacy-release-evidence \
              -- \
              -C target-feature=+crt-static \
            2>&1 | tee "$TAIRA_EVIDENCE_ROOT/provenance/final-runner-build.log"

          final_runner="$final_target/release/taira_privacy_release_runner"
          final_irohad="$final_target/release/irohad"
          for binary in "$final_runner" "$final_irohad"; do
            if [[ ! -x "$binary" || -L "$binary" ]] \
              || [[ "$(stat -c '%h' "$binary")" != "1" ]]; then
              echo "final binary is not a singly linked executable regular file: $binary" >&2
              exit 1
            fi
          done
          readelf --program-headers --wide "$final_runner" \
            >"$TAIRA_EVIDENCE_ROOT/provenance/final-runner.program-headers.txt"
          readelf --dynamic --wide "$final_runner" \
            >"$TAIRA_EVIDENCE_ROOT/provenance/final-runner.dynamic.txt"
          if grep -E '(^|[[:space:]])INTERP([[:space:]]|$)' \
            "$TAIRA_EVIDENCE_ROOT/provenance/final-runner.program-headers.txt"; then
            echo "final privacy runner contains PT_INTERP" >&2
            exit 1
          fi
          if grep -E '\(NEEDED\)' \
            "$TAIRA_EVIDENCE_ROOT/provenance/final-runner.dynamic.txt"; then
            echo "final privacy runner contains DT_NEEDED" >&2
            exit 1
          fi
          if grep -E \
            '(^|[[:space:]])(LOAD|GNU_STACK).*(RWE|R[[:space:]]+W[[:space:]]+E)' \
            "$TAIRA_EVIDENCE_ROOT/provenance/final-runner.program-headers.txt"; then
            echo "final privacy runner contains a writable executable segment" >&2
            exit 1
          fi
          test "$(
            python3 -I -S scripts/compute_workspace_source_manifest.py \
              --root "$GITHUB_WORKSPACE"
          )" = "$TAIRA_FINAL_SOURCE_SHA256"
          printf '%s  %s\n' "$TAIRA_INPUT_LOCK_SHA256" Cargo.lock | sha256sum -c -
          final_toolchain_sha="$(
            python3 -I -S \
              "$TAIRA_DPN_RELEASE_ROOT/authentication/hash_taira_rust_toolchain.py" \
              --sysroot "$TAIRA_AUTHENTICATED_RUST_SYSROOT" \
              --manifest-out \
                "$TAIRA_EVIDENCE_ROOT/provenance/rust-toolchain-tree-after-builds-v1.json"
          )"
          test "$final_toolchain_sha" = "$TAIRA_RUST_TOOLCHAIN_TREE_SHA256"
          {
            echo "TAIRA_FINAL_IROHAD=$final_irohad"
            echo "TAIRA_FINAL_RUNNER=$final_runner"
            echo "TAIRA_FINAL_TARGET=$final_target"
          } >>"$GITHUB_ENV"

      - name: Generate, verify, and independently reverify the final bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          native_dir="$TAIRA_EVIDENCE_ROOT/provenance/privacy-native"
          command_norito="$native_dir/command-manifest-v1.norito"
          command_json="$native_dir/command-manifest-v1.json"
          stages_norito="$native_dir/stage-artifacts-v1.norito"
          stages_json="$native_dir/stage-artifacts-v1.json"
          receipt_norito="$native_dir/receipt-v1.norito"
          receipt_json="$native_dir/receipt-v1.json"
          common_args=(
            --build-profile release
            --source-sha256 "$TAIRA_FINAL_SOURCE_SHA256"
            --exact12-matrix "$GITHUB_WORKSPACE/fixtures/privacy/exact12_v1.tsv"
            --expectations-norito \
              "$GITHUB_WORKSPACE/fixtures/privacy/native_release_expectations_v1.norito"
            --expectations-json \
              "$GITHUB_WORKSPACE/fixtures/privacy/native_release_expectations_v1.json"
            --x509-resource-norito \
              "$GITHUB_WORKSPACE/fixtures/privacy/zk_x509_native_resource_v1.norito"
            --x509-resource-json \
              "$GITHUB_WORKSPACE/fixtures/privacy/zk_x509_native_resource_v1.json"
            --cargo-lock "$GITHUB_WORKSPACE/Cargo.lock"
            --validator-binary "$TAIRA_FINAL_IROHAD"
          )
          "$TAIRA_FINAL_RUNNER" generate \
            "${common_args[@]}" \
            --command-manifest-norito-out "$command_norito" \
            --command-manifest-json-out "$command_json" \
            --stage-artifacts-norito-out "$stages_norito" \
            --stage-artifacts-json-out "$stages_json" \
            --receipt-norito-out "$receipt_norito" \
            --receipt-json-out "$receipt_json" \
            2>&1 | tee "$TAIRA_EVIDENCE_ROOT/provenance/generate.log"
          for output in \
            "$command_norito" \
            "$command_json" \
            "$stages_norito" \
            "$stages_json" \
            "$receipt_norito" \
            "$receipt_json"; do
            if [[ ! -s "$output" || -L "$output" ]] \
              || [[ "$(stat -c '%h' "$output")" != "1" ]]; then
              echo "runner did not emit one singly linked regular artifact: $output" >&2
              exit 1
            fi
          done
          "$TAIRA_FINAL_RUNNER" verify \
            "${common_args[@]}" \
            --command-manifest-norito "$command_norito" \
            --command-manifest-json "$command_json" \
            --stage-artifacts-norito "$stages_norito" \
            --stage-artifacts-json "$stages_json" \
            --receipt-norito "$receipt_norito" \
            --receipt-json "$receipt_json" \
            2>&1 | tee "$TAIRA_EVIDENCE_ROOT/provenance/verify.log"
          test "$(
            python3 -I -S scripts/compute_workspace_source_manifest.py \
              --root "$GITHUB_WORKSPACE"
          )" = "$TAIRA_FINAL_SOURCE_SHA256"
          printf '%s  %s\n' "$TAIRA_INPUT_LOCK_SHA256" Cargo.lock | sha256sum -c -

          install -m 0555 "$TAIRA_FINAL_RUNNER" \
            "$TAIRA_EVIDENCE_ROOT/bin/taira_privacy_release_runner"
          install -m 0555 "$TAIRA_FINAL_IROHAD" \
            "$TAIRA_EVIDENCE_ROOT/bin/irohad"
          install -m 0444 Cargo.lock \
            "$TAIRA_EVIDENCE_ROOT/provenance/Cargo.lock"
          install -m 0444 fixtures/privacy/exact12_v1.tsv \
            "$native_dir/exact12-v1.tsv"
          install -m 0444 \
            fixtures/privacy/native_release_expectations_v1.norito \
            "$native_dir/expectations-v1.norito"
          install -m 0444 \
            fixtures/privacy/native_release_expectations_v1.json \
            "$native_dir/expectations-v1.json"
          install -m 0444 \
            fixtures/privacy/zk_x509_native_resource_v1.norito \
            "$native_dir/zk-x509-resource-v1.norito"
          install -m 0444 \
            fixtures/privacy/zk_x509_native_resource_v1.json \
            "$native_dir/zk-x509-resource-v1.json"

          bundled_common_args=(
            --build-profile release
            --source-sha256 "$TAIRA_FINAL_SOURCE_SHA256"
            --exact12-matrix "$native_dir/exact12-v1.tsv"
            --expectations-norito "$native_dir/expectations-v1.norito"
            --expectations-json "$native_dir/expectations-v1.json"
            --x509-resource-norito "$native_dir/zk-x509-resource-v1.norito"
            --x509-resource-json "$native_dir/zk-x509-resource-v1.json"
            --cargo-lock "$TAIRA_EVIDENCE_ROOT/provenance/Cargo.lock"
            --validator-binary "$TAIRA_EVIDENCE_ROOT/bin/irohad"
          )
          "$TAIRA_EVIDENCE_ROOT/bin/taira_privacy_release_runner" verify \
            "${bundled_common_args[@]}" \
            --command-manifest-norito "$command_norito" \
            --command-manifest-json "$command_json" \
            --stage-artifacts-norito "$stages_norito" \
            --stage-artifacts-json "$stages_json" \
            --receipt-norito "$receipt_norito" \
            --receipt-json "$receipt_json" \
            2>&1 | tee "$TAIRA_EVIDENCE_ROOT/provenance/bundled-verify.log"
          test "$(
            python3 -I -S scripts/compute_workspace_source_manifest.py \
              --root "$GITHUB_WORKSPACE"
          )" = "$TAIRA_FINAL_SOURCE_SHA256"
          printf '%s  %s\n' "$TAIRA_INPUT_LOCK_SHA256" Cargo.lock | sha256sum -c -

      - name: Package complete provenance
        id: package
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -Eeuo pipefail
          umask 077
          for component in \
            provenance.json \
            tracked.patch \
            untracked.tar \
            untracked.manifest.json \
            source.manifest.json; do
            install -m 0444 \
              "$TAIRA_DPN_SOURCE_BUNDLE/$component" \
              "$TAIRA_EVIDENCE_ROOT/provenance/source-bundle/$component"
          done
          install -m 0444 "$TAIRA_DPN_RELEASE_ROOT/iroha_source_bundle.py" \
            "$TAIRA_EVIDENCE_ROOT/provenance/source-bundle/iroha_source_bundle.py"
          install -m 0444 "$TAIRA_DPN_RELEASE_ROOT/Cargo.lock" \
            "$TAIRA_EVIDENCE_ROOT/provenance/source-bundle/Cargo.lock"
          for origin_evidence in \
            iroha-signer.pub \
            iroha-allowed-signers \
            iroha-commit.raw \
            iroha-signature-metadata.bin \
            iroha-verify-commit.log \
            dpn-signer.pub \
            dpn-allowed-signers \
            dpn-commit.raw \
            dpn-signature-metadata.bin \
            dpn-verify-commit.log \
            ssh-revocation \
            hash_taira_rust_toolchain.py \
            source-authentication.json; do
            install -m 0444 \
              "$TAIRA_DPN_RELEASE_ROOT/authentication/$origin_evidence" \
              "$TAIRA_EVIDENCE_ROOT/provenance/authenticated-origins/$origin_evidence"
          done

          python3 -I -S - "$TAIRA_EVIDENCE_ROOT" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])

          def digest(path: Path) -> str:
              hasher = hashlib.sha256()
              with path.open("rb") as source:
                  while chunk := source.read(1024 * 1024):
                      hasher.update(chunk)
              return hasher.hexdigest()

          def required_sha(name: str) -> str:
              value = os.environ[name]
              if (
                  re.fullmatch(r"[0-9a-f]{64}", value) is None
                  or value == "0" * 64
              ):
                  raise SystemExit(f"{name} is not a canonical SHA-256")
              return value

          def write_create_new(path: Path, encoded: bytes) -> None:
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(path, flags, 0o600)
              try:
                  with os.fdopen(descriptor, "wb") as stream:
                      stream.write(encoded)
                      stream.flush()
                      os.fsync(stream.fileno())
              except BaseException:
                  path.unlink(missing_ok=True)
                  raise

          authentication_path = (
              root
              / "provenance/authenticated-origins/source-authentication.json"
          )
          with authentication_path.open(encoding="utf-8") as stream:
              authenticated_origins = json.load(stream)
          iroha_origin = authenticated_origins["iroha_source"]
          validator_origin = authenticated_origins["validator_source"]
          if (
              authenticated_origins.get("schema")
              != "iroha.taira.privacy-native-source-authentication.v1"
              or iroha_origin.get("commit")
              != os.environ["TAIRA_INPUT_EXPECTED_COMMIT"]
              or iroha_origin.get("signer_principal")
              != os.environ["TAIRA_APPROVED_IROHA_SIGNER_PRINCIPAL"]
              or iroha_origin.get("signer_fingerprint")
              != os.environ["TAIRA_APPROVED_IROHA_SIGNER_FINGERPRINT"]
              or iroha_origin.get("allowed_signers_sha256")
              != digest(
                  root
                  / "provenance/authenticated-origins/iroha-allowed-signers"
              )
              or validator_origin.get("commit")
              != os.environ["TAIRA_INPUT_VALIDATOR_RELEASE_REF"]
              or validator_origin.get("signer_principal")
              != os.environ["TAIRA_APPROVED_DPN_SIGNER_PRINCIPAL"]
              or validator_origin.get("signer_fingerprint")
              != os.environ["TAIRA_APPROVED_DPN_SIGNER_FINGERPRINT"]
              or validator_origin.get("allowed_signers_sha256")
              != digest(
                  root / "provenance/authenticated-origins/dpn-allowed-signers"
              )
              or validator_origin.get("source_tree_sha256")
              != os.environ["TAIRA_INPUT_SOURCE_TREE_SHA256"]
          ):
              raise SystemExit("authenticated source origins diverged before packaging")
          installation_path = root / "provenance/expectation-installation.json"
          with installation_path.open(encoding="utf-8") as stream:
              installation = json.load(stream)
          installed_origins = installation.get("authenticated_origins")
          expected_installed_iroha = {
              key: iroha_origin[key]
              for key in (
                  "allowed_signers_sha256",
                  "commit",
                  "signature_format",
                  "signer_fingerprint",
                  "signer_principal",
              )
          }
          expected_installed_validator = {
              key: validator_origin[key]
              for key in (
                  "allowed_signers_sha256",
                  "commit",
                  "signature_format",
                  "signer_fingerprint",
                  "signer_principal",
                  "source_tree_sha256",
              )
          }
          if (
              not isinstance(installed_origins, dict)
              or installed_origins.get("iroha_source")
              != expected_installed_iroha
              or installed_origins.get("validator_source")
              != expected_installed_validator
              or installed_origins.get("build_inputs")
              != {
                  "bootstrap_source_tree_sha256": os.environ[
                      "TAIRA_BOOTSTRAP_SOURCE_SHA256"
                  ],
                  "cargo_lock_sha256": os.environ["TAIRA_INPUT_LOCK_SHA256"],
              }
              or installed_origins.get("rust_toolchain", {}).get("tree_sha256")
              != os.environ["TAIRA_RUST_TOOLCHAIN_TREE_SHA256"]
          ):
              raise SystemExit(
                  "expectation installation diverged from authenticated origins"
              )

          invocation = {
              "schema": "iroha.taira.privacy-native-evidence-invocation.v1",
              "authenticated_source_origins": authenticated_origins,
              "repository": os.environ["REPOSITORY"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_commit": os.environ["TAIRA_INPUT_EXPECTED_COMMIT"],
              "dpn_validator_release_ref": os.environ[
                  "TAIRA_INPUT_VALIDATOR_RELEASE_REF"
              ],
              "dpn_source_tree_sha256": required_sha(
                  "TAIRA_INPUT_SOURCE_TREE_SHA256"
              ),
              "cargo_lock_sha256": required_sha("TAIRA_INPUT_LOCK_SHA256"),
              "exact12_sha256": required_sha("TAIRA_INPUT_EXACT12_SHA256"),
              "rust_toolchain_tree_sha256": required_sha(
                  "TAIRA_RUST_TOOLCHAIN_TREE_SHA256"
              ),
              "rust_toolchain_manifest_sha256": digest(
                  root / "provenance/rust-toolchain-tree-v1.json"
              ),
              "rust_toolchain_after_builds_manifest_sha256": digest(
                  root / "provenance/rust-toolchain-tree-after-builds-v1.json"
              ),
              "expectation_installation_manifest_sha256": digest(
                  installation_path
              ),
              "workspace_source_manifest_before_expectations_sha256": required_sha(
                  "TAIRA_BOOTSTRAP_SOURCE_SHA256"
              ),
              "workspace_source_manifest_final_sha256": required_sha(
                  "TAIRA_FINAL_SOURCE_SHA256"
              ),
              "generic_capture_ceilings": {
                  "elapsed_millis": os.environ["TAIRA_INPUT_ELAPSED_CEILING_MS"],
                  "peak_rss_bytes": os.environ[
                      "TAIRA_INPUT_PEAK_RSS_CEILING_BYTES"
                  ],
                  "address_space_bytes": os.environ[
                      "TAIRA_INPUT_ADDRESS_SPACE_CEILING_BYTES"
                  ],
              },
              "expectations_norito_sha256": digest(
                  root / "provenance/privacy-native/expectations-v1.norito"
              ),
              "expectations_json_sha256": digest(
                  root / "provenance/privacy-native/expectations-v1.json"
              ),
              "x509_resource_norito_sha256": digest(
                  root / "provenance/privacy-native/zk-x509-resource-v1.norito"
              ),
              "x509_resource_json_sha256": digest(
                  root / "provenance/privacy-native/zk-x509-resource-v1.json"
              ),
              "bootstrap_runner_sha256": digest(
                  root / "provenance/bootstrap-runner.elf"
              ),
              "runner_sha256": digest(
                  root / "bin/taira_privacy_release_runner"
              ),
              "irohad_sha256": digest(root / "bin/irohad"),
              "generate_passed": True,
              "verify_passed": True,
              "bundled_verify_passed": True,
              "published": False,
              "deployed": False,
          }
          write_create_new(
              root / "provenance/invocation.json",
              (
                  json.dumps(invocation, indent=2, sort_keys=True) + "\n"
              ).encode("utf-8"),
          )

          links = [path for path in root.rglob("*") if path.is_symlink()]
          if links:
              raise SystemExit(
                  "provenance contains forbidden symlinks: "
                  + ", ".join(str(path) for path in links)
              )
          files = sorted(
              path
              for path in root.rglob("*")
              if path.is_file() and path.name != "SHA256SUMS"
          )
          if not files:
              raise SystemExit("native privacy provenance is empty")
          for path in files:
              metadata = path.stat()
              if metadata.st_nlink != 1:
                  raise SystemExit(
                      f"provenance file is multiply linked: {path}"
                  )
          checksum_path = root / "provenance/SHA256SUMS"
          write_create_new(
              checksum_path,
              "".join(
                  f"{digest(path)}  {path.relative_to(root).as_posix()}\n"
                  for path in files
              ).encode("utf-8"),
          )
          PY

          (
            cd "$TAIRA_EVIDENCE_ROOT"
            sha256sum -c provenance/SHA256SUMS
          )
          bundle_base="taira-privacy-native-${TAIRA_INPUT_EXPECTED_COMMIT}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive_root="$(
            mktemp -d "${RUNNER_TEMP}/taira-privacy-native-archive.XXXXXXXXXX"
          )"
          archive_root="$(cd "$archive_root" && pwd -P)"
          bundle="$archive_root/${bundle_base}.tar.gz"
          checksum="${bundle}.sha256"
          if [[ -e "$bundle" || -L "$bundle" \
            || -e "$checksum" || -L "$checksum" ]]; then
            echo "native evidence archive output already exists" >&2
            exit 1
          fi
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C "$TAIRA_EVIDENCE_ROOT" \
            -czf "$bundle" \
            .
          python3 -I -S scripts/audit_taira_privacy_native_archive.py \
            --archive "$bundle" \
            --staged-root "$TAIRA_EVIDENCE_ROOT"
          bundle_sha="$(sha256sum "$bundle" | awk '{print $1}')"
          printf '%s  %s\n' "$bundle_sha" "$(basename "$bundle")" >"$checksum"
          echo "bundle=$bundle" >>"$GITHUB_OUTPUT"
          echo "checksum=$checksum" >>"$GITHUB_OUTPUT"

      - name: Upload the non-publishing native evidence archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taira-privacy-native-${{ inputs.expected_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.bundle }}
            ${{ steps.package.outputs.checksum }}
          compression-level: 0
          if-no-files-found: error
