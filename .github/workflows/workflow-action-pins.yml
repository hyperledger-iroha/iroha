name: Workflow action pin policy

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/check_workflow_action_pins.py"
      - "scripts/tests/check_sorafs_fixture_workflow_contract_test.py"
      - "scripts/tests/check_workflow_action_pins_test.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/check_workflow_action_pins.py"
      - "scripts/tests/check_sorafs_fixture_workflow_contract_test.py"
      - "scripts/tests/check_workflow_action_pins_test.py"

permissions:
  contents: read

jobs:
  action-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned workflow-test dependency
        run: python3 -m pip install --disable-pip-version-check pytest==9.0.3
      - name: Exercise the fail-closed checker
        run: python3 scripts/tests/check_workflow_action_pins_test.py
      - name: Enforce immutable action references
        run: python3 scripts/check_workflow_action_pins.py
      - name: Enforce SoraFS fixture and SDK workflow routing
        run: >-
          python3 -m pytest -q
          scripts/tests/check_sorafs_fixture_workflow_contract_test.py
