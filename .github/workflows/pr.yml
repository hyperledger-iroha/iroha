name: Pull Request CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/workflows/publish*"
      - ".github/workflows/ci_image.yml"
      - "Dockerfile*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TEST_NETWORK_TMP_DIR: /tmp
  NEXTEST_PROFILE: ci

jobs:
  pre_build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # Norito's build-time bindings guard compares against origin/main.
          fetch-depth: 0
      - uses: ./.github/actions/setup-native-ci
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
      - name: Build native release binaries
        run: |
          cargo build --locked --release -p irohad -p iroha_cli -p iroha_kagami --bin iroha3d --bin iroha --bin kagami
          mkdir -p target/release/pre_build
          install target/release/iroha3d target/release/iroha target/release/kagami target/release/pre_build/
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: bins
          path: target/release/pre_build
          retention-days: 1
          if-no-files-found: error

  consistency:
    runs-on: ubuntu-24.04
    needs: pre_build
    steps:
      - uses: actions/checkout@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: bins
          path: bins
      - name: Check
        env:
          BIN_KAGAMI: bins/kagami
          BIN_IROHA: bins/iroha
        run: |
          chmod +x bins/*
          ./scripts/tests/consistency.sh all

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: "false"
          components: rustfmt
      - name: Format native workspace
        run: cargo fmt --all -- --check

  norito_rpc_verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-native-ci
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
      - name: Norito-RPC fixture parity
        run: cargo run --locked -p xtask --bin xtask -- norito-rpc-verify

  android_fixture_compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Android fixture compatibility
        working-directory: java/iroha_android
        run: |
          chmod +x ./gradlew
          ./gradlew :core:test --tests org.hyperledger.iroha.android.tx.TransactionFixtureManifestTests

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-native-ci
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
      - name: Clippy (workspace, all targets and features)
        run: |
          set -o pipefail
          cargo clippy --locked --workspace --all-targets --all-features --message-format=json -- -D warnings | tee clippy.json
      - name: Upload clippy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-clippy
          path: clippy.json
          if-no-files-found: error

  doc:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-native-ci
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
      - name: Documentation (workspace, all features)
        run: cargo doc --locked --workspace --no-deps --quiet --all-features

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    needs: pre_build
    env:
      TEST_NETWORK_BIN_IROHAD: ${{ github.workspace }}/bins/iroha3d
      TEST_NETWORK_BIN_IROHA: ${{ github.workspace }}/bins/iroha
      KAGAMI_BIN: ${{ github.workspace }}/bins/kagami
      IROHA_TEST_SKIP_BUILD: "1"
      IROHA_FAIL_ON_SANDBOX_SKIP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Branch and doctest coverage require nightly; other Rust jobs use the
      # repository's rust-toolchain.toml. Keep this coverage toolchain explicit.
      - uses: ./.github/actions/setup-native-ci
        with:
          toolchain: nightly-2026-10-23
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: bins
          path: bins
      - name: Make binaries executable
        run: chmod +x bins/*
      - name: Test full native workspace and network suites
        id: test
        run: >-
          cargo +nightly-2026-10-23 llvm-cov nextest
          --workspace --locked --branch --no-report
      - name: Test documentation
        id: test-doc
        run: >-
          cargo +nightly-2026-10-23 llvm-cov --workspace --locked --doc
          --branch --no-report
      - name: Generate lcov report
        run: cargo +nightly-2026-10-23 llvm-cov report --doctests --branch --ignore-filename-regex 'iroha_cli|iroha_torii' --lcov --output-path lcov.info
      - name: Upload lcov report
        uses: actions/upload-artifact@v4
        with:
          name: report-coverage
          path: lcov.info
          if-no-files-found: error
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2.3.6
        with:
          file: lcov.info
          format: lcov
          github-token: ${{ github.token }}
      - name: Upload test network artifacts
        if: failure() && (steps.test.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: test_network_runs
          path: ${{ env.TEST_NETWORK_TMP_DIR }}/irohad_test_network_*
          retention-days: 3

  pytests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python SDK and script test dependencies
        run: python -m pip install pytest pyyaml requests -r scripts/requirements.txt './python/norito_py[compression]'
      # The old Poetry suite directories retain fixture modules only. Exercise
      # the actual codec, HTTP-client and script tests; real-peer coverage is
      # retained in the full Rust workspace and the two network proof jobs.
      - name: Python Norito codec tests
        run: python -m pytest -q python/norito_py/tests
      - name: Python Torii client tests
        run: python -m pytest -q python/iroha_torii_client/tests
      - name: CI and script regressions
        run: python -m pytest -q pytests/scripts

  check_title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check conventional commits
        uses: amannn/action-semantic-pull-request@v5
        id: lint_pr_title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          validateSingleCommit: true
          validateSingleCommitMatchesPrTitle: true

      - name: Post error comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: always() && (steps.lint_pr_title.outputs.error_message != null)
        with:
          header: pr-title-lint-error
          message: |
            Hey there and thank you for opening this pull request! 👋🏼

            We require pull request titles to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/), and it looks like your proposed title needs to be adjusted.

            Details:

            ```
            ${{ steps.lint_pr_title.outputs.error_message }}
            ```

      # Delete a previous comment when the issue has been resolved
      - name: Delete error comment
        if: ${{ steps.lint_pr_title.outputs.error_message == null }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-title-lint-error
          delete: true

  check_links:
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Restore lychee cache
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.ref_name }}
          restore-keys: cache-lychee-
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--cache --max-cache-age 1d '**/*.rs' ."
          token: ${{ secrets.CUSTOM_TOKEN }}
          # We want to have a report, but it is not a hard error
          fail: false

  ivm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-native-ci
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
      - name: Native IVM release tests
        run: cargo test --locked -p ivm --release --tests --no-fail-fast

  sumeragi_formal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Apalache
        run: bash scripts/formal/install_apalache.sh 0.52.2
      - name: Sumeragi formal model checks (fast + deep)
        run: bash ci/check_sumeragi_formal.sh

  docs_i18n_metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit translated documentation metadata
        run: python3 ci/check_docs_i18n_metadata.py --paths docs/formal --json-out target/docs-i18n/formal-metadata.json
      - name: Upload formal docs metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-docs-i18n-metadata
          path: target/docs-i18n/formal-metadata.json
          if-no-files-found: ignore

  nexus_cross_dataspace_localnet:
    runs-on: ubuntu-24.04
    needs: pre_build
    env:
      TEST_NETWORK_BIN_IROHAD: ${{ github.workspace }}/bins/iroha3d
      TEST_NETWORK_BIN_IROHA: ${{ github.workspace }}/bins/iroha
      KAGAMI_BIN: ${{ github.workspace }}/bins/kagami
      IROHA_TEST_SKIP_BUILD: "1"
      IROHA_FAIL_ON_SANDBOX_SKIP: "1"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-native-ci
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          name: bins
          path: bins
      - name: Make native binaries executable
        run: chmod +x bins/*
      - name: SORA Nexus proof across data spaces
        run: bash ci/check_nexus_cross_dataspace_localnet.sh

  nexus_cross_lane_proofs:
    runs-on: ubuntu-24.04
    needs: pre_build
    env:
      TEST_NETWORK_BIN_IROHAD: ${{ github.workspace }}/bins/iroha3d
      TEST_NETWORK_BIN_IROHA: ${{ github.workspace }}/bins/iroha
      KAGAMI_BIN: ${{ github.workspace }}/bins/kagami
      IROHA_TEST_SKIP_BUILD: "1"
      IROHA_FAIL_ON_SANDBOX_SKIP: "1"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-native-ci
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          name: bins
          path: bins
      - name: Make native binaries executable
        run: chmod +x bins/*
      - name: SORA Nexus cross-lane proof filters
        run: bash ci/check_nexus_cross_lane_proofs.sh
