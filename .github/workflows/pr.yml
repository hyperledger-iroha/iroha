name: Pull Request CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/workflows/publish*"
      - ".github/workflows/ci_image.yml"
      - "Dockerfile*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IROHA_CLI_DIR: "/__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}/test"
  TEST_NETWORK_TMP_DIR: /tmp
  NEXTEST_PROFILE: ci

jobs:
  pre_build:
    runs-on: ubuntu-latest
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
      - name: Build binaries (iroha3d, iroha, kagami, koto) (release)
        run: |
          cargo build --locked --release --bin iroha3d --bin iroha --bin kagami
          cargo build --locked --release -p ivm --bin koto
          mkdir target/release/pre_build
          mv target/release/iroha3d target/release/iroha target/release/kagami target/release/koto target/release/pre_build
      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bins
          path: target/release/pre_build
          retention-days: 1

  consistency:
    runs-on: ubuntu-latest
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    needs: pre_build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bins
          path: bins
      - name: Check
        env:
          BIN_KAGAMI: bins/kagami
          BIN_IROHA: bins/iroha
        run: |
          chmod +x -R bins
          ./scripts/tests/consistency.sh all

  kotodama_docs:
    runs-on: ubuntu-latest
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    needs: pre_build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Download canonical koto driver
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bins
          path: bins
      - name: Make koto executable
        run: chmod +x bins/koto
      - name: Install pytest
        run: python3 -m pip install --disable-pip-version-check pytest==9.0.3
      - name: Unit-test Kotodama documentation checker
        run: python3 -m pytest -q pytests/scripts/check_kotodama_docs_test.py
      - name: Verify sealed Kotodama compiler test sources
        run: |
          python3 -m pytest -q pytests/scripts/kotodama_fixture_manifest_test.py
          python3 scripts/check_kotodama_test_sources.py
      - name: Verify workspace release-workflow semantics
        run: python3 -m pytest -q pytests/scripts/workspace_release_gate_test.py
      - name: Compile canonical Kotodama documentation fences
        run: python3 scripts/check_kotodama_docs.py --koto bins/koto

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          cache: "false"
          toolchain: "nightly-2025-05-08"
          components: "rustfmt"
      - name: Format
        run: cargo fmt --all -- --check

  norito_rpc_verify:
    runs-on: ubuntu-latest
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
      - name: Norito-RPC fixture parity
        run: cargo run --locked -p xtask --features dev-tools --bin xtask -- norito-rpc-verify

  numeric_v1_architecture_parity:
    name: Numeric V1 parity (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-14
          - windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
          shared-key: numeric-v1-${{ matrix.runner }}
      - name: Verify canonical numeric fixtures and consensus behavior
        run: |
          cargo test --locked -p ivm --test ivm_group_06 numeric_
          cargo test --locked -p ivm --test ivm_group_01 abi_hash_versions::
          cargo test --locked -p ivm --test ivm_group_03 gas_schedule_hash
          cargo run --locked -p ivm --features dev-tools --bin gen_abi_hash_doc -- --check
          cargo test --locked -p ivm --test ivm_group_05 kotodama_checked_arithmetic::
          cargo test --locked -p iroha_primitives randomized_decimal_arithmetic_matches_independent_rational_reference

  android_fixture_compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Android fixture compatibility
        working-directory: java/iroha_android
        run: |
          chmod +x ./gradlew
          ./gradlew :core:test \
            --tests org.hyperledger.iroha.android.tx.TransactionFixtureManifestTests \
            --tests org.hyperledger.iroha.android.tx.TransactionPayloadFixtureTests

  rust_changes:
    name: Classify affected Rust lanes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_rust: ${{ steps.classify.outputs.has_rust }}
      full: ${{ steps.classify.outputs.full }}
      matrix: ${{ steps.classify.outputs.matrix }}
      package_count: ${{ steps.classify.outputs.package_count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          cache: "false"
          toolchain: 1.93.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned router-test dependency
        run: python3 -m pip install --disable-pip-version-check pytest==9.0.3
      - name: Verify exhaustive Rust lane ownership
        run: |
          python3 -I -S scripts/check_build_efficiency_provenance.py
          python3 scripts/rust_ci.py validate
          python3 -m pytest -q pytests/scripts/rust_ci_test.py
          python3 -m pytest -q \
            pytests/scripts/check_cargo_feature_hygiene_test.py \
            pytests/scripts/check_workspace_target_inventory_test.py \
            scripts/tests/cargo_fast_test.py \
            scripts/tests/profile_build_test.py \
            scripts/tests/profile_cargo_build_test.py \
            scripts/tests/check_musubi_fixture_owner_test.py \
            scripts/tests/check_compile_time_table_assets_test.py \
            scripts/tests/check_build_efficiency_provenance_test.py \
            scripts/tests/check_jni_sdk_android_pairs_test.py \
            scripts/tests/check_dependency_budget_test.py \
            scripts/tests/check_source_file_budget_test.py \
            scripts/tests/check_compile_unit_budget_test.py \
            scripts/tests/check_generated_artifacts_test.py \
            scripts/tests/check_nexus_provisioning_templates_test.py \
            pytests/scripts/iso_xsd_fixture_verify_test.py \
            pytests/scripts/iso_xsd_profile_catalog_include_test.py
          python3 scripts/check_cargo_feature_hygiene.py
          python3 scripts/check_workspace_target_inventory.py
          python3 scripts/check_compile_time_table_assets.py
          python3 -I -S scripts/check_jni_sdk_android_pairs.py
          python3 scripts/check_dependency_budget.py
          python3 scripts/check_source_file_budget.py --require-objective
          python3 -I -S scripts/check_telemetry_metric_catalog_v2.py
          python3 -I -S scripts/check_telemetry_metric_catalog_v2.py --self-test
          python3 -m unittest \
            scripts.tests.connect_gating_fixture_compaction_source_test \
            scripts.tests.developer_executable_retirement_source_test \
            scripts.tests.halo2_backend_02_compaction_source_test \
            scripts.tests.halo2_backend_shared_circuit_source_test \
            scripts.tests.integration_target_consolidation_source_test \
            scripts.tests.isi_instruction_box_macro_source_test \
            scripts.tests.ivm_vector_metal_compaction_source_test \
            scripts.tests.kotodama_ir_compaction_source_test \
            scripts.tests.kotodama_typed_case_registry_source_test \
            scripts.tests.norito_columnar_derive_compaction_source_test \
            scripts.tests.norito_scratch_retirement_source_test \
            scripts.tests.obsolete_developer_test_retirement_source_test \
            scripts.tests.shared_proc_macro_emitter_source_test
          python3 scripts/check_generated_artifacts.py
          python3 scripts/check_nexus_provisioning_templates.py
      - name: Classify the PR reverse-dependency closure
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL_REQUESTED: ${{ contains(github.event.pull_request.labels.*.name, 'ci/full') }}
        run: |
          mkdir -p target/ci
          scope_args=(--base "$BASE_SHA")
          if test "$FULL_REQUESTED" = true; then
            scope_args=(--all)
          fi
          python3 scripts/rust_ci.py classify \
            "${scope_args[@]}" \
            --json-out target/ci/rust-classification.json \
            --github-output "$GITHUB_OUTPUT" \
            > target/ci/rust-classification.log
      - name: Upload Rust classification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-classification
          path: |
            target/ci/rust-classification.json
            target/ci/rust-classification.log
          if-no-files-found: error

  rust_affected:
    name: Rust ${{ matrix.lane }} (${{ matrix.package_count }} packages)
    if: needs.rust_changes.outputs.has_rust == 'true'
    needs: [rust_changes, pre_build]
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.rust_changes.outputs.matrix) }}
    env:
      IROHA_TEST_REQUIRE_NETWORK: "1"
      TEST_NETWORK_BIN_IROHAD: bins/iroha3d
      TEST_NETWORK_BIN_IROHA: bins/iroha
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          cache: "false"
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
          shared-key: rust-lane-1.93.1-${{ matrix.lane }}
      - name: Download test-network binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bins
          path: bins
      - name: Make test-network binaries executable
        run: chmod +x -R bins
      - name: Enforce data-model compile-unit budget
        if: matrix.lane == 'execution'
        run: >-
          python3 scripts/check_compile_unit_budget.py
          --locked
          --lib
          -p iroha_data_model
          --artifact-scope workspace
          --baseline ci/compile_unit_baselines.json
          --baseline-key iroha_data_model_lib
          --budget-percent 2
          --budget-min-growth 3
          --json-out target/ci/iroha-data-model-compile-units.json
      - name: Upload data-model compile-unit evidence
        if: always() && matrix.lane == 'execution'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compile-units-${{ matrix.lane }}
          path: target/ci/iroha-data-model-compile-units.json
          if-no-files-found: error
      - name: Run locked affected checks
        run: >
          python3 scripts/rust_ci.py run
          --packages "${{ matrix.packages }}"
          --checks clippy,build,test,doc
      - name: Upload failed test-network artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-network-${{ matrix.lane }}
          path: ${{ env.TEST_NETWORK_TMP_DIR }}/irohad_test_network_*
          if-no-files-found: ignore
          retention-days: 3

  rust_required:
    name: Required affected Rust validation
    if: always()
    needs: [rust_changes, rust_affected]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate dynamic Rust lane results
        env:
          CLASSIFIER_RESULT: ${{ needs.rust_changes.result }}
          AFFECTED_RESULT: ${{ needs.rust_affected.result }}
          HAS_RUST: ${{ needs.rust_changes.outputs.has_rust }}
        run: |
          set -euo pipefail
          test "$CLASSIFIER_RESULT" = success
          if test "$HAS_RUST" = true; then
            test "$AFFECTED_RESULT" = success
          else
            test "$AFFECTED_RESULT" = skipped
          fi

  pytests:
    needs: pre_build
    runs-on: ubuntu-latest
    env:
      IROHA_CONTAINER: "defaults-irohad0-1"
      BIN_IROHAD: bins/iroha3d
      BIN_IROHA: bins/iroha
      BIN_KAGAMI: bins/kagami
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.12
      - uses: abatilo/actions-poetry@0dd19c9498c3dc8728967849d0d2eae428a8a3d8
      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bins
          path: bins
      - name: Make binaries executable
        run: chmod +x -R bins
      - name: Install test_env deps globally
        run: pip install tomli-w
      - name: Run test env
        run: ./scripts/test_env.py setup
      - name: Install Torii pytest dependencies
        working-directory: pytests/iroha_torii_tests
        run: poetry install --no-root
      - name: Run Torii pytests
        working-directory: pytests/iroha_torii_tests
        run: poetry run pytest
      - name: Install client pytest dependencies
        working-directory: pytests/iroha_cli_tests
        run: poetry install --no-root
      - name: Run client pytests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
        env:
          # created by test_env.py
          TMP_DIR: ../../test
          IROHA_CLI_BINARY: iroha
          IROHA_CLI_CONFIG: client.toml
        with:
          timeout_minutes: 10
          max_attempts: 5
          command: |
            cd pytests/iroha_cli_tests
            poetry run pytest
          on_retry_command: |
            ./scripts/test_env.py cleanup
            ./scripts/test_env.py setup
      - name: Terminate test network
        run: ./scripts/test_env.py cleanup

  check_title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check conventional commits
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825
        id: lint_pr_title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          validateSingleCommit: true
          validateSingleCommitMatchesPrTitle: true

      - name: Post error comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
        if: always() && (steps.lint_pr_title.outputs.error_message != null)
        with:
          header: pr-title-lint-error
          message: |
            Hey there and thank you for opening this pull request! 👋🏼

            We require pull request titles to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/), and it looks like your proposed title needs to be adjusted.

            Details:

            ```
            ${{ steps.lint_pr_title.outputs.error_message }}
            ```

      # Delete a previous comment when the issue has been resolved
      - name: Delete error comment
        if: ${{ steps.lint_pr_title.outputs.error_message == null }}
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
        with:
          header: pr-title-lint-error
          delete: true

  check_links:
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore lychee cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.ref_name }}
          restore-keys: cache-lychee-
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: "--cache --max-cache-age 1d '**/*.rs' ."
          token: ${{ secrets.CUSTOM_TOKEN }}
          # We want to have a report, but it is not a hard error
          fail: false

  sumeragi_formal:
    runs-on: ubuntu-latest
    env:
      CARGO_NET_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
      - name: Create fresh private formal invocation layout
        id: formal_layout
        shell: bash
        run: |
          set -euo pipefail
          invocation_root="$(mktemp -d /private/tmp/iroha-sumeragi-v2-formal.XXXXXX)"
          chmod 700 "$invocation_root"
          mkdir -m 700 \
            "$invocation_root/target" \
            "$invocation_root/artifacts" \
            "$invocation_root/artifacts/formal" \
            "$invocation_root/artifacts/formal/sumeragi_v2" \
            "$invocation_root/tmp" \
            "$invocation_root/tools" \
            "$invocation_root/tools/tlapm" \
            "$invocation_root/tools/tla2tools" \
            "$invocation_root/tools/apalache" \
            "$invocation_root/tools/verus"
          {
            printf 'invocation_root=%s\n' "$invocation_root"
            printf 'artifact_root=%s\n' "$invocation_root/artifacts"
            printf 'tlapm_root=%s\n' "$invocation_root/tools/tlapm"
          } >> "$GITHUB_OUTPUT"
          {
            printf 'CARGO_TARGET_DIR=%s\n' "$invocation_root/target"
            printf 'IROHA_RELEASE_ARTIFACT_ROOT=%s\n' "$invocation_root/artifacts"
            printf 'IROHA_RELEASE_CANCEL_REQUEST_PATH=%s\n' "$invocation_root/cancel-request.json"
            printf 'SUMERAGI_V2_FORMAL_EVIDENCE_DIR=%s\n' "$invocation_root/artifacts/formal/sumeragi_v2"
            printf 'TMPDIR=%s\n' "$invocation_root/tmp"
            printf 'TLAPM_INSTALL_ROOT=%s\n' "$invocation_root/tools/tlapm"
            printf 'TLA2TOOLS_INSTALL_ROOT=%s\n' "$invocation_root/tools/tla2tools"
            printf 'APALACHE_INSTALL_ROOT=%s\n' "$invocation_root/tools/apalache"
            printf 'VERUS_INSTALL_ROOT=%s\n' "$invocation_root/tools/verus"
          } >> "$GITHUB_ENV"
      - name: Cache pinned TLAPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.formal_layout.outputs.tlapm_root }}/3ab43c7ff31db4ced850619d4746fa4c841a7681/x86_64-linux-gnu
          key: sumeragi-v2-tlapm-linux-x86-64-3ab43c7ff31db4ced850619d4746fa4c841a7681-closure-v2-${{ hashFiles('scripts/formal/sumeragi_v2_tlapm_source_build_lock.json', 'scripts/formal/sumeragi_v2_tlapm_source_lock.py', 'scripts/formal/sumeragi_v2_tlapm_locked_wget.sh', 'scripts/formal/build_sumeragi_v2_tlapm_from_source.sh', 'scripts/formal/install_sumeragi_v2_tlapm.sh') }}
      - name: Install pinned formal tools
        run: |
          set -euo pipefail
          bash scripts/formal/install_sumeragi_v2_tlapm.sh
          bash scripts/formal/install_sumeragi_v2_tla2tools.sh
          bash scripts/formal/install_apalache.sh 0.52.2
          bash scripts/formal/install_sumeragi_v2_verus.sh
          tlapm_tree="$TLAPM_INSTALL_ROOT/3ab43c7ff31db4ced850619d4746fa4c841a7681/x86_64-linux-gnu/tlapm"
          mapfile -t tlapm_functions < <(find "$tlapm_tree" -type f -name Functions.tla -print)
          test "${#tlapm_functions[@]}" -eq 1
          tlapm_stdlib="$(dirname -- "${tlapm_functions[0]}")"
          test -f "$tlapm_stdlib/Folds.tla"
          {
            printf 'TLAPM_BIN=%s\n' "$tlapm_tree/bin/tlapm"
            printf 'TLAPM_STDLIB=%s\n' "$tlapm_stdlib"
            printf 'TLA2TOOLS_JAR=%s\n' "$TLA2TOOLS_INSTALL_ROOT/1.7.4/tla2tools.jar"
            printf 'APALACHE_BIN=%s\n' "$APALACHE_INSTALL_ROOT/v0.52.2/bin/apalache-mc"
          } >> "$GITHUB_ENV"
          printf '%s\n' \
            "$VERUS_INSTALL_ROOT/0.2026.05.31.5dd6d83/x86-linux" \
            >> "$GITHUB_PATH"
      - name: Sumeragi v2 TLAPS, bounded TLC, and production Verus gates
        run: bash ci/check_sumeragi_formal.sh
      - name: Upload Sumeragi v2 formal logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sumeragi-v2-formal-pr
          path: ${{ steps.formal_layout.outputs.artifact_root }}/formal/sumeragi_v2
          if-no-files-found: ignore

  nexus_cross_dataspace_localnet:
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Nexus cross-dataspace localnet proof
        run: bash ci/check_nexus_cross_dataspace_localnet.sh

  nexus_cross_lane_proofs:
    runs-on: [self-hosted, Linux, iroha2]
