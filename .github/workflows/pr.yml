name: Pull Request CI

on:
  pull_request:
    branches: [main]
    paths_ignore:
      - ".github/workflows/publish*"
      - ".github/workflows/ci_image.yml"
      - "Dockerfile*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IROHA_CLI_DIR: "/__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}/test"
  TEST_NETWORK_TMP_DIR: /tmp
  NEXTEST_PROFILE: ci

jobs:
  pre_build:
    runs-on: ubuntu-latest
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Build binaries (irohad, iroha, kagami, koto) (release)
        run: |
          cargo build --release --bin irohad --bin iroha --bin kagami
          cargo build --release -p ivm --bin koto
          mkdir target/release/pre_build
          mv target/release/irohad target/release/iroha target/release/kagami target/release/koto target/release/pre_build
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: bins
          path: target/release/pre_build
          retention-days: 1

  consistency:
    runs-on: ubuntu-latest
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    needs: pre_build
    steps:
      - uses: actions/checkout@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: bins
          path: bins
      - name: Check
        env:
          BIN_KAGAMI: bins/kagami
          BIN_IROHA: bins/iroha
        run: |
          chmod +x -R bins
          ./scripts/tests/consistency.sh all

  kotodama_docs:
    runs-on: ubuntu-latest
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    needs: pre_build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download canonical koto driver
        uses: actions/download-artifact@v4
        with:
          name: bins
          path: bins
      - name: Make koto executable
        run: chmod +x bins/koto
      - name: Install pytest
        run: python3 -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Unit-test Kotodama documentation checker
        run: python3 -m pytest -q pytests/scripts/check_kotodama_docs_test.py
      - name: Verify workspace release-workflow semantics
        run: python3 -m pytest -q pytests/scripts/workspace_release_gate_test.py
      - name: Compile canonical Kotodama documentation fences
        run: python3 scripts/check_kotodama_docs.py --koto bins/koto

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: "false"
          toolchain: "nightly-2025-05-08"
          components: "rustfmt"
      - name: Format
        run: cargo fmt --all -- --check

  norito_rpc_verify:
    runs-on: ubuntu-latest
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Norito-RPC fixture parity
        run: cargo xtask norito-rpc-verify

  numeric_v1_architecture_parity:
    name: Numeric V1 parity (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-14
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          shared-key: numeric-v1-${{ matrix.runner }}
      - name: Verify canonical numeric fixtures and consensus behavior
        run: |
          cargo test --locked -p ivm --test ivm_group_06 numeric_
          cargo test --locked -p ivm --test ivm_group_03 gas_schedule_hash
          cargo test --locked -p ivm --test ivm_group_05 kotodama_checked_arithmetic::
          cargo test --locked -p iroha_primitives randomized_decimal_arithmetic_matches_independent_rational_reference

  android_fixture_compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Android fixture compatibility
        working-directory: java/iroha_android
        run: |
          chmod +x ./gradlew
          ./gradlew :core:test --tests org.hyperledger.iroha.android.tx.TransactionFixtureManifestTests

  clippy:
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Clippy (all targets, all features)
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features --message-format=json -- -D warnings | tee clippy.json
      - name: Upload clippy report
        uses: actions/upload-artifact@v4
        with:
          name: report-clippy
          path: clippy.json

  doc:
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Documentation (all features)
        run: cargo doc --no-deps --quiet --all-features

  test:
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    needs: pre_build
    env:
      LLVM_PROFILE_FILE_NAME: "iroha-%p-%m.profraw"
      IROHA_TEST_REQUIRE_NETWORK: "1"
      TEST_NETWORK_BIN_IROHAD: bins/irohad
      TEST_NETWORK_BIN_IROHA: bins/iroha
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: bins
          path: bins
      - name: Make binaries executable
        run: chmod +x -R bins
      - name: Test (full)
        id: test
        run: >
          mold --run cargo llvm-cov nextest
          --workspace --locked
          --branch --no-report
      - name: Test (doc)
        id: test-doc
        run: >
          mold --run cargo llvm-cov --doc
          --branch --no-report
      - name: Generate lcov report
        run: cargo llvm-cov report --doctests --ignore-filename-regex 'iroha_cli|iroha_torii' --lcov --output-path lcov.info
      - name: Upload lcov report
        uses: actions/upload-artifact@v4
        with:
          name: report-coverage
          path: lcov.info
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2.3.6
        with:
          file: lcov.info
          format: lcov
          github-token: ${{ github.token }}
      - name: Upload test network artifacts
        if: failure() && (steps.test.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: test_network_runs
          path: ${{ env.TEST_NETWORK_TMP_DIR }}/irohad_test_network_*
          retention-days: 3

  pytests:
    needs: pre_build
    runs-on: ubuntu-latest
    env:
      IROHA_CONTAINER: "defaults-irohad0-1"
      BIN_IROHAD: bins/irohad
      BIN_IROHA: bins/iroha
      BIN_KAGAMI: bins/kagami
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.12
      - uses: abatilo/actions-poetry@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: bins
          path: bins
      - name: Make binaries executable
        run: chmod +x -R bins
      - name: Install test_env deps globally
        run: pip install tomli-w
      - name: Run test env
        run: ./scripts/test_env.py setup
      - name: Install Torii pytest dependencies
        working-directory: pytests/iroha_torii_tests
        run: poetry install --no-root
      - name: Run Torii pytests
        working-directory: pytests/iroha_torii_tests
        run: poetry run pytest
      - name: Install client pytest dependencies
        working-directory: pytests/iroha_cli_tests
        run: poetry install --no-root
      - name: Run client pytests
        uses: nick-fields/retry@v3
        env:
          # created by test_env.py
          TMP_DIR: ../../test
          IROHA_CLI_BINARY: iroha
          IROHA_CLI_CONFIG: client.toml
        with:
          timeout_minutes: 10
          max_attempts: 5
          command: |
            cd pytests/iroha_cli_tests
            poetry run pytest
          on_retry_command: |
            ./scripts/test_env.py cleanup
            ./scripts/test_env.py setup
      - name: Terminate test network
        run: ./scripts/test_env.py cleanup

  check_title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check conventional commits
        uses: amannn/action-semantic-pull-request@v5
        id: lint_pr_title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          validateSingleCommit: true
          validateSingleCommitMatchesPrTitle: true

      - name: Post error comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: always() && (steps.lint_pr_title.outputs.error_message != null)
        with:
          header: pr-title-lint-error
          message: |
            Hey there and thank you for opening this pull request! 👋🏼

            We require pull request titles to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/), and it looks like your proposed title needs to be adjusted.

            Details:

            ```
            ${{ steps.lint_pr_title.outputs.error_message }}
            ```

      # Delete a previous comment when the issue has been resolved
      - name: Delete error comment
        if: ${{ steps.lint_pr_title.outputs.error_message == null }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-title-lint-error
          delete: true

  check_links:
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Restore lychee cache
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.ref_name }}
          restore-keys: cache-lychee-
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--cache --max-cache-age 1d '**/*.rs' ."
          token: ${{ secrets.CUSTOM_TOKEN }}
          # We want to have a report, but it is not a hard error
          fail: false

  sumeragi_formal:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache pinned TLAPM
        uses: actions/cache@v4
        with:
          path: target/tlapm/toolchains/763bf3c1826d77a4cf206f43d5aa16775da1da33/x86_64-linux-gnu
          key: sumeragi-v2-tlapm-linux-x86-64-763bf3c1826d77a4cf206f43d5aa16775da1da33
      - name: Install pinned formal tools
        run: |
          bash scripts/formal/install_sumeragi_v2_tlapm.sh
          bash scripts/formal/install_sumeragi_v2_tla2tools.sh
          bash scripts/formal/install_sumeragi_v2_verus.sh
          echo "$GITHUB_WORKSPACE/target/verus/toolchains/0.2026.05.31.5dd6d83/x86-linux" >> "$GITHUB_PATH"
      - name: Sumeragi v2 TLAPS, bounded TLC, and production Verus gates
        run: bash ci/check_sumeragi_formal.sh
      - name: Upload Sumeragi v2 formal logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sumeragi-v2-formal-pr
          path: target/formal/sumeragi_v2
          if-no-files-found: ignore

  docs_i18n_metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit translated documentation metadata
        run: python3 ci/check_docs_i18n_metadata.py --paths docs/formal --json-out target/docs-i18n/formal-metadata.json
      - name: Upload formal docs metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-docs-i18n-metadata
          path: target/docs-i18n/formal-metadata.json
          if-no-files-found: ignore

  nexus_cross_dataspace_localnet:
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Nexus cross-dataspace localnet proof
        run: bash ci/check_nexus_cross_dataspace_localnet.sh

  nexus_cross_lane_proofs:
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Nexus cross-lane proof filters
        run: bash ci/check_nexus_cross_lane_proofs.sh
