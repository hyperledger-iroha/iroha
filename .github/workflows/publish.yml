name: Publish (v2* release)

on:
  push:
    tags:
      - "v2*"

env:
  CARGO_TERM_COLOR: always
  DEFAULTS_DIR: defaults
  IROHA2_PROFILE: profiling
  IROHA2_RUSTFLAGS: -C force-frame-pointers=on
  IROHA2_FEATURES: profiling
  IROHA2_CARGOFLAGS: -Z build-std
  IROHA_CI_IMAGE: ${{ vars.IROHA_CI_IMAGE }}
  IROHA_RUST_BUILDER_IMAGE: ${{ vars.IROHA_RUST_BUILDER_IMAGE }}
  IROHA_RUNTIME_IMAGE: ${{ vars.IROHA_RUNTIME_IMAGE }}

jobs:
  registry-no-profiling:
    runs-on: [self-hosted, Linux, iroha2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate digest-pinned Docker base images
        run: |
          python3 scripts/validate_release_image_bases.py \
            --builder "$IROHA_RUST_BUILDER_IMAGE" \
            --runtime "$IROHA_RUNTIME_IMAGE"
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          install: true
          version: v0.34.1
      - name: Get the release tag
        run: |
          RELEASE_VERSION=${{ github.ref_name }}
          PREFIX='v'
          TAG=${RELEASE_VERSION#$PREFIX}
          echo "TAG=$TAG" >>$GITHUB_ENV
      - name: Build and export to Docker iroha2 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        if: always()
        with:
          context: .
          load: true
          tags: |
            hyperledger/iroha:${{ env.TAG }}
            docker.soramitsu.co.jp/iroha2/iroha:${{ env.TAG }}
          build-args: |
            "IROHA_RUST_BUILDER_IMAGE=${{ env.IROHA_RUST_BUILDER_IMAGE }}"
            "IROHA_RUNTIME_IMAGE=${{ env.IROHA_RUNTIME_IMAGE }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Generate runtime-only genesis signing custody
        run: |
          umask 077
          key_root="$(mktemp -d "$RUNNER_TEMP/iroha-compose-genesis.XXXXXX")"
          echo "IROHA_GENESIS_KEY_ROOT=$key_root" >> "$GITHUB_ENV"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$key_root,dst=/keys" \
            --entrypoint kagami \
            "hyperledger/iroha:${TAG}" \
            keys --out-dir /keys/custody > /dev/null
          key_dir="$key_root/custody"
          test -s "$key_dir/public.key"
          test -s "$key_dir/private.key"
          echo "IROHA_GENESIS_PUBLIC_KEY_FILE=$key_dir/public.key" >> "$GITHUB_ENV"
          echo "IROHA_GENESIS_PRIVATE_KEY_FILE=$key_dir/private.key" >> "$GITHUB_ENV"
      - name: Test docker-compose.single.yml before pushing
        run: |
          docker compose -f ${{ env.DEFAULTS_DIR }}/docker-compose.single.yml up --wait || {
            echo "docker-compose failed. Logs:";
            docker compose -f ${{ env.DEFAULTS_DIR }}/docker-compose.single.yml logs --tail="all";
            exit 1;
          }
          docker compose -f ${{ env.DEFAULTS_DIR }}/docker-compose.single.yml down
      - name: Test docker-compose.local.yml before pushing
        run: |
          docker compose -f ${{ env.DEFAULTS_DIR }}/docker-compose.local.yml up --wait || {
            echo "docker-compose failed. Logs:";
            docker compose -f ${{ env.DEFAULTS_DIR }}/docker-compose.local.yml logs --tail="all";
            exit 1;
          }
          docker compose -f ${{ env.DEFAULTS_DIR }}/docker-compose.local.yml down
      - name: Test docker-compose.yml before pushing
        run: |
          docker compose -f ${{ env.DEFAULTS_DIR }}/docker-compose.yml up --wait || exit 1
          docker compose -f ${{ env.DEFAULTS_DIR }}/docker-compose.yml down
      - name: Remove runtime-only genesis signing custody
        if: always()
        run: |
          case "${IROHA_GENESIS_KEY_ROOT:-}" in
            "") exit 0 ;;
            "$RUNNER_TEMP"/iroha-compose-genesis.*) ;;
            *) echo "Refusing to remove an unexpected genesis custody path" >&2; exit 1 ;;
          esac
          rm -rf -- "$IROHA_GENESIS_KEY_ROOT"
      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Soramitsu Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: docker.soramitsu.co.jp
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}
      - name: Build and push iroha2 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: |
            hyperledger/iroha:${{ env.TAG }}
            docker.soramitsu.co.jp/iroha2/iroha:${{ env.TAG }}
          labels: commit=${{ github.sha }}
          build-args: |
            "IROHA_RUST_BUILDER_IMAGE=${{ env.IROHA_RUST_BUILDER_IMAGE }}"
            "IROHA_RUNTIME_IMAGE=${{ env.IROHA_RUNTIME_IMAGE }}"

  registry-with-profiling:
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: ${{ vars.IROHA_CI_IMAGE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate digest-pinned Docker base images
        run: |
          python3 scripts/validate_release_image_bases.py \
            --builder "$IROHA_RUST_BUILDER_IMAGE" \
            --runtime "$IROHA_RUNTIME_IMAGE"
          python3 scripts/validate_release_image_bases.py \
            --builder "$IROHA_CI_IMAGE" \
            --runtime "$IROHA_CI_IMAGE"
      - name: Get the release tag
        run: |
          RELEASE_VERSION=${{ github.ref_name }}
          PREFIX='v'
          TAG=${RELEASE_VERSION#$PREFIX}
          echo "TAG=$TAG" >>$GITHUB_ENV
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Soramitsu Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: docker.soramitsu.co.jp
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}
      - name: Set up Docker Buildx
        id: buildx
        if: always()
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          install: true
          version: v0.34.1
      - name: Build and push iroha2-profiling image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        if: always()
        with:
          push: true
          tags: |
            hyperledger/iroha:${{ env.TAG }}-${{ env.IROHA2_PROFILE }}
            docker.soramitsu.co.jp/iroha2/iroha:${{ env.TAG }}-${{ env.IROHA2_PROFILE }}
          labels: commit=${{ github.sha }}
          build-args: |
            "IROHA_RUST_BUILDER_IMAGE=${{ env.IROHA_RUST_BUILDER_IMAGE }}"
            "IROHA_RUNTIME_IMAGE=${{ env.IROHA_RUNTIME_IMAGE }}"
            "PROFILE=${{ env.IROHA2_PROFILE }}"
            "RUSTFLAGS=${{ env.IROHA2_RUSTFLAGS }}"
            "FEATURES=${{ env.IROHA2_FEATURES }}"
            "CARGOFLAGS=${{ env.IROHA2_CARGOFLAGS }}"
          context: .
