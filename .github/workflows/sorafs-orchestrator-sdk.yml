name: SoraFS orchestrator SDK parity

on:
  pull_request:
    branches: [main]
    paths:
      - ".cargo/**"
      - ".github/workflows/sorafs-orchestrator-sdk.yml"
      - ".github/workflows/mobile_sdk_artifacts.yml"
      - ".github/workflows/pr_csharp.yml"
      - "ci/sdk_sorafs_orchestrator.sh"
      - "ci/check_kagemusha_jvm_native_bridge.sh"
      - "ci/check_sorafs_python_native_sdk.sh"
      - "codec/**"
      - "scripts/deploy_localnet.sh"
      - "scripts/tests/deploy_localnet_test.py"
      - "gradle/mobile-sdk-external-android-build.settings.gradle.kts"
      - "scripts/build_norito_xcframework.sh"
      - "scripts/exec_with_file_lock.py"
      - "scripts/check_mobile_sdk_artifact_pin_commit.py"
      - "scripts/check_mobile_sdk_artifacts.sh"
      - "scripts/norito_bridge_source_seal.py"
      - "scripts/package_mobile_sdk_artifacts.sh"
      - "scripts/run_mobile_hermetic_command.py"
      - "crates/connect_norito_bridge/**"
      - "crates/iroha_js_host/**"
      - "crates/iroha_cli/**"
      - "crates/iroha_config/**"
      - "crates/iroha_core/**"
      - "crates/iroha_data_model/**"
      - "crates/iroha_kagami/**"
      - "crates/iroha_torii/**"
      - "crates/irohad/**"
      - "crates/iroha_core/src/smartcontracts/isi/mod.rs"
      - "crates/iroha_core/src/smartcontracts/isi/escrow.rs"
      - "crates/iroha_data_model/src/bin/cancel_asset_lock_fixtures.rs"
      - "crates/iroha_data_model/src/escrow.rs"
      - "crates/iroha_data_model/src/events/data/escrow.rs"
      - "crates/iroha_data_model/src/isi/mod.rs"
      - "crates/iroha_data_model/src/isi/escrow.rs"
      - "crates/iroha_data_model/src/isi/registry.rs"
      - "crates/iroha_data_model/src/testing/cancel_asset_lock.rs"
      - "crates/kotodama_lang/src/samples/native_escrow.ko"
      - "crates/kotodama_lang/src/samples/native_escrow.to"
      - "crates/sorafs_manifest/**"
      - "crates/sorafs_orchestrator/**"
      - "python/iroha_python/**"
      - "python/iroha_torii_client/**"
      - "javascript/iroha_js/**"
      - "IrohaSwift/**"
      - "kotlin/**"
      - "java/iroha_android/**"
      - "java/norito_java/**"
      - "csharp/**"
      - "fixtures/sorafs_manifest/appeal_finance/**"
      - "fixtures/sorafs_manifest/**"
      - "fixtures/sorafs_manifest/reference_sdk/**"
      - "fixtures/sorafs_manifest/reference_sdk_validation_inventory_v1.json"
      - "fixtures/sorafs_orchestrator/multi_peer_parity_v1/**"
      - "integration_tests/tests/native_escrow.rs"
      - "scripts/check_sorafs_reference_sdk_fixtures.py"
      - "scripts/check_native_sdk_abi22_artifact.py"
      - "scripts/compute_workspace_source_manifest.py"
      - "scripts/tests/check_native_sdk_abi22_artifact_test.py"
      - "scripts/tests/check_sorafs_python_native_sdk_evidence_contract.sh"
      - "scripts/tests/check_sorafs_fixture_workflow_contract_test.py"
      - "scripts/check_sorafs_release_automation.py"
      - "scripts/tests/check_sorafs_release_automation_test.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "vendor/**"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdk-parity:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      IROHA_JS_NATIVE_BUILD_PROFILE: "release"
      IROHA_REQUIRE_SORAFS_NATIVE_VALIDATION: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify Python ABI-23 evidence retention contract
        run: bash scripts/tests/check_sorafs_python_native_sdk_evidence_contract.sh
      - name: Bind the canonical mobile Python
        run: |
          mobile_python="$(python3 -I -S -c '
          import sys
          sys.path.insert(0, "scripts")
          from pathlib import Path
          from sorafs_path_identity import resolve_path_identity
          errors = []
          identity = resolve_path_identity(Path(sys.executable), errors, label="mobile SDK Python")
          if identity is None or errors:
              raise SystemExit("mobile SDK Python path identity could not be resolved")
          print(identity)
          ')"
          [[ "$("$mobile_python" -I -S -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == "3.12" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: sorafs-orchestrator-sdk
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - name: Install Apple Rust targets
        run: |
          rustup_source="$(command -v rustup)"
          rustup_source="$("$MOBILE_SDK_PYTHON_BINARY" -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$rustup_source")"
          [[ "$rustup_source" == /* && -f "$rustup_source" && ! -L "$rustup_source" && -x "$rustup_source" ]]
          rustup_tools="$RUNNER_TEMP/iroha-sorafs-apple-tools"
          mkdir -p "$rustup_tools"
          chmod 0700 "$rustup_tools"
          rustup_path="$rustup_tools/rustup"
          test ! -e "$rustup_path"
          /bin/cp "$rustup_source" "$rustup_path"
          chmod 0700 "$rustup_path"
          rustup_path="$("$MOBILE_SDK_PYTHON_BINARY" -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$rustup_path")"
          [[ "$rustup_path" == /* && "${rustup_path##*/}" == rustup && -f "$rustup_path" && ! -L "$rustup_path" && -x "$rustup_path" ]]
          echo "MOBILE_SDK_RUSTUP_BINARY=$rustup_path" >> "$GITHUB_ENV"
          "$rustup_path" target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
          cargo fetch --locked
      - name: Bind the first-release Apple Cargo envelope
        run: |
          cargo_target="$RUNNER_TEMP/iroha-sorafs-apple-cargo"
          mkdir -p "$cargo_target"
          cargo_target="$(cd "$cargo_target" && pwd -P)"
          rustc_path="$("$MOBILE_SDK_RUSTUP_BINARY" which --toolchain 1.93.1 rustc)"
          rustdoc_path="$("$MOBILE_SDK_RUSTUP_BINARY" which --toolchain 1.93.1 rustdoc)"
          echo "CARGO_BUILD_JOBS=1" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$cargo_target" >> "$GITHUB_ENV"
          echo "RUSTC=$rustc_path" >> "$GITHUB_ENV"
          echo "RUSTC_BOOTSTRAP=1" >> "$GITHUB_ENV"
          echo "RUSTDOC=$rustdoc_path" >> "$GITHUB_ENV"
      - name: Prepare external Apple native artifact roots
        run: |
          artifact_dir="$RUNNER_TEMP/iroha-sorafs-sdk-apple-artifacts"
          build_dir="$RUNNER_TEMP/iroha-sorafs-sdk-apple-build"
          mkdir -p "$artifact_dir" "$build_dir"
          echo "MOBILE_SDK_APPLE_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_REQUIRE_EXTERNAL_APPLE_ARTIFACT=1" >> "$GITHUB_ENV"
          echo "NORITO_BRIDGE_OUT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "NORITO_BRIDGE_BUILD_DIR=$build_dir" >> "$GITHUB_ENV"
      - name: Build exact ABI-23 NoritoBridge XCFramework
        run: scripts/build_norito_xcframework.sh
      - name: Authenticate Apple native artifact
        run: bash scripts/check_mobile_sdk_artifacts.sh --apple-only
      - name: Run exact Python 3.12 ABI-23 native reference parity
        env:
          SORAFS_PYTHON_SDK_EVIDENCE_DIR: ${{ runner.temp }}/iroha-sorafs-python-native-abi22-evidence
          SORAFS_PYTHON_SDK_PYTHON_BIN: python3
        run: bash ci/check_sorafs_python_native_sdk.sh
      - name: Run Rust, Python, JavaScript, and Swift fixture parity
        run: bash ci/sdk_sorafs_orchestrator.sh
      - name: Upload verified Python ABI-23 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sorafs-python-native-abi22-${{ github.run_id }}
          path: ${{ runner.temp }}/iroha-sorafs-python-native-abi22-evidence/python-native-abi22.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sorafs-orchestrator-sdk-${{ github.run_id }}
          path: |
            artifacts/sorafs_orchestrator_sdk/
            !artifacts/sorafs_orchestrator_sdk/latest
          if-no-files-found: error
          retention-days: 30

  mobile-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANDROID_PLATFORM_PACKAGE: platforms;android-35
      ANDROID_BUILD_TOOLS_PACKAGE: build-tools;35.0.0
      IROHA_REQUIRE_SORAFS_NATIVE_VALIDATION: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Bind the canonical mobile Python
        shell: bash
        run: |
          mobile_python="$(python3 -I -S -B -c '
          import sys
          sys.path.insert(0, "scripts")
          from pathlib import Path
          from sorafs_path_identity import resolve_path_identity
          errors = []
          identity = resolve_path_identity(Path(sys.executable), errors, label="mobile SDK Python")
          if identity is None or errors:
              raise SystemExit("mobile SDK Python path identity could not be resolved")
          print(identity)
          ')"
          [[ "$("$mobile_python" -I -S -B -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == "3.12" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: sorafs-orchestrator-mobile-parity
      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "ANDROID_HOME or ANDROID_SDK_ROOT must be set by the runner" >&2
            exit 1
          fi
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "sdkmanager not found at $sdkmanager" >&2
            exit 1
          fi
          set +e
          yes | "$sdkmanager" --licenses >/dev/null
          sdkmanager_status="${PIPESTATUS[1]}"
          set -e
          if [[ "$sdkmanager_status" -ne 0 ]]; then
            echo "sdkmanager license acceptance failed with status $sdkmanager_status" >&2
            exit "$sdkmanager_status"
          fi
          "$sdkmanager" "$ANDROID_PLATFORM_PACKAGE" "$ANDROID_BUILD_TOOLS_PACKAGE"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
      - name: Fetch the locked Rust dependency graph
        run: cargo fetch --locked
      - name: Require fresh ABI-23 JNI bridge in complete Kotlin and Java suites
        env:
          KAGEMUSHA_JVM_NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/iroha-kotlin-zk-asset-localnet-evidence
        run: >-
          NORITO_MOBILE_JAVA_HOME="$JAVA_HOME"
          NORITO_MOBILE_ANDROID_HOME="$ANDROID_HOME"
          bash ci/check_kagemusha_jvm_native_bridge.sh
      - name: Upload Kotlin four-peer localnet evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sorafs-orchestrator-mobile-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/iroha-kotlin-zk-asset-localnet-evidence/*
          if-no-files-found: error
          retention-days: 30

  csharp-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IROHA_REQUIRE_SORAFS_NATIVE_VALIDATION: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: sorafs-orchestrator-csharp-parity
      - name: Build and authenticate the exact ABI-23 C# bridge
        shell: bash
        run: |
          target=x86_64-unknown-linux-gnu
          cargo build --locked --release -p connect_norito_bridge --target "$target"
          native_dir="$RUNNER_TEMP/sorafs-csharp-native"
          artifact="$native_dir/libconnect_norito_bridge.so"
          manifest="$native_dir/native-sdk-abi22.json"
          mkdir -p "$native_dir"
          cp "target/$target/release/libconnect_norito_bridge.so" "$artifact"
          python3 -I scripts/check_native_sdk_abi22_artifact.py record \
            --artifact "$artifact" \
            --manifest "$manifest" \
            --source-root "$GITHUB_WORKSPACE" \
            --sdk csharp \
            --target "$target"
          python3 -I scripts/check_native_sdk_abi22_artifact.py verify \
            --artifact "$artifact" \
            --manifest "$manifest" \
            --source-root "$GITHUB_WORKSPACE"
          echo "LD_LIBRARY_PATH=$native_dir" >> "$GITHUB_ENV"
      - name: Restore C# dependencies
        working-directory: csharp
        run: dotnet restore Hyperledger.Iroha.Sdk.sln
      - name: Build C# SDK with warnings denied
        working-directory: csharp
        run: dotnet build Hyperledger.Iroha.Sdk.sln -c Release --no-restore -warnaserror
      - name: Run complete C# ABI-23 parity suite
        working-directory: csharp
        run: dotnet test Hyperledger.Iroha.Sdk.sln -c Release --no-build
