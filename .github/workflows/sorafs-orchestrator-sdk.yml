name: SoraFS orchestrator SDK parity

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sorafs-orchestrator-sdk.yml"
      - "ci/sdk_sorafs_orchestrator.sh"
      - "ci/check_sorafs_python_native_sdk.sh"
      - "scripts/build_norito_xcframework.sh"
      - "scripts/exec_with_file_lock.py"
      - "scripts/check_mobile_sdk_artifact_pin_commit.py"
      - "scripts/check_mobile_sdk_artifacts.sh"
      - "scripts/norito_bridge_source_seal.py"
      - "scripts/run_mobile_hermetic_command.py"
      - "crates/connect_norito_bridge/**"
      - "crates/iroha_js_host/**"
      - "crates/iroha_core/src/smartcontracts/isi/mod.rs"
      - "crates/iroha_core/src/smartcontracts/isi/escrow.rs"
      - "crates/iroha_data_model/src/bin/cancel_asset_lock_fixtures.rs"
      - "crates/iroha_data_model/src/escrow.rs"
      - "crates/iroha_data_model/src/events/data/escrow.rs"
      - "crates/iroha_data_model/src/isi/mod.rs"
      - "crates/iroha_data_model/src/isi/escrow.rs"
      - "crates/iroha_data_model/src/isi/registry.rs"
      - "crates/iroha_data_model/src/testing/cancel_asset_lock.rs"
      - "crates/kotodama_lang/src/samples/native_escrow.ko"
      - "crates/kotodama_lang/src/samples/native_escrow.to"
      - "crates/sorafs_manifest/**"
      - "crates/sorafs_orchestrator/**"
      - "python/iroha_python/**"
      - "javascript/iroha_js/**"
      - "IrohaSwift/**"
      - "fixtures/sorafs_manifest/appeal_finance/**"
      - "fixtures/sorafs_manifest/reference_sdk/**"
      - "fixtures/sorafs_manifest/reference_sdk_validation_inventory_v1.json"
      - "fixtures/sorafs_orchestrator/multi_peer_parity_v1/**"
      - "integration_tests/tests/native_escrow.rs"
      - "scripts/check_sorafs_reference_sdk_fixtures.py"
      - "scripts/check_native_sdk_abi21_artifact.py"
      - "scripts/tests/check_native_sdk_abi21_artifact_test.py"
      - "scripts/tests/check_sorafs_python_native_sdk_evidence_contract.sh"
      - "scripts/tests/check_sorafs_fixture_workflow_contract_test.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdk-parity:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      IROHA_JS_NATIVE_BUILD_PROFILE: "release"
      IROHA_REQUIRE_SORAFS_NATIVE_VALIDATION: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify Python ABI-21 evidence retention contract
        run: bash scripts/tests/check_sorafs_python_native_sdk_evidence_contract.sh
      - name: Bind the canonical mobile Python
        run: |
          mobile_python="$(python3 -I -S -c '
          import sys
          sys.path.insert(0, "scripts")
          from pathlib import Path
          from sorafs_path_identity import resolve_path_identity
          errors = []
          identity = resolve_path_identity(Path(sys.executable), errors, label="mobile SDK Python")
          if identity is None or errors:
              raise SystemExit("mobile SDK Python path identity could not be resolved")
          print(identity)
          ')"
          [[ "$("$mobile_python" -I -S -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == "3.12" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: sorafs-orchestrator-sdk
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - name: Install Apple Rust targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
          cargo fetch --locked
      - name: Bind the first-release Apple Cargo envelope
        run: |
          cargo_target="$RUNNER_TEMP/iroha-sorafs-apple-cargo"
          mkdir -p "$cargo_target"
          cargo_target="$(python3 -I -S -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$cargo_target")"
          rustc_path="$(rustup which --toolchain 1.93.1 rustc)"
          rustdoc_path="$(rustup which --toolchain 1.93.1 rustdoc)"
          echo "CARGO_BUILD_JOBS=1" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$cargo_target" >> "$GITHUB_ENV"
          echo "RUSTC=$rustc_path" >> "$GITHUB_ENV"
          echo "RUSTC_BOOTSTRAP=1" >> "$GITHUB_ENV"
          echo "RUSTDOC=$rustdoc_path" >> "$GITHUB_ENV"
      - name: Prepare external Apple native artifact roots
        run: |
          artifact_dir="$RUNNER_TEMP/iroha-sorafs-sdk-apple-artifacts"
          build_dir="$RUNNER_TEMP/iroha-sorafs-sdk-apple-build"
          mkdir -p "$artifact_dir" "$build_dir"
          echo "MOBILE_SDK_APPLE_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_REQUIRE_EXTERNAL_APPLE_ARTIFACT=1" >> "$GITHUB_ENV"
          echo "NORITO_BRIDGE_OUT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "NORITO_BRIDGE_BUILD_DIR=$build_dir" >> "$GITHUB_ENV"
      - name: Build exact ABI-21 NoritoBridge XCFramework
        run: scripts/build_norito_xcframework.sh
      - name: Authenticate Apple native artifact
        run: bash scripts/check_mobile_sdk_artifacts.sh --apple-only
      - name: Run exact Python 3.12 ABI-21 native reference parity
        env:
          SORAFS_PYTHON_SDK_EVIDENCE_DIR: ${{ runner.temp }}/iroha-sorafs-python-native-abi21-evidence
          SORAFS_PYTHON_SDK_PYTHON_BIN: python3
        run: bash ci/check_sorafs_python_native_sdk.sh
      - name: Run Rust, Python, JavaScript, and Swift fixture parity
        run: bash ci/sdk_sorafs_orchestrator.sh
      - name: Upload verified Python ABI-21 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sorafs-python-native-abi21-${{ github.run_id }}
          path: ${{ runner.temp }}/iroha-sorafs-python-native-abi21-evidence/python-native-abi21.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sorafs-orchestrator-sdk-${{ github.run_id }}
          path: |
            artifacts/sorafs_orchestrator_sdk/
            !artifacts/sorafs_orchestrator_sdk/latest
          if-no-files-found: error
          retention-days: 30
