name: Workspace release build and optional diagnostics

on:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      run_diagnostics:
        description: "Run optional workspace tests, lint, formatting, docs, coverage, and fuzz diagnostics"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_diagnostics:
        description: "Run optional workspace tests, lint, formatting, docs, coverage, and fuzz diagnostics"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: workspace-release-${{ github.sha }}
  # A release-evidence run must finish even when another ref advances.
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  ci_image:
    uses: ./.github/workflows/ci_image_preflight.yml
    permissions:
      contents: read

  # Diagnostic jobs are independent of the release build. Nightly runs collect
  # them automatically; push, manual, and reusable runs default to build only.
  format:
    name: Workspace format
    if: ${{ github.event_name == 'schedule' || inputs.run_diagnostics }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact workflow source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "${EXPECTED_SHA}^{commit}")"
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$WORKFLOW_SHA" = "$source_sha"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: "false"
          components: rustfmt
          toolchain: 1.99.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Install pinned workflow-test dependency
        run: python3 -m pip install --disable-pip-version-check pytest==9.0.3
      - name: Verify release-workflow semantics
        run: python3 -m pytest -q pytests/scripts/workspace_release_gate_test.py
      - name: Verify locked metadata and workspace formatting
        run: |
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo fmt --all -- --check

  build:
    needs: ci_image
    name: Workspace build
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: ${{ needs.ci_image.outputs.image }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact workflow source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "${EXPECTED_SHA}^{commit}")"
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$WORKFLOW_SHA" = "$source_sha"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: "false"
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
          shared-key: workspace-release-build-1.99.1
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Build the full workspace
        run: cargo build --locked --offline --workspace

  release-diagnostics:
    needs: ci_image
    name: Selected release diagnostics
    if: ${{ github.event_name == 'schedule' || inputs.run_diagnostics }}
    continue-on-error: true
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: ${{ needs.ci_image.outputs.image }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact workflow source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "${EXPECTED_SHA}^{commit}")"
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$WORKFLOW_SHA" = "$source_sha"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: "false"
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
          shared-key: workspace-release-diagnostics-1.99.1
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Run the release-gate test profile
        # The package set equals the packages named by the release-gate
        # default-filter in .config/nextest.toml.
        run: >-
          cargo nextest run --profile release-gate --locked --offline
          --no-tests=fail
          -p mv -p iroha_allocation -p iroha_genesis -p iroha_schema_gen
          -p iroha_sumeragi -p iroha_deploy -p iroha_config -p iroha_torii_shared
          -p iroha_wallet -p iroha -p concread -p norito -p iroha_primitives -p iroha_data_model
          -p iroha_crypto -p iroha_p2p -p fastpq_prover -p iroha_core
          -p iroha_core_zk -p iroha_torii -p irohad_lib -p iroha_cli_lib -p iroha_kagami
          -p iroha_test_network

  doc:
    needs: ci_image
    name: Workspace documentation
    if: ${{ github.event_name == 'schedule' || inputs.run_diagnostics }}
    continue-on-error: true
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: ${{ needs.ci_image.outputs.image }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact workflow source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "${EXPECTED_SHA}^{commit}")"
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$WORKFLOW_SHA" = "$source_sha"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: "false"
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
          shared-key: workspace-release-doc-1.99.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Document every supported workspace feature
        run: python3 scripts/rust_ci.py run --workspace --checks doc

  test:
    needs: ci_image
    name: Workspace tests
    if: ${{ github.event_name == 'schedule' || inputs.run_diagnostics }}
    continue-on-error: true
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: ${{ needs.ci_image.outputs.image }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact workflow source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "${EXPECTED_SHA}^{commit}")"
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$WORKFLOW_SHA" = "$source_sha"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: "false"
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
          shared-key: workspace-release-test-1.99.1
      - name: Enforce data-model compile-unit budget
        run: >-
          python3 scripts/check_compile_unit_budget.py
          --locked
          --lib
          -p iroha_data_model
          --artifact-scope workspace
          --baseline ci/compile_unit_baselines.json
          --baseline-key iroha_data_model_lib
          --budget-percent 2
          --budget-min-growth 3
          --json-out target/ci/iroha-data-model-compile-units.json
      - name: Upload data-model compile-unit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workspace-release-compile-units
          path: target/ci/iroha-data-model-compile-units.json
          if-no-files-found: error
      - name: Test the full workspace
        run: cargo test --locked --workspace --no-fail-fast --features iroha_torii/test-fixtures

  coverage:
    needs: ci_image
    name: Workspace coverage
    if: ${{ github.event_name == 'schedule' || inputs.run_diagnostics }}
    continue-on-error: true
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: ${{ needs.ci_image.outputs.image }}
    timeout-minutes: 360
    env:
      LLVM_PROFILE_FILE_NAME: "iroha-%p-%m.profraw"
      IROHA_TEST_REQUIRE_NETWORK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact workflow source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "${EXPECTED_SHA}^{commit}")"
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$WORKFLOW_SHA" = "$source_sha"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: "false"
          components: llvm-tools-preview
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
          shared-key: workspace-release-coverage-1.99.1
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: Collect workspace test coverage
        run: >-
          mold --run cargo llvm-cov nextest
          --workspace --locked --features iroha_torii/test-fixtures
          --branch --no-report
      - name: Collect documentation-test coverage
        run: >-
          mold --run cargo llvm-cov --doc
          --branch --no-report
      - name: Generate LCOV report
        run: >-
          cargo llvm-cov report --doctests
          --ignore-filename-regex 'iroha_cli|iroha_torii'
          --lcov --output-path lcov.info
      - name: Upload LCOV report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: report-coverage
          path: lcov.info
          if-no-files-found: error
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
        with:
          file: lcov.info
          format: lcov
          github-token: ${{ github.token }}

  clippy:
    needs: ci_image
    name: Strict workspace Clippy
    if: ${{ github.event_name == 'schedule' || inputs.run_diagnostics }}
    continue-on-error: true
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: ${{ needs.ci_image.outputs.image }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact workflow source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "${EXPECTED_SHA}^{commit}")"
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$WORKFLOW_SHA" = "$source_sha"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: "false"
          components: clippy
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: "true"
          shared-key: workspace-release-clippy-1.99.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Lint every workspace target and supported feature
        run: python3 scripts/rust_ci.py run --workspace --checks clippy

  adversarial:
    name: Adversarial Norito and IVM fuzz diagnostics
    if: ${{ github.event_name == 'schedule' || inputs.run_diagnostics }}
    continue-on-error: true
    runs-on: [self-hosted, Linux, iroha2]
    timeout-minutes: 180
    env:
      RUNS: "10000"
      FUZZ_MAX_TOTAL_TIME: "60"
      FUZZ_RSS_LIMIT_MB: "3072"
      FUZZ_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact workflow source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "${EXPECTED_SHA}^{commit}")"
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$WORKFLOW_SHA" = "$source_sha"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: "false"
          toolchain: nightly-2026-10-23
      - name: Install pinned cargo-fuzz
        run: |
          cargo +nightly-2026-10-23 install cargo-fuzz \
            --version 0.13.2 \
            --locked
          test "$(cargo-fuzz --version)" = "cargo-fuzz 0.13.2"
      - name: Verify immutable security-corpus integrity fingerprints
        run: python3 scripts/replay_security_corpora.py
      - name: Verify integrity and fuzz inventory contracts without executing Cargo
        run: >-
          python3 -m unittest -v
          pytests.scripts.corpora_integrity_replay_test
          pytests.scripts.fuzz_smoke_inventory_test
      - name: Run strict Norito and IVM fuzz targets
        run: scripts/fuzz_smoke.sh --strict
      - name: Archive fuzz crash artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workspace-release-fuzz-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            crates/norito/fuzz/artifacts
            crates/ivm/fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
