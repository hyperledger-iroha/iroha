name: Mobile SDK Artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mobile_sdk_artifacts.yml"
      - "Makefile"
      - "scripts/build_norito_xcframework.sh"
      - "scripts/archive_norito_xcframework.py"
      - "scripts/tests/archive_norito_xcframework_test.py"
      - "scripts/tests/package_mobile_sdk_artifacts_test.py"
      - "scripts/update_norito_bridge_swift_pins.py"
      - "scripts/tests/update_norito_bridge_swift_pins_test.py"
      - "scripts/validate_norito_bridge_xcframework.py"
      - "scripts/tests/validate_norito_bridge_xcframework_test.py"
      - "scripts/exec_with_file_lock.py"
      - "scripts/tests/exec_with_file_lock_test.py"
      - "scripts/check_mobile_sdk_artifact_pin_commit.py"
      - "scripts/check_mobile_sdk_artifacts.sh"
      - "scripts/check_mobile_sdk_artifacts_test.sh"
      - "ci/check_swift_pod_bridge.sh"
      - "scripts/check_swift_pod_bridge.sh"
      - "scripts/tests/mobile_sdk_python312_contract.sh"
      - "scripts/check_android_app_native_archive.py"
      - "scripts/tests/check_android_app_native_archive_test.py"
      - "scripts/norito_bridge_source_seal.py"
      - "scripts/run_mobile_hermetic_command.py"
      - "scripts/check_kotlin_no_reflection.sh"
      - "scripts/build_kagemusha_candidate_android_native.sh"
      - "scripts/run_kagemusha_candidate_android_lab.sh"
      - "ci/check_kagemusha_candidate_android_lab.sh"
      - "ci/check_kagemusha_candidate_android_lab_compile.sh"
      - "ci/check_kagemusha_jvm_native_bridge.sh"
      - "ci/check_android_transport_guard.sh"
      - "scripts/deploy_localnet.sh"
      - "scripts/tests/deploy_localnet_test.py"
      - "scripts/package_mobile_sdk_artifacts.sh"
      - "scripts/check_sorafs_release_automation.py"
      - "scripts/tests/check_sorafs_release_automation_test.py"
      - "IrohaSwift/**"
      - "kotlin/**"
      - "java/iroha_android/**"
      - "crates/connect_norito_bridge/**"
      - "crates/iroha_cli/**"
      - "crates/iroha_config/**"
      - "crates/iroha_core/**"
      - "crates/iroha_data_model/**"
      - "crates/iroha_kagami/**"
      - "crates/iroha_torii/**"
      - "crates/irohad/**"
      - "crates/iroha_core/src/smartcontracts/isi/mod.rs"
      - "crates/iroha_core/src/smartcontracts/isi/escrow.rs"
      - "crates/iroha_data_model/src/bin/cancel_asset_lock_fixtures.rs"
      - "crates/iroha_data_model/src/escrow.rs"
      - "crates/iroha_data_model/src/events/data/escrow.rs"
      - "crates/iroha_data_model/src/isi/mod.rs"
      - "crates/iroha_data_model/src/isi/escrow.rs"
      - "crates/iroha_data_model/src/isi/registry.rs"
      - "crates/iroha_data_model/src/testing/cancel_asset_lock.rs"
      - "crates/kotodama_lang/src/samples/native_escrow.ko"
      - "crates/kotodama_lang/src/samples/native_escrow.to"
      - "crates/sorafs_manifest/**"
      - "fixtures/sorafs_manifest/appeal_finance/**"
      - "fixtures/sorafs_manifest/governance/**"
      - "fixtures/sorafs_manifest/reference_sdk/**"
      - "fixtures/sorafs_manifest/reference_sdk_validation_inventory_v1.json"
      - "integration_tests/tests/native_escrow.rs"
      - "scripts/check_sorafs_reference_sdk_fixtures.py"
      - "scripts/check_native_sdk_abi22_artifact.py"
      - "scripts/compute_workspace_source_manifest.py"
      - "scripts/tests/check_native_sdk_abi22_artifact_test.py"
      - "scripts/tests/check_sorafs_fixture_workflow_contract_test.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version override; defaults to tag, PR number, or commit."
        required: false
        type: string
      privacy_production_enabled:
        description: "Build the opt-in real privacy prover/verifier after production-gate evidence is approved."
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ANDROID_PLATFORM_PACKAGE: platforms;android-35
  ANDROID_BUILD_TOOLS_PACKAGE: build-tools;35.0.0
  ANDROID_NDK_VERSION: 28.0.12674087
  # Tagged release artifacts always carry the real production prover. Manual
  # non-tag builds remain an explicit opt-in and pull requests stay fail-closed.
  PRIVACY_PRODUCTION_ENABLED: ${{ github.ref_type == 'tag' || inputs.privacy_production_enabled == true }}

jobs:
  checker-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Bind the canonical mobile Python
        shell: bash
        run: |
          mobile_python="$(python3 -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))')"
          [[ "$("$mobile_python" -I -S -B -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == "3.12" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
      - name: Shell syntax
        run: bash -n ci/check_kagemusha_candidate_android_lab.sh ci/check_kagemusha_jvm_native_bridge.sh ci/check_swift_pod_bridge.sh scripts/build_kagemusha_candidate_android_native.sh scripts/build_norito_xcframework.sh scripts/check_kotlin_no_reflection.sh scripts/check_mobile_sdk_artifacts.sh scripts/check_mobile_sdk_artifacts_test.sh scripts/check_swift_pod_bridge.sh scripts/deploy_localnet.sh scripts/package_mobile_sdk_artifacts.sh scripts/run_kagemusha_candidate_android_lab.sh scripts/tests/mobile_sdk_python312_contract.sh
      - name: Python syntax
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/mobile-sdk-pycache" python3 -I -S -B -m py_compile scripts/archive_norito_xcframework.py scripts/tests/archive_norito_xcframework_test.py scripts/tests/package_mobile_sdk_artifacts_test.py scripts/update_norito_bridge_swift_pins.py scripts/tests/update_norito_bridge_swift_pins_test.py scripts/validate_norito_bridge_xcframework.py scripts/tests/validate_norito_bridge_xcframework_test.py scripts/check_android_app_native_archive.py scripts/tests/check_android_app_native_archive_test.py scripts/check_native_sdk_abi22_artifact.py scripts/tests/check_native_sdk_abi22_artifact_test.py scripts/exec_with_file_lock.py scripts/tests/exec_with_file_lock_test.py scripts/norito_bridge_source_seal.py scripts/run_mobile_hermetic_command.py
      - name: Deterministic NoritoBridge archive owner fixtures
        run: python3 -I -S -B scripts/tests/archive_norito_xcframework_test.py
      - name: Atomic mobile SDK package publisher fixtures
        run: python3 -I -S -B scripts/tests/package_mobile_sdk_artifacts_test.py
      - name: NoritoBridge Swift pin owner fixtures
        run: python3 -I -S -B scripts/tests/update_norito_bridge_swift_pins_test.py
      - name: NoritoBridge XCFramework validator fixtures
        run: python3 -I -S -B scripts/tests/validate_norito_bridge_xcframework_test.py
      - name: Shared output lock fixtures
        run: python3 -I -S -B scripts/tests/exec_with_file_lock_test.py
      - name: Host native ABI-22 artifact checker fixtures
        run: python3 -B -m pytest -q scripts/tests/check_native_sdk_abi22_artifact_test.py
      - name: Android app native archive authenticator fixtures
        run: python3 -I -B scripts/tests/check_android_app_native_archive_test.py
      - name: Kotlin production reflection guard
        run: scripts/check_kotlin_no_reflection.sh
      - name: Candidate Android lab isolation contract
        run: ci/check_kagemusha_candidate_android_lab.sh
      - name: Artifact checker fixture tests
        run: bash scripts/check_mobile_sdk_artifacts_test.sh
      - name: Mobile Python 3.12 contract
        run: bash scripts/tests/mobile_sdk_python312_contract.sh

  apple-mobile-sdk:
    needs: checker-self-test
    runs-on: macos-14
    timeout-minutes: 120
    env:
      IROHA_REQUIRE_SORAFS_NATIVE_VALIDATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Bind the canonical mobile Python
        shell: bash
        run: |
          mobile_python="$(python3 -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))')"
          [[ "$("$mobile_python" -I -S -B -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == "3.12" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
      - name: Resolve artifact version
        run: |
          input_version="${{ github.event.inputs.version }}"
          if [[ -n "$input_version" ]]; then
            version="$input_version"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            version="pr-${{ github.event.pull_request.number }}-${GITHUB_SHA:0:12}"
          else
            version="${GITHUB_REF_NAME}-${GITHUB_SHA:0:12}"
          fi
          version="${version//\//-}"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          [[ "$source_date_epoch" =~ ^[1-9][0-9]*$ ]]
          echo "MOBILE_SDK_VERSION=$version" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
      - name: Prepare external Apple build and artifact roots
        run: |
          artifact_dir="$RUNNER_TEMP/iroha-mobile-apple-artifacts"
          build_dir="$RUNNER_TEMP/iroha-mobile-apple-build"
          package_dir="$RUNNER_TEMP/iroha-mobile-sdk-package"
          swift_scratch_dir="$RUNNER_TEMP/iroha-mobile-swift-build"
          mkdir -p "$artifact_dir" "$build_dir" "$package_dir" "$swift_scratch_dir"
          echo "MOBILE_SDK_APPLE_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_REQUIRE_EXTERNAL_APPLE_ARTIFACT=1" >> "$GITHUB_ENV"
          echo "NORITO_BRIDGE_OUT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "NORITO_BRIDGE_BUILD_DIR=$build_dir" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_PACKAGE_OUT_DIR=$package_dir" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_SWIFT_SCRATCH_DIR=$swift_scratch_dir" >> "$GITHUB_ENV"
      - name: Install Apple Rust targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
          cargo fetch --locked
      - name: Bind the first-release Apple Cargo envelope
        run: |
          cargo_target="$RUNNER_TEMP/iroha-mobile-apple-cargo"
          mkdir -p "$cargo_target"
          cargo_target="$(python3 -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$cargo_target")"
          rustc_path="$(rustup which --toolchain 1.93.1 rustc)"
          rustdoc_path="$(rustup which --toolchain 1.93.1 rustdoc)"
          echo "CARGO_BUILD_JOBS=1" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$cargo_target" >> "$GITHUB_ENV"
          echo "RUSTC=$rustc_path" >> "$GITHUB_ENV"
          echo "RUSTC_BOOTSTRAP=1" >> "$GITHUB_ENV"
          echo "RUSTDOC=$rustdoc_path" >> "$GITHUB_ENV"
      - name: Make reviewed Iroha source read-only
        run: chmod -R a-w "$GITHUB_WORKSPACE"
      - name: Build NoritoBridge XCFramework
        run: |
          build_args=()
          if [[ "$PRIVACY_PRODUCTION_ENABLED" == "true" ]]; then
            build_args+=(--privacy-production-enabled)
          fi
          scripts/build_norito_xcframework.sh "${build_args[@]}"
          if [[ "$PRIVACY_PRODUCTION_ENABLED" == "true" ]]; then
            test -f "$MOBILE_SDK_APPLE_ARTIFACT_DIR/NoritoBridge.xcframework/.privacy-production-enabled"
          else
            test ! -e "$MOBILE_SDK_APPLE_ARTIFACT_DIR/NoritoBridge.xcframework/.privacy-production-enabled"
          fi
      - name: Validate Apple mobile SDK artifact
        run: bash scripts/check_mobile_sdk_artifacts.sh --apple-only
      - name: CocoaPods structural lint (no capability skip)
        env:
          SWIFT_POD_REPORT_DIR: ${{ runner.temp }}/iroha-swift-pod-report
        run: ci/check_swift_pod_bridge.sh
      - name: Test Swift SDK
        working-directory: IrohaSwift
        run: >-
          swift test
          --disable-automatic-resolution
          --scratch-path "$MOBILE_SDK_SWIFT_SCRATCH_DIR"
      - name: Package Apple mobile SDK artifact
        run: bash scripts/package_mobile_sdk_artifacts.sh --apple --version "$MOBILE_SDK_VERSION"
      - name: Consume packaged XCFramework archive with SwiftPM
        shell: bash
        run: |
          archive="$MOBILE_SDK_PACKAGE_OUT_DIR/NoritoBridge-${MOBILE_SDK_VERSION}.xcframework.zip"
          /usr/bin/unzip -t "$archive"
          consumer="$(mktemp -d "$RUNNER_TEMP/norito-bridge-archive-consumer.XXXXXXXX")"
          trap 'rm -rf "$consumer"' EXIT
          cp "$archive" "$consumer/NoritoBridge.xcframework.zip"
          mkdir -p "$consumer/Sources/ArchiveConsumer"
          cat > "$consumer/Package.swift" <<'SWIFT'
          // swift-tools-version: 6.0
          import PackageDescription

          let package = Package(
              name: "NoritoBridgeArchiveConsumer",
              platforms: [.macOS(.v12)],
              products: [
                  .library(name: "ArchiveConsumer", targets: ["ArchiveConsumer"]),
              ],
              targets: [
                  .binaryTarget(
                      name: "NoritoBridge",
                      path: "NoritoBridge.xcframework.zip"
                  ),
                  .target(name: "ArchiveConsumer", dependencies: ["NoritoBridge"]),
              ]
          )
          SWIFT
          cat > "$consumer/Sources/ArchiveConsumer/ArchiveConsumer.swift" <<'SWIFT'
          import NoritoBridge

          public func archivedNativeBridgeAbiVersion() -> UInt32 {
              connect_norito_bridge_abi_version()
          }
          SWIFT
          swift build \
            --package-path "$consumer" \
            --disable-automatic-resolution \
            --scratch-path "$RUNNER_TEMP/norito-bridge-archive-consumer-build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-sdk-apple-${{ env.MOBILE_SDK_VERSION }}
          path: ${{ runner.temp }}/iroha-mobile-sdk-package/*
          if-no-files-found: error
          retention-days: 14

  android-mobile-sdk:
    needs: checker-self-test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      IROHA_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/target/debug
      IROHA_REQUIRE_SORAFS_NATIVE_VALIDATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Bind the canonical mobile Python
        shell: bash
        run: |
          mobile_python="$(python3 -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))')"
          [[ "$("$mobile_python" -I -S -B -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == "3.12" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
      - name: Resolve artifact version
        run: |
          input_version="${{ github.event.inputs.version }}"
          if [[ -n "$input_version" ]]; then
            version="$input_version"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            version="pr-${{ github.event.pull_request.number }}-${GITHUB_SHA:0:12}"
          else
            version="${GITHUB_REF_NAME}-${GITHUB_SHA:0:12}"
          fi
          version="${version//\//-}"
          maven_version="${version#v}"
          echo "MOBILE_SDK_VERSION=$version" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_MAVEN_VERSION=$maven_version" >> "$GITHUB_ENV"
      - name: Install Android SDK and NDK packages
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "ANDROID_HOME or ANDROID_SDK_ROOT must be set by the runner" >&2
            exit 1
          fi
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "sdkmanager not found at $sdkmanager" >&2
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "$ANDROID_PLATFORM_PACKAGE" "$ANDROID_BUILD_TOOLS_PACKAGE" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install Android Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo fetch --locked
      - name: Bind the first-release Android Cargo envelope
        run: |
          cargo_target="$RUNNER_TEMP/iroha-mobile-android-cargo"
          mkdir -p "$cargo_target"
          cargo_target="$(python3 -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$cargo_target")"
          rustc_path="$(rustup which --toolchain 1.93.1 rustc)"
          rustdoc_path="$(rustup which --toolchain 1.93.1 rustdoc)"
          echo "CARGO_BUILD_JOBS=1" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$cargo_target" >> "$GITHUB_ENV"
          echo "IROHA_NATIVE_LIBRARY_PATH=$cargo_target/debug" >> "$GITHUB_ENV"
          echo "RUSTC=$rustc_path" >> "$GITHUB_ENV"
          echo "RUSTC_BOOTSTRAP=1" >> "$GITHUB_ENV"
          echo "RUSTDOC=$rustdoc_path" >> "$GITHUB_ENV"
      - name: Prepare external Android build and artifact roots
        run: |
          artifact_dir="$RUNNER_TEMP/iroha-mobile-android-artifacts"
          gradle_home="$artifact_dir/gradle-user-home"
          project_cache="$artifact_dir/project-cache"
          gradle_tmp="$artifact_dir/tmp"
          java_sorafs_tmp="$gradle_tmp/java-sorafs"
          maven_repo="$artifact_dir/maven"
          package_dir="$RUNNER_TEMP/iroha-mobile-sdk-package"
          mkdir -p "$artifact_dir" "$gradle_home" "$project_cache" "$gradle_tmp" "$java_sorafs_tmp" "$maven_repo" "$package_dir"
          echo "MOBILE_SDK_ANDROID_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_ANDROID_MAVEN_REPO_DIR=$maven_repo" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_ANDROID_PROJECT_CACHE_DIR=$project_cache" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_ANDROID_GRADLE_TMP_DIR=$gradle_tmp" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_PACKAGE_OUT_DIR=$package_dir" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$gradle_home" >> "$GITHUB_ENV"
      - name: Compile candidate Android lab main and instrumentation sources only
        run: ci/check_kagemusha_candidate_android_lab_compile.sh
      - name: Build host SoraFS reference native bridge
        run: cargo build --locked -p connect_norito_bridge
      - name: Require fresh ABI-22 JNI bridge in complete Kotlin and Java suites
        env:
          KAGEMUSHA_JVM_NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/iroha-kotlin-zk-asset-localnet-evidence
        run: >-
          NORITO_MOBILE_JAVA_HOME="$JAVA_HOME"
          NORITO_MOBILE_ANDROID_HOME="$ANDROID_HOME"
          bash ci/check_kagemusha_jvm_native_bridge.sh
      - name: Upload Kotlin four-peer localnet evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kotlin-zk-asset-localnet-${{ env.MOBILE_SDK_VERSION }}
          path: ${{ runner.temp }}/iroha-kotlin-zk-asset-localnet-evidence/*
          if-no-files-found: error
          retention-days: 14
      - name: Make reviewed Iroha source read-only
        run: chmod -R a-w "$GITHUB_WORKSPACE"
      - name: Build Android native bridge libraries
        working-directory: kotlin
        run: >-
          ./gradlew
          --no-daemon
          --no-configuration-cache
          --project-cache-dir "$MOBILE_SDK_ANDROID_PROJECT_CACHE_DIR"
          -Djava.io.tmpdir="$MOBILE_SDK_ANDROID_GRADLE_TMP_DIR"
          -Dkotlin.daemon.runFilesPath="$MOBILE_SDK_ANDROID_GRADLE_TMP_DIR/kotlin-daemon"
          :client-android:buildNativeLibs
          -PprivacyProductionEnabled="$PRIVACY_PRODUCTION_ENABLED"
      - name: Test, lint, publish, and build Android SDK artifacts
        working-directory: kotlin
        run: |
          ./gradlew --no-daemon \
            --no-configuration-cache \
            --project-cache-dir "$MOBILE_SDK_ANDROID_PROJECT_CACHE_DIR" \
            -Djava.io.tmpdir="$MOBILE_SDK_ANDROID_GRADLE_TMP_DIR" \
            -Dkotlin.daemon.runFilesPath="$MOBILE_SDK_ANDROID_GRADLE_TMP_DIR/kotlin-daemon" \
            -PprivacyProductionEnabled="$PRIVACY_PRODUCTION_ENABLED" \
            -PirohaSdkVersion="$MOBILE_SDK_MAVEN_VERSION" \
            -PirohaSdkRepoDir="$MOBILE_SDK_ANDROID_MAVEN_REPO_DIR" \
            :client-android:testDebugUnitTest \
            :client-android:lintRelease \
            :offline-wallet-android:testDebugUnitTest \
            :offline-wallet-android:lintRelease \
            :core-jvm:publishReleasePublicationToMavenLocal \
            :client-android:publishReleasePublicationToMavenLocal \
            :offline-wallet-android:publishReleasePublicationToMavenLocal \
            :core-jvm:publishReleasePublicationToMobileSdkRepository \
            :client-android:publishReleasePublicationToMobileSdkRepository \
            :offline-wallet-android:publishReleasePublicationToMobileSdkRepository
      - name: Test mirrored Java Android Governance DAG reference validators
        working-directory: java/iroha_android
        env:
          ANDROID_HARNESS_MAINS: org.hyperledger.iroha.android.sorafs.SorafsReferenceValidatorsTests
        run: |
          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --project-cache-dir "$MOBILE_SDK_ANDROID_PROJECT_CACHE_DIR/java-sorafs" \
            -Djava.io.tmpdir="$MOBILE_SDK_ANDROID_GRADLE_TMP_DIR/java-sorafs" \
            -Dkotlin.daemon.runFilesPath="$MOBILE_SDK_ANDROID_GRADLE_TMP_DIR/kotlin-daemon-java-sorafs" \
            -PenableCycloneDx=false \
            :core:test \
            --tests org.hyperledger.iroha.android.GradleHarnessTests \
            :android:assembleRelease \
            --console=plain
      - name: Reject JVM transports in the Java Android release AAR
        env:
          ANDROID_TRANSPORT_GUARD_AAR: ${{ runner.temp }}/iroha-mobile-android-artifacts/gradle-build/iroha-android/android/outputs/aar/android-release.aar
        run: bash ci/check_android_transport_guard.sh
      - name: Validate Android mobile SDK artifact
        run: bash scripts/check_mobile_sdk_artifacts.sh --android-only --require-built-android
      - name: Package Android mobile SDK artifact
        run: bash scripts/package_mobile_sdk_artifacts.sh --android --version "$MOBILE_SDK_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-sdk-android-${{ env.MOBILE_SDK_VERSION }}
          path: ${{ runner.temp }}/iroha-mobile-sdk-package/*
          if-no-files-found: error
          retention-days: 14

  publish-release-assets:
    if: github.ref_type == 'tag'
    needs: [apple-mobile-sdk, android-mobile-sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mobile-sdk-*
          path: release-assets
          merge-multiple: true
      - name: Publish mobile SDK release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          find release-assets -maxdepth 1 -type f -print | sort
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "Mobile SDK artifacts for $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
