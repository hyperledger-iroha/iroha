name: Mobile SDK Artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mobile_sdk_artifacts.yml"
      - "Makefile"
      - "scripts/build_norito_xcframework.sh"
      - "scripts/archive_norito_xcframework.py"
      - "scripts/tests/archive_norito_xcframework_test.py"
      - "scripts/render_norito_bridge_podspec.py"
      - "scripts/tests/render_norito_bridge_podspec_test.py"
      - "scripts/tests/norito_bridge_source_seal_test.py"
      - "scripts/norito_bridge_apple_slice_handoff.py"
      - "scripts/tests/norito_bridge_apple_slice_handoff_test.py"
      - "scripts/tests/package_mobile_sdk_artifacts_test.py"
      - "scripts/update_norito_bridge_swift_pins.py"
      - "scripts/tests/update_norito_bridge_swift_pins_test.py"
      - "scripts/validate_norito_bridge_xcframework.py"
      - "scripts/tests/validate_norito_bridge_xcframework_test.py"
      - "scripts/exec_with_file_lock.py"
      - "scripts/tests/exec_with_file_lock_test.py"
      - "scripts/check_mobile_sdk_artifact_pin_commit.py"
      - "scripts/check_mobile_sdk_artifacts.sh"
      - "scripts/check_mobile_sdk_artifacts_test.sh"
      - "ci/check_swift_pod_bridge.sh"
      - "scripts/check_swift_pod_bridge.sh"
      - "scripts/tests/mobile_sdk_python312_contract.sh"
      - "scripts/check_android_app_native_archive.py"
      - "scripts/tests/check_android_app_native_archive_test.py"
      - "scripts/norito_bridge_source_seal.py"
      - "scripts/run_mobile_hermetic_command.py"
      - "scripts/check_kotlin_no_reflection.sh"
      - "scripts/build_kagemusha_candidate_android_native.sh"
      - "scripts/run_kagemusha_candidate_android_lab.sh"
      - "ci/check_kagemusha_candidate_android_lab.sh"
      - "ci/check_kagemusha_candidate_android_lab_compile.sh"
      - "ci/check_kagemusha_jvm_native_bridge.sh"
      - "ci/check_android_transport_guard.sh"
      - "scripts/deploy_localnet.sh"
      - "scripts/tests/deploy_localnet_test.py"
      - "scripts/package_mobile_sdk_artifacts.sh"
      - "scripts/kagemusha_mobile_production_authorization.py"
      - "scripts/tests/kagemusha_mobile_production_authorization_test.py"
      - "scripts/check_sorafs_release_automation.py"
      - "scripts/tests/check_sorafs_release_automation_test.py"
      - "IrohaSwift/**"
      - "kotlin/**"
      - "java/iroha_android/**"
      - "crates/connect_norito_bridge/**"
      - "crates/iroha_cli/**"
      - "crates/iroha_config/**"
      - "crates/iroha_core/**"
      - "crates/iroha_data_model/**"
      - "crates/iroha_kagami/**"
      - "crates/iroha_torii/**"
      - "crates/irohad/**"
      - "crates/iroha_core/src/smartcontracts/isi/mod.rs"
      - "crates/iroha_core/src/smartcontracts/isi/escrow.rs"
      - "crates/iroha_data_model/src/bin/cancel_asset_lock_fixtures.rs"
      - "crates/iroha_data_model/src/escrow.rs"
      - "crates/iroha_data_model/src/events/data/escrow.rs"
      - "crates/iroha_data_model/src/isi/mod.rs"
      - "crates/iroha_data_model/src/isi/escrow.rs"
      - "crates/iroha_data_model/src/isi/registry.rs"
      - "crates/iroha_data_model/src/testing/cancel_asset_lock.rs"
      - "crates/kotodama_lang/src/samples/native_escrow.ko"
      - "crates/kotodama_lang/src/samples/native_escrow.to"
      - "crates/sorafs_manifest/**"
      - "fixtures/sorafs_manifest/appeal_finance/**"
      - "fixtures/sorafs_manifest/governance/**"
      - "fixtures/sorafs_manifest/reference_sdk/**"
      - "fixtures/sorafs_manifest/reference_sdk_validation_inventory_v1.json"
      - "integration_tests/tests/native_escrow.rs"
      - "scripts/check_sorafs_reference_sdk_fixtures.py"
      - "scripts/check_native_sdk_abi22_artifact.py"
      - "scripts/compute_workspace_source_manifest.py"
      - "scripts/tests/check_native_sdk_abi22_artifact_test.py"
      - "scripts/tests/check_sorafs_fixture_workflow_contract_test.py"
      - "roadmap.md"
      - "specs/sorafs/v1_closure_ledger.md"
      - "specs/sorafs_reference_sdk_plan.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version override; defaults to tag, PR number, or commit."
        required: false
        type: string
      promotion_run_id:
        description: "Protected Kagemusha promotion run id; requires its exact attempt."
        required: false
        type: string
      promotion_run_attempt:
        description: "Protected Kagemusha promotion run attempt; requires its exact run id."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ANDROID_PLATFORM_PACKAGE: platforms;android-35
  ANDROID_BUILD_TOOLS_PACKAGE: build-tools;35.0.0
  ANDROID_NDK_VERSION: 28.0.12674087

jobs:
  checker-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject a noncanonical release tag before setup or build
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          [[ "$GITHUB_REPOSITORY" == "hyperledger-iroha/iroha" ]] || {
            echo "tagged mobile SDK releases are owned by hyperledger-iroha/iroha" >&2
            exit 1
          }
          IFS= read -r pod_version < IrohaSwift/VERSION
          [[ "$pod_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version_bytes="$(wc -c < IrohaSwift/VERSION | tr -d '[:space:]')"
          [[ "$version_bytes" == "$(( ${#pod_version} + 1 ))" ]] || {
            echo "IrohaSwift/VERSION must be one canonical ASCII SemVer plus newline" >&2
            exit 1
          }
          [[ "$GITHUB_REF_NAME" == "v${pod_version}" ]] || {
            echo "release tag $GITHUB_REF_NAME must equal canonical SDK tag v${pod_version}" >&2
            exit 1
          }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Bind the canonical mobile Python
        shell: bash
        run: |
          mobile_python="$(python3 -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))')"
          [[ "$("$mobile_python" -I -S -B -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == "3.12" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
      - name: Install pinned checker dependencies
        run: python3 -m pip install --disable-pip-version-check pytest==9.0.3
      - name: Shell syntax
        run: bash -n ci/check_kagemusha_candidate_android_lab.sh ci/check_kagemusha_jvm_native_bridge.sh ci/check_swift_pod_bridge.sh scripts/build_kagemusha_candidate_android_native.sh scripts/build_norito_xcframework.sh scripts/check_kotlin_no_reflection.sh scripts/check_mobile_sdk_artifacts.sh scripts/check_mobile_sdk_artifacts_test.sh scripts/check_swift_pod_bridge.sh scripts/deploy_localnet.sh scripts/package_mobile_sdk_artifacts.sh scripts/run_kagemusha_candidate_android_lab.sh scripts/tests/mobile_sdk_python312_contract.sh
      - name: Python syntax
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/mobile-sdk-pycache" python3 -I -S -B -m py_compile scripts/archive_norito_xcframework.py scripts/tests/archive_norito_xcframework_test.py scripts/render_norito_bridge_podspec.py scripts/tests/render_norito_bridge_podspec_test.py scripts/tests/norito_bridge_source_seal_test.py scripts/norito_bridge_apple_slice_handoff.py scripts/tests/norito_bridge_apple_slice_handoff_test.py scripts/tests/package_mobile_sdk_artifacts_test.py scripts/update_norito_bridge_swift_pins.py scripts/tests/update_norito_bridge_swift_pins_test.py scripts/validate_norito_bridge_xcframework.py scripts/tests/validate_norito_bridge_xcframework_test.py scripts/check_android_app_native_archive.py scripts/tests/check_android_app_native_archive_test.py scripts/check_native_sdk_abi22_artifact.py scripts/tests/check_native_sdk_abi22_artifact_test.py scripts/exec_with_file_lock.py scripts/tests/exec_with_file_lock_test.py scripts/norito_bridge_source_seal.py scripts/run_mobile_hermetic_command.py scripts/kagemusha_mobile_production_authorization.py scripts/tests/kagemusha_mobile_production_authorization_test.py
      - name: Deterministic NoritoBridge archive owner fixtures
        run: python3 -I -S -B scripts/tests/archive_norito_xcframework_test.py
      - name: NoritoBridge CocoaPods spec renderer fixtures
        run: python3 -I -S -B scripts/tests/render_norito_bridge_podspec_test.py
      - name: NoritoBridge source seal fixtures
        run: python3 -I -S -B scripts/tests/norito_bridge_source_seal_test.py
      - name: NoritoBridge Apple slice handoff fixtures
        run: python3 -I -S -B scripts/tests/norito_bridge_apple_slice_handoff_test.py
      - name: Atomic mobile SDK package publisher fixtures
        run: python3 -I -S -B scripts/tests/package_mobile_sdk_artifacts_test.py
      - name: NoritoBridge Swift pin owner fixtures
        run: python3 -I -S -B scripts/tests/update_norito_bridge_swift_pins_test.py
      - name: NoritoBridge XCFramework validator fixtures
        run: python3 -I -S -B scripts/tests/validate_norito_bridge_xcframework_test.py
      - name: Shared output lock fixtures
        run: python3 -I -S -B scripts/tests/exec_with_file_lock_test.py
      - name: Host native ABI-23 artifact checker fixtures
        run: python3 -B -m pytest -q scripts/tests/check_native_sdk_abi22_artifact_test.py
      - name: Android app native archive authenticator fixtures
        run: python3 -I -B scripts/tests/check_android_app_native_archive_test.py
      - name: Kagemusha mobile production authorization fixtures
        run: python3 -I -S -B scripts/tests/kagemusha_mobile_production_authorization_test.py
      - name: Kotlin production reflection guard
        run: scripts/check_kotlin_no_reflection.sh
      - name: Candidate Android lab isolation contract
        run: ci/check_kagemusha_candidate_android_lab.sh
      - name: Artifact checker fixture tests
        run: bash scripts/check_mobile_sdk_artifacts_test.sh
      - name: Mobile Python 3.12 contract
        run: bash scripts/tests/mobile_sdk_python312_contract.sh

  authorize-mobile-production:
    needs: checker-self-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      production: ${{ steps.resolve.outputs.production }}
      promotion_run_id: ${{ steps.resolve.outputs.promotion_run_id }}
      promotion_run_attempt: ${{ steps.resolve.outputs.promotion_run_attempt }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Resolve one exact protected promotion run
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          REQUESTED_PROMOTION_RUN_ATTEMPT: ${{ inputs.promotion_run_attempt }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          echo "production=false" >> "$GITHUB_OUTPUT"
          release_version="$(<IrohaSwift/VERSION)"
          [[ "$release_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          release_tag="v${release_version}"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          if [[ -n "$REQUESTED_PROMOTION_RUN_ID" || -n "$REQUESTED_PROMOTION_RUN_ATTEMPT" ]]; then
            [[ "$REQUESTED_PROMOTION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$REQUESTED_PROMOTION_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            if [[ -n "$REQUESTED_VERSION" && "$REQUESTED_VERSION" != "$release_tag" ]]; then
              echo "an authorized manual build must use the canonical release tag version" >&2
              exit 1
            fi
            promotion_run_id="$REQUESTED_PROMOTION_RUN_ID"
            promotion_run_attempt="$REQUESTED_PROMOTION_RUN_ATTEMPT"
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            runs="$RUNNER_TEMP/kagemusha-promotion-runs.json"
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/promote_kagemusha_v4.yml/runs" \
              -f branch=main -f event=workflow_dispatch -f status=success -f per_page=100 \
              > "$runs"
            read -r promotion_run_id promotion_run_attempt < <(
              python3 -I -S -B - "$runs" "$GITHUB_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          matches = sorted(
              (
                  (run.get("id"), run.get("run_attempt"))
                  for run in payload.get("workflow_runs", [])
                  if run.get("head_sha") == sys.argv[2]
                  and run.get("head_branch") == "main"
                  and run.get("event") == "workflow_dispatch"
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and run.get("path") == ".github/workflows/promote_kagemusha_v4.yml"
              ),
              reverse=True,
          )
          if not matches or type(matches[0][0]) is not int or type(matches[0][1]) is not int:
              raise SystemExit("no successful protected promotion run matches this release commit")
          print(*matches[0])
          PY
            )
          else
            exit 0
          fi
          run_metadata="$RUNNER_TEMP/kagemusha-promotion-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$promotion_run_id" > "$run_metadata"
          python3 -I -S -B - \
            "$run_metadata" "$promotion_run_id" "$promotion_run_attempt" "$GITHUB_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "id": int(sys.argv[2]),
              "run_attempt": int(sys.argv[3]),
              "head_sha": sys.argv[4],
              "head_branch": "main",
              "event": "workflow_dispatch",
              "status": "completed",
              "conclusion": "success",
              "path": ".github/workflows/promote_kagemusha_v4.yml",
          }
          if any(run.get(field) != value for field, value in expected.items()):
              raise SystemExit("selected promotion run metadata does not match this release")
          PY
          echo "production=true" >> "$GITHUB_OUTPUT"
          echo "promotion_run_id=$promotion_run_id" >> "$GITHUB_OUTPUT"
          echo "promotion_run_attempt=$promotion_run_attempt" >> "$GITHUB_OUTPUT"

  apple-mobile-sdk:
    needs: [checker-self-test, authorize-mobile-production]
    runs-on: macos-14
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    outputs:
      authorization_sha256: ${{ steps.verify-apple-authorization.outputs.authorization_sha256 }}
      package_inventory_sha256: ${{ steps.verify-apple-package.outputs.package_inventory_sha256 }}
    env:
      IROHA_REQUIRE_SORAFS_NATIVE_VALIDATION: "1"
      MOBILE_SDK_REQUIRE_KAGEMUSHA_PRODUCTION_AUTHORIZATION: "1"
      PRIVACY_PRODUCTION_ENABLED: ${{ needs.authorize-mobile-production.outputs.production }}
      KAGEMUSHA_PRODUCTION_AUTHORIZATION_SHA256: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Bind the canonical mobile Python
        shell: bash
        run: |
          mobile_python="$(python3 -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))')"
          [[ "$("$mobile_python" -I -S -B -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == "3.12" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
      - name: Download the exact Apple production authorization
        if: needs.authorize-mobile-production.outputs.production == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kagemusha-mobile-apple-production-authorization-${{ needs.authorize-mobile-production.outputs.promotion_run_id }}-${{ needs.authorize-mobile-production.outputs.promotion_run_attempt }}
          path: ${{ runner.temp }}/kagemusha-mobile-apple-authorization
          github-token: ${{ github.token }}
          run-id: ${{ needs.authorize-mobile-production.outputs.promotion_run_id }}
      - name: Verify and enable only the Apple production build
        id: verify-apple-authorization
        if: needs.authorize-mobile-production.outputs.production == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_RUN_ID: ${{ needs.authorize-mobile-production.outputs.promotion_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ needs.authorize-mobile-production.outputs.promotion_run_attempt }}
          RELEASE_TAG: ${{ needs.authorize-mobile-production.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/kagemusha-mobile-apple-authorization"
          authorization="$root/apple-production-authorization-v1.json"
          report="$root/kagami-release-verification-report.json"
          bundle="$root/github-attestations/provenance-1.json"
          test -z "$(find "$root" -type l -print -quit)"
          test "$(find "$root" -type f | wc -l | tr -d '[:space:]')" = 3
          test -f "$authorization" && test -f "$report" && test -f "$bundle"
          gh attestation verify "$authorization" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$bundle" \
            --cert-identity \
              "https://github.com/hyperledger-iroha/iroha/.github/workflows/promote_kagemusha_v4.yml@refs/heads/main" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com"
          workflow_ref="hyperledger-iroha/iroha/.github/workflows/promote_kagemusha_v4.yml@refs/heads/main"
          promotion_id="$(
            printf '%s\0%s\0%s\0%s\0%s\0%s\0' \
              iroha.kagemusha.github-promotion-run.v1 \
              "$GITHUB_REPOSITORY" "$workflow_ref" "$GITHUB_SHA" \
              "$PROMOTION_RUN_ID" "$PROMOTION_RUN_ATTEMPT" \
              | shasum -a 256 | awk '{print $1}'
          )"
          authorization_sha256="$("$MOBILE_SDK_PYTHON_BINARY" -I -S -B \
            scripts/kagemusha_mobile_production_authorization.py verify \
            --platform apple \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$workflow_ref" \
            --workflow-sha "$GITHUB_SHA" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$PROMOTION_RUN_ID" \
            --run-attempt "$PROMOTION_RUN_ATTEMPT" \
            --promotion-id "$promotion_id" \
            --release-tag "$RELEASE_TAG" \
            --authorization "$authorization" \
            --release-verification-report "$report")"
          [[ "$authorization_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "PRIVACY_PRODUCTION_ENABLED=true" >> "$GITHUB_ENV"
          echo "KAGEMUSHA_PRODUCTION_AUTHORIZATION_SHA256=$authorization_sha256" >> "$GITHUB_ENV"
          echo "authorization_sha256=$authorization_sha256" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
      - name: Resolve artifact version
        run: |
          input_version="${{ github.event.inputs.version }}"
          authorized_production="${{ needs.authorize-mobile-production.outputs.production }}"
          authorized_release_tag="${{ needs.authorize-mobile-production.outputs.release_tag }}"
          if [[ "$authorized_production" == "true" ]]; then
            [[ "$authorized_release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            version="$authorized_release_tag"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ -n "$input_version" ]]; then
            version="$input_version"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            version="pr-${{ github.event.pull_request.number }}-${GITHUB_SHA:0:12}"
          else
            version="${GITHUB_REF_NAME}-${GITHUB_SHA:0:12}"
          fi
          version="${version//\//-}"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          [[ "$source_date_epoch" =~ ^[1-9][0-9]*$ ]]
          echo "MOBILE_SDK_VERSION=$version" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
      - name: Require the canonical SDK release tag
        if: github.ref_type == 'tag'
        run: |
          [[ "$GITHUB_REPOSITORY" == "hyperledger-iroha/iroha" ]] || {
            echo "tagged mobile SDK releases are owned by hyperledger-iroha/iroha" >&2
            exit 1
          }
          pod_version="$(python3 -I -S -B - <<'PY'
          from pathlib import Path
          import re
          raw = Path("IrohaSwift/VERSION").read_bytes()
          match = re.fullmatch(rb"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\n", raw)
          if match is None:
              raise SystemExit("IrohaSwift/VERSION must be one canonical ASCII SemVer plus newline")
          print(raw[:-1].decode("ascii"))
          PY
          )"
          [[ "$GITHUB_REF_NAME" == "v${pod_version}" ]] || {
            echo "release tag $GITHUB_REF_NAME must equal canonical SDK tag v${pod_version}" >&2
            exit 1
          }
      - name: Prepare external Apple build and artifact roots
        run: |
          artifact_dir="$RUNNER_TEMP/iroha-mobile-apple-artifacts"
          build_dir="$RUNNER_TEMP/iroha-mobile-apple-build"
          package_dir="$RUNNER_TEMP/iroha-mobile-sdk-package"
          swift_scratch_dir="$RUNNER_TEMP/iroha-mobile-swift-build"
          mkdir -p "$artifact_dir" "$build_dir" "$swift_scratch_dir"
          test ! -e "$package_dir"
          echo "MOBILE_SDK_APPLE_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_REQUIRE_EXTERNAL_APPLE_ARTIFACT=1" >> "$GITHUB_ENV"
          echo "NORITO_BRIDGE_OUT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "NORITO_BRIDGE_BUILD_DIR=$build_dir" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_PACKAGE_OUT_DIR=$package_dir" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_SWIFT_SCRATCH_DIR=$swift_scratch_dir" >> "$GITHUB_ENV"
      - name: Install Apple Rust targets
        run: |
          rustup_source="$(command -v rustup)"
          rustup_source="$("$MOBILE_SDK_PYTHON_BINARY" -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$rustup_source")"
          [[ "$rustup_source" == /* && -f "$rustup_source" && ! -L "$rustup_source" && -x "$rustup_source" ]]
          rustup_tools="$RUNNER_TEMP/iroha-mobile-apple-tools"
          mkdir -p "$rustup_tools"
          chmod 0700 "$rustup_tools"
          rustup_path="$rustup_tools/rustup"
          test ! -e "$rustup_path"
          /bin/cp "$rustup_source" "$rustup_path"
          chmod 0700 "$rustup_path"
          rustup_path="$("$MOBILE_SDK_PYTHON_BINARY" -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$rustup_path")"
          [[ "$rustup_path" == /* && "${rustup_path##*/}" == rustup && -f "$rustup_path" && ! -L "$rustup_path" && -x "$rustup_path" ]]
          echo "MOBILE_SDK_RUSTUP_BINARY=$rustup_path" >> "$GITHUB_ENV"
          "$rustup_path" target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
          cargo fetch --locked
      - name: Bind the first-release Apple Cargo envelope
        run: |
          cargo_target="$RUNNER_TEMP/iroha-mobile-apple-cargo"
          mkdir -p "$cargo_target"
          cargo_target="$(python3 -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$cargo_target")"
          rustc_path="$("$MOBILE_SDK_RUSTUP_BINARY" which --toolchain 1.93.1 rustc)"
          rustdoc_path="$("$MOBILE_SDK_RUSTUP_BINARY" which --toolchain 1.93.1 rustdoc)"
          echo "CARGO_BUILD_JOBS=1" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$cargo_target" >> "$GITHUB_ENV"
          echo "RUSTC=$rustc_path" >> "$GITHUB_ENV"
          echo "RUSTC_BOOTSTRAP=1" >> "$GITHUB_ENV"
          echo "RUSTDOC=$rustdoc_path" >> "$GITHUB_ENV"
      - name: Make reviewed Iroha source read-only
        run: chmod -R a-w "$GITHUB_WORKSPACE"
      - name: Build NoritoBridge XCFramework
        run: |
          build_args=()
          if [[ "$PRIVACY_PRODUCTION_ENABLED" == "true" ]]; then
            build_args+=(--privacy-production-enabled)
          fi
          scripts/build_norito_xcframework.sh "${build_args[@]}"
          if [[ "$PRIVACY_PRODUCTION_ENABLED" == "true" ]]; then
            test -f "$MOBILE_SDK_APPLE_ARTIFACT_DIR/NoritoBridge.xcframework/.privacy-production-enabled"
          else
            test ! -e "$MOBILE_SDK_APPLE_ARTIFACT_DIR/NoritoBridge.xcframework/.privacy-production-enabled"
          fi
      - name: Validate Apple mobile SDK artifact
        run: bash scripts/check_mobile_sdk_artifacts.sh --apple-only
      - name: Test Swift SDK
        working-directory: IrohaSwift
        run: >-
          swift test
          --disable-automatic-resolution
          --scratch-path "$MOBILE_SDK_SWIFT_SCRATCH_DIR"
      - name: Package Apple mobile SDK artifact
        run: bash scripts/package_mobile_sdk_artifacts.sh --apple --version "$MOBILE_SDK_VERSION"
      - name: CocoaPods authenticated archive and source lint (no capability skip)
        env:
          SWIFT_POD_REPORT_DIR: ${{ runner.temp }}/iroha-swift-pod-report
        run: ci/check_swift_pod_bridge.sh
      - name: Consume packaged XCFramework archive with SwiftPM
        shell: bash
        run: |
          pod_version="$(python3 -I -S -B - <<'PY'
          from pathlib import Path
          import re
          raw = Path("IrohaSwift/VERSION").read_bytes()
          match = re.fullmatch(rb"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\n", raw)
          if match is None:
              raise SystemExit("IrohaSwift/VERSION must be one canonical ASCII SemVer plus newline")
          print(raw[:-1].decode("ascii"))
          PY
          )"
          archive="$MOBILE_SDK_PACKAGE_OUT_DIR/NoritoBridge-v${pod_version}.xcframework.zip"
          /usr/bin/unzip -t "$archive"
          consumer="$(mktemp -d "$RUNNER_TEMP/norito-bridge-archive-consumer.XXXXXXXX")"
          trap 'rm -rf "$consumer"' EXIT
          cp "$archive" "$consumer/NoritoBridge.xcframework.zip"
          mkdir -p "$consumer/Sources/ArchiveConsumer"
          cat > "$consumer/Package.swift" <<'SWIFT'
          // swift-tools-version: 6.0
          import PackageDescription

          let package = Package(
              name: "NoritoBridgeArchiveConsumer",
              platforms: [.macOS(.v12)],
              products: [
                  .library(name: "ArchiveConsumer", targets: ["ArchiveConsumer"]),
              ],
              targets: [
                  .binaryTarget(
                      name: "NoritoBridge",
                      path: "NoritoBridge.xcframework.zip"
                  ),
                  .target(name: "ArchiveConsumer", dependencies: ["NoritoBridge"]),
              ]
          )
          SWIFT
          cat > "$consumer/Sources/ArchiveConsumer/ArchiveConsumer.swift" <<'SWIFT'
          import NoritoBridge

          public func archivedNativeBridgeAbiVersion() -> UInt32 {
              connect_norito_bridge_abi_version()
          }
          SWIFT
          swift build \
            --package-path "$consumer" \
            --disable-automatic-resolution \
            --scratch-path "$RUNNER_TEMP/norito-bridge-archive-consumer-build"
      - name: Bind every Apple package byte to this build job
        id: verify-apple-package
        if: needs.authorize-mobile-production.outputs.production == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.authorize-mobile-production.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          package_inventory_sha256="$(
            "$MOBILE_SDK_PYTHON_BINARY" -I -S -B \
              scripts/kagemusha_mobile_production_authorization.py \
              verify-apple-artifact \
              --archive "$MOBILE_SDK_PACKAGE_OUT_DIR/NoritoBridge-${RELEASE_TAG}.xcframework.zip" \
              --manifest "$MOBILE_SDK_PACKAGE_OUT_DIR/NoritoBridge-${RELEASE_TAG}.artifacts.json" \
              --podspec "$MOBILE_SDK_PACKAGE_OUT_DIR/NoritoBridge-${RELEASE_TAG#v}.podspec" \
              --checksums "$MOBILE_SDK_PACKAGE_OUT_DIR/SHA256SUMS-apple-${RELEASE_TAG}.txt" \
              --package-manifest "$MOBILE_SDK_PACKAGE_OUT_DIR/mobile-sdk-apple-${RELEASE_TAG}.artifacts.json" \
              --release-tag "$RELEASE_TAG" \
              --source-sha "$GITHUB_SHA" \
              --authorization-sha256 "$KAGEMUSHA_PRODUCTION_AUTHORIZATION_SHA256"
          )"
          [[ "$package_inventory_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "package_inventory_sha256=$package_inventory_sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-sdk-apple-${{ env.MOBILE_SDK_VERSION }}
          path: ${{ runner.temp }}/iroha-mobile-sdk-package/*
          if-no-files-found: error
          retention-days: 14

  android-mobile-sdk:
    needs: [checker-self-test, authorize-mobile-production]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    outputs:
      authorization_sha256: ${{ steps.verify-android-authorization.outputs.authorization_sha256 }}
      package_inventory_sha256: ${{ steps.verify-android-package.outputs.package_inventory_sha256 }}
    env:
      IROHA_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/target/debug
      IROHA_REQUIRE_SORAFS_NATIVE_VALIDATION: "1"
      PRIVACY_PRODUCTION_ENABLED: ${{ needs.authorize-mobile-production.outputs.production }}
      KAGEMUSHA_PRODUCTION_AUTHORIZATION_SHA256: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Bind the canonical mobile Python
        shell: bash
        run: |
          mobile_python="$(python3 -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))')"
          [[ "$("$mobile_python" -I -S -B -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == "3.12" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
      - name: Download the exact Android production authorization
        if: needs.authorize-mobile-production.outputs.production == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kagemusha-mobile-android-production-authorization-${{ needs.authorize-mobile-production.outputs.promotion_run_id }}-${{ needs.authorize-mobile-production.outputs.promotion_run_attempt }}
          path: ${{ runner.temp }}/kagemusha-mobile-android-authorization
          github-token: ${{ github.token }}
          run-id: ${{ needs.authorize-mobile-production.outputs.promotion_run_id }}
      - name: Verify and enable only the Android production build
        id: verify-android-authorization
        if: needs.authorize-mobile-production.outputs.production == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_RUN_ID: ${{ needs.authorize-mobile-production.outputs.promotion_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ needs.authorize-mobile-production.outputs.promotion_run_attempt }}
          RELEASE_TAG: ${{ needs.authorize-mobile-production.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/kagemusha-mobile-android-authorization"
          authorization="$root/android-production-authorization-v1.json"
          report="$root/kagami-release-verification-report.json"
          bundle="$root/github-attestations/provenance-1.json"
          test -z "$(find "$root" -type l -print -quit)"
          test "$(find "$root" -type f | wc -l | tr -d '[:space:]')" = 3
          test -f "$authorization" && test -f "$report" && test -f "$bundle"
          gh attestation verify "$authorization" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$bundle" \
            --cert-identity \
              "https://github.com/hyperledger-iroha/iroha/.github/workflows/promote_kagemusha_v4.yml@refs/heads/main" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com"
          workflow_ref="hyperledger-iroha/iroha/.github/workflows/promote_kagemusha_v4.yml@refs/heads/main"
          promotion_id="$(
            printf '%s\0%s\0%s\0%s\0%s\0%s\0' \
              iroha.kagemusha.github-promotion-run.v1 \
              "$GITHUB_REPOSITORY" "$workflow_ref" "$GITHUB_SHA" \
              "$PROMOTION_RUN_ID" "$PROMOTION_RUN_ATTEMPT" \
              | sha256sum | awk '{print $1}'
          )"
          authorization_sha256="$("$MOBILE_SDK_PYTHON_BINARY" -I -S -B \
            scripts/kagemusha_mobile_production_authorization.py verify \
            --platform android \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$workflow_ref" \
            --workflow-sha "$GITHUB_SHA" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$PROMOTION_RUN_ID" \
            --run-attempt "$PROMOTION_RUN_ATTEMPT" \
            --promotion-id "$promotion_id" \
            --release-tag "$RELEASE_TAG" \
            --authorization "$authorization" \
            --release-verification-report "$report")"
          [[ "$authorization_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "PRIVACY_PRODUCTION_ENABLED=true" >> "$GITHUB_ENV"
          echo "KAGEMUSHA_PRODUCTION_AUTHORIZATION_SHA256=$authorization_sha256" >> "$GITHUB_ENV"
          echo "authorization_sha256=$authorization_sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
      - name: Resolve artifact version
        run: |
          input_version="${{ github.event.inputs.version }}"
          authorized_production="${{ needs.authorize-mobile-production.outputs.production }}"
          authorized_release_tag="${{ needs.authorize-mobile-production.outputs.release_tag }}"
          if [[ "$authorized_production" == "true" ]]; then
            [[ "$authorized_release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            version="$authorized_release_tag"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ -n "$input_version" ]]; then
            version="$input_version"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            version="pr-${{ github.event.pull_request.number }}-${GITHUB_SHA:0:12}"
          else
            version="${GITHUB_REF_NAME}-${GITHUB_SHA:0:12}"
          fi
          version="${version//\//-}"
          maven_version="${version#v}"
          echo "MOBILE_SDK_VERSION=$version" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_MAVEN_VERSION=$maven_version" >> "$GITHUB_ENV"
      - name: Require the canonical SDK release tag
        if: github.ref_type == 'tag'
        run: |
          [[ "$GITHUB_REPOSITORY" == "hyperledger-iroha/iroha" ]] || {
            echo "tagged mobile SDK releases are owned by hyperledger-iroha/iroha" >&2
            exit 1
          }
          pod_version="$(python3 -I -S -B - <<'PY'
          from pathlib import Path
          import re
          raw = Path("IrohaSwift/VERSION").read_bytes()
          match = re.fullmatch(rb"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\n", raw)
          if match is None:
              raise SystemExit("IrohaSwift/VERSION must be one canonical ASCII SemVer plus newline")
          print(raw[:-1].decode("ascii"))
          PY
          )"
          [[ "$GITHUB_REF_NAME" == "v${pod_version}" ]] || {
            echo "release tag $GITHUB_REF_NAME must equal canonical SDK tag v${pod_version}" >&2
            exit 1
          }
      - name: Install Android SDK and NDK packages
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "ANDROID_HOME or ANDROID_SDK_ROOT must be set by the runner" >&2
            exit 1
          fi
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "sdkmanager not found at $sdkmanager" >&2
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "$ANDROID_PLATFORM_PACKAGE" "$ANDROID_BUILD_TOOLS_PACKAGE" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install Android Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo fetch --locked
      - name: Bind the first-release Android Cargo envelope
        run: |
          cargo_target="$RUNNER_TEMP/iroha-mobile-android-cargo"
          mkdir -p "$cargo_target"
          cargo_target="$(python3 -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$cargo_target")"
          rustc_path="$(rustup which --toolchain 1.93.1 rustc)"
          rustdoc_path="$(rustup which --toolchain 1.93.1 rustdoc)"
          echo "CARGO_BUILD_JOBS=1" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$cargo_target" >> "$GITHUB_ENV"
          echo "IROHA_NATIVE_LIBRARY_PATH=$cargo_target/debug" >> "$GITHUB_ENV"
          echo "RUSTC=$rustc_path" >> "$GITHUB_ENV"
          echo "RUSTC_BOOTSTRAP=1" >> "$GITHUB_ENV"
          echo "RUSTDOC=$rustdoc_path" >> "$GITHUB_ENV"
      - name: Prepare external Android build and artifact roots
        run: |
          artifact_dir="$RUNNER_TEMP/iroha-mobile-android-artifacts"
          gradle_home="$artifact_dir/gradle-user-home"
          project_cache="$artifact_dir/project-cache"
          gradle_tmp="$artifact_dir/tmp"
          java_sorafs_tmp="$gradle_tmp/java-sorafs"
          maven_repo="$artifact_dir/maven"
          package_dir="$RUNNER_TEMP/iroha-mobile-sdk-package"
          mkdir -p "$artifact_dir" "$gradle_home" "$project_cache" "$gradle_tmp" "$java_sorafs_tmp" "$maven_repo"
          test ! -e "$package_dir"
          echo "MOBILE_SDK_ANDROID_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_ANDROID_MAVEN_REPO_DIR=$maven_repo" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_ANDROID_PROJECT_CACHE_DIR=$project_cache" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_ANDROID_GRADLE_TMP_DIR=$gradle_tmp" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_PACKAGE_OUT_DIR=$package_dir" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$gradle_home" >> "$GITHUB_ENV"
      - name: Warm exact Android compile dependencies
        run: ci/check_kagemusha_candidate_android_lab_compile.sh --warm-dependencies
      - name: Prove candidate Android lab compilation offline
        run: ci/check_kagemusha_candidate_android_lab_compile.sh
      - name: Build host SoraFS reference native bridge
        run: cargo build --locked -p connect_norito_bridge
      - name: Require fresh ABI-23 JNI bridge in complete Kotlin and Java suites
        env:
          KAGEMUSHA_JVM_NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/iroha-kotlin-zk-asset-localnet-evidence
        run: >-
          NORITO_MOBILE_JAVA_HOME="$JAVA_HOME"
          NORITO_MOBILE_ANDROID_HOME="$ANDROID_HOME"
          bash ci/check_kagemusha_jvm_native_bridge.sh
      - name: Upload Kotlin four-peer localnet evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kotlin-zk-asset-localnet-${{ env.MOBILE_SDK_VERSION }}
          path: ${{ runner.temp }}/iroha-kotlin-zk-asset-localnet-evidence/*
          if-no-files-found: error
          retention-days: 14
      - name: Make reviewed Iroha source read-only
        run: chmod -R a-w "$GITHUB_WORKSPACE"
      - name: Build Android native bridge libraries
        working-directory: kotlin
        run: >-
          ./gradlew
          --no-daemon
          --no-configuration-cache
          --project-cache-dir "$MOBILE_SDK_ANDROID_PROJECT_CACHE_DIR"
          -Djava.io.tmpdir="$MOBILE_SDK_ANDROID_GRADLE_TMP_DIR"
          -Dkotlin.daemon.runFilesPath="$MOBILE_SDK_ANDROID_GRADLE_TMP_DIR/kotlin-daemon"
          :client-android:buildNativeLibs
          -PprivacyProductionEnabled="$PRIVACY_PRODUCTION_ENABLED"
          -PrequireKagemushaProductionAuthorization=true
          -PkagemushaProductionAuthorizationSha256="$KAGEMUSHA_PRODUCTION_AUTHORIZATION_SHA256"
      - name: Test, lint, publish, and build Android SDK artifacts
        working-directory: kotlin
        run: |
          ./gradlew --no-daemon \
            --no-configuration-cache \
            --project-cache-dir "$MOBILE_SDK_ANDROID_PROJECT_CACHE_DIR" \
            -Djava.io.tmpdir="$MOBILE_SDK_ANDROID_GRADLE_TMP_DIR" \
            -Dkotlin.daemon.runFilesPath="$MOBILE_SDK_ANDROID_GRADLE_TMP_DIR/kotlin-daemon" \
            -PprivacyProductionEnabled="$PRIVACY_PRODUCTION_ENABLED" \
            -PrequireKagemushaProductionAuthorization=true \
            -PkagemushaProductionAuthorizationSha256="$KAGEMUSHA_PRODUCTION_AUTHORIZATION_SHA256" \
            -PirohaSdkVersion="$MOBILE_SDK_MAVEN_VERSION" \
            -PirohaSdkRepoDir="$MOBILE_SDK_ANDROID_MAVEN_REPO_DIR" \
            :client-android:testDebugUnitTest \
            :client-android:lintRelease \
            :offline-wallet-android:testDebugUnitTest \
            :offline-wallet-android:lintRelease \
            :core-jvm:publishReleasePublicationToMavenLocal \
            :client-android:publishReleasePublicationToMavenLocal \
            :offline-wallet-android:publishReleasePublicationToMavenLocal \
            :core-jvm:publishReleasePublicationToMobileSdkRepository \
            :client-android:publishReleasePublicationToMobileSdkRepository \
            :offline-wallet-android:publishReleasePublicationToMobileSdkRepository
      - name: Test mirrored Java Android Governance DAG reference validators
        working-directory: java/iroha_android
        env:
          ANDROID_HARNESS_MAINS: org.hyperledger.iroha.android.sorafs.SorafsReferenceValidatorsTests
        run: |
          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --project-cache-dir "$MOBILE_SDK_ANDROID_PROJECT_CACHE_DIR/java-sorafs" \
            -Djava.io.tmpdir="$MOBILE_SDK_ANDROID_GRADLE_TMP_DIR/java-sorafs" \
            -Dkotlin.daemon.runFilesPath="$MOBILE_SDK_ANDROID_GRADLE_TMP_DIR/kotlin-daemon-java-sorafs" \
            -PenableCycloneDx=false \
            :core:test \
            --tests org.hyperledger.iroha.android.GradleHarnessTests \
            :android:assembleRelease \
            --console=plain
      - name: Reject JVM transports in the Java Android release AAR
        env:
          ANDROID_TRANSPORT_GUARD_AAR: ${{ runner.temp }}/iroha-mobile-android-artifacts/gradle-build/iroha-android/android/outputs/aar/android-release.aar
        run: bash ci/check_android_transport_guard.sh
      - name: Validate Android mobile SDK artifact
        run: bash scripts/check_mobile_sdk_artifacts.sh --android-only --require-built-android
      - name: Package Android mobile SDK artifact
        run: bash scripts/package_mobile_sdk_artifacts.sh --android --version "$MOBILE_SDK_VERSION"
      - name: Bind every Android package byte to this build job
        id: verify-android-package
        if: needs.authorize-mobile-production.outputs.production == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.authorize-mobile-production.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          package_inventory_sha256="$(
            "$MOBILE_SDK_PYTHON_BINARY" -I -S -B \
              scripts/kagemusha_mobile_production_authorization.py \
              verify-android-artifact \
              --archive "$MOBILE_SDK_PACKAGE_OUT_DIR/iroha-mobile-sdk-android-${RELEASE_TAG}.zip" \
              --checksums "$MOBILE_SDK_PACKAGE_OUT_DIR/SHA256SUMS-android-${RELEASE_TAG}.txt" \
              --package-manifest "$MOBILE_SDK_PACKAGE_OUT_DIR/mobile-sdk-android-${RELEASE_TAG}.artifacts.json" \
              --release-tag "$RELEASE_TAG" \
              --source-sha "$GITHUB_SHA" \
              --authorization-sha256 "$KAGEMUSHA_PRODUCTION_AUTHORIZATION_SHA256"
          )"
          [[ "$package_inventory_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "package_inventory_sha256=$package_inventory_sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-sdk-android-${{ env.MOBILE_SDK_VERSION }}
          path: ${{ runner.temp }}/iroha-mobile-sdk-package/*
          if-no-files-found: error
          retention-days: 14

  publish-release-assets:
    if: >-
      github.ref_type == 'tag' &&
      github.repository == 'hyperledger-iroha/iroha' &&
      needs.authorize-mobile-production.outputs.production == 'true'
    needs: [authorize-mobile-production, apple-mobile-sdk, android-mobile-sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mobile-sdk-*
          path: release-assets
          merge-multiple: true
      - name: Download the exact Apple production authorization again
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kagemusha-mobile-apple-production-authorization-${{ needs.authorize-mobile-production.outputs.promotion_run_id }}-${{ needs.authorize-mobile-production.outputs.promotion_run_attempt }}
          path: ${{ runner.temp }}/publish-apple-authorization
          github-token: ${{ github.token }}
          run-id: ${{ needs.authorize-mobile-production.outputs.promotion_run_id }}
      - name: Download the exact Android production authorization again
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kagemusha-mobile-android-production-authorization-${{ needs.authorize-mobile-production.outputs.promotion_run_id }}-${{ needs.authorize-mobile-production.outputs.promotion_run_attempt }}
          path: ${{ runner.temp }}/publish-android-authorization
          github-token: ${{ github.token }}
          run-id: ${{ needs.authorize-mobile-production.outputs.promotion_run_id }}
      - name: Reverify both authorizations and production artifacts before publication
        id: reverify-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_BUILD_AUTHORIZATION_SHA256: ${{ needs.apple-mobile-sdk.outputs.authorization_sha256 }}
          APPLE_BUILD_PACKAGE_INVENTORY_SHA256: ${{ needs.apple-mobile-sdk.outputs.package_inventory_sha256 }}
          ANDROID_BUILD_AUTHORIZATION_SHA256: ${{ needs.android-mobile-sdk.outputs.authorization_sha256 }}
          ANDROID_BUILD_PACKAGE_INVENTORY_SHA256: ${{ needs.android-mobile-sdk.outputs.package_inventory_sha256 }}
          PROMOTION_RUN_ID: ${{ needs.authorize-mobile-production.outputs.promotion_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ needs.authorize-mobile-production.outputs.promotion_run_attempt }}
          RELEASE_TAG: ${{ needs.authorize-mobile-production.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          apple_root="$RUNNER_TEMP/publish-apple-authorization"
          android_root="$RUNNER_TEMP/publish-android-authorization"
          apple="$apple_root/apple-production-authorization-v1.json"
          android="$android_root/android-production-authorization-v1.json"
          apple_report="$apple_root/kagami-release-verification-report.json"
          android_report="$android_root/kagami-release-verification-report.json"
          apple_bundle="$apple_root/github-attestations/provenance-1.json"
          android_bundle="$android_root/github-attestations/provenance-1.json"
          release_root="$GITHUB_WORKSPACE/release-assets"
          python3 -I -S -B scripts/kagemusha_mobile_production_authorization.py \
            verify-release-inventory \
            --release-root "$release_root" \
            --release-tag "$RELEASE_TAG" \
            --phase artifacts >/dev/null
          for root in "$apple_root" "$android_root"; do
            test -z "$(find "$root" -type l -print -quit)"
            test "$(find "$root" -type f | wc -l | tr -d '[:space:]')" = 3
          done
          for path in \
            "$apple" "$android" "$apple_report" "$android_report" \
            "$apple_bundle" "$android_bundle"; do
            test -f "$path"
            test ! -L "$path"
          done
          certificate_identity="https://github.com/hyperledger-iroha/iroha/.github/workflows/promote_kagemusha_v4.yml@refs/heads/main"
          gh attestation verify "$apple" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$apple_bundle" \
            --cert-identity "$certificate_identity" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com"
          gh attestation verify "$android" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$android_bundle" \
            --cert-identity "$certificate_identity" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com"
          workflow_ref="hyperledger-iroha/iroha/.github/workflows/promote_kagemusha_v4.yml@refs/heads/main"
          promotion_id="$(
            printf '%s\0%s\0%s\0%s\0%s\0%s\0' \
              iroha.kagemusha.github-promotion-run.v1 \
              "$GITHUB_REPOSITORY" "$workflow_ref" "$GITHUB_SHA" \
              "$PROMOTION_RUN_ID" "$PROMOTION_RUN_ATTEMPT" \
              | sha256sum | awk '{print $1}'
          )"
          pair="$RUNNER_TEMP/kagemusha-mobile-authorization-pair.json"
          python3 -I -S -B scripts/kagemusha_mobile_production_authorization.py \
            verify-pair \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$workflow_ref" \
            --workflow-sha "$GITHUB_SHA" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$PROMOTION_RUN_ID" \
            --run-attempt "$PROMOTION_RUN_ATTEMPT" \
            --promotion-id "$promotion_id" \
            --release-tag "$RELEASE_TAG" \
            --apple-authorization "$apple" \
            --android-authorization "$android" \
            --apple-release-verification-report "$apple_report" \
            --android-release-verification-report "$android_report" \
            > "$pair"
          python3 -I -S -B - \
            "$pair" "$APPLE_BUILD_AUTHORIZATION_SHA256" \
            "$ANDROID_BUILD_AUTHORIZATION_SHA256" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          pair = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "apple_authorization_sha256": sys.argv[2],
              "android_authorization_sha256": sys.argv[3],
          }
          if any(re.fullmatch(r"[0-9a-f]{64}", value) is None for value in expected.values()):
              raise SystemExit("mobile build authorization outputs are missing")
          if any(pair.get(field) != value for field, value in expected.items()):
              raise SystemExit("mobile artifacts were not built from the reverified authorizations")
          PY
          apple_package_inventory_sha256="$(
            python3 -I -S -B scripts/kagemusha_mobile_production_authorization.py \
              verify-apple-artifact \
              --archive "$release_root/NoritoBridge-${RELEASE_TAG}.xcframework.zip" \
              --manifest "$release_root/NoritoBridge-${RELEASE_TAG}.artifacts.json" \
              --podspec "$release_root/NoritoBridge-${RELEASE_TAG#v}.podspec" \
              --checksums "$release_root/SHA256SUMS-apple-${RELEASE_TAG}.txt" \
              --package-manifest "$release_root/mobile-sdk-apple-${RELEASE_TAG}.artifacts.json" \
              --release-tag "$RELEASE_TAG" \
              --source-sha "$GITHUB_SHA" \
              --authorization-sha256 "$APPLE_BUILD_AUTHORIZATION_SHA256"
          )"
          android_package_inventory_sha256="$(
            python3 -I -S -B scripts/kagemusha_mobile_production_authorization.py \
              verify-android-artifact \
              --archive "$release_root/iroha-mobile-sdk-android-${RELEASE_TAG}.zip" \
              --checksums "$release_root/SHA256SUMS-android-${RELEASE_TAG}.txt" \
              --package-manifest "$release_root/mobile-sdk-android-${RELEASE_TAG}.artifacts.json" \
              --release-tag "$RELEASE_TAG" \
              --source-sha "$GITHUB_SHA" \
              --authorization-sha256 "$ANDROID_BUILD_AUTHORIZATION_SHA256"
          )"
          [[ "$APPLE_BUILD_PACKAGE_INVENTORY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ANDROID_BUILD_PACKAGE_INVENTORY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$apple_package_inventory_sha256" == "$APPLE_BUILD_PACKAGE_INVENTORY_SHA256" ]]
          [[ "$android_package_inventory_sha256" == "$ANDROID_BUILD_PACKAGE_INVENTORY_SHA256" ]]
          install -m 0444 "$apple" \
            release-assets/kagemusha-apple-production-authorization-v1.json
          install -m 0444 "$apple_report" \
            release-assets/kagemusha-apple-release-verification-report-v1.json
          install -m 0444 "$apple_bundle" \
            release-assets/kagemusha-apple-github-attestation-v1.json
          install -m 0444 "$android" \
            release-assets/kagemusha-android-production-authorization-v1.json
          install -m 0444 "$android_report" \
            release-assets/kagemusha-android-release-verification-report-v1.json
          install -m 0444 "$android_bundle" \
            release-assets/kagemusha-android-github-attestation-v1.json
          release_inventory_sha256="$(
            python3 -I -S -B scripts/kagemusha_mobile_production_authorization.py \
              verify-release-inventory \
              --release-root "$release_root" \
              --release-tag "$RELEASE_TAG" \
              --phase final
          )"
          [[ "$release_inventory_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "release_inventory_sha256=$release_inventory_sha256" >> "$GITHUB_OUTPUT"
      - name: Publish mobile SDK release assets
        env:
          EXPECTED_RELEASE_INVENTORY_SHA256: ${{ steps.reverify-release.outputs.release_inventory_sha256 }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$GITHUB_REPOSITORY" == "hyperledger-iroha/iroha" ]] || {
            echo "release publication is restricted to hyperledger-iroha/iroha" >&2
            exit 1
          }
          pod_version="$(python3 -I -S -B - <<'PY'
          from pathlib import Path
          import re
          raw = Path("IrohaSwift/VERSION").read_bytes()
          match = re.fullmatch(rb"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\n", raw)
          if match is None:
              raise SystemExit("IrohaSwift/VERSION must be one canonical ASCII SemVer plus newline")
          print(raw[:-1].decode("ascii"))
          PY
          )"
          if [[ "$GITHUB_REF_NAME" != "v${pod_version}" ]]; then
            echo "release tag $GITHUB_REF_NAME must equal canonical SDK tag v${pod_version}" >&2
            exit 1
          fi
          observed_release_inventory_sha256="$(
            python3 -I -S -B scripts/kagemusha_mobile_production_authorization.py \
              verify-release-inventory \
              --release-root "$GITHUB_WORKSPACE/release-assets" \
              --release-tag "$GITHUB_REF_NAME" \
              --phase final
          )"
          [[ "$EXPECTED_RELEASE_INVENTORY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$observed_release_inventory_sha256" == "$EXPECTED_RELEASE_INVENTORY_SHA256" ]] || {
            echo "release asset bytes changed after final verification" >&2
            exit 1
          }
          candidate_inventory="$(
            find release-assets -maxdepth 1 -type f -print | sort |
              while IFS= read -r candidate; do
                printf '%s %s\n' "${candidate##*/}" "$(wc -c <"$candidate" | tr -d '[:space:]')"
              done
          )"
          [[ -n "$candidate_inventory" ]] || {
            echo "release asset inventory is empty" >&2
            exit 1
          }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" == "true" ]] || {
              echo "existing release is public; refusing mutation" >&2
              exit 1
            }
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "Mobile SDK artifacts for $GITHUB_REF_NAME"
          fi
          existing_assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          [[ -z "$existing_assets" ]] || {
            echo "draft release already contains assets; refusing partial upload" >&2
            exit 1
          }
          gh release upload "$GITHUB_REF_NAME" release-assets/*
          remote_inventory="$(
            gh release view "$GITHUB_REF_NAME" --json assets \
              --jq '.assets[] | "\(.name) \(.size)"' | sort
          )"
          [[ "$remote_inventory" == "$candidate_inventory" ]] || {
            echo "uploaded release asset inventory is incomplete" >&2
            exit 1
          }
          verify_dir="$(mktemp -d "$RUNNER_TEMP/mobile-sdk-release-verify.XXXXXXXX")"
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" --dir "$verify_dir"
          while IFS= read -r candidate; do
            candidate_name="${candidate##*/}"
            [[ "$(sha256sum "$candidate" | cut -d' ' -f1)" == "$(sha256sum "$verify_dir/$candidate_name" | cut -d' ' -f1)" ]] || {
              echo "downloaded release asset digest mismatch: $candidate_name" >&2
              exit 1
            }
          done < <(find release-assets -maxdepth 1 -type f -print | sort)
          gh release edit "$GITHUB_REF_NAME" --draft=false
