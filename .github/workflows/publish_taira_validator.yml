name: Taira Full Release/Reset (exceptional)

on:
  workflow_dispatch:
    inputs:
      validator_release_ref:
        description: "Exact 40-character DPN API commit containing the reviewed source closure and Cargo.lock"
        required: true
        type: string
      privacy_v1_boi_artifact_run_id:
        description: "Exact prior run ID that produced the source-bound 13-file Privacy v1 BOI artifact handoff"
        required: true
        type: string

permissions:
  actions: read
  contents: read

# A Taira rollout is one fleet-wide state transition.  Serializing the whole
# workflow prevents a second approved dispatch from deploying between the
# first dispatch's health proof and publication.
concurrency:
  group: taira-validator-rollout
  cancel-in-progress: false

env:
  DPN_VALIDATOR_LOCK_SHA256: 4318f92184fedb10e9bc5cb5c47f1df930c419221be4bd61fbc41741d02f6289
  TAIRA_CONTROLLER_COMMAND: /usr/local/libexec/iroha-taira-release-controller-v1
  TAIRA_CONTROLLER_ROOT: /usr/local/libexec/iroha-taira-release-controller-v1.d

jobs:
  # GitHub leaves an unmatched self-hosted job queued for up to 24 hours.  A
  # few consecutive dispatches used to turn that into roughly 100 hours with
  # no checkout or build step ever starting.  Keep the release workflow's
  # global serialization, but fail the active dispatch within the promised
  # wall-clock budget and report every runner label that did not start.
  rollout-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 31
    permissions:
      actions: write
      contents: none
    steps:
      - name: Enforce the 30-minute rollout budget
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          deadline=$((SECONDS + 30 * 60))
          last_activity=$SECONDS
          previous_state=""
          while (( SECONDS < deadline )); do
            jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100")"
            if jq -e '.jobs[] | select(.name == "macos-publish" and .conclusion == "success")' \
              <<<"$jobs" >/dev/null; then
              exit 0
            fi
            if jq -e '.jobs[] | select(.name != "rollout-budget" and .status == "completed" and (.conclusion | IN("failure", "cancelled", "timed_out", "action_required", "stale")))' \
              <<<"$jobs" >/dev/null; then
              exit 0
            fi
            state="$(jq -c '[.jobs[] | select(.name != "rollout-budget") | {name,status,conclusion,runner_name}]' <<<"$jobs")"
            if [[ "$state" != "$previous_state" ]] || jq -e '.jobs[] | select(.name != "rollout-budget" and .status == "in_progress")' <<<"$jobs" >/dev/null; then
              previous_state="$state"
              last_activity=$SECONDS
            elif (( SECONDS - last_activity >= 2 * 60 )); then
              echo "::error::No Taira job ran for two minutes; a required self-hosted runner is unavailable"
              jq -r '.jobs[] | select(.status != "completed") | "::error::queued job=\(.name) runner=\(if (.runner_name // "") == "" then "unassigned" else .runner_name end) labels=\(.labels | join(","))"' <<<"$jobs"
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel"
              exit 1
            fi
            sleep 15
          done

          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100")"
          echo "::error::Taira rollout exceeded the 30-minute build-and-deploy budget"
          jq -r '.jobs[] | select(.status != "completed") | "::error::pending job=\(.name) status=\(.status) runner=\(if (.runner_name // "") == "" then "unassigned" else .runner_name end) labels=\(.labels | join(","))"' \
            <<<"$jobs"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel"
          exit 1

  # Audit the complete fixed native client and all eight authenticated authority
  # call paths on a hosted runner before reserving native builders.  The actual
  # role sockets, brokers, and replay journals remain externally provisioned and
  # each protected operation fails closed when its role preflight cannot reach them.
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify all authenticated release-authority source paths
        run: python3 -I -S scripts/check_taira_release_prerequisites.py

  # This job reads five explicitly public files.  It has no checkout and cannot
  # sign, build, qualify, deploy, or publish.  Its protected environment must
  # contain only the public input path and controller/host trust pins.
  public-privacy-input:
    needs: release-readiness
    environment: taira-validator-public-input
    runs-on: [self-hosted, Linux, ARM64, taira-public-input]
    timeout-minutes: 30
    steps:
      - name: Attest the distinct public-input controller host
        shell: bash
        env:
          EXPECTED_LAUNCHER_SHA256: ${{ vars.TAIRA_RELEASE_CONTROLLER_LAUNCHER_SHA256 }}
          EXPECTED_CONTROLLER_DIGEST: ${{ vars.TAIRA_LINUX_RELEASE_CONTROLLER_DIGEST }}
          EXPECTED_CONTROLLER_VERSION: ${{ vars.TAIRA_RELEASE_CONTROLLER_VERSION }}
          EXPECTED_HOST_ID: ${{ vars.TAIRA_PUBLIC_INPUT_HOST_ID }}
          EXPECTED_INSTALLATION_ID: ${{ vars.TAIRA_PUBLIC_INPUT_INSTALLATION_ID }}
          EXPECTED_UID: "0"
          TAIRA_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          for value in "$EXPECTED_LAUNCHER_SHA256" "$EXPECTED_CONTROLLER_DIGEST"; do
            [[ "$value" =~ ^[0-9a-f]{64}$ ]]
          done
          test -n "$EXPECTED_CONTROLLER_VERSION"
          test -n "$EXPECTED_HOST_ID"
          test -n "$EXPECTED_INSTALLATION_ID"
          [[ "$EXPECTED_UID" =~ ^(0|[1-9][0-9]*)$ ]]
          [[ "$TAIRA_WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(sha256sum "$TAIRA_CONTROLLER_COMMAND" | awk '{print $1}')" = "$EXPECTED_LAUNCHER_SHA256"
          record="$(
            sudo -n "$TAIRA_CONTROLLER_COMMAND" attest \
              --expected-launcher-sha256 "$EXPECTED_LAUNCHER_SHA256" \
              --expected-controller-digest "$EXPECTED_CONTROLLER_DIGEST" \
              --expected-version "$EXPECTED_CONTROLLER_VERSION" \
              --expected-host-id "$EXPECTED_HOST_ID" \
              --expected-installation-id "$EXPECTED_INSTALLATION_ID" \
              --expected-uid "$EXPECTED_UID" \
              --source-commit "$TAIRA_WORKFLOW_COMMIT" \
              --platform linux \
              --role public-input-authority
          )"
          printf '%s' "$record" | /usr/bin/python3 -I -S -c \
            'import json,sys; v=json.load(sys.stdin); assert v["role"]=="public-input-authority"; assert v["host_id"]==sys.argv[1]; assert v["installation_id"]==sys.argv[2]; assert v["uid"]==int(sys.argv[3])' \
            "$EXPECTED_HOST_ID" "$EXPECTED_INSTALLATION_ID" "$EXPECTED_UID"

      - name: Snapshot only the five public NEVO/privacy inputs with the installed controller
        shell: bash
        env:
          EXPECTED_LAUNCHER_SHA256: ${{ vars.TAIRA_RELEASE_CONTROLLER_LAUNCHER_SHA256 }}
          EXPECTED_CONTROLLER_DIGEST: ${{ vars.TAIRA_LINUX_RELEASE_CONTROLLER_DIGEST }}
          EXPECTED_CONTROLLER_VERSION: ${{ vars.TAIRA_RELEASE_CONTROLLER_VERSION }}
          EXPECTED_HOST_ID: ${{ vars.TAIRA_PUBLIC_INPUT_HOST_ID }}
          EXPECTED_INSTALLATION_ID: ${{ vars.TAIRA_PUBLIC_INPUT_INSTALLATION_ID }}
          EXPECTED_UID: "0"
          AUTHORITY_STAGING_ROOT: ${{ vars.TAIRA_PUBLIC_INPUT_STAGING_ROOT }}
          PUBLIC_INPUT_DIR: ${{ vars.TAIRA_PRIVACY_RELEASE_INPUT_DIR }}
          TAIRA_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test -n "$PUBLIC_INPUT_DIR"
          [[ "$AUTHORITY_STAGING_ROOT" == /* ]]
          handoff="$AUTHORITY_STAGING_ROOT/public-input-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$handoff"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" run \
            --expected-launcher-sha256 "$EXPECTED_LAUNCHER_SHA256" \
            --expected-controller-digest "$EXPECTED_CONTROLLER_DIGEST" \
            --expected-version "$EXPECTED_CONTROLLER_VERSION" \
            --expected-host-id "$EXPECTED_HOST_ID" \
            --expected-installation-id "$EXPECTED_INSTALLATION_ID" \
            --expected-uid "$EXPECTED_UID" \
            --source-commit "$TAIRA_WORKFLOW_COMMIT" \
            --platform linux \
            --role public-input-authority \
            snapshot-public-privacy -- \
              --source "$PUBLIC_INPUT_DIR" \
              --output "$handoff" \
              --forbidden-root "$GITHUB_WORKSPACE"
      - name: Upload the secret-free public privacy input handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taira-public-privacy-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ vars.TAIRA_PUBLIC_INPUT_STAGING_ROOT }}/public-input-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 7

  # Source checkout, reconstruction, Cargo build scripts, and the produced
  # binaries are hostile in this job.  This runner has no protected environment
  # and is never reused by a controller authority role.
  linux-native-build:
    needs: public-privacy-input
    runs-on: [self-hosted, Linux, ARM64, taira-untrusted-build]
    timeout-minutes: 360
    steps:
      - name: Require one exact validator release commit before checkout
        shell: bash
        env:
          TAIRA_INPUT_VALIDATOR_RELEASE_REF: ${{ inputs.validator_release_ref }}
          TAIRA_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$TAIRA_INPUT_VALIDATOR_RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TAIRA_WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the secret-free privacy input bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: taira-public-privacy-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taira-public-privacy-input

      - name: Reconstruct source and build the unsigned Linux archive
        shell: bash
        env:
          TAIRA_INPUT_VALIDATOR_RELEASE_REF: ${{ inputs.validator_release_ref }}
          TAIRA_BUILD_CACHE_ROOT: ${{ vars.TAIRA_LINUX_BUILD_CACHE_ROOT }}
          TAIRA_NATIVE_BUILD_JOBS: ${{ vars.TAIRA_NATIVE_BUILD_JOBS || '6' }}
        run: |
          set -Eeuo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          [[ "$TAIRA_NATIVE_BUILD_JOBS" =~ ^[1-9][0-9]*$ ]]
          (( TAIRA_NATIVE_BUILD_JOBS <= 16 ))
          cache_root="${TAIRA_BUILD_CACHE_ROOT:-$RUNNER_TOOL_CACHE/iroha-taira-linux-build}"
          [[ "$cache_root" == /* ]]
          test ! -L "$cache_root"
          test ! -L "$cache_root/cargo-target"
          mkdir -p "$cache_root/cargo-target"
          test ! -L "$cache_root"
          test ! -L "$cache_root/cargo-target"
          chmod 0700 "$cache_root" "$cache_root/cargo-target"
          cache_root="$(cd "$cache_root" && pwd -P)"
          source_root="$RUNNER_TEMP/taira-linux-source"
          bash configs/soranexus/taira/prepare_taira_release_source.sh \
            --workspace "$GITHUB_WORKSPACE" \
            --output-dir "$source_root" \
            --validator-release-ref "$TAIRA_INPUT_VALIDATOR_RELEASE_REF" \
            --validator-lock-sha256 "$DPN_VALIDATOR_LOCK_SHA256"
          source_manifest="$(/usr/bin/python3 -I -S - "$source_root/taira-source-identity-v1.json" <<'PY'
          import json, re, sys
          value=json.load(open(sys.argv[1], encoding="ascii"))["source"]["workspace_source_manifest_sha256"]
          if not isinstance(value, str) or re.fullmatch(r"[0-9a-f]{64}", value) is None: raise SystemExit("invalid reconstructed source identity")
          print(value)
          PY
          )"
          rustc_identity="$(rustc -Vv | /usr/bin/python3 -I -S -c 'import hashlib,sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())')"
          cache_key="$source_manifest-$TAIRA_INPUT_VALIDATOR_RELEASE_REF-$rustc_identity"
          target_root="$cache_root/cargo-target/$cache_key"
          test ! -L "$target_root"
          if [[ ! -e "$target_root" ]]; then mkdir -m 0700 "$target_root"; fi
          test -d "$target_root"
          test ! -L "$target_root"
          chmod 0700 "$target_root"
          output_dir="$RUNNER_TEMP/taira-linux-unsigned"
          mkdir -m 0700 "$output_dir"
          privacy_handoff="$RUNNER_TEMP/taira-public-privacy-input"
          privacy_input="$privacy_handoff/inputs"
          test -s "$privacy_handoff/handoff-inventory-v1.json"
          test -d "$privacy_input"
          chmod 0700 "$privacy_input"
          chmod 0600 \
            "$privacy_input/bootle_lantern_broker_public.json" \
            "$privacy_input/config.toml" \
            "$privacy_input/genesis.json" \
            "$privacy_input/nevo-reset.review.json" \
            "$privacy_input/privacy_bootstrap_plan.json"
          clean_build_env=(
            env -i "HOME=$HOME" "PATH=$PATH" "TMPDIR=${TMPDIR:-/tmp}" LANG=C LC_ALL=C
            "CARGO_BUILD_JOBS=$TAIRA_NATIVE_BUILD_JOBS"
            "CARGO_TARGET_DIR=$target_root"
            "IROHA_DPN_VALIDATOR_RELEASE_COMMIT=$TAIRA_INPUT_VALIDATOR_RELEASE_REF"
            "IROHA_VALIDATOR_LOCK_SHA256=$DPN_VALIDATOR_LOCK_SHA256"
            "IROHA_VALIDATOR_BUILD_PROVENANCE=$source_root/validator-build-provenance-v1.json"
            "IROHA_VALIDATOR_SOURCE_BUNDLE_DIR=$source_root/dpn-validator-release/source-bundle"
            "IROHA_VALIDATOR_SOURCE_VERIFIER=$source_root/dpn-validator-release/iroha_source_bundle.py"
            "TAIRA_PRIVACY_RELEASE_INPUT_SNAPSHOT_DIR=$privacy_input"
            "OUTPUT_DIR=$output_dir"
          )
          for name in CARGO_HOME RUSTUP_HOME; do
            if [[ -n "${!name:-}" ]]; then clean_build_env+=("$name=${!name}"); fi
          done
          "${clean_build_env[@]}" bash configs/soranexus/taira/build_taira_rollout_bundle.sh \
            --profile release --output-dir "$output_dir"
          cp "$source_root/taira-source-identity-v1.json" "$output_dir/taira-source-identity-v1.json"

      - name: Close the unsigned Linux handoff inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/bin/python3 -I -S - "$RUNNER_TEMP/taira-linux-unsigned" linux-unsigned <<'PY'
          import hashlib, json, os, re, stat, sys
          from pathlib import Path
          root = Path(sys.argv[1]).resolve(strict=True)
          archives = sorted(root.glob("taira-rollout-*-linux-aarch64.tar.gz"))
          if len(archives) != 1 or re.fullmatch(r"taira-rollout-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}-release-linux-aarch64\.tar\.gz", archives[0].name) is None:
              raise SystemExit("unsigned Linux archive name is not canonical")
          evidence = root / archives[0].name.removesuffix(".tar.gz")
          if not evidence.is_dir() or evidence.is_symlink():
              raise SystemExit("unsigned Linux evidence root is missing")
          if (root / f"{evidence.name}.authority").exists():
              raise SystemExit("hostile build produced an unexpected authority")
          rows = []
          for current, dirs, files in os.walk(root, followlinks=False):
              for name in dirs:
                  if (Path(current) / name).is_symlink(): raise SystemExit("handoff directory symlink")
              for name in files:
                  path = Path(current) / name
                  info = path.lstat()
                  if not stat.S_ISREG(info.st_mode) or stat.S_ISLNK(info.st_mode) or info.st_nlink != 1 or info.st_size <= 0:
                      raise SystemExit(f"unsafe handoff file: {path}")
                  payload = path.read_bytes()
                  rows.append({"path": path.relative_to(root).as_posix(), "sha256": hashlib.sha256(payload).hexdigest(), "size": len(payload)})
          rows.sort(key=lambda row: row["path"])
          manifest = {"files": rows, "kind": sys.argv[2], "schema": "iroha.taira.release_handoff", "schema_version": 1}
          target = root / "handoff-inventory-v1.json"
          descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_CLOEXEC, 0o600)
          try:
              payload = (json.dumps(manifest, ensure_ascii=True, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
              os.write(descriptor, payload); os.fsync(descriptor)
          finally: os.close(descriptor)
          PY

      - name: Upload inert unsigned Linux bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taira-linux-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taira-linux-unsigned/
          if-no-files-found: error
          retention-days: 7

  linux-native-authority:
    needs: [public-privacy-input, linux-native-build]
    environment: taira-validator-authority
    runs-on: [self-hosted, Linux, ARM64, taira-linux-authority]
    timeout-minutes: 90
    steps:
      - name: Download unsigned Linux bytes into quarantine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: taira-linux-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taira-linux-unsigned-quarantine

      - name: Download the trusted public-input snapshot into separate quarantine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: taira-public-privacy-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taira-linux-public-input-quarantine

      - name: Attest authority host and inspect every hostile handoff inode
        shell: bash
        env:
          EXPECTED_LAUNCHER_SHA256: ${{ vars.TAIRA_RELEASE_CONTROLLER_LAUNCHER_SHA256 }}
          EXPECTED_CONTROLLER_DIGEST: ${{ vars.TAIRA_LINUX_RELEASE_CONTROLLER_DIGEST }}
          EXPECTED_CONTROLLER_VERSION: ${{ vars.TAIRA_RELEASE_CONTROLLER_VERSION }}
          EXPECTED_HOST_ID: ${{ vars.TAIRA_LINUX_AUTHORITY_HOST_ID }}
          EXPECTED_INSTALLATION_ID: ${{ vars.TAIRA_LINUX_AUTHORITY_INSTALLATION_ID }}
          EXPECTED_UID: "0"
          TAIRA_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          for value in "$EXPECTED_LAUNCHER_SHA256" "$EXPECTED_CONTROLLER_DIGEST"; do [[ "$value" =~ ^[0-9a-f]{64}$ ]]; done
          test -n "$EXPECTED_CONTROLLER_VERSION"; test -n "$EXPECTED_HOST_ID"; test -n "$EXPECTED_INSTALLATION_ID"
          [[ "$EXPECTED_UID" =~ ^(0|[1-9][0-9]*)$ ]]
          test "$(sha256sum "$TAIRA_CONTROLLER_COMMAND" | awk '{print $1}')" = "$EXPECTED_LAUNCHER_SHA256"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" inspect-handoff \
            --expected-launcher-sha256 "$EXPECTED_LAUNCHER_SHA256" \
            --expected-controller-digest "$EXPECTED_CONTROLLER_DIGEST" \
            --expected-version "$EXPECTED_CONTROLLER_VERSION" \
            --expected-host-id "$EXPECTED_HOST_ID" \
            --expected-installation-id "$EXPECTED_INSTALLATION_ID" \
            --expected-uid "$EXPECTED_UID" \
            --source-commit "$TAIRA_WORKFLOW_COMMIT" --platform linux --role linux-authority \
            --root "$RUNNER_TEMP/taira-linux-unsigned-quarantine" --expected-kind linux-unsigned \
            --stage-name "linux-unsigned-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >"$RUNNER_TEMP/linux-inspection.json"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" inspect-handoff \
            --expected-launcher-sha256 "$EXPECTED_LAUNCHER_SHA256" \
            --expected-controller-digest "$EXPECTED_CONTROLLER_DIGEST" \
            --expected-version "$EXPECTED_CONTROLLER_VERSION" \
            --expected-host-id "$EXPECTED_HOST_ID" \
            --expected-installation-id "$EXPECTED_INSTALLATION_ID" \
            --expected-uid "$EXPECTED_UID" \
            --source-commit "$TAIRA_WORKFLOW_COMMIT" --platform linux --role linux-authority \
            --root "$RUNNER_TEMP/taira-linux-public-input-quarantine" --expected-kind public-privacy-input \
            --stage-name "linux-public-input-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >"$RUNNER_TEMP/linux-public-input-inspection.json"

      - name: Finalize and sign Linux bytes using only installed authority code
        shell: bash
        env:
          EXPECTED_LAUNCHER_SHA256: ${{ vars.TAIRA_RELEASE_CONTROLLER_LAUNCHER_SHA256 }}
          EXPECTED_CONTROLLER_DIGEST: ${{ vars.TAIRA_LINUX_RELEASE_CONTROLLER_DIGEST }}
          EXPECTED_CONTROLLER_VERSION: ${{ vars.TAIRA_RELEASE_CONTROLLER_VERSION }}
          EXPECTED_HOST_ID: ${{ vars.TAIRA_LINUX_AUTHORITY_HOST_ID }}
          EXPECTED_INSTALLATION_ID: ${{ vars.TAIRA_LINUX_AUTHORITY_INSTALLATION_ID }}
          EXPECTED_UID: "0"
          TAIRA_RELEASE_EXTERNAL_SIGNER_PATH: ${{ vars.TAIRA_RELEASE_EXTERNAL_SIGNER_PATH }}
          TAIRA_RELEASE_SIGNING_PUBLIC_KEY_PATH: ${{ vars.TAIRA_RELEASE_SIGNING_PUBLIC_KEY_PATH }}
          TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT: ${{ vars.TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT }}
          TAIRA_RELEASE_MANIFEST_VERIFIER_PATH: ${{ vars.TAIRA_RELEASE_MANIFEST_VERIFIER_PATH }}
          TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256: ${{ vars.TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256 }}
          TAIRA_INPUT_VALIDATOR_RELEASE_REF: ${{ inputs.validator_release_ref }}
          TAIRA_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          root="$(/usr/bin/python3 -I -S -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="ascii"))["staged_root"])' "$RUNNER_TEMP/linux-inspection.json")"
          public_root="$(/usr/bin/python3 -I -S -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="ascii"))["staged_root"])' "$RUNNER_TEMP/linux-public-input-inspection.json")"
          [[ "$root" == /* && "$public_root" == /* ]]; test -d "$root"; test -d "$public_root/inputs"
          IFS=$'\t' read -r archive evidence source_epoch dpn_commit < <(
            /usr/bin/python3 -I -S - "$root" <<'PY'
          import json, re, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          archives = sorted(root.glob("taira-rollout-*-linux-aarch64.tar.gz"))
          if len(archives) != 1 or re.fullmatch(r"taira-rollout-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}-release-linux-aarch64\.tar\.gz", archives[0].name) is None: raise SystemExit("archive contract")
          identity = json.loads((root / "taira-source-identity-v1.json").read_text(encoding="ascii"))
          epoch = identity["source_date_epoch"]
          if not isinstance(epoch, int) or isinstance(epoch, bool) or epoch <= 0: raise SystemExit("source epoch")
          source = identity["source"]
          print(archives[0], root / archives[0].name.removesuffix(".tar.gz"), epoch, source["dpn_validator_release_commit"], sep="\t")
          PY
          )
          test "$dpn_commit" = "$TAIRA_INPUT_VALIDATOR_RELEASE_REF"
          authority="$RUNNER_TEMP/taira-linux-authority-output"
          test ! -e "$authority"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" run \
            --expected-launcher-sha256 "$EXPECTED_LAUNCHER_SHA256" \
            --expected-controller-digest "$EXPECTED_CONTROLLER_DIGEST" \
            --expected-version "$EXPECTED_CONTROLLER_VERSION" \
            --expected-host-id "$EXPECTED_HOST_ID" \
            --expected-installation-id "$EXPECTED_INSTALLATION_ID" \
            --expected-uid "$EXPECTED_UID" \
            --source-commit "$TAIRA_WORKFLOW_COMMIT" --platform linux --role linux-authority \
            finalize-linux -- \
              --evidence-root "$evidence" --archive "$archive" --output-dir "$authority" \
              --dpn-validator-release-commit "$TAIRA_INPUT_VALIDATOR_RELEASE_REF" \
              --commit "$TAIRA_WORKFLOW_COMMIT" --source-date-epoch "$source_epoch" \
              --checkout-root "$root" \
              --public-privacy-input-dir "$public_root/inputs" \
              --controller-manifest "$TAIRA_CONTROLLER_ROOT/authority-controller-v1.json" \
              --controller-digest "$EXPECTED_CONTROLLER_DIGEST" \
              --external-signer "$TAIRA_RELEASE_EXTERNAL_SIGNER_PATH" \
              --signing-public-key "$TAIRA_RELEASE_SIGNING_PUBLIC_KEY_PATH" \
              --trusted-signing-fingerprint "$TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT" \
              --release-manifest-verifier "$TAIRA_RELEASE_MANIFEST_VERIFIER_PATH" \
              --trusted-release-manifest-verifier-sha256 "$TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256"
          stage="$RUNNER_TEMP/taira-linux-authority-handoff"
          mkdir -m 0700 "$stage"
          cp "$archive" "$stage/"
          cp "$root/taira-source-identity-v1.json" "$stage/"
          cp -R "$authority" "$stage/authority"
          /usr/bin/python3 -I -S - "$stage" linux-authority <<'PY'
          import hashlib,json,os,stat,sys
          from pathlib import Path
          root=Path(sys.argv[1]); rows=[]
          for path in sorted(value for value in root.rglob("*") if value.is_file()):
              info=path.lstat()
              if not stat.S_ISREG(info.st_mode) or stat.S_ISLNK(info.st_mode) or info.st_nlink != 1 or info.st_size <= 0: raise SystemExit("unsafe authority handoff")
              payload=path.read_bytes(); rows.append({"path":path.relative_to(root).as_posix(),"sha256":hashlib.sha256(payload).hexdigest(),"size":len(payload)})
          manifest={"files":rows,"kind":sys.argv[2],"schema":"iroha.taira.release_handoff","schema_version":1}
          target=root/"handoff-inventory-v1.json"; fd=os.open(target,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_CLOEXEC,0o600)
          try: os.write(fd,(json.dumps(manifest,ensure_ascii=True,sort_keys=True,separators=(",",":"))+"\n").encode("ascii")); os.fsync(fd)
          finally: os.close(fd)
          PY

      - name: Upload signed Linux authority handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taira-linux-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taira-linux-authority-handoff/
          if-no-files-found: error
          retention-days: 30

  # This build has no dependency on Linux authority bytes.  Qualification is
  # the first cross-target consumer, so start both expensive native builds in
  # parallel and compare their identities there.
  macos-native-build:
    needs: release-readiness
    runs-on: [self-hosted, macOS, ARM64, taira-untrusted-build]
    timeout-minutes: 360
    steps:
      - name: Require one exact validator release commit before checkout
        shell: bash
        env:
          TAIRA_INPUT_VALIDATOR_RELEASE_REF: ${{ inputs.validator_release_ref }}
        run: |
          set -Eeuo pipefail
          [[ "$TAIRA_INPUT_VALIDATOR_RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ github.sha }}" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Qualify authenticated-tool OS isolation on the build host
        shell: bash
        run: ci/check_authenticated_tool_controller.sh
      - name: Reconstruct and compile inert macOS binaries
        shell: bash
        env:
          TAIRA_INPUT_VALIDATOR_RELEASE_REF: ${{ inputs.validator_release_ref }}
          TAIRA_BUILD_CACHE_ROOT: ${{ vars.TAIRA_MACOS_BUILD_CACHE_ROOT }}
          TAIRA_NATIVE_BUILD_JOBS: ${{ vars.TAIRA_NATIVE_BUILD_JOBS || '6' }}
        run: |
          set -Eeuo pipefail
          test "$(uname -s)" = Darwin; test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          [[ "$TAIRA_NATIVE_BUILD_JOBS" =~ ^[1-9][0-9]*$ ]]
          (( TAIRA_NATIVE_BUILD_JOBS <= 16 ))
          cache_root="${TAIRA_BUILD_CACHE_ROOT:-$RUNNER_TOOL_CACHE/iroha-taira-macos-build}"
          [[ "$cache_root" == /* ]]
          test ! -L "$cache_root"
          test ! -L "$cache_root/cargo-target"
          mkdir -p "$cache_root/cargo-target"
          test ! -L "$cache_root"
          test ! -L "$cache_root/cargo-target"
          chmod 0700 "$cache_root" "$cache_root/cargo-target"
          cache_root="$(cd "$cache_root" && pwd -P)"
          source_root="$RUNNER_TEMP/taira-macos-source"
          bash configs/soranexus/taira/prepare_taira_release_source.sh \
            --workspace "$GITHUB_WORKSPACE" --output-dir "$source_root" \
            --validator-release-ref "$TAIRA_INPUT_VALIDATOR_RELEASE_REF" \
            --validator-lock-sha256 "$DPN_VALIDATOR_LOCK_SHA256"
          source_manifest="$(/usr/bin/python3 -I -S - "$source_root/taira-source-identity-v1.json" <<'PY'
          import json, re, sys
          value=json.load(open(sys.argv[1], encoding="ascii"))["source"]["workspace_source_manifest_sha256"]
          if not isinstance(value, str) or re.fullmatch(r"[0-9a-f]{64}", value) is None: raise SystemExit("invalid reconstructed source identity")
          print(value)
          PY
          )"
          rustc_identity="$(rustc -Vv | /usr/bin/python3 -I -S -c 'import hashlib,sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())')"
          cache_key="$source_manifest-$TAIRA_INPUT_VALIDATOR_RELEASE_REF-$rustc_identity"
          target_root="$cache_root/cargo-target/$cache_key"
          test ! -L "$target_root"
          if [[ ! -e "$target_root" ]]; then mkdir -m 0700 "$target_root"; fi
          test -d "$target_root"
          test ! -L "$target_root"
          chmod 0700 "$target_root"
          clean=(env -i "HOME=$HOME" "PATH=$PATH" "TMPDIR=${TMPDIR:-/tmp}" LANG=C LC_ALL=C CARGO_TARGET_DIR="$target_root" CARGO_BUILD_JOBS="$TAIRA_NATIVE_BUILD_JOBS" "IROHA_DPN_VALIDATOR_RELEASE_COMMIT=$TAIRA_INPUT_VALIDATOR_RELEASE_REF")
          for name in CARGO_HOME RUSTUP_HOME; do if [[ -n "${!name:-}" ]]; then clean+=("$name=${!name}"); fi; done
          "${clean[@]}" cargo build --locked --release -p irohad \
            --bin iroha3d --bin sorafs_external_software_signer \
            --features embedded-soracloud-runtime,external-software-signer-bin,zk-stark
          "${clean[@]}" cargo build --locked --release -p iroha_kagami \
            --bin iroha_authenticated_tool_controller --features dev-tools
          network_messages="$RUNNER_TEMP/taira-network-driver.jsonl"
          jindo_messages="$RUNNER_TEMP/taira-jindo-driver.jsonl"
          action_messages="$RUNNER_TEMP/taira-action-driver.jsonl"
          "${clean[@]}" cargo test --locked --release -p integration_tests --test network_functional --features "zk-stark privacy-release-evidence" --no-run --message-format=json >"$network_messages"
          "${clean[@]}" cargo test --locked --release -p iroha_core --lib --features "privacy-release-evidence,iroha-core-tests" --no-run --message-format=json >"$jindo_messages"
          "${clean[@]}" cargo build --locked --release -p iroha_core --bin privacy_exact12_action_driver --features "privacy-release-evidence,iroha-core-tests" --message-format=json >"$action_messages"
          network_driver="$(/usr/bin/python3 -I -S - "$network_messages" network_functional "$target_root" <<'PY'
          import json,os,stat,sys
          from pathlib import Path
          messages,target_name,target_root=Path(sys.argv[1]),sys.argv[2],Path(sys.argv[3]).resolve(strict=True)
          found=[]
          for line in messages.read_text(encoding="utf-8").splitlines():
              value=json.loads(line)
              executable=value.get("executable")
              target=value.get("target",{})
              if value.get("reason") == "compiler-artifact" and target.get("name") == target_name and executable:
                  path=Path(executable).resolve(strict=True); info=path.lstat()
                  if target_root not in path.parents or not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_size <= 0: raise SystemExit("unsafe native test driver")
                  found.append(path)
          if len(set(found)) != 1: raise SystemExit(f"expected one {target_name} native test driver, found {found}")
          print(found[0])
          PY
          )"
          jindo_driver="$(/usr/bin/python3 -I -S - "$jindo_messages" iroha_core "$target_root" <<'PY'
          import json,stat,sys
          from pathlib import Path
          messages,target_name,target_root=Path(sys.argv[1]),sys.argv[2],Path(sys.argv[3]).resolve(strict=True)
          found=[]
          for line in messages.read_text(encoding="utf-8").splitlines():
              value=json.loads(line)
              executable=value.get("executable")
              target=value.get("target",{})
              if value.get("reason") == "compiler-artifact" and target.get("name") == target_name and executable:
                  path=Path(executable).resolve(strict=True); info=path.lstat()
                  if target_root not in path.parents or not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_size <= 0: raise SystemExit("unsafe native test driver")
                  found.append(path)
          if len(set(found)) != 1: raise SystemExit(f"expected one {target_name} native test driver, found {found}")
          print(found[0])
          PY
          )"
          action_driver="$(/usr/bin/python3 -I -S - "$action_messages" privacy_exact12_action_driver "$target_root" <<'PY'
          import json,stat,sys
          from pathlib import Path
          messages,target_name,target_root=Path(sys.argv[1]),sys.argv[2],Path(sys.argv[3]).resolve(strict=True)
          found=[]
          for line in messages.read_text(encoding="utf-8").splitlines():
              value=json.loads(line)
              executable=value.get("executable")
              target=value.get("target",{})
              if value.get("reason") == "compiler-artifact" and target.get("name") == target_name and executable:
                  path=Path(executable).resolve(strict=True); info=path.lstat()
                  if target_root not in path.parents or not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_size <= 0: raise SystemExit("unsafe native action driver")
                  found.append(path)
          if len(set(found)) != 1: raise SystemExit(f"expected one {target_name} native action driver, found {found}")
          print(found[0])
          PY
          )"
          stage="$RUNNER_TEMP/taira-macos-build-handoff"
          mkdir -m 0700 "$stage" "$stage/bin" "$stage/drivers" "$stage/privacy" \
            "$stage/libexec" "$stage/smoke"
          install -m 0500 "$target_root/release/iroha3d" "$stage/bin/iroha3d"
          install -m 0500 "$target_root/release/iroha_authenticated_tool_controller" \
            "$stage/bin/iroha_authenticated_tool_controller"
          install -m 0500 "$network_driver" "$stage/drivers/network-functional"
          install -m 0500 "$jindo_driver" "$stage/drivers/iroha-core-tests"
          install -m 0500 "$action_driver" "$stage/drivers/privacy-exact12-action-driver"
          install -m 0600 "$GITHUB_WORKSPACE/fixtures/privacy/exact12_v1.tsv" "$stage/privacy/exact12_v1.tsv"
          install -m 0500 "$target_root/release/sorafs_external_software_signer" \
            "$stage/bin/sorafs_external_software_signer"
          install -m 0500 "$target_root/release/sorafs_external_software_signer" \
            "$stage/libexec/iroha-runtime-provider-broker-v1"
          cmp "$stage/bin/sorafs_external_software_signer" \
            "$stage/libexec/iroha-runtime-provider-broker-v1"
          "$stage/bin/sorafs_external_software_signer" --help \
            >"$stage/smoke/sorafs_external_software_signer.help.txt"
          "$stage/libexec/iroha-runtime-provider-broker-v1" --help \
            >"$stage/smoke/iroha-runtime-provider-broker-v1.help.txt"
          asset_root="$stage/share/iroha/sorafs"
          mkdir -p "$asset_root/external_software_signer" \
            "$asset_root/runtime_provider_broker"
          cp configs/sorafs/external_software_signer/README.md \
            "$asset_root/external_software_signer/README.md"
          cp -R configs/sorafs/external_software_signer/launchd \
            "$asset_root/external_software_signer/"
          cp configs/sorafs/runtime_provider_broker/README.md \
            "$asset_root/runtime_provider_broker/README.md"
          cp -R configs/sorafs/runtime_provider_broker/launchd \
            "$asset_root/runtime_provider_broker/"
          install -m 0600 "$source_root/taira-source-identity-v1.json" "$stage/taira-source-identity-v1.json"
          /usr/bin/python3 -I -S - "$stage" macos-build <<'PY'
          import hashlib,json,os,stat,sys
          from pathlib import Path
          root=Path(sys.argv[1]); rows=[]
          for path in sorted(value for value in root.rglob("*") if value.is_file()):
              info=path.lstat()
              if not stat.S_ISREG(info.st_mode) or stat.S_ISLNK(info.st_mode) or info.st_nlink != 1 or info.st_size <= 0: raise SystemExit("unsafe macOS build handoff")
              payload=path.read_bytes(); rows.append({"path":path.relative_to(root).as_posix(),"sha256":hashlib.sha256(payload).hexdigest(),"size":len(payload)})
          manifest={"files":rows,"kind":sys.argv[2],"schema":"iroha.taira.release_handoff","schema_version":1}
          target=root/"handoff-inventory-v1.json"; fd=os.open(target,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_CLOEXEC,0o600)
          try: os.write(fd,(json.dumps(manifest,ensure_ascii=True,sort_keys=True,separators=(",",":"))+"\n").encode("ascii")); os.fsync(fd)
          finally: os.close(fd)
          PY
      - name: Upload inert macOS build handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taira-macos-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taira-macos-build-handoff/
          if-no-files-found: error
          retention-days: 7

  # This host executes the produced validator under the installed root harness,
  # but receives only public trust anchors and disposable qualification inputs.
  # It has no production reset, release signer, registry, or deployment access.
  macos-secret-free-qualification:
    needs: [linux-native-authority, macos-native-build]
    environment: taira-validator-qualification
    runs-on: [self-hosted, macOS, ARM64, taira-secret-free-qualification]
    timeout-minutes: 180
    steps:
      - name: Download signed Linux handoff into quarantine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: taira-linux-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taira-qualification-linux-quarantine
      - name: Download inert macOS handoff into quarantine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: taira-macos-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taira-qualification-macos-quarantine
      - name: Inspect both hostile handoffs and run the installed qualification harness
        shell: bash
        env:
          EXPECTED_LAUNCHER_SHA256: ${{ vars.TAIRA_RELEASE_CONTROLLER_LAUNCHER_SHA256 }}
          EXPECTED_CONTROLLER_DIGEST: ${{ vars.TAIRA_MACOS_RELEASE_CONTROLLER_DIGEST }}
          EXPECTED_CONTROLLER_VERSION: ${{ vars.TAIRA_RELEASE_CONTROLLER_VERSION }}
          EXPECTED_HOST_ID: ${{ vars.TAIRA_QUALIFICATION_HOST_ID }}
          EXPECTED_INSTALLATION_ID: ${{ vars.TAIRA_QUALIFICATION_INSTALLATION_ID }}
          EXPECTED_UID: "0"
          AUTHORITY_STAGING_ROOT: ${{ vars.TAIRA_QUALIFICATION_STAGING_ROOT }}
          QUALIFICATION_SOURCE_RESET_BUNDLE_PATH: ${{ vars.TAIRA_QUALIFICATION_SOURCE_RESET_BUNDLE_PATH }}
          QUALIFICATION_SOURCE_RESET_BUNDLE_SHA256: ${{ vars.TAIRA_QUALIFICATION_SOURCE_RESET_BUNDLE_SHA256 }}
          QUALIFICATION_GENESIS_SIGNER_PATH: ${{ vars.TAIRA_QUALIFICATION_GENESIS_SIGNER_PATH }}
          QUALIFICATION_GENESIS_SIGNER_SHA256: ${{ vars.TAIRA_QUALIFICATION_GENESIS_SIGNER_SHA256 }}
          QUALIFICATION_KAGEMUSHA_RELEASE_ROOT: ${{ vars.TAIRA_QUALIFICATION_KAGEMUSHA_RELEASE_ROOT }}
          QUALIFICATION_KAGEMUSHA_ACTIVATION_AUTHORITY: ${{ vars.TAIRA_QUALIFICATION_KAGEMUSHA_ACTIVATION_AUTHORITY }}
          TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH: ${{ vars.TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH }}
          TAIRA_AUTHENTICATED_TOOL_CONTROLLER_SHA256: ${{ vars.TAIRA_AUTHENTICATED_TOOL_CONTROLLER_SHA256 }}
          TAIRA_GENESIS_NATIVE_VERIFIER_PATH: ${{ vars.TAIRA_GENESIS_NATIVE_VERIFIER_PATH }}
          TAIRA_GENESIS_NATIVE_VERIFIER_SHA256: ${{ vars.TAIRA_GENESIS_NATIVE_VERIFIER_SHA256 }}
          TAIRA_OPERATOR_STATUS_CLIENT_PATH: ${{ vars.TAIRA_OPERATOR_STATUS_CLIENT_PATH }}
          TAIRA_OPERATOR_STATUS_CLIENT_SHA256: ${{ vars.TAIRA_OPERATOR_STATUS_CLIENT_SHA256 }}
          TAIRA_ONBOARDING_TOKEN_HASH_TOOL_PATH: ${{ vars.TAIRA_ONBOARDING_TOKEN_HASH_TOOL_PATH }}
          TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT: ${{ vars.TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT }}
          TAIRA_RELEASE_MANIFEST_VERIFIER_PATH: ${{ vars.TAIRA_RELEASE_MANIFEST_VERIFIER_PATH }}
          TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256: ${{ vars.TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256 }}
          TAIRA_INPUT_VALIDATOR_RELEASE_REF: ${{ inputs.validator_release_ref }}
          TAIRA_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(shasum -a 256 "$TAIRA_CONTROLLER_COMMAND" | awk '{print $1}')" = "$EXPECTED_LAUNCHER_SHA256"
          linux_root="$RUNNER_TEMP/taira-qualification-linux-quarantine"
          mac_root="$RUNNER_TEMP/taira-qualification-macos-quarantine"
          common=(--expected-launcher-sha256 "$EXPECTED_LAUNCHER_SHA256" --expected-controller-digest "$EXPECTED_CONTROLLER_DIGEST" --expected-version "$EXPECTED_CONTROLLER_VERSION" --expected-host-id "$EXPECTED_HOST_ID" --expected-installation-id "$EXPECTED_INSTALLATION_ID" --expected-uid "$EXPECTED_UID" --source-commit "$TAIRA_WORKFLOW_COMMIT" --platform macos --role macos-qualification)
          attestation="$(sudo -n "$TAIRA_CONTROLLER_COMMAND" attest "${common[@]}")"
          IFS=$'\t' read -r runtime_identity_root handoff_root < <(/usr/bin/python3 -I -S -c 'import json,sys; v=json.load(sys.stdin); print(v["runtime_root"],v["handoff_root"],sep="\t")' <<<"$attestation")
          test "$handoff_root" = "$AUTHORITY_STAGING_ROOT"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" inspect-handoff "${common[@]}" --root "$linux_root" --expected-kind linux-authority --stage-name "qualification-linux-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >"$RUNNER_TEMP/linux-inspection.json"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" inspect-handoff "${common[@]}" --root "$mac_root" --expected-kind macos-build --stage-name "qualification-macos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >"$RUNNER_TEMP/macos-inspection.json"
          handoff_digest="$(/usr/bin/python3 -I -S -c 'import json,sys; v=json.load(open(sys.argv[1],encoding="ascii")); d=v["handoff_digest"]; assert len(d)==64; print(d)' "$RUNNER_TEMP/macos-inspection.json")"
          linux_stage="$(/usr/bin/python3 -I -S -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="ascii"))["staged_root"])' "$RUNNER_TEMP/linux-inspection.json")"
          mac_stage="$(/usr/bin/python3 -I -S -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="ascii"))["staged_root"])' "$RUNNER_TEMP/macos-inspection.json")"
          built_controller="$mac_stage/bin/iroha_authenticated_tool_controller"
          test "$(/usr/bin/shasum -a 256 "$built_controller" | /usr/bin/awk '{print $1}')" = "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_SHA256"
          [[ "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH" == /* ]]
          controller_parent="${TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH%/*}"
          controller_name="${TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH##*/}"
          test -n "$controller_name"
          test "$(cd "$controller_parent" && pwd -P)" = "$controller_parent"
          /usr/bin/python3 -I -S - "$controller_parent" "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH" <<'PY'
          import os, stat, sys
          from pathlib import Path
          parent=Path(sys.argv[1]); target=Path(sys.argv[2])
          if target.parent != parent or target.name in {"",".",".."} or target.resolve(strict=False) != target: raise SystemExit("authenticated-tool controller installation target is not canonical")
          for path in (parent,*parent.parents):
              info=os.lstat(path)
              if not stat.S_ISDIR(info.st_mode) or stat.S_ISLNK(info.st_mode) or info.st_uid != 0 or stat.S_IMODE(info.st_mode)&0o022: raise SystemExit("authenticated-tool controller installation parent is not root-custodied")
          PY
          controller_candidate="$controller_parent/.${controller_name}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.new"
          sudo -n /bin/test ! -d "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH"
          sudo -n /bin/test ! -L "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH"
          sudo -n /bin/test ! -e "$controller_candidate"
          sudo -n /bin/test ! -L "$controller_candidate"
          sudo -n /usr/bin/install -o root -g wheel -m 0555 "$built_controller" "$controller_candidate"
          test "$(sudo -n /usr/bin/shasum -a 256 "$controller_candidate" | /usr/bin/awk '{print $1}')" = "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_SHA256"
          sudo -n /usr/bin/cmp "$built_controller" "$controller_candidate"
          sudo -n /bin/mv -f -- "$controller_candidate" "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH"
          /usr/bin/python3 -I -S - "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH" <<'PY'
          import os, stat, sys
          from pathlib import Path
          path=Path(sys.argv[1]); info=os.lstat(path)
          if path.resolve(strict=True) != path or not stat.S_ISREG(info.st_mode) or stat.S_ISLNK(info.st_mode) or info.st_uid != 0 or info.st_gid != 0 or info.st_nlink != 1 or info.st_size <= 0 or stat.S_IMODE(info.st_mode) != 0o555: raise SystemExit("installed authenticated-tool controller identity is invalid")
          PY
          test "$(sudo -n /usr/bin/shasum -a 256 "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH" | /usr/bin/awk '{print $1}')" = "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_SHA256"
          sudo -n /usr/bin/cmp "$built_controller" "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH"
          qualification_result="$(sudo -n /usr/bin/env -i LANG=C LC_ALL=C PATH=/usr/bin:/bin TMPDIR=/private/var/tmp "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH" qualify-host-v1)"
          test "$qualification_result" = "authenticated-tool-controller: macOS host qualification passed"
          cmp "$linux_stage/taira-source-identity-v1.json" "$mac_stage/taira-source-identity-v1.json"
          IFS=$'\t' read -r source_commit dpn_commit cargo_lock source_manifest source_epoch < <(/usr/bin/python3 -I -S - "$mac_stage/taira-source-identity-v1.json" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding="ascii")); source=value["source"]
          print(source["commit"],source["dpn_validator_release_commit"],source["cargo_lock_sha256"],source["workspace_source_manifest_sha256"],value["source_date_epoch"],sep="\t")
          PY
          )
          test "$source_commit" = "$TAIRA_WORKFLOW_COMMIT"
          test "$dpn_commit" = "$TAIRA_INPUT_VALIDATOR_RELEASE_REF"
          if [[ -z "$QUALIFICATION_KAGEMUSHA_RELEASE_ROOT" || -z "$QUALIFICATION_KAGEMUSHA_ACTIVATION_AUTHORITY" ]]; then
            echo "qualification requires the complete protected Kagemusha release-root/activation-authority pair" >&2
            exit 1
          fi
          [[ "$QUALIFICATION_KAGEMUSHA_RELEASE_ROOT" == /* ]]
          test "$(cd "$QUALIFICATION_KAGEMUSHA_RELEASE_ROOT" && pwd -P)" = "$QUALIFICATION_KAGEMUSHA_RELEASE_ROOT"
          linux_archive="$(find "$linux_stage" -maxdepth 1 -type f -name '*.tar.gz' -print)"; test -n "$linux_archive"
          privacy="$runtime_identity_root/qualification-privacy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$privacy"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" run "${common[@]}" extract-privacy -- \
            --archive "$linux_archive" --authority-dir "$linux_stage/authority" \
            --dpn-validator-release-commit "$TAIRA_INPUT_VALIDATOR_RELEASE_REF" \
            --source-commit "$source_commit" --cargo-lock-sha256 "$cargo_lock" \
            --workspace-source-manifest-sha256 "$source_manifest" \
            --trusted-signing-fingerprint "$TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT" \
            --release-manifest-verifier "$TAIRA_RELEASE_MANIFEST_VERIFIER_PATH" \
            --trusted-release-manifest-verifier-sha256 "$TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256" \
            --output-dir "$privacy"
          reset="$runtime_identity_root/qualification-reset-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; binary_sha="$(shasum -a 256 "$mac_stage/bin/iroha3d" | awk '{print $1}')"
          test ! -e "$reset"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" run "${common[@]}" prepare-reset -- \
            --source-bundle "$QUALIFICATION_SOURCE_RESET_BUNDLE_PATH" \
            --source-bundle-sha256 "$QUALIFICATION_SOURCE_RESET_BUNDLE_SHA256" \
            --privacy-release-dir "$privacy" \
            --genesis-external-signer "$QUALIFICATION_GENESIS_SIGNER_PATH" \
            --trusted-genesis-external-signer-sha256 "$QUALIFICATION_GENESIS_SIGNER_SHA256" \
            --authenticated-tool-controller "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH" \
            --trusted-authenticated-tool-controller-sha256 "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_SHA256" \
            --genesis-native-verifier "$TAIRA_GENESIS_NATIVE_VERIFIER_PATH" \
            --trusted-genesis-native-verifier-sha256 "$TAIRA_GENESIS_NATIVE_VERIFIER_SHA256" \
            --operator-status-client "$TAIRA_OPERATOR_STATUS_CLIENT_PATH" \
            --trusted-operator-status-client-sha256 "$TAIRA_OPERATOR_STATUS_CLIENT_SHA256" \
            --onboarding-token-hash-tool "$TAIRA_ONBOARDING_TOKEN_HASH_TOOL_PATH" \
            --kagemusha-release-root "$QUALIFICATION_KAGEMUSHA_RELEASE_ROOT" \
            --kagemusha-activation-authority "$QUALIFICATION_KAGEMUSHA_ACTIVATION_AUTHORITY" \
            --irohad-sha256 "$binary_sha" --source-commit "$source_commit" \
            --dpn-validator-release-commit "$TAIRA_INPUT_VALIDATOR_RELEASE_REF" \
            --cargo-lock-sha256 "$cargo_lock" --workspace-source-manifest-sha256 "$source_manifest" \
            --controller-manifest "$TAIRA_CONTROLLER_ROOT/authority-controller-v1.json" \
            --controller-digest "$EXPECTED_CONTROLLER_DIGEST" --output-bundle "$reset"
          supervisor="$TAIRA_CONTROLLER_ROOT/scripts/taira_peer_supervisor.py"
          generation="$(printf 'iroha.taira.qualification.v2\0%s\0%s\0' "$handoff_digest" "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" | shasum -a 256 | awk '{print $1}')"
          stage="$AUTHORITY_STAGING_ROOT/qualification-receipt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; test ! -e "$stage"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" run "${common[@]}" capture-four-peer -- \
            --reset-bundle "$reset" --validator-binary "$mac_stage/bin/iroha3d" --supervisor "$supervisor" \
            --privacy-action-driver "$mac_stage/drivers/privacy-exact12-action-driver" \
            --privacy-network-driver "$mac_stage/drivers/network-functional" \
            --privacy-jindo-driver "$mac_stage/drivers/iroha-core-tests" \
            --linux-archive "$linux_archive" --exact12-matrix "$mac_stage/privacy/exact12_v1.tsv" \
            --artifact-handoff-sha256 "$handoff_digest" --source-commit "$source_commit" \
            --dpn-validator-release-commit "$TAIRA_INPUT_VALIDATOR_RELEASE_REF" \
            --cargo-lock-sha256 "$cargo_lock" --workspace-source-manifest-sha256 "$source_manifest" \
            --restart-generation "$generation" \
            --source-identity "$mac_stage/taira-source-identity-v1.json" \
            --output "$stage" --health-timeout-seconds 240
      - name: Upload secret-free qualification result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taira-qualification-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ vars.TAIRA_QUALIFICATION_STAGING_ROOT }}/qualification-receipt-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 7

  macos-candidate-authority:
    needs: macos-secret-free-qualification
    environment: taira-validator-authority
    runs-on: [self-hosted, macOS, ARM64, taira-candidate-authority]
    timeout-minutes: 90
    steps:
      - name: Download Linux authority bytes into quarantine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: taira-linux-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taira-candidate-linux-quarantine
      - name: Download qualification bytes into quarantine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: taira-qualification-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taira-candidate-receipt-quarantine
      - name: Download the source-bound BOI artifact handoff into quarantine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: privacy-v1-boi-artifacts-${{ github.sha }}-${{ inputs.validator_release_ref }}
          path: ${{ runner.temp }}/taira-candidate-boi-quarantine
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.privacy_v1_boi_artifact_run_id }}
      - name: Inspect, sign, and close the candidate with installed authority code
        shell: bash
        env:
          EXPECTED_LAUNCHER_SHA256: ${{ vars.TAIRA_RELEASE_CONTROLLER_LAUNCHER_SHA256 }}
          EXPECTED_CONTROLLER_DIGEST: ${{ vars.TAIRA_MACOS_RELEASE_CONTROLLER_DIGEST }}
          EXPECTED_CONTROLLER_VERSION: ${{ vars.TAIRA_RELEASE_CONTROLLER_VERSION }}
          EXPECTED_HOST_ID: ${{ vars.TAIRA_CANDIDATE_AUTHORITY_HOST_ID }}
          EXPECTED_INSTALLATION_ID: ${{ vars.TAIRA_CANDIDATE_AUTHORITY_INSTALLATION_ID }}
          EXPECTED_UID: "0"
          TAIRA_RELEASE_EXTERNAL_SIGNER_PATH: ${{ vars.TAIRA_RELEASE_EXTERNAL_SIGNER_PATH }}
          TAIRA_RELEASE_SIGNING_PUBLIC_KEY_PATH: ${{ vars.TAIRA_RELEASE_SIGNING_PUBLIC_KEY_PATH }}
          TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT: ${{ vars.TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT }}
          TAIRA_RELEASE_MANIFEST_VERIFIER_PATH: ${{ vars.TAIRA_RELEASE_MANIFEST_VERIFIER_PATH }}
          TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256: ${{ vars.TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256 }}
          TAIRA_INPUT_VALIDATOR_RELEASE_REF: ${{ inputs.validator_release_ref }}
          TAIRA_INPUT_BOI_ARTIFACT_RUN_ID: ${{ inputs.privacy_v1_boi_artifact_run_id }}
          TAIRA_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$TAIRA_INPUT_BOI_ARTIFACT_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          test "$(shasum -a 256 "$TAIRA_CONTROLLER_COMMAND" | awk '{print $1}')" = "$EXPECTED_LAUNCHER_SHA256"
          linux_root="$RUNNER_TEMP/taira-candidate-linux-quarantine"
          receipt_root="$RUNNER_TEMP/taira-candidate-receipt-quarantine"
          boi_root="$RUNNER_TEMP/taira-candidate-boi-quarantine"
          common=(--expected-launcher-sha256 "$EXPECTED_LAUNCHER_SHA256" --expected-controller-digest "$EXPECTED_CONTROLLER_DIGEST" --expected-version "$EXPECTED_CONTROLLER_VERSION" --expected-host-id "$EXPECTED_HOST_ID" --expected-installation-id "$EXPECTED_INSTALLATION_ID" --expected-uid "$EXPECTED_UID" --source-commit "$TAIRA_WORKFLOW_COMMIT" --platform macos --role macos-candidate-authority)
          sudo -n "$TAIRA_CONTROLLER_COMMAND" inspect-handoff "${common[@]}" --root "$linux_root" --expected-kind linux-authority --stage-name "candidate-linux-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >"$RUNNER_TEMP/candidate-linux-inspection.json"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" inspect-handoff "${common[@]}" --root "$receipt_root" --expected-kind qualification-receipt --stage-name "candidate-receipt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >"$RUNNER_TEMP/candidate-receipt-inspection.json"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" inspect-handoff "${common[@]}" --root "$boi_root" --expected-kind privacy-v1-boi-artifacts --stage-name "candidate-boi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >"$RUNNER_TEMP/candidate-boi-inspection.json"
          linux_stage="$(/usr/bin/python3 -I -S -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="ascii"))["staged_root"])' "$RUNNER_TEMP/candidate-linux-inspection.json")"
          receipt_stage="$(/usr/bin/python3 -I -S -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="ascii"))["staged_root"])' "$RUNNER_TEMP/candidate-receipt-inspection.json")"
          boi_stage="$(/usr/bin/python3 -I -S -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="ascii"))["staged_root"])' "$RUNNER_TEMP/candidate-boi-inspection.json")"
          cmp "$linux_stage/taira-source-identity-v1.json" "$receipt_stage/taira-source-identity-v1.json"
          IFS=$'\t' read -r source_commit dpn_commit cargo_lock source_manifest source_epoch receipt_id < <(/usr/bin/python3 -I -S - "$receipt_stage" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); identity=json.load(open(root/"taira-source-identity-v1.json",encoding="ascii")); receipt=json.load(open(root/"four-peer-receipt-v2.json",encoding="ascii")); source=identity["source"]
          print(source["commit"],source["dpn_validator_release_commit"],source["cargo_lock_sha256"],source["workspace_source_manifest_sha256"],identity["source_date_epoch"],receipt["receipt_id"],sep="\t")
          PY
          )
          test "$source_commit" = "$TAIRA_WORKFLOW_COMMIT"
          test "$dpn_commit" = "$TAIRA_INPUT_VALIDATOR_RELEASE_REF"
          linux_archive="$(find "$linux_stage" -maxdepth 1 -type f -name '*.tar.gz' -print)"
          candidate_dir="$RUNNER_TEMP/taira-final-candidate"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" run "${common[@]}" assemble-candidate -- assemble \
            --dpn-validator-release-commit "$TAIRA_INPUT_VALIDATOR_RELEASE_REF" \
            --source-commit "$source_commit" --cargo-lock-sha256 "$cargo_lock" \
            --workspace-source-manifest-sha256 "$source_manifest" --source-date-epoch "$source_epoch" \
            --linux-archive "$linux_archive" --linux-authority-dir "$linux_stage/authority" \
            --boi-artifact-handoff-dir "$boi_stage" \
            --macos-receipt "$receipt_stage/four-peer-receipt-v2.json" --expected-receipt-id "$receipt_id" \
            --privacy-protocol-evidence-dir "$receipt_stage/privacy-protocol-four-peer-v2" \
            --controller-manifest "$TAIRA_CONTROLLER_ROOT/authority-controller-v1.json" --controller-digest "$EXPECTED_CONTROLLER_DIGEST" \
            --trusted-signing-fingerprint "$TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT" \
            --release-manifest-verifier "$TAIRA_RELEASE_MANIFEST_VERIFIER_PATH" \
            --trusted-release-manifest-verifier-sha256 "$TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256" \
            --external-signer "$TAIRA_RELEASE_EXTERNAL_SIGNER_PATH" --signing-public-key "$TAIRA_RELEASE_SIGNING_PUBLIC_KEY_PATH" \
            --output-directory "$candidate_dir"
          stage="$RUNNER_TEMP/taira-candidate-handoff"; mkdir -m 0700 "$stage" "$stage/admission" "$stage/authority"
          archive="$(find "$candidate_dir" -maxdepth 1 -type f -name '*.tar.gz' -print)"; test -n "$archive"
          authority="${archive%.tar.gz}.authority"; test -d "$authority"
          install -m 0600 "$archive" "$stage/admission/$(basename "$archive")"
          for name in release_manifest.json release_manifest.json.pub release_manifest.json.sig; do install -m 0600 "$authority/$name" "$stage/authority/$name"; done
          install -m 0600 "$receipt_stage/taira-source-identity-v1.json" "$stage/taira-source-identity-v1.json"
          printf '%s\n' "$receipt_id" >"$stage/receipt-id"
          /usr/bin/python3 -I -S - "$stage" candidate <<'PY'
          import hashlib,json,os,stat,sys
          from pathlib import Path
          root=Path(sys.argv[1]); rows=[]
          for path in sorted(value for value in root.rglob("*") if value.is_file()):
              info=path.lstat()
              if not stat.S_ISREG(info.st_mode) or stat.S_ISLNK(info.st_mode) or info.st_nlink != 1 or info.st_size <= 0: raise SystemExit("unsafe candidate handoff")
              data=path.read_bytes(); rows.append({"path":path.relative_to(root).as_posix(),"sha256":hashlib.sha256(data).hexdigest(),"size":len(data)})
          value={"files":rows,"kind":sys.argv[2],"schema":"iroha.taira.release_handoff","schema_version":1}; target=root/"handoff-inventory-v1.json"
          fd=os.open(target,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_CLOEXEC,0o600)
          try: os.write(fd,(json.dumps(value,ensure_ascii=True,sort_keys=True,separators=(",",":"))+"\n").encode("ascii")); os.fsync(fd)
          finally: os.close(fd)
          PY
      - name: Upload authenticated candidate handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taira-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taira-candidate-handoff/
          if-no-files-found: error
          retention-days: 30

  # The macOS candidate authority performs the portable, static BOI rebind
  # before signing.  This distinct secret-free Linux/aarch64 authority then
  # re-admits that signed candidate and executes the native ABI and wheel
  # probes against a separately downloaded, freshly frozen copy of all 13
  # artifacts.  Neither an artifact-service pass marker nor mutable host state
  # can substitute for this controller-owned validation.
  linux-boi-qualification:
    needs: macos-candidate-authority
    environment: taira-validator-boi-qualification
    runs-on: [self-hosted, Linux, ARM64, taira-boi-qualification]
    timeout-minutes: 90
    steps:
      - name: Download the authenticated candidate into BOI quarantine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: taira-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taira-boi-candidate-quarantine
      - name: Download the source-bound BOI artifact handoff independently
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: privacy-v1-boi-artifacts-${{ github.sha }}-${{ inputs.validator_release_ref }}
          path: ${{ runner.temp }}/taira-boi-artifact-quarantine
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.privacy_v1_boi_artifact_run_id }}
      - name: Re-admit and assemble the exact BOI handoff with installed Linux authority code
        shell: bash
        env:
          EXPECTED_LAUNCHER_SHA256: ${{ vars.TAIRA_RELEASE_CONTROLLER_LAUNCHER_SHA256 }}
          EXPECTED_CONTROLLER_DIGEST: ${{ vars.TAIRA_LINUX_RELEASE_CONTROLLER_DIGEST }}
          EXPECTED_CONTROLLER_VERSION: ${{ vars.TAIRA_RELEASE_CONTROLLER_VERSION }}
          EXPECTED_HOST_ID: ${{ vars.TAIRA_BOI_QUALIFICATION_HOST_ID }}
          EXPECTED_INSTALLATION_ID: ${{ vars.TAIRA_BOI_QUALIFICATION_INSTALLATION_ID }}
          EXPECTED_UID: "0"
          TAIRA_BOI_QUALIFICATION_STAGING_ROOT: ${{ vars.TAIRA_BOI_QUALIFICATION_STAGING_ROOT }}
          TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT: ${{ vars.TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT }}
          TAIRA_BOI_QUALIFICATION_EXTERNAL_SIGNER_PATH: ${{ vars.TAIRA_BOI_QUALIFICATION_EXTERNAL_SIGNER_PATH }}
          TAIRA_BOI_QUALIFICATION_EXTERNAL_SIGNER_SHA256: ${{ vars.TAIRA_BOI_QUALIFICATION_EXTERNAL_SIGNER_SHA256 }}
          TAIRA_BOI_QUALIFICATION_SIGNING_PUBLIC_KEY_PATH: ${{ vars.TAIRA_BOI_QUALIFICATION_SIGNING_PUBLIC_KEY_PATH }}
          TAIRA_TRUSTED_BOI_QUALIFICATION_SIGNING_FINGERPRINT: ${{ vars.TAIRA_TRUSTED_BOI_QUALIFICATION_SIGNING_FINGERPRINT }}
          TAIRA_RELEASE_MANIFEST_VERIFIER_PATH: ${{ vars.TAIRA_RELEASE_MANIFEST_VERIFIER_PATH }}
          TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256: ${{ vars.TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256 }}
          TAIRA_INPUT_VALIDATOR_RELEASE_REF: ${{ inputs.validator_release_ref }}
          TAIRA_INPUT_BOI_ARTIFACT_RUN_ID: ${{ inputs.privacy_v1_boi_artifact_run_id }}
          TAIRA_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          [[ "$TAIRA_INPUT_BOI_ARTIFACT_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$TAIRA_BOI_QUALIFICATION_STAGING_ROOT" == /* ]]
          test "$(cd "$TAIRA_BOI_QUALIFICATION_STAGING_ROOT" && pwd -P)" = "$TAIRA_BOI_QUALIFICATION_STAGING_ROOT"
          test "$(sha256sum "$TAIRA_CONTROLLER_COMMAND" | awk '{print $1}')" = "$EXPECTED_LAUNCHER_SHA256"
          candidate_root="$RUNNER_TEMP/taira-boi-candidate-quarantine"
          boi_root="$RUNNER_TEMP/taira-boi-artifact-quarantine"
          common=(--expected-launcher-sha256 "$EXPECTED_LAUNCHER_SHA256" --expected-controller-digest "$EXPECTED_CONTROLLER_DIGEST" --expected-version "$EXPECTED_CONTROLLER_VERSION" --expected-host-id "$EXPECTED_HOST_ID" --expected-installation-id "$EXPECTED_INSTALLATION_ID" --expected-uid "$EXPECTED_UID" --source-commit "$TAIRA_WORKFLOW_COMMIT" --platform linux --role linux-boi-qualification)
          sudo -n "$TAIRA_CONTROLLER_COMMAND" inspect-handoff "${common[@]}" --root "$candidate_root" --expected-kind candidate --stage-name "boi-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >"$RUNNER_TEMP/boi-candidate-inspection.json"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" inspect-handoff "${common[@]}" --root "$boi_root" --expected-kind privacy-v1-boi-artifacts --stage-name "boi-artifacts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >"$RUNNER_TEMP/boi-artifact-inspection.json"
          candidate_stage="$(/usr/bin/python3 -I -S -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="ascii"))["staged_root"])' "$RUNNER_TEMP/boi-candidate-inspection.json")"
          boi_stage="$(/usr/bin/python3 -I -S -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="ascii"))["staged_root"])' "$RUNNER_TEMP/boi-artifact-inspection.json")"
          IFS=$'\t' read -r source_commit dpn_commit cargo_lock source_manifest receipt_id < <(/usr/bin/python3 -I -S - "$candidate_stage" <<'PY'
          import json,re,sys
          from pathlib import Path
          root=Path(sys.argv[1]); identity=json.load(open(root/"taira-source-identity-v1.json",encoding="ascii")); source=identity["source"]; receipt=(root/"receipt-id").read_text(encoding="ascii")
          if re.fullmatch(r"[0-9a-f]{64}\n",receipt) is None: raise SystemExit("candidate receipt ID differs")
          print(source["commit"],source["dpn_validator_release_commit"],source["cargo_lock_sha256"],source["workspace_source_manifest_sha256"],receipt.removesuffix("\n"),sep="\t")
          PY
          )
          test "$source_commit" = "$TAIRA_WORKFLOW_COMMIT"
          test "$dpn_commit" = "$TAIRA_INPUT_VALIDATOR_RELEASE_REF"
          mapfile -t candidate_archives < <(find "$candidate_stage/admission" -maxdepth 1 -type f -name '*.tar.gz' -print)
          test "${#candidate_archives[@]}" -eq 1
          candidate_archive="${candidate_archives[0]}"
          boi_output="$TAIRA_BOI_QUALIFICATION_STAGING_ROOT/boi-qualified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$boi_output"
          # The installed controller currently fails closed here until the
          # root-provisioned iroha.taira.boi-native-isolation-broker.v1,
          # iroha.taira.boi-authenticated-run-nonce.v1, and
          # iroha.taira.complete-source-identity-attestation.v1 contracts exist.
          # No workflow value or pass marker may bypass them.
          sudo -n "$TAIRA_CONTROLLER_COMMAND" run "${common[@]}" assemble-boi -- \
            --artifact-handoff-root "$boi_stage" \
            --candidate-archive "$candidate_archive" --candidate-authority-dir "$candidate_stage/authority" \
            --expected-source-commit "$source_commit" \
            --expected-dpn-validator-release-commit "$dpn_commit" --expected-cargo-lock-sha256 "$cargo_lock" \
            --expected-workspace-source-manifest-sha256 "$source_manifest" --expected-receipt-id "$receipt_id" \
            --trusted-signing-fingerprint "$TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT" \
            --qualification-external-signer "$TAIRA_BOI_QUALIFICATION_EXTERNAL_SIGNER_PATH" \
            --trusted-qualification-external-signer-sha256 "$TAIRA_BOI_QUALIFICATION_EXTERNAL_SIGNER_SHA256" \
            --qualification-signing-public-key "$TAIRA_BOI_QUALIFICATION_SIGNING_PUBLIC_KEY_PATH" \
            --trusted-qualification-signing-fingerprint "$TAIRA_TRUSTED_BOI_QUALIFICATION_SIGNING_FINGERPRINT" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --release-manifest-verifier "$TAIRA_RELEASE_MANIFEST_VERIFIER_PATH" \
            --trusted-release-manifest-verifier-sha256 "$TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256" \
            --output "$boi_output" >"$RUNNER_TEMP/privacy-v1-boi-qualification.json"
      - name: Upload the controller-closed BOI handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taira-privacy-v1-boi-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ vars.TAIRA_BOI_QUALIFICATION_STAGING_ROOT }}/boi-qualified-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30

  # This job owns production reset/deploy inputs and executes the already signed
  # validator.  It has neither release signing nor OCI publication authority.
  macos-deploy:
    needs: [macos-candidate-authority, linux-boi-qualification, macos-native-build, linux-native-authority]
    environment: taira-validator-deploy
    runs-on: [self-hosted, macOS, ARM64, taira-deploy]
    timeout-minutes: 180
    steps:
      - name: Download candidate into deployment quarantine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: taira-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taira-deploy-candidate-quarantine
      - name: Download qualified BOI handoff into deployment quarantine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: taira-privacy-v1-boi-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taira-deploy-boi-quarantine
      - name: Download macOS build into deployment quarantine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: taira-macos-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taira-deploy-macos-quarantine
      - name: Download Linux authority into deployment quarantine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: taira-linux-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taira-deploy-linux-quarantine
      - name: Prepare private reset and apply the signed candidate with the installed controller
        shell: bash
        env:
          EXPECTED_LAUNCHER_SHA256: ${{ vars.TAIRA_RELEASE_CONTROLLER_LAUNCHER_SHA256 }}
          EXPECTED_CONTROLLER_DIGEST: ${{ vars.TAIRA_MACOS_RELEASE_CONTROLLER_DIGEST }}
          EXPECTED_CONTROLLER_VERSION: ${{ vars.TAIRA_RELEASE_CONTROLLER_VERSION }}
          EXPECTED_HOST_ID: ${{ vars.TAIRA_DEPLOY_HOST_ID }}
          EXPECTED_INSTALLATION_ID: ${{ vars.TAIRA_DEPLOY_INSTALLATION_ID }}
          EXPECTED_UID: "0"
          TAIRA_MACOS_SOURCE_RESET_BUNDLE_PATH: ${{ vars.TAIRA_MACOS_SOURCE_RESET_BUNDLE_PATH }}
          TAIRA_MACOS_SOURCE_RESET_BUNDLE_SHA256: ${{ vars.TAIRA_MACOS_SOURCE_RESET_BUNDLE_SHA256 }}
          TAIRA_MACOS_RESET_STAGING_ROOT: ${{ vars.TAIRA_MACOS_RESET_STAGING_ROOT }}
          TAIRA_MACOS_GENESIS_EXTERNAL_SIGNER_PATH: ${{ vars.TAIRA_MACOS_GENESIS_EXTERNAL_SIGNER_PATH }}
          TAIRA_MACOS_GENESIS_EXTERNAL_SIGNER_SHA256: ${{ vars.TAIRA_MACOS_GENESIS_EXTERNAL_SIGNER_SHA256 }}
          TAIRA_MACOS_KAGEMUSHA_RELEASE_ROOT: ${{ vars.TAIRA_MACOS_KAGEMUSHA_RELEASE_ROOT }}
          TAIRA_MACOS_KAGEMUSHA_ACTIVATION_AUTHORITY: ${{ vars.TAIRA_MACOS_KAGEMUSHA_ACTIVATION_AUTHORITY }}
          TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH: ${{ vars.TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH }}
          TAIRA_AUTHENTICATED_TOOL_CONTROLLER_SHA256: ${{ vars.TAIRA_AUTHENTICATED_TOOL_CONTROLLER_SHA256 }}
          TAIRA_GENESIS_NATIVE_VERIFIER_PATH: ${{ vars.TAIRA_GENESIS_NATIVE_VERIFIER_PATH }}
          TAIRA_GENESIS_NATIVE_VERIFIER_SHA256: ${{ vars.TAIRA_GENESIS_NATIVE_VERIFIER_SHA256 }}
          TAIRA_OPERATOR_STATUS_CLIENT_PATH: ${{ vars.TAIRA_OPERATOR_STATUS_CLIENT_PATH }}
          TAIRA_OPERATOR_STATUS_CLIENT_SHA256: ${{ vars.TAIRA_OPERATOR_STATUS_CLIENT_SHA256 }}
          TAIRA_ONBOARDING_TOKEN_HASH_TOOL_PATH: ${{ vars.TAIRA_ONBOARDING_TOKEN_HASH_TOOL_PATH }}
          TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT: ${{ vars.TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT }}
          TAIRA_TRUSTED_BOI_QUALIFICATION_PUBLIC_KEY_PATH: ${{ vars.TAIRA_BOI_QUALIFICATION_SIGNING_PUBLIC_KEY_PATH }}
          TAIRA_TRUSTED_BOI_QUALIFICATION_SIGNING_FINGERPRINT: ${{ vars.TAIRA_TRUSTED_BOI_QUALIFICATION_SIGNING_FINGERPRINT }}
          EXPECTED_BOI_QUALIFICATION_HOST_ID: ${{ vars.TAIRA_BOI_QUALIFICATION_HOST_ID }}
          EXPECTED_BOI_QUALIFICATION_INSTALLATION_ID: ${{ vars.TAIRA_BOI_QUALIFICATION_INSTALLATION_ID }}
          EXPECTED_BOI_QUALIFICATION_CONTROLLER_DIGEST: ${{ vars.TAIRA_LINUX_RELEASE_CONTROLLER_DIGEST }}
          TAIRA_RELEASE_MANIFEST_VERIFIER_PATH: ${{ vars.TAIRA_RELEASE_MANIFEST_VERIFIER_PATH }}
          TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256: ${{ vars.TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256 }}
          TAIRA_WORKFLOW_COMMIT: ${{ github.sha }}
          TAIRA_INPUT_VALIDATOR_RELEASE_REF: ${{ inputs.validator_release_ref }}
        run: |
          set -Eeuo pipefail
          test "$(shasum -a 256 "$TAIRA_CONTROLLER_COMMAND" | awk '{print $1}')" = "$EXPECTED_LAUNCHER_SHA256"
          mac_root="$RUNNER_TEMP/taira-deploy-macos-quarantine"
          linux_root="$RUNNER_TEMP/taira-deploy-linux-quarantine"
          candidate_root="$RUNNER_TEMP/taira-deploy-candidate-quarantine"
          boi_root="$RUNNER_TEMP/taira-deploy-boi-quarantine"
          common=(--expected-launcher-sha256 "$EXPECTED_LAUNCHER_SHA256" --expected-controller-digest "$EXPECTED_CONTROLLER_DIGEST" --expected-version "$EXPECTED_CONTROLLER_VERSION" --expected-host-id "$EXPECTED_HOST_ID" --expected-installation-id "$EXPECTED_INSTALLATION_ID" --expected-uid "$EXPECTED_UID" --source-commit "$TAIRA_WORKFLOW_COMMIT" --platform macos --role macos-deploy)
          sudo -n "$TAIRA_CONTROLLER_COMMAND" inspect-handoff "${common[@]}" --root "$linux_root" --expected-kind linux-authority --stage-name "deploy-linux-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >"$RUNNER_TEMP/deploy-linux-inspection.json"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" inspect-handoff "${common[@]}" --root "$candidate_root" --expected-kind candidate --stage-name "deploy-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >"$RUNNER_TEMP/deploy-candidate-inspection.json"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" inspect-handoff "${common[@]}" --root "$boi_root" --expected-kind privacy-v1-boi-qualified --stage-name "deploy-boi-qualified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >"$RUNNER_TEMP/deploy-boi-inspection.json"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" inspect-handoff "${common[@]}" --root "$mac_root" --expected-kind macos-build --stage-name "deploy-macos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >"$RUNNER_TEMP/macos-inspection.json"
          linux_stage="$(/usr/bin/python3 -I -S -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="ascii"))["staged_root"])' "$RUNNER_TEMP/deploy-linux-inspection.json")"
          candidate_stage="$(/usr/bin/python3 -I -S -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="ascii"))["staged_root"])' "$RUNNER_TEMP/deploy-candidate-inspection.json")"
          boi_stage="$(/usr/bin/python3 -I -S -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="ascii"))["staged_root"])' "$RUNNER_TEMP/deploy-boi-inspection.json")"
          mac_stage="$(/usr/bin/python3 -I -S -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="ascii"))["staged_root"])' "$RUNNER_TEMP/macos-inspection.json")"
          handoff_digest="$(/usr/bin/python3 -I -S -c 'import json,sys;print(json.load(open(sys.argv[1],encoding="ascii"))["handoff_digest"])' "$RUNNER_TEMP/macos-inspection.json")"
          built_controller="$mac_stage/bin/iroha_authenticated_tool_controller"
          test "$(/usr/bin/shasum -a 256 "$built_controller" | /usr/bin/awk '{print $1}')" = "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_SHA256"
          [[ "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH" == /* ]]
          controller_parent="${TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH%/*}"
          controller_name="${TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH##*/}"
          test -n "$controller_name"
          test "$(cd "$controller_parent" && pwd -P)" = "$controller_parent"
          /usr/bin/python3 -I -S - "$controller_parent" "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH" <<'PY'
          import os, stat, sys
          from pathlib import Path
          parent=Path(sys.argv[1]); target=Path(sys.argv[2])
          if target.parent != parent or target.name in {"",".",".."} or target.resolve(strict=False) != target: raise SystemExit("authenticated-tool controller installation target is not canonical")
          for path in (parent,*parent.parents):
              info=os.lstat(path)
              if not stat.S_ISDIR(info.st_mode) or stat.S_ISLNK(info.st_mode) or info.st_uid != 0 or stat.S_IMODE(info.st_mode)&0o022: raise SystemExit("authenticated-tool controller installation parent is not root-custodied")
          PY
          controller_candidate="$controller_parent/.${controller_name}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.new"
          sudo -n /bin/test ! -d "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH"
          sudo -n /bin/test ! -L "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH"
          sudo -n /bin/test ! -e "$controller_candidate"
          sudo -n /bin/test ! -L "$controller_candidate"
          sudo -n /usr/bin/install -o root -g wheel -m 0555 "$built_controller" "$controller_candidate"
          test "$(sudo -n /usr/bin/shasum -a 256 "$controller_candidate" | /usr/bin/awk '{print $1}')" = "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_SHA256"
          sudo -n /usr/bin/cmp "$built_controller" "$controller_candidate"
          sudo -n /bin/mv -f -- "$controller_candidate" "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH"
          /usr/bin/python3 -I -S - "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH" <<'PY'
          import os, stat, sys
          from pathlib import Path
          path=Path(sys.argv[1]); info=os.lstat(path)
          if path.resolve(strict=True) != path or not stat.S_ISREG(info.st_mode) or stat.S_ISLNK(info.st_mode) or info.st_uid != 0 or info.st_gid != 0 or info.st_nlink != 1 or info.st_size <= 0 or stat.S_IMODE(info.st_mode) != 0o555: raise SystemExit("installed authenticated-tool controller identity is invalid")
          PY
          test "$(sudo -n /usr/bin/shasum -a 256 "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH" | /usr/bin/awk '{print $1}')" = "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_SHA256"
          sudo -n /usr/bin/cmp "$built_controller" "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH"
          qualification_result="$(sudo -n /usr/bin/env -i LANG=C LC_ALL=C PATH=/usr/bin:/bin TMPDIR=/private/var/tmp "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH" qualify-host-v1)"
          test "$qualification_result" = "authenticated-tool-controller: macOS host qualification passed"
          cmp "$linux_stage/taira-source-identity-v1.json" "$mac_stage/taira-source-identity-v1.json"; cmp "$mac_stage/taira-source-identity-v1.json" "$candidate_stage/taira-source-identity-v1.json"
          IFS=$'\t' read -r source_commit dpn_commit cargo_lock source_manifest < <(/usr/bin/python3 -I -S - "$mac_stage/taira-source-identity-v1.json" <<'PY'
          import json,sys
          source=json.load(open(sys.argv[1],encoding="ascii"))["source"]
          print(source["commit"],source["dpn_validator_release_commit"],source["cargo_lock_sha256"],source["workspace_source_manifest_sha256"],sep="\t")
          PY
          )
          test "$source_commit" = "$TAIRA_WORKFLOW_COMMIT"
          test "$dpn_commit" = "$TAIRA_INPUT_VALIDATOR_RELEASE_REF"
          if [[ -z "$TAIRA_MACOS_KAGEMUSHA_RELEASE_ROOT" || -z "$TAIRA_MACOS_KAGEMUSHA_ACTIVATION_AUTHORITY" ]]; then
            echo "deployment requires the complete protected Kagemusha release-root/activation-authority pair" >&2
            exit 1
          fi
          [[ "$TAIRA_MACOS_KAGEMUSHA_RELEASE_ROOT" == /* ]]
          test "$(cd "$TAIRA_MACOS_KAGEMUSHA_RELEASE_ROOT" && pwd -P)" = "$TAIRA_MACOS_KAGEMUSHA_RELEASE_ROOT"
          linux_archive="$(find "$linux_stage" -maxdepth 1 -type f -name '*.tar.gz' -print)"; privacy="$RUNNER_TEMP/deploy-privacy"; mkdir -m 0700 "$privacy"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" run "${common[@]}" extract-privacy -- --archive "$linux_archive" --authority-dir "$linux_stage/authority" --source-commit "$source_commit" --dpn-validator-release-commit "$dpn_commit" --cargo-lock-sha256 "$cargo_lock" --workspace-source-manifest-sha256 "$source_manifest" --trusted-signing-fingerprint "$TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT" --release-manifest-verifier "$TAIRA_RELEASE_MANIFEST_VERIFIER_PATH" --trusted-release-manifest-verifier-sha256 "$TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256" --output-dir "$privacy/release"
          [[ "$TAIRA_MACOS_RESET_STAGING_ROOT" == /* ]]
          test "$(cd "$TAIRA_MACOS_RESET_STAGING_ROOT" && pwd -P)" = "$TAIRA_MACOS_RESET_STAGING_ROOT"
          reset="$TAIRA_MACOS_RESET_STAGING_ROOT/taira-${source_commit}-${dpn_commit}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$reset"; binary_sha="$(shasum -a 256 "$mac_stage/bin/iroha3d" | awk '{print $1}')"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" run "${common[@]}" prepare-reset -- \
            --source-bundle "$TAIRA_MACOS_SOURCE_RESET_BUNDLE_PATH" \
            --source-bundle-sha256 "$TAIRA_MACOS_SOURCE_RESET_BUNDLE_SHA256" \
            --privacy-release-dir "$privacy/release" \
            --genesis-external-signer "$TAIRA_MACOS_GENESIS_EXTERNAL_SIGNER_PATH" \
            --trusted-genesis-external-signer-sha256 "$TAIRA_MACOS_GENESIS_EXTERNAL_SIGNER_SHA256" \
            --authenticated-tool-controller "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_PATH" \
            --trusted-authenticated-tool-controller-sha256 "$TAIRA_AUTHENTICATED_TOOL_CONTROLLER_SHA256" \
            --genesis-native-verifier "$TAIRA_GENESIS_NATIVE_VERIFIER_PATH" \
            --trusted-genesis-native-verifier-sha256 "$TAIRA_GENESIS_NATIVE_VERIFIER_SHA256" \
            --operator-status-client "$TAIRA_OPERATOR_STATUS_CLIENT_PATH" \
            --trusted-operator-status-client-sha256 "$TAIRA_OPERATOR_STATUS_CLIENT_SHA256" \
            --onboarding-token-hash-tool "$TAIRA_ONBOARDING_TOKEN_HASH_TOOL_PATH" \
            --kagemusha-release-root "$TAIRA_MACOS_KAGEMUSHA_RELEASE_ROOT" \
            --kagemusha-activation-authority "$TAIRA_MACOS_KAGEMUSHA_ACTIVATION_AUTHORITY" \
            --irohad-sha256 "$binary_sha" --source-commit "$source_commit" \
            --dpn-validator-release-commit "$dpn_commit" \
            --cargo-lock-sha256 "$cargo_lock" \
            --workspace-source-manifest-sha256 "$source_manifest" \
            --controller-manifest "$TAIRA_CONTROLLER_ROOT/authority-controller-v1.json" \
            --controller-digest "$EXPECTED_CONTROLLER_DIGEST" --output-bundle "$reset"
          production_manifest_sha="$(shasum -a 256 "$reset/reset-manifest.json" | awk '{print $1}')"
          supervisor="$TAIRA_CONTROLLER_ROOT/scripts/taira_peer_supervisor.py"
          candidate_archive="$(find "$candidate_stage/admission" -maxdepth 1 -type f -name '*.tar.gz' -print)"; receipt_id="$(tr -d '\n' <"$candidate_stage/receipt-id")"
          # Both invocations intentionally fail before attestation/path reads
          # until iroha.taira.deploy-authenticated-run-nonce.v1 and
          # iroha.taira.complete-source-identity-attestation.v1 are installed.
          # Workflow IDs and caller-echoed source fields cannot bypass either.
          args=(--bundle "$reset" --binary "$mac_stage/bin/iroha3d" --supervisor "$supervisor" --admission-archive "$candidate_archive" --admission-authority-dir "$candidate_stage/authority" --boi-qualified-handoff-root "$boi_stage" --expected-source-commit "$source_commit" --expected-dpn-validator-release-commit "$dpn_commit" --expected-cargo-lock-sha256 "$cargo_lock" --expected-workspace-source-manifest-sha256 "$source_manifest" --expected-receipt-id "$receipt_id" --expected-artifact-handoff-sha256 "$handoff_digest" --expected-production-reset-manifest-sha256 "$production_manifest_sha" --trusted-signing-fingerprint "$TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT" --trusted-boi-qualification-public-key "$TAIRA_TRUSTED_BOI_QUALIFICATION_PUBLIC_KEY_PATH" --trusted-boi-qualification-signing-fingerprint "$TAIRA_TRUSTED_BOI_QUALIFICATION_SIGNING_FINGERPRINT" --expected-boi-qualification-host-id "$EXPECTED_BOI_QUALIFICATION_HOST_ID" --expected-boi-qualification-installation-id "$EXPECTED_BOI_QUALIFICATION_INSTALLATION_ID" --expected-boi-qualification-controller-digest "$EXPECTED_BOI_QUALIFICATION_CONTROLLER_DIGEST" --expected-workflow-run-id "$GITHUB_RUN_ID" --expected-workflow-run-attempt "$GITHUB_RUN_ATTEMPT" --release-manifest-verifier "$TAIRA_RELEASE_MANIFEST_VERIFIER_PATH" --trusted-release-manifest-verifier-sha256 "$TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256" --health-timeout-seconds 240)
          sudo -n "$TAIRA_CONTROLLER_COMMAND" run "${common[@]}" deploy-reset -- "${args[@]}" >"$RUNNER_TEMP/deploy-preflight.json"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" run "${common[@]}" deploy-reset -- "${args[@]}" --apply >"$RUNNER_TEMP/deploy-applied.json"
          /usr/bin/python3 -I -S - "$RUNNER_TEMP/deploy-preflight.json" "$RUNNER_TEMP/deploy-applied.json" "$reset/reset-manifest.json" <<'PY'
          import json,sys
          before,after,manifest=(json.load(open(path,encoding="ascii")) for path in sys.argv[1:])
          exact_int=lambda value: isinstance(value,int) and not isinstance(value,bool)
          sha=lambda value: isinstance(value,str) and len(value)==64 and value==value.lower() and value!="0"*64 and all(character in "0123456789abcdef" for character in value)
          def canonical_network_id(genesis_hash):
              if not sha(genesis_hash): raise SystemExit("reset manifest genesis hash is invalid")
              body=genesis_hash.upper(); crc=0xFFFF
              for byte in b"hash:"+body.encode("ascii"):
                  crc^=byte<<8
                  for _ in range(8): crc=((crc<<1)^0x1021)&0xFFFF if crc&0x8000 else (crc<<1)&0xFFFF
              return f"hash:{body}#{crc:04X}"
          if before.get("applied") is not False or after.get("applied") is not True or before.get("admission_receipt_id") != after.get("admission_receipt_id"): raise SystemExit("deployment preflight/apply contract failed")
          genesis=manifest.get("genesis_expected_hash"); signed_genesis=manifest.get("signed_genesis_sha256")
          if manifest.get("schema")!="taira-exact2f-reset-bundle" or not isinstance(manifest.get("chain_id"),str) or not sha(signed_genesis): raise SystemExit("authenticated reset manifest identity is invalid")
          expected={"chain_id":manifest["chain_id"],"network_id":canonical_network_id(genesis),"network_name":"taira","peer_count":4,"protocol_version":4,"restart_proof":"passed","genesis_block_hash":genesis,"signed_genesis_sha256":signed_genesis}
          if any(type(after.get(key)) is not type(value) or after.get(key)!=value for key,value in expected.items()): raise SystemExit("deployment identity contract failed")
          if not exact_int(after.get("deployment_completed_at_unix_ms")) or after["deployment_completed_at_unix_ms"]<=0: raise SystemExit("deployment completion time is invalid")
          if not exact_int(after.get("start_height")) or not exact_int(after.get("end_height")) or after["start_height"]<1 or after["end_height"]<=after["start_height"]: raise SystemExit("deployment height proof is invalid")
          if any(not sha(after.get(field)) for field in ("binary_sha256","config_set_sha256","end_block_hash","signed_genesis_sha256","supervisor_sha256","topology_sha256")): raise SystemExit("deployment artifact identity is invalid")
          signers=after.get("receipt_signers")
          slugs=tuple(f"taira-validator-{index}" for index in range(1,5))
          fields={"binary_stat_seal","config_sha256","lifecycle_binding_sha256","node_id","public_key","runtime_binding_sha256"}
          if not isinstance(signers,dict) or tuple(signers)!=slugs or any(not isinstance(signers[slug],dict) or set(signers[slug])!=fields for slug in slugs): raise SystemExit("deployment receipt signer set is invalid")
          nodes=set(); keys=set()
          for slug in slugs:
              row=signers[slug]; seal=row["binary_stat_seal"]; node=row["node_id"]; key=row["public_key"]
              if any(not sha(row[field]) for field in ("config_sha256","lifecycle_binding_sha256","runtime_binding_sha256")): raise SystemExit("deployment receipt signer binding is invalid")
              if not isinstance(seal,list) or len(seal)!=5 or any(not exact_int(value) or value<0 for value in seal) or seal[2]<=0: raise SystemExit("deployment receipt signer binary seal is invalid")
              if not isinstance(node,str) or not node.startswith("taira-node:receipt-signer:secp256k1:sha256:") or not sha(node.rsplit(":",1)[-1]): raise SystemExit("deployment receipt signer node ID is invalid")
              if not isinstance(key,dict) or set(key)!={"algorithm","payload_hex"} or key.get("algorithm")!="secp256k1": raise SystemExit("deployment receipt signer public key is invalid")
              payload=key.get("payload_hex")
              if not isinstance(payload,str) or len(payload)!=66 or payload[:2] not in {"02","03"} or payload!=payload.lower() or any(character not in "0123456789abcdef" for character in payload): raise SystemExit("deployment receipt signer public key is invalid")
              if node in nodes or payload in keys: raise SystemExit("deployment receipt signer identities alias")
              nodes.add(node); keys.add(payload)
          PY
      - name: Require exact-four advancement and the controller-owned privacy cutover record
        shell: bash
        env:
          EXPECTED_LAUNCHER_SHA256: ${{ vars.TAIRA_RELEASE_CONTROLLER_LAUNCHER_SHA256 }}
          EXPECTED_CONTROLLER_DIGEST: ${{ vars.TAIRA_MACOS_RELEASE_CONTROLLER_DIGEST }}
          EXPECTED_CONTROLLER_VERSION: ${{ vars.TAIRA_RELEASE_CONTROLLER_VERSION }}
          EXPECTED_HOST_ID: ${{ vars.TAIRA_DEPLOY_HOST_ID }}
          EXPECTED_INSTALLATION_ID: ${{ vars.TAIRA_DEPLOY_INSTALLATION_ID }}
          EXPECTED_UID: "0"
          TAIRA_PUBLIC_TORII_ROOT: ${{ vars.TAIRA_PUBLIC_TORII_ROOT }}
          TAIRA_VALIDATOR_1_TORII_ROOT: ${{ vars.TAIRA_VALIDATOR_1_TORII_ROOT }}
          TAIRA_VALIDATOR_2_TORII_ROOT: ${{ vars.TAIRA_VALIDATOR_2_TORII_ROOT }}
          TAIRA_VALIDATOR_3_TORII_ROOT: ${{ vars.TAIRA_VALIDATOR_3_TORII_ROOT }}
          TAIRA_VALIDATOR_4_TORII_ROOT: ${{ vars.TAIRA_VALIDATOR_4_TORII_ROOT }}
          TAIRA_POST_CUTOVER_CANARY_CLIENT_PATH: ${{ vars.TAIRA_POST_CUTOVER_CANARY_CLIENT_PATH }}
          TAIRA_PRIVACY_ROLLOUT_OBSERVATION_PATH: ${{ vars.TAIRA_PRIVACY_ROLLOUT_OBSERVATION_PATH }}
          TAIRA_INPUT_VALIDATOR_RELEASE_REF: ${{ inputs.validator_release_ref }}
        run: |
          set -Eeuo pipefail
          [[ "$TAIRA_POST_CUTOVER_CANARY_CLIENT_PATH" == /* ]]
          [[ "$TAIRA_PRIVACY_ROLLOUT_OBSERVATION_PATH" == /* ]]
          common=(--expected-launcher-sha256 "$EXPECTED_LAUNCHER_SHA256" --expected-controller-digest "$EXPECTED_CONTROLLER_DIGEST" --expected-version "$EXPECTED_CONTROLLER_VERSION" --expected-host-id "$EXPECTED_HOST_ID" --expected-installation-id "$EXPECTED_INSTALLATION_ID" --expected-uid "$EXPECTED_UID" --source-commit "${{ github.sha }}" --platform macos --role macos-deploy)
          sudo -n "$TAIRA_CONTROLLER_COMMAND" run "${common[@]}" check-public -- --public-root "$TAIRA_PUBLIC_TORII_ROOT" --validator-root "taira-validator-1=$TAIRA_VALIDATOR_1_TORII_ROOT" --validator-root "taira-validator-2=$TAIRA_VALIDATOR_2_TORII_ROOT" --validator-root "taira-validator-3=$TAIRA_VALIDATOR_3_TORII_ROOT" --validator-root "taira-validator-4=$TAIRA_VALIDATOR_4_TORII_ROOT" --require-all-validators --expected-git-sha "${{ github.sha }}" --expected-dpn-validator-release-commit "$TAIRA_INPUT_VALIDATOR_RELEASE_REF" --write-config "$TAIRA_POST_CUTOVER_CANARY_CLIENT_PATH"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" run "${common[@]}" verify-privacy-rollout -- --result "$TAIRA_PRIVACY_ROLLOUT_OBSERVATION_PATH" >"$RUNNER_TEMP/privacy-rollout-verification.json"
          /usr/bin/python3 -I -S - "$RUNNER_TEMP/privacy-rollout-verification.json" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding="ascii"))
          if value.get("status") != "structurally-valid" or value.get("qualification_authority") is not False or not isinstance(value.get("rollout_id"),str): raise SystemExit("controller-owned privacy rollout observation failed closed verification")
          PY

  # The publisher runs on a separately attested authority installation.  It
  # never checks out or executes repository/product bytes.
  macos-publish:
    needs: macos-deploy
    environment: taira-validator-publish
    runs-on: [self-hosted, macOS, ARM64, taira-publish-authority]
    timeout-minutes: 90
    steps:
      - name: Download candidate bytes into publication quarantine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: taira-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taira-publication-quarantine

      - name: Publish through the sealed installed authority controller
        id: publish
        shell: bash
        env:
          EXPECTED_LAUNCHER_SHA256: ${{ vars.TAIRA_RELEASE_CONTROLLER_LAUNCHER_SHA256 }}
          EXPECTED_CONTROLLER_DIGEST: ${{ vars.TAIRA_MACOS_RELEASE_CONTROLLER_DIGEST }}
          EXPECTED_CONTROLLER_VERSION: ${{ vars.TAIRA_RELEASE_CONTROLLER_VERSION }}
          EXPECTED_HOST_ID: ${{ vars.TAIRA_PUBLISH_HOST_ID }}
          EXPECTED_INSTALLATION_ID: ${{ vars.TAIRA_PUBLISH_INSTALLATION_ID }}
          EXPECTED_UID: "0"
          TAIRA_PUBLISH_HANDOFF_ROOT: ${{ vars.TAIRA_PUBLISH_HANDOFF_ROOT }}
          TAIRA_OCI_REPOSITORY: ${{ vars.TAIRA_OCI_REPOSITORY }}
          TAIRA_OCI_TAG_SUFFIX: ${{ vars.TAIRA_OCI_TAG_SUFFIX }}
          TAIRA_INPUT_VALIDATOR_RELEASE_REF: ${{ inputs.validator_release_ref }}
          TAIRA_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          for digest in "$EXPECTED_LAUNCHER_SHA256" "$EXPECTED_CONTROLLER_DIGEST"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          done
          [[ "$TAIRA_WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TAIRA_INPUT_VALIDATOR_RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TAIRA_PUBLISH_HANDOFF_ROOT" == /* ]]
          test "$(cd "$TAIRA_PUBLISH_HANDOFF_ROOT" && pwd -P)" = "$TAIRA_PUBLISH_HANDOFF_ROOT"
          test "$(shasum -a 256 "$TAIRA_CONTROLLER_COMMAND" | awk '{print $1}')" = "$EXPECTED_LAUNCHER_SHA256"

          common=(
            --expected-launcher-sha256 "$EXPECTED_LAUNCHER_SHA256"
            --expected-controller-digest "$EXPECTED_CONTROLLER_DIGEST"
            --expected-version "$EXPECTED_CONTROLLER_VERSION"
            --expected-host-id "$EXPECTED_HOST_ID"
            --expected-installation-id "$EXPECTED_INSTALLATION_ID"
            --expected-uid "$EXPECTED_UID"
            --source-commit "$TAIRA_WORKFLOW_COMMIT"
            --platform macos
            --role macos-publish
          )
          candidate="$TAIRA_PUBLISH_HANDOFF_ROOT/publish-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          inspection="$RUNNER_TEMP/publish-inspection.json"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" inspect-handoff \
            "${common[@]}" \
            --root "$RUNNER_TEMP/taira-publication-quarantine" \
            --expected-kind candidate \
            --stage-name "publish-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >"$inspection"
          inspected_candidate="$(/usr/bin/python3 -I -S -c \
            'import json,sys; print(json.load(open(sys.argv[1], encoding="ascii"))["staged_root"])' \
            "$inspection")"
          test "$inspected_candidate" = "$candidate"

          IFS=$'\t' read -r \
            source_commit dpn_commit cargo_lock source_manifest receipt_id \
            < <(/usr/bin/python3 -I -S - "$candidate" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          value = json.loads((root / "taira-source-identity-v1.json").read_bytes())
          source = value.get("source")
          expected = {
              "cargo_lock_sha256",
              "commit",
              "dpn_validator_release_commit",
              "workspace_source_manifest_sha256",
          }
          if not isinstance(source, dict) or set(source) != expected:
              raise SystemExit("candidate source identity differs")
          receipt_id = (root / "receipt-id").read_text(encoding="ascii")
          if re.fullmatch(r"[0-9a-f]{64}\n", receipt_id) is None:
              raise SystemExit("candidate qualification receipt ID differs")
          print(
              source["commit"],
              source["dpn_validator_release_commit"],
              source["cargo_lock_sha256"],
              source["workspace_source_manifest_sha256"],
              receipt_id.removesuffix("\n"),
              sep="\t",
          )
          PY
          )
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$dpn_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$cargo_lock" =~ ^[0-9a-f]{64}$ ]]
          [[ "$source_manifest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$receipt_id" =~ ^[0-9a-f]{64}$ ]]
          test "$source_commit" = "$TAIRA_WORKFLOW_COMMIT"
          test "$dpn_commit" = "$TAIRA_INPUT_VALIDATOR_RELEASE_REF"

          candidate_prerequisite="$TAIRA_PUBLISH_HANDOFF_ROOT/public-soak-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          publication_prerequisite="$TAIRA_PUBLISH_HANDOFF_ROOT/public-soak-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$candidate_prerequisite"
          test ! -e "$publication_prerequisite"
          sudo -n "$TAIRA_CONTROLLER_COMMAND" run "${common[@]}" \
            build-public-soak-candidate -- \
              --candidate-root "$candidate" \
              --output "$candidate_prerequisite"

          sudo -n "$TAIRA_CONTROLLER_COMMAND" run "${common[@]}" \
            publish-rollout -- \
              --candidate-root "$candidate" \
              --expected-source-commit "$source_commit" \
              --expected-dpn-validator-release-commit "$dpn_commit" \
              --expected-cargo-lock-sha256 "$cargo_lock" \
              --expected-workspace-source-manifest-sha256 "$source_manifest" \
              --expected-qualification-receipt-id "$receipt_id" \
              --repository "$TAIRA_OCI_REPOSITORY" \
              --suffix "$TAIRA_OCI_TAG_SUFFIX"

          final="$TAIRA_PUBLISH_HANDOFF_ROOT/publication-receipt-$receipt_id"
          /usr/bin/python3 -I -S - "$final" <<'PY'
          import stat
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          expected = {
              "publication-receipt-v1.json",
              "publication-receipt-v1.json.pub",
              "publication-receipt-v1.json.sig",
              "published-primary-digest",
              "published-receipt-digest",
              "taira-primary-oci-manifest.json",
              "taira-publication-receipt-oci-manifest.json",
          }
          info = root.lstat()
          if not stat.S_ISDIR(info.st_mode) or stat.S_IMODE(info.st_mode) != 0o555:
              raise SystemExit("publication handoff directory identity differs")
          if {path.name for path in root.iterdir()} != expected:
              raise SystemExit("publication handoff inventory differs")
          for path in root.iterdir():
              info = path.lstat()
              if (
                  not stat.S_ISREG(info.st_mode)
                  or info.st_nlink != 1
                  or stat.S_IMODE(info.st_mode) != 0o444
              ):
                  raise SystemExit(f"publication handoff file identity differs: {path.name}")
          PY
          sudo -n "$TAIRA_CONTROLLER_COMMAND" run "${common[@]}" \
            build-public-soak-publication -- \
              --candidate-root "$candidate" \
              --candidate-handoff "$candidate_prerequisite/public-soak-prerequisite-v1.json" \
              --publication-root "$final" \
              --output "$publication_prerequisite"
          /usr/bin/python3 -I -S - "$candidate_prerequisite" "$publication_prerequisite" <<'PY'
          import stat
          import sys
          from pathlib import Path

          expected = {
              "handoff-inventory-v1.json",
              "public-soak-prerequisite-v1.json",
          }
          for root_value in sys.argv[1:]:
              root = Path(root_value)
              root_info = root.lstat()
              if (
                  not stat.S_ISDIR(root_info.st_mode)
                  or stat.S_IMODE(root_info.st_mode) != 0o555
                  or {path.name for path in root.iterdir()} != expected
              ):
                  raise SystemExit("public-soak prerequisite handoff identity differs")
              for path in root.iterdir():
                  info = path.lstat()
                  if (
                      not stat.S_ISREG(info.st_mode)
                      or info.st_nlink != 1
                      or stat.S_IMODE(info.st_mode) != 0o444
                  ):
                      raise SystemExit(
                          f"public-soak prerequisite file identity differs: {path.name}"
                      )
          PY
          printf 'receipt_id=%s\n' "$receipt_id" >>"$GITHUB_OUTPUT"

      - name: Upload the exact root-closed publication and public-soak handoffs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taira-publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ vars.TAIRA_PUBLISH_HANDOFF_ROOT }}/publication-receipt-${{ steps.publish.outputs.receipt_id }}/
            ${{ vars.TAIRA_PUBLISH_HANDOFF_ROOT }}/public-soak-candidate-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ vars.TAIRA_PUBLISH_HANDOFF_ROOT }}/public-soak-publication-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
