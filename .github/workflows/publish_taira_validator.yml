name: Publish (Taira Validator Image)

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "The branch, tag, or SHA to checkout"
        required: true
        type: string
        default: main
      tag_suffix:
        description: "Optional image tag suffix. Defaults to the canonical workspace-source-manifest digest."
        required: false
        type: string
      push_latest:
        description: "Also push the rolling `taira-latest` tags"
        required: false
        type: boolean
        default: false
      validator_release_ref:
        description: "Exact 40-character DPN API commit containing the reviewed validator source bundle and lock"
        required: true
        type: string

env:
  DPN_VALIDATOR_LOCK_SHA256: 4318f92184fedb10e9bc5cb5c47f1df930c419221be4bd61fbc41741d02f6289
  IROHA_CI_IMAGE: ${{ vars.IROHA_CI_IMAGE }}
  IROHA_RUST_BUILDER_IMAGE: ${{ vars.IROHA_RUST_BUILDER_IMAGE }}
  IROHA_RUNTIME_IMAGE: ${{ vars.IROHA_RUNTIME_IMAGE }}

jobs:
  image:
    environment: taira-validator-publish
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: ${{ vars.IROHA_CI_IMAGE }}
    timeout-minutes: 180
    env:
      TAIRA_INPUT_VALIDATOR_RELEASE_REF: ${{ inputs.validator_release_ref }}
      TAIRA_INPUT_TAG_SUFFIX: ${{ inputs.tag_suffix }}
      TAIRA_INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
      TAIRA_RELEASE_EXTERNAL_SIGNER_PATH: ${{ vars.TAIRA_RELEASE_EXTERNAL_SIGNER_PATH }}
      TAIRA_RELEASE_SIGNING_PUBLIC_KEY_PATH: ${{ vars.TAIRA_RELEASE_SIGNING_PUBLIC_KEY_PATH }}
      TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT: ${{ vars.TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT }}
      TAIRA_RELEASE_MANIFEST_VERIFIER_PATH: ${{ vars.TAIRA_RELEASE_MANIFEST_VERIFIER_PATH }}
      TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256: ${{ vars.TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.inputs.checkout_ref }}
      - name: Validate digest-pinned Docker base images
        run: |
          python3 scripts/validate_release_image_bases.py \
            --builder "$IROHA_RUST_BUILDER_IMAGE" \
            --runtime "$IROHA_RUNTIME_IMAGE"
          python3 scripts/validate_release_image_bases.py \
            --builder "$IROHA_CI_IMAGE" \
            --runtime "$IROHA_CI_IMAGE"

      - name: Reconstruct reviewed DPN validator source and install lock
        shell: bash
        run: |
          set -Eeuo pipefail
          release_ref="$TAIRA_INPUT_VALIDATOR_RELEASE_REF"
          if [[ ! "$release_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "validator_release_ref must be an exact 40-character DPN commit" >&2
            exit 1
          fi
          release_dir="$RUNNER_TEMP/dpn-validator-release"
          bundle_dir="$release_dir/source-bundle"
          rm -rf "$release_dir"
          mkdir -p "$bundle_dir"
          base_url="https://raw.githubusercontent.com/soramitsu/dpn-api-rust/${release_ref}"
          curl_args=(--proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3)
          curl "${curl_args[@]}" --output "$release_dir/iroha_source_bundle.py" \
            "$base_url/scripts/iroha_source_bundle.py"
          for component in provenance.json tracked.patch untracked.tar untracked.manifest.json source.manifest.json; do
            curl "${curl_args[@]}" --output "$bundle_dir/$component" \
              "$base_url/ops/iroha/taira-validator-source/$component"
          done
          curl "${curl_args[@]}" --output Cargo.lock \
            "$base_url/ops/iroha/taira-validator.Cargo.lock"
          printf '%s  %s\n' "$DPN_VALIDATOR_LOCK_SHA256" Cargo.lock | sha256sum -c -
          python3 "$release_dir/iroha_source_bundle.py" reconstruct \
            --repo "$GITHUB_WORKSPACE" \
            --bundle-dir "$bundle_dir"
          source_tree_sha="$(python3 - "$bundle_dir/provenance.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              print(json.load(stream)["source_tree_sha256"])
          PY
          )"
          [[ "$source_tree_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "DPN_VALIDATOR_SOURCE_TREE_SHA256=$source_tree_sha" >>"$GITHUB_ENV"
          echo "DPN_VALIDATOR_BASE_GIT_HEAD=$(git rev-parse HEAD)" >>"$GITHUB_ENV"

      - name: Validate protected Taira release authority inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          require_external_file() {
            local label="$1"
            local path="$2"
            if [[ -z "$path" || "$path" != /* ]]; then
              echo "${label} must be an explicit absolute path" >&2
              exit 1
            fi
            if [[ ! -f "$path" || -L "$path" ]]; then
              echo "${label} must be a non-symlink regular file" >&2
              exit 1
            fi
            local canonical_path
            local canonical_workspace
            canonical_path="$(
              python3 -S -c \
                'import os, sys; print(os.path.realpath(sys.argv[1]))' \
                "$path"
            )"
            canonical_workspace="$(
              python3 -S -c \
                'import os, sys; print(os.path.realpath(sys.argv[1]))' \
                "$GITHUB_WORKSPACE"
            )"
            if [[ "$canonical_path" != "$path" ]]; then
              echo "${label} must use its canonical physical path without symlink or parent aliases" >&2
              exit 1
            fi
            if [[ "$canonical_path" == "$canonical_workspace" || "$canonical_path" == "$canonical_workspace/"* ]]; then
              echo "${label} must be provisioned outside the GitHub workspace" >&2
              exit 1
            fi
          }
          require_external_file \
            "Taira release external signer" \
            "$TAIRA_RELEASE_EXTERNAL_SIGNER_PATH"
          require_external_file \
            "Taira release raw Ed25519 public key" \
            "$TAIRA_RELEASE_SIGNING_PUBLIC_KEY_PATH"
          require_external_file \
            "Taira pinned native release-manifest verifier" \
            "$TAIRA_RELEASE_MANIFEST_VERIFIER_PATH"
          if [[ ! "$TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Taira trusted release signing fingerprint must be lowercase SHA-256" >&2
            exit 1
          fi
          if [[ ! "$TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Taira trusted native verifier digest must be lowercase SHA-256" >&2
            exit 1
          fi
          actual_verifier_sha="$(
            sha256sum "$TAIRA_RELEASE_MANIFEST_VERIFIER_PATH" | awk '{print $1}'
          )"
          test "$actual_verifier_sha" \
            = "$TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256"

      - name: Seal the exact Taira source closure
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          sealed_context="$(mktemp -d "${RUNNER_TEMP}/taira-sealed-context.XXXXXXXXXX")"
          mkdir "$sealed_context/scripts"
          source_path_list="$sealed_context/taira-workspace-source-paths-v1.bin"
          source_archive="$sealed_context/taira-workspace-source-v1.seal"

          workspace_source_manifest_sha="$(
            python3 -I -S scripts/compute_workspace_source_manifest.py \
              --root "$GITHUB_WORKSPACE" \
              --write-path-list "$source_path_list"
          )"
          [[ "$workspace_source_manifest_sha" =~ ^[0-9a-f]{64}$ ]]
          source_path_list_sha="$(sha256sum "$source_path_list" | awk '{print $1}')"
          source_archive_sha="$(
            python3 -I -S scripts/compute_workspace_source_manifest.py \
              --root "$GITHUB_WORKSPACE" \
              --path-list "$source_path_list" \
              --create-sealed-archive "$source_archive" \
              --expected-manifest "$workspace_source_manifest_sha"
          )"
          [[ "$source_archive_sha" =~ ^[0-9a-f]{64}$ ]]
          test "$source_archive_sha" = "$(sha256sum "$source_archive" | awk '{print $1}')"

          install -m 0444 Dockerfile "$sealed_context/Dockerfile"
          install -m 0555 scripts/compute_workspace_source_manifest.py \
            "$sealed_context/scripts/compute_workspace_source_manifest.py"
          install -m 0555 scripts/taira_image_smoke.sh \
            "$sealed_context/scripts/taira_image_smoke.sh"
          printf '%s\n' "$workspace_source_manifest_sha" \
            >"$sealed_context/workspace-source-manifest.sha256"
          printf '%s  %s\n' "$source_archive_sha" \
            taira-workspace-source-v1.seal \
            >"$sealed_context/source-archive.sha256"
          printf '%s  %s\n' "$source_path_list_sha" \
            taira-workspace-source-paths-v1.bin \
            >"$sealed_context/source-path-list.sha256"
          (
            cd "$sealed_context"
            sha256sum \
              Dockerfile \
              scripts/compute_workspace_source_manifest.py \
              scripts/taira_image_smoke.sh \
              source-archive.sha256 \
              source-path-list.sha256 \
              taira-workspace-source-paths-v1.bin \
              taira-workspace-source-v1.seal \
              workspace-source-manifest.sha256 \
              >context-control.sha256
          )
          context_control_sha="$(
            sha256sum "$sealed_context/context-control.sha256" | awk '{print $1}'
          )"
          [[ "$context_control_sha" =~ ^[0-9a-f]{64}$ ]]
          python3 -I -S scripts/compute_workspace_source_manifest.py \
            --validate-sealed-context "$sealed_context"
          find "$sealed_context" -type f -exec chmod 0444 {} +
          chmod 0555 \
            "$sealed_context/scripts/compute_workspace_source_manifest.py" \
            "$sealed_context/scripts/taira_image_smoke.sh"
          chmod 0555 "$sealed_context/scripts" "$sealed_context"

          {
            echo "IROHA_WORKSPACE_SOURCE_MANIFEST_SHA256=$workspace_source_manifest_sha"
            echo "TAIRA_SEALED_SOURCE_ARCHIVE_SHA256=$source_archive_sha"
            echo "TAIRA_SEALED_SOURCE_PATH_LIST_SHA256=$source_path_list_sha"
            echo "TAIRA_SEALED_CONTEXT_CONTROL_SHA256=$context_control_sha"
            echo "TAIRA_SEALED_CONTEXT=$sealed_context"
          } >>"$GITHUB_ENV"

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Soramitsu Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: docker.soramitsu.co.jp
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.34.1
          install: true

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          raw_suffix="$TAIRA_INPUT_TAG_SUFFIX"
          if [[ -n "$raw_suffix" && ! "$raw_suffix" =~ ^[a-z0-9][a-z0-9._-]{0,47}$ ]]; then
            echo "tag_suffix must be a canonical lowercase 1-48 character Docker tag component" >&2
            exit 1
          fi
          if [[ "$TAIRA_INPUT_PUSH_LATEST" != "true" && "$TAIRA_INPUT_PUSH_LATEST" != "false" ]]; then
            echo "push_latest must be exactly true or false" >&2
            exit 1
          fi
          suffix="source-${IROHA_WORKSPACE_SOURCE_MANIFEST_SHA256}"
          if [[ -n "$raw_suffix" ]]; then
            suffix="${suffix}-${raw_suffix}"
          fi
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]

          {
            echo "suffix=$suffix"
            echo "local_tag=local/taira-validator:sealed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "tags<<EOF"
            echo "hyperledger/iroha:taira-$suffix"
            echo "docker.soramitsu.co.jp/iroha3/iroha:taira-$suffix"
            if [[ "$TAIRA_INPUT_PUSH_LATEST" == "true" ]]; then
              echo "hyperledger/iroha:taira-latest"
              echo "docker.soramitsu.co.jp/iroha3/iroha:taira-latest"
            fi
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Recheck the immutable source immediately before Buildx
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(
            sha256sum "$TAIRA_SEALED_CONTEXT/taira-workspace-source-v1.seal" |
              awk '{print $1}'
          )" = "$TAIRA_SEALED_SOURCE_ARCHIVE_SHA256"
          test "$(
            sha256sum "$TAIRA_SEALED_CONTEXT/taira-workspace-source-paths-v1.bin" |
              awk '{print $1}'
          )" = "$TAIRA_SEALED_SOURCE_PATH_LIST_SHA256"
          test "$(
            sha256sum "$TAIRA_SEALED_CONTEXT/context-control.sha256" |
              awk '{print $1}'
          )" = "$TAIRA_SEALED_CONTEXT_CONTROL_SHA256"
          (
            cd "$TAIRA_SEALED_CONTEXT"
            sha256sum -c context-control.sha256
          )
          python3 -I -S scripts/compute_workspace_source_manifest.py \
            --validate-sealed-context "$TAIRA_SEALED_CONTEXT"
          git_digest="$(
            python3 -I -S scripts/compute_workspace_source_manifest.py \
              --root "$GITHUB_WORKSPACE"
          )"
          detached_digest="$(
            python3 -I -S scripts/compute_workspace_source_manifest.py \
              --root "$GITHUB_WORKSPACE" \
              --path-list "$TAIRA_SEALED_CONTEXT/taira-workspace-source-paths-v1.bin"
          )"
          test "$git_digest" = "$IROHA_WORKSPACE_SOURCE_MANIFEST_SHA256"
          test "$detached_digest" = "$IROHA_WORKSPACE_SOURCE_MANIFEST_SHA256"
          test "$(
            tr -d '\n' <"$TAIRA_SEALED_CONTEXT/workspace-source-manifest.sha256"
          )" = "$IROHA_WORKSPACE_SOURCE_MANIFEST_SHA256"

      - name: Build the final Taira publish image once
        id: build_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ env.TAIRA_SEALED_CONTEXT }}
          load: true
          push: false
          tags: |
            ${{ steps.tags.outputs.local_tag }}
            ${{ steps.tags.outputs.tags }}
          labels: |
            commit=${{ env.DPN_VALIDATOR_BASE_GIT_HEAD }}
            validator-source-tree=${{ env.DPN_VALIDATOR_SOURCE_TREE_SHA256 }}
            workspace-source-manifest=${{ env.IROHA_WORKSPACE_SOURCE_MANIFEST_SHA256 }}
          build-args: |
            "IROHA_RUST_BUILDER_IMAGE=${{ env.IROHA_RUST_BUILDER_IMAGE }}"
            "IROHA_RUNTIME_IMAGE=${{ env.IROHA_RUNTIME_IMAGE }}"
            "PROFILE=release"
            "CONFIG_PROFILE=taira"
            "IROHA_RELEASE_PREPROVISIONED_BASES=1"
            "FEATURES=embedded-soracloud-runtime,zk-stark"
            "CARGO_BUILD_JOBS=1"
            "BINARIES=irohad kagami"
            "IROHA_GIT_COMMIT_HASH=${{ env.DPN_VALIDATOR_BASE_GIT_HEAD }}"
            "VALIDATOR_LOCK_SHA256=${{ env.DPN_VALIDATOR_LOCK_SHA256 }}"
            "VALIDATOR_SOURCE_TREE_SHA256=${{ env.DPN_VALIDATOR_SOURCE_TREE_SHA256 }}"
            "WORKSPACE_SOURCE_MANIFEST_SHA256=${{ env.IROHA_WORKSPACE_SOURCE_MANIFEST_SHA256 }}"
            "SEALED_SOURCE_ARCHIVE_SHA256=${{ env.TAIRA_SEALED_SOURCE_ARCHIVE_SHA256 }}"
            "SEALED_SOURCE_PATH_LIST_SHA256=${{ env.TAIRA_SEALED_SOURCE_PATH_LIST_SHA256 }}"
            "SEALED_CONTEXT_CONTROL_SHA256=${{ env.TAIRA_SEALED_CONTEXT_CONTROL_SHA256 }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke the exact locally loaded publish image
        shell: bash
        env:
          EXPECTED_IMAGE_ID: ${{ steps.build_image.outputs.imageid }}
          EXPECTED_MANIFEST_DIGEST: ${{ steps.build_image.outputs.digest }}
          LOCAL_TAG: ${{ steps.tags.outputs.local_tag }}
          PUBLISH_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          actual_image_id="$(docker image inspect --format '{{.Id}}' "$LOCAL_TAG")"
          test "$actual_image_id" = "$EXPECTED_IMAGE_ID"
          while IFS= read -r publish_tag; do
            [[ -n "$publish_tag" ]] || continue
            test "$(docker image inspect --format '{{.Id}}' "$publish_tag")" \
              = "$EXPECTED_IMAGE_ID"
          done <<<"$PUBLISH_TAGS"
          bash "$TAIRA_SEALED_CONTEXT/scripts/taira_image_smoke.sh" \
            --image "$LOCAL_TAG" \
            --timeout 120
          test "$(docker image inspect --format '{{.Id}}' "$LOCAL_TAG")" \
            = "$EXPECTED_IMAGE_ID"
          {
            echo "TAIRA_PUBLISH_IMAGE_ID=$EXPECTED_IMAGE_ID"
            echo "TAIRA_BUILD_MANIFEST_DIGEST=$EXPECTED_MANIFEST_DIGEST"
          } >>"$GITHUB_ENV"

      - name: Create and verify the portable signed exact-12 release authority
        id: release_authority
        shell: bash
        env:
          LOCAL_TAG: ${{ steps.tags.outputs.local_tag }}
          PUBLISH_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -Eeuo pipefail
          umask 077
          authority_dir="$(mktemp -d "${RUNNER_TEMP}/taira-release-authority.XXXXXXXXXX")"
          evidence_root="${authority_dir}/evidence"
          artifacts_dir="${authority_dir}/artifacts"
          mkdir -p \
            "$evidence_root/bin" \
            "$evidence_root/provenance/privacy-native" \
            "$artifacts_dir"

          container_id="$(docker create "$LOCAL_TAG")"
          [[ "$container_id" =~ ^[0-9a-f]{12,64}$ ]]
          trap 'docker rm -f -- "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp \
            "${container_id}:/usr/local/bin/irohad" \
            "$evidence_root/bin/irohad"
          docker cp \
            "${container_id}:/usr/local/bin/taira_privacy_release_runner" \
            "$evidence_root/bin/taira_privacy_release_runner"
          docker cp \
            "${container_id}:/opt/iroha/provenance/Cargo.lock" \
            "$evidence_root/provenance/Cargo.lock"
          docker cp \
            "${container_id}:/opt/iroha/provenance/privacy-native/." \
            "$evidence_root/provenance/privacy-native/"
          docker rm -f -- "$container_id" >/dev/null
          trap - EXIT
          test "$(docker image inspect --format '{{.Id}}' "$LOCAL_TAG")" \
            = "$TAIRA_PUBLISH_IMAGE_ID"

          install -m 0555 \
            "$TAIRA_RELEASE_MANIFEST_VERIFIER_PATH" \
            "$artifacts_dir/sorafs-validate"
          install -m 0555 \
            scripts/taira_release_authority.py \
            "$artifacts_dir/taira_release_authority.py"
          install -m 0444 \
            scripts/release_artifact_contract.py \
            "$artifacts_dir/release_artifact_contract.py"

          authority_args=(
            create
            --evidence-root "$evidence_root"
            --commit "$DPN_VALIDATOR_BASE_GIT_HEAD"
            --signing-fingerprint "$TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT"
            --native-verifier-sha256 "$TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256"
            --image-manifest-digest "$TAIRA_BUILD_MANIFEST_DIGEST"
            --image-id "$TAIRA_PUBLISH_IMAGE_ID"
          )
          while IFS= read -r publish_tag; do
            [[ -n "$publish_tag" ]] || continue
            authority_args+=(--image-tag "$publish_tag")
          done < <(printf '%s\n' "$PUBLISH_TAGS" | sed '/^$/d' | LC_ALL=C sort)
          authority_payload="$artifacts_dir/taira-exact12-release-authority-v1.json"
          authority_args+=(--output "$authority_payload")
          python3 -S scripts/taira_release_authority.py "${authority_args[@]}"

          python3 -S scripts/write_release_sha256sums.py \
            --artifacts-dir "$artifacts_dir" \
            --output "$artifacts_dir/SHA256SUMS" \
            --file release_artifact_contract.py \
            --file sorafs-validate \
            --file taira-exact12-release-authority-v1.json \
            --file taira_release_authority.py

          source_date_epoch="$(
            git show -s --format=%ct "$DPN_VALIDATOR_BASE_GIT_HEAD"
          )"
          authority_manifest="$authority_dir/release_manifest.json"
          release_manifest_args=(
            --artifacts-dir "$artifacts_dir"
            --version "taira-${IROHA_WORKSPACE_SOURCE_MANIFEST_SHA256:0:16}"
            --commit "$DPN_VALIDATOR_BASE_GIT_HEAD"
            --source-date-epoch "$source_date_epoch"
            --os-tag linux
            --arch "$(uname -m | tr '[:upper:]' '[:lower:]')"
            --artifact "iroha3:taira-exact12:release-evidence:json:taira-exact12-release-authority-v1.json"
            --artifact "iroha3:taira-authority:release-evidence:binary:release_artifact_contract.py"
            --artifact "iroha3:taira-authority:reference-validator:binary:sorafs-validate"
            --artifact "iroha3:taira-authority:release-evidence:binary:taira_release_authority.py"
          )
          python3 -S scripts/generate_release_manifest.py \
            "${release_manifest_args[@]}" \
            --output "$authority_manifest"

          authority_signature="$authority_dir/release_manifest.json.sig"
          authority_public_key="$authority_dir/release_manifest.json.pub"
          python3 -S scripts/release_manifest_signing.py sign \
            --manifest "$authority_manifest" \
            --external-signer "$TAIRA_RELEASE_EXTERNAL_SIGNER_PATH" \
            --signing-public-key "$TAIRA_RELEASE_SIGNING_PUBLIC_KEY_PATH" \
            --trusted-signing-fingerprint \
              "$TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT" \
            --signature-output "$authority_signature" \
            --public-key-output "$authority_public_key" \
            --release-manifest-verifier \
              "$TAIRA_RELEASE_MANIFEST_VERIFIER_PATH" \
            --trusted-release-manifest-verifier-sha256 \
              "$TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256"

          python3 -S scripts/release_manifest_signing.py verify \
            --manifest "$authority_manifest" \
            --signature "$authority_signature" \
            --public-key "$authority_public_key" \
            --trusted-signing-fingerprint \
              "$TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT" \
            --release-manifest-verifier "$artifacts_dir/sorafs-validate" \
            --trusted-release-manifest-verifier-sha256 \
              "$TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256"

          authority_manifest_replay="$authority_dir/release_manifest.replay.json"
          python3 -S scripts/generate_release_manifest.py \
            "${release_manifest_args[@]}" \
            --output "$authority_manifest_replay"
          cmp "$authority_manifest" "$authority_manifest_replay"
          rm -f -- "$authority_manifest_replay"

          verify_args=(
            verify
            --evidence-root "$evidence_root"
            --commit "$DPN_VALIDATOR_BASE_GIT_HEAD"
            --signing-fingerprint "$TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT"
            --native-verifier-sha256 "$TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256"
            --image-manifest-digest "$TAIRA_BUILD_MANIFEST_DIGEST"
            --image-id "$TAIRA_PUBLISH_IMAGE_ID"
          )
          while IFS= read -r publish_tag; do
            [[ -n "$publish_tag" ]] || continue
            verify_args+=(--image-tag "$publish_tag")
          done < <(printf '%s\n' "$PUBLISH_TAGS" | sed '/^$/d' | LC_ALL=C sort)
          verify_args+=(--authority "$authority_payload")
          python3 -S \
            "$artifacts_dir/taira_release_authority.py" \
            "${verify_args[@]}"
          test "$(docker image inspect --format '{{.Id}}' "$LOCAL_TAG")" \
            = "$TAIRA_PUBLISH_IMAGE_ID"

          authority_manifest_sha="$(sha256sum "$authority_manifest" | awk '{print $1}')"
          [[ "$authority_manifest_sha" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "authority_dir=$authority_dir"
            echo "authority_manifest_sha256=$authority_manifest_sha"
          } >>"$GITHUB_OUTPUT"
          echo "TAIRA_RELEASE_AUTHORITY_MANIFEST_SHA256=$authority_manifest_sha" \
            >>"$GITHUB_ENV"

      - name: Upload the authenticated portable Taira release authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taira-validator-release-authority-${{ github.run_id }}
          path: |
            ${{ steps.release_authority.outputs.authority_dir }}/artifacts/
            ${{ steps.release_authority.outputs.authority_dir }}/release_manifest.json
            ${{ steps.release_authority.outputs.authority_dir }}/release_manifest.json.pub
            ${{ steps.release_authority.outputs.authority_dir }}/release_manifest.json.sig
          if-no-files-found: error
          retention-days: 90

      - name: Download the uploaded authority into a fresh replay root
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: taira-validator-release-authority-${{ github.run_id }}
          path: ${{ runner.temp }}/taira-release-authority-upload-replay

      - name: Reverify the uploaded authority before registry mutation
        shell: bash
        env:
          LOCAL_AUTHORITY_DIR: ${{ steps.release_authority.outputs.authority_dir }}
          LOCAL_TAG: ${{ steps.tags.outputs.local_tag }}
          PUBLISH_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -Eeuo pipefail
          downloaded="$RUNNER_TEMP/taira-release-authority-upload-replay"
          python3 -S - "$downloaded" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          sys.path.insert(0, str(root / "artifacts"))
          from release_artifact_contract import scan_inventory_paths

          expected = sorted(
              [
                  "artifacts/SHA256SUMS",
                  "artifacts/release_artifact_contract.py",
                  "artifacts/sorafs-validate",
                  "artifacts/taira-exact12-release-authority-v1.json",
                  "artifacts/taira_release_authority.py",
                  "release_manifest.json",
                  "release_manifest.json.pub",
                  "release_manifest.json.sig",
              ]
          )
          actual = scan_inventory_paths(root)
          if actual != expected:
              raise SystemExit(
                  f"uploaded Taira authority inventory mismatch: "
                  f"expected={expected}, actual={actual}"
              )
          PY

          while IFS= read -r relative; do
            cmp \
              "$LOCAL_AUTHORITY_DIR/$relative" \
              "$downloaded/$relative"
          done <<'EOF'
          artifacts/SHA256SUMS
          artifacts/release_artifact_contract.py
          artifacts/sorafs-validate
          artifacts/taira-exact12-release-authority-v1.json
          artifacts/taira_release_authority.py
          release_manifest.json
          release_manifest.json.pub
          release_manifest.json.sig
          EOF

          chmod 0555 "$downloaded/artifacts/sorafs-validate"
          python3 -S scripts/release_manifest_signing.py verify \
            --manifest "$downloaded/release_manifest.json" \
            --signature "$downloaded/release_manifest.json.sig" \
            --public-key "$downloaded/release_manifest.json.pub" \
            --trusted-signing-fingerprint \
              "$TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT" \
            --release-manifest-verifier \
              "$downloaded/artifacts/sorafs-validate" \
            --trusted-release-manifest-verifier-sha256 \
              "$TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256"

          verify_args=(
            verify
            --evidence-root "$LOCAL_AUTHORITY_DIR/evidence"
            --commit "$DPN_VALIDATOR_BASE_GIT_HEAD"
            --signing-fingerprint "$TAIRA_TRUSTED_RELEASE_SIGNING_FINGERPRINT"
            --native-verifier-sha256 "$TAIRA_TRUSTED_RELEASE_MANIFEST_VERIFIER_SHA256"
            --image-manifest-digest "$TAIRA_BUILD_MANIFEST_DIGEST"
            --image-id "$TAIRA_PUBLISH_IMAGE_ID"
          )
          while IFS= read -r publish_tag; do
            [[ -n "$publish_tag" ]] || continue
            verify_args+=(--image-tag "$publish_tag")
          done < <(printf '%s\n' "$PUBLISH_TAGS" | sed '/^$/d' | LC_ALL=C sort)
          verify_args+=(
            --authority
            "$downloaded/artifacts/taira-exact12-release-authority-v1.json"
          )
          python3 -S \
            "$downloaded/artifacts/taira_release_authority.py" \
            "${verify_args[@]}"
          test "$(docker image inspect --format '{{.Id}}' "$LOCAL_TAG")" \
            = "$TAIRA_PUBLISH_IMAGE_ID"

      - name: Push the same smoke-tested local image and verify registry digests
        shell: bash
        env:
          PUBLISH_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -Eeuo pipefail
          while IFS= read -r publish_tag; do
            [[ -n "$publish_tag" ]] || continue
            test "$(docker image inspect --format '{{.Id}}' "$publish_tag")" \
              = "$TAIRA_PUBLISH_IMAGE_ID"
            push_log="$(mktemp "${RUNNER_TEMP}/taira-push.XXXXXXXXXX")"
            trap 'rm -f -- "$push_log"' EXIT
            docker push "$publish_tag" 2>&1 | tee "$push_log"
            pushed_digest="$(
              sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$push_log" |
                tail -n 1
            )"
            [[ "$pushed_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$pushed_digest" = "$TAIRA_BUILD_MANIFEST_DIGEST"
            registry_digest="$(
              docker manifest inspect --verbose "$publish_tag" |
                jq -er '
                  if type == "object"
                     and (.Descriptor.digest? | type == "string")
                  then .Descriptor.digest
                  elif type == "object" and (.digest? | type == "string")
                  then .digest
                  else error("registry did not return one manifest digest")
                  end
                '
            )"
            test "$registry_digest" = "$pushed_digest"
            test "$(docker image inspect --format '{{.Id}}' "$publish_tag")" \
              = "$TAIRA_PUBLISH_IMAGE_ID"
            {
              echo "published ${publish_tag}"
              echo "  local image: ${TAIRA_PUBLISH_IMAGE_ID}"
              echo "  registry manifest: ${registry_digest}"
              echo "  signed authority manifest: ${TAIRA_RELEASE_AUTHORITY_MANIFEST_SHA256}"
            } >>"$GITHUB_STEP_SUMMARY"
            rm -f -- "$push_log"
            trap - EXIT
          done <<<"$PUBLISH_TAGS"
