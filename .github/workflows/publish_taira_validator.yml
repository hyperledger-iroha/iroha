name: Publish (Taira Validator Image)

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "The branch, tag, or SHA to checkout"
        required: true
        type: string
        default: main
      tag_suffix:
        description: "Optional image tag suffix. Defaults to the checked-out short SHA."
        required: false
        type: string
      push_latest:
        description: "Also push the rolling `taira-latest` tags"
        required: false
        type: boolean
        default: false

jobs:
  image:
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.checkout_ref }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Soramitsu Harbor
        uses: docker/login-action@v3
        with:
          registry: docker.soramitsu.co.jp
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          install: true

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          raw_suffix="${{ inputs.tag_suffix }}"
          if [[ -z "$raw_suffix" ]]; then
            raw_suffix="$(git rev-parse --short=12 HEAD)"
          fi

          suffix="$(printf '%s' "$raw_suffix" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [[ -z "$suffix" ]]; then
            echo "resolved tag suffix is empty" >&2
            exit 1
          fi

          {
            echo "suffix=$suffix"
            echo "tags<<EOF"
            echo "hyperledger/iroha:taira-$suffix"
            echo "docker.soramitsu.co.jp/iroha3/iroha:taira-$suffix"
            if [[ "${{ inputs.push_latest }}" == "true" ]]; then
              echo "hyperledger/iroha:taira-latest"
              echo "docker.soramitsu.co.jp/iroha3/iroha:taira-latest"
            fi
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Build local smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: local/taira-validator:smoke
          build-args: |
            "CONFIG_PROFILE=taira"
            "FEATURES=embedded-soracloud-runtime"
            "CARGO_BUILD_JOBS=1"
            "BINARIES=irohad"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Taira image default entrypoint
        shell: bash
        run: |
          set -euo pipefail

          cid="$(docker run -d --rm \
            --name taira-validator-smoke \
            -e IROHA_TAIRA_GENESIS=/config/genesis.json \
            -v "$PWD/defaults/kagami/iroha3-taira/config.toml:/config/config.toml:ro" \
            -v "$PWD/defaults/kagami/iroha3-taira/genesis.json:/config/genesis.json:ro" \
            local/taira-validator:smoke)"

          cleanup() {
            local status=$?
            if [[ $status -ne 0 ]]; then
              docker logs "$cid" || true
            fi
            docker stop "$cid" >/dev/null || true
            return $status
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if docker exec "$cid" curl -fsS http://127.0.0.1:8080/v1/mcp >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "timed out waiting for /v1/mcp on smoke container" >&2
          exit 1

      - name: Build and push Taira validator image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: commit=${{ github.sha }}
          build-args: |
            "CONFIG_PROFILE=taira"
            "FEATURES=embedded-soracloud-runtime"
            "CARGO_BUILD_JOBS=1"
            "BINARIES=irohad"
          cache-from: type=gha
          cache-to: type=gha,mode=max
