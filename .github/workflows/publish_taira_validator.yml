name: Publish (Taira Validator Image)

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "The branch, tag, or SHA to checkout"
        required: true
        type: string
        default: main
      tag_suffix:
        description: "Optional image tag suffix. Defaults to the checked-out short SHA."
        required: false
        type: string
      push_latest:
        description: "Also push the rolling `taira-latest` tags"
        required: false
        type: boolean
        default: false
      validator_lock_ref:
        description: "DPN API branch, tag, or SHA containing the reviewed validator lock"
        required: true
        type: string
        default: master

env:
  DPN_VALIDATOR_LOCK_SHA256: 08c939a65668814951adbd6f09ec4589a368dc41a7daac3cb3e8a096d8679986

jobs:
  image:
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: hyperledger/iroha2-ci:nightly-2025-05-08
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.checkout_ref }}

      - name: Install reviewed DPN validator lock
        shell: bash
        run: |
          set -Eeuo pipefail
          lock_ref='${{ inputs.validator_lock_ref }}'
          if [[ ! "$lock_ref" =~ ^[A-Za-z0-9._/-]+$ || "$lock_ref" == *..* ]]; then
            echo "validator_lock_ref contains unsupported characters" >&2
            exit 1
          fi
          lock_url="https://raw.githubusercontent.com/soramitsu/dpn-api-rust/${lock_ref}/ops/iroha/taira-validator.Cargo.lock"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --location --retry 3 --output Cargo.lock "$lock_url"
          printf '%s  %s\n' "$DPN_VALIDATOR_LOCK_SHA256" Cargo.lock | sha256sum -c -

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Soramitsu Harbor
        uses: docker/login-action@v3
        with:
          registry: docker.soramitsu.co.jp
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          install: true

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          raw_suffix="${{ inputs.tag_suffix }}"
          if [[ -z "$raw_suffix" ]]; then
            raw_suffix="$(git rev-parse --short=12 HEAD)"
          fi

          suffix="$(printf '%s' "$raw_suffix" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [[ -z "$suffix" ]]; then
            echo "resolved tag suffix is empty" >&2
            exit 1
          fi

          {
            echo "suffix=$suffix"
            echo "tags<<EOF"
            echo "hyperledger/iroha:taira-$suffix"
            echo "docker.soramitsu.co.jp/iroha3/iroha:taira-$suffix"
            if [[ "${{ inputs.push_latest }}" == "true" ]]; then
              echo "hyperledger/iroha:taira-latest"
              echo "docker.soramitsu.co.jp/iroha3/iroha:taira-latest"
            fi
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Build local smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/taira-validator:smoke
          build-args: |
            "PROFILE=release"
            "CONFIG_PROFILE=taira"
            "FEATURES=embedded-soracloud-runtime"
            "CARGO_BUILD_JOBS=1"
            "BINARIES=irohad kagami"
            "VALIDATOR_LOCK_SHA256=${{ env.DPN_VALIDATOR_LOCK_SHA256 }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Taira image default entrypoint
        shell: bash
        run: bash scripts/taira_image_smoke.sh --image local/taira-validator:smoke --timeout 120

      - name: Build and push Taira validator image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: commit=${{ github.sha }}
          build-args: |
            "PROFILE=release"
            "CONFIG_PROFILE=taira"
            "FEATURES=embedded-soracloud-runtime"
            "CARGO_BUILD_JOBS=1"
            "BINARIES=irohad"
            "VALIDATOR_LOCK_SHA256=${{ env.DPN_VALIDATOR_LOCK_SHA256 }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
