name: SCCP v1 conformance

# Cross-check the committed fixtures through each independent implementation.
# These component checks do not establish live-network or settlement readiness.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sccp-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  python-reference:
    name: Independent Python reference and fixture drift
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install the pinned script dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements.txt
      # test_fixture_has_no_drift regenerates every Python-owned fixture in
      # memory and compares it byte for byte, without rewriting committed data.
      - name: Verify primitives, destination behavior and every reference fixture
        run: |
          mkdir -p target/qualification/sccp
          python3 -m pytest -q pytests/scripts/test_sccp_reference.py pytests/scripts/test_sccp_sdk_governance.py 2>&1 | tee target/qualification/sccp/python-reference.log
      - name: Retain the reference test record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sccp-python-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/qualification/sccp/python-reference.log
          if-no-files-found: warn
          retention-days: 14

  rust-reference:
    name: Rust fixtures, Core, keeper, CLI and BLS cross-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: "false"
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: sccp-v1-rust-reference
          cache-on-failure: "true"
      # The ordinary tests reconstruct the fixtures and fail on drift. The
      # ignored regeneration tests are intentionally never selected in CI.
      - name: Check payload, tree, history, finality, transition and control fixtures
        run: |
          mkdir -p target/qualification/sccp
          cargo test --locked -p iroha_sccp --lib --test v1_vectors --test v1_reference_finality --test v1_reference_transitions --test v1_reference_control --test ethereum_light_client 2>&1 | tee target/qualification/sccp/rust-reference.log
      - name: Check RPC builders, retained mainnet fixtures and offline replay
        run: |
          cargo test --locked -p iroha_sccp_rpc 2>&1 | tee target/qualification/sccp/rpc.log
      - name: Check original-pool policy decoder controls and physical refusal
        run: |
          cargo test --locked -p norito --lib -- prepared_canonical prepared_scope canonical_header_policy --test-threads=1 2>&1 | tee target/qualification/sccp/policy-decoder.log
          cargo test --locked -p norito --test exact_field_streaming_allocations -- canonical_controls prepared_canonical --test-threads=1 2>&1 | tee target/qualification/sccp/policy-decoder-allocator.log
      - name: Check original-pool UID binding graphs and canonical parity
        run: |
          cargo test --locked -p iroha_data_model --lib -- asset::uid::binding_custody invalid_multisig_policies_reject_inside_ordinary_and_funded_complete_uid_bindings --test-threads=1 2>&1 | tee target/qualification/sccp/uid-binding.log
      - name: Check Core governance, fast-pause, forgery and liability fixtures
        run: |
          cargo test --locked -p iroha_core --lib -- sccp state::asset_uid uid_binding_retry_tests execution_attempt::policy_decode certified_chain::successor_context state::world_acquisition --test-threads=1 2>&1 | tee target/qualification/sccp/core-reference.log
      - name: Check shared asset policy and scope behavior
        run: |
          cargo test --locked -p iroha_core --lib smartcontracts::isi::asset 2>&1 | tee target/qualification/sccp/asset-policy.log
          cargo test --locked -p iroha_core --lib direct_home_tests 2>&1 | tee target/qualification/sccp/asset-scope.log
          cargo test --locked -p iroha_core --lib canonical_state_tests 2>&1 | tee target/qualification/sccp/canonical-state.log
          cargo test --locked -p iroha_primitives --lib numeric::quantity_accumulator::tests 2>&1 | tee target/qualification/sccp/quantity-accumulator.log
      # Build the daemon and CLI together so their shared feature graph is compiled once.
      - name: Check keeper admission, wallet preflight, signed submission and recovery
        run: |
          cargo test --locked -p irohad_lib -p iroha_cli_lib --lib sccp 2>&1 | tee target/qualification/sccp/keeper-cli.log
      - name: Reproduce Python BLS vectors and check the Rust-owned BLS fixture
        run: |
          cargo test --locked -p iroha_crypto --lib signature::bls::consensus::tests:: 2>&1 | tee target/qualification/sccp/bls-reference.log
      - name: Retain the Rust test records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sccp-rust-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/qualification/sccp/*.log
          if-no-files-found: warn
          retention-days: 14

  evm-contracts:
    name: Native EVM build, fixture replay and gas
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install the pinned script dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements.txt
      - name: Test authenticated artifact and compiler rejection paths
        run: python3 -m pytest -q pytests/scripts/test_contract_artifact_corridor.py
      # The harness authenticates the locked native solc, audits the locked EDR
      # runtime, and exercises Prague and Osaka with the committed gas bounds.
      - name: Build and test the locked Solidity contracts
        run: |
          mkdir -p target/qualification/sccp
          bash scripts/sccp_evm_contract_smoke.sh 2>&1 | tee target/qualification/sccp/evm-contracts.log
      - name: Retain the EVM test record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sccp-evm-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/qualification/sccp/evm-contracts.log
          if-no-files-found: warn
          retention-days: 14

  ton-contracts:
    name: Native TON build, fixture replay, StateInit and gas
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install the pinned script dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements.txt
      - name: Test toolchain authentication, vector rendering and StateInit encoding
        run: python3 -m pytest -q scripts/tests/ton_sccp_builder_test.py scripts/tests/sccp_ton_live_replay_test.py
      # "all" authenticates Acton 1.2.0 / Tolk 1.4.2, checks generated vectors,
      # formatting and wrappers, then runs the full emulator, gas and golden checks.
      - name: Build and test all three TON contracts
        run: |
          mkdir -p target/qualification/sccp
          sh scripts/sccp_ton_contract_build.sh all 2>&1 | tee target/qualification/sccp/ton-contracts.log
      - name: Retain the TON test record and measured gas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sccp-ton-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/qualification/sccp/ton-contracts.log
            contracts/ton/sccp/gas-current.json
          if-no-files-found: warn
          retention-days: 14
