name: Nightly Sumeragi v2 Formal

on:
  workflow_dispatch:
    inputs:
      release_gate:
        description: Require the machine-complete proof ledger
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "43 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sumeragi-v2-formal:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache pinned TLAPM
        uses: actions/cache@v4
        with:
          path: target/tlapm/toolchains/763bf3c1826d77a4cf206f43d5aa16775da1da33/x86_64-linux-gnu
          key: sumeragi-v2-tlapm-linux-x86-64-763bf3c1826d77a4cf206f43d5aa16775da1da33
      - name: Install pinned formal tools
        run: |
          bash scripts/formal/install_sumeragi_v2_tlapm.sh
          bash scripts/formal/install_sumeragi_v2_tla2tools.sh
          bash scripts/formal/install_sumeragi_v2_verus.sh
          echo "$GITHUB_WORKSPACE/target/verus/toolchains/0.2026.05.31.5dd6d83/x86-linux" >> "$GITHUB_PATH"
      - name: Sumeragi v2 TLAPS, bounded TLC, and Verus gates
        env:
          SUMERAGI_V2_TLC_PROFILE: nightly
          RELEASE_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate }}
        run: |
          if [[ "$RELEASE_GATE" == "true" ]]; then
            bash ci/check_sumeragi_formal.sh --release
          else
            bash ci/check_sumeragi_formal.sh
          fi
      - name: Formal docs metadata report
        if: always()
        run: python3 ci/check_docs_i18n_metadata.py --paths docs/formal --json-out target/docs-i18n/formal-metadata.json
      - name: Upload Sumeragi v2 formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sumeragi-v2-formal-nightly
          path: |
            target/formal/sumeragi_v2
            target/docs-i18n/formal-metadata.json
          if-no-files-found: ignore
