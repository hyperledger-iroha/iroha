version: 2

updates:
  - package-ecosystem: "docker"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: "github-actions"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: "pip"
    target-branch: "main"
    directories:
      - /pytests/*
      - /scripts
      - /.github/scripts/ci_test
      - /python/*
    schedule:
      interval: "daily"
    commit-message:
      prefix: chore
      include: scope
    groups:
      deps:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    target-branch: "main"
    directories:
      - /
    schedule:
      interval: "daily"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: "npm"
    target-branch: "main"
    directories:
      - /javascript/iroha_js
      - /scripts/contract_tooling/evm-runtime
      - /tools/kotodama_linguist/grammar-repo
      - /tools/openapi
    schedule:
      interval: "weekly"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: "gradle"
    target-branch: "main"
    directories:
      - /kotlin
      - /java/iroha_android
      - /java/norito_java
      - /examples/android
      - /examples/android/attestation-probe
    schedule:
      interval: "weekly"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: "swift"
    target-branch: "main"
    directories:
      - /IrohaSwift
      - /tools/connect-cli
      - /examples/ios/ConnectMinimalApp
    schedule:
      interval: "weekly"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: "nuget"
    target-branch: "main"
    directory: "/csharp"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: chore
      include: scope
