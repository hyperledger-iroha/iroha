[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "iroha-python"
version = "0.0.1"
description = "Python SDK for interacting with Hyperledger Iroha 3 nodes."
readme = "README.md"
authors = [{name = "Hyperledger Iroha Contributors"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "blake3>=1.0",
  "iroha-norito>=0.1.0",
  "iroha-torii-client>=0.0.1",
  "requests>=2.31",
]
keywords = ["iroha", "sdk", "blockchain", "norito"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.optional-dependencies]
ws = [
  "websocket-client>=1.7",
]
dev = [
  "pytest>=8.0",
  "mypy>=1.8.0,<2.0",
  "ruff>=0.1.9",
  "types-requests>=2.31,<3",
]

[project.urls]
Homepage = "https://github.com/hyperledger/iroha"
Repository = "https://github.com/hyperledger/iroha"

[tool.maturin]
python-source = "src"
manifest-path = "iroha_python_rs/Cargo.toml"
module-name = "iroha_python._crypto"
exclude = [
  "src/**/*.so",
  "src/**/*.dylib",
  "src/**/*.pyd",
  "src/**/__pycache__/**",
  "src/**/*.pyc",
  "src/**/*.pyo",
]
include = [
  "src/iroha_python/examples/connect_app_metadata.json",
  "src/iroha_python/py.typed",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E203", "E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true
files = ["src/iroha_python"]
