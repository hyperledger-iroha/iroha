[package]
name = "iroha_python_rs"
version = "0.0.1"
edition = "2024"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("compact-len"))',
    'cfg(feature, values("packed-struct"))',
    'cfg(feature, values("schema-structural"))',
] }

[lib]
name = "iroha_python_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
iroha_crypto = { path = "../../../crates/iroha_crypto", features = ["node-crypto", "gost", "sm"], default-features = false }
iroha_data_model = { path = "../../../crates/iroha_data_model", features = ["application-model"], default-features = false }
iroha_primitives = { path = "../../../crates/iroha_primitives" }
iroha_schema = { path = "../../../crates/iroha_schema" }
iroha_version = { path = "../../../crates/iroha_version" }
iroha_torii_shared = { path = "../../../crates/iroha_torii_shared" }
norito = { path = "../../../crates/norito", default-features = false, features = ["node-codec"] }
ivm = { path = "../../../crates/ivm", default-features = false, features = ["runtime"] }
sorafs_manifest = { path = "../../../crates/sorafs_manifest" }
iroha_config = { path = "../../../crates/iroha_config" }
iroha_core = { path = "../../../crates/iroha_core", features = ["node"], default-features = false }
iroha_zkp_halo2 = { path = "../../../crates/iroha_zkp_halo2" }
zk_ace_prover = { path = "../../../crates/zk_ace_prover" }
sorafs_car = { path = "../../../crates/sorafs_car" }
sorafs_chunker = { path = "../../../crates/sorafs_chunker" }
sorafs_orchestrator = { path = "../../../crates/sorafs_orchestrator" }
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py39"] }
rand_core_06 = { workspace = true }
rustix = { version = "1.1.4", features = ["fs", "process"] }
hex = "0.4.3"
base64 = "0.22.1"
sha2 = "0.10.9"
zeroize = { version = "1.8.2", default-features = false, features = ["alloc", "std"] }
x25519-dalek = "2.0.1"
futures = { workspace = true }
blake3 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
url = { workspace = true }

[build-dependencies]
pyo3-build-config = "0.29.0"

[dev-dependencies]
once_cell = "1.21.3"
tempfile = { workspace = true }
ed25519-dalek = "2.2.0"
http = { workspace = true }

[package.metadata.maturin]
name = "iroha_python._crypto"
