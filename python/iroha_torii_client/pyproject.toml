[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iroha-torii-client"
version = "0.0.1"
description = "Lightweight Torii HTTP client helpers for Hyperledger Iroha."
readme = "README.md"
authors = [{name = "Hyperledger Iroha Contributors"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "blake3>=1.0.10",
  "cryptography>=50.0.2",
  "requests>=2.34.2",
  "certifi>=2026.10.19",
  "urllib3>=2.8.0",
]
keywords = ["iroha", "torii", "sdk", "blockchain"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
native = ["iroha-native==0.0.1"]

[project.urls]
Homepage = "https://github.com/hyperledger/iroha"
Repository = "https://github.com/hyperledger/iroha"

[tool.setuptools]
include-package-data = true
packages = ["iroha_torii_client"]
package-dir = {"iroha_torii_client" = "."}

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "*.pyo", "__pycache__/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E203", "E501"]

[tool.mypy]
python_version = "3.10"
exclude = "(^|/)(build|tests)/"
strict = false
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true
files = ["."]
