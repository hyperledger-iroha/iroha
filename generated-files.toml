# Registry for generated source that intentionally remains checked in.
#
# Each repository-owned generator must provide a read-only drift-check command.
# External entries record pinned provenance when the upstream input is not part
# of this repository. Package, portal, cache, and build outputs are forbidden
# below and must be regenerated in ignored staging directories.
schema_version = 1

[policy]
forbidden_tracked_globs = [
  "dist/**",
  "javascript/iroha_js/dist/**",
  ".swiftpm-build/**",
  "build/**",
  "**/build/**",
  "target/**",
  "**/target/**",
  "**/node_modules/**",
  "**/.docusaurus/**",
  "**/__pycache__/**",
  "**/.pytest_cache/**",
  "**/.ruff_cache/**",
  "**/.gradle/**",
  "**/.swiftpm/**",
  "**/.cache/**",
  "**/*.pyc",
  "**/*.pyo",
  "**/*.class",
]
allowed_tracked_paths = ["dist/.gitkeep"]
generated_source_extensions = [
  ".go",
  ".java",
  ".js",
  ".kt",
  ".mjs",
  ".py",
  ".rs",
  ".swift",
  ".ts",
  ".yaml",
  ".yml",
]

[[generated]]
name = "data-model-public-api"
kind = "file"
outputs = [
  "crates/iroha_data_model/non_transparent_api.rs",
  "crates/iroha_data_model/transparent_api.rs",
]
# The obsolete extractor was retired because it could not reproduce this
# curated public API facade. The crate tests remain the authoritative check.
generator = "retired legacy extractor; no authoritative generator"
generator_sources = []
inputs = []
check = "cargo test --locked -p iroha_data_model"
external = true
provenance = "checked-in public API facade; obsolete non-authoritative extractor retired"

