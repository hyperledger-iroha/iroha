]
inputs = [
  "crates/ivm/spec/syscalls.toml",
  "crates/ivm/src/syscalls.rs",
  "crates/ivm_abi/src/syscalls.rs",
]
check = "cargo run --locked -p ivm --bin gen_syscalls_doc -- --check"

