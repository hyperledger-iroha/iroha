# SDK-owned client configuration. CLI filesystem settings are documented in
# crates/iroha_cli/README.md and are not accepted by the reusable SDK loader.
# chain =
# Select the same canonical one-line identity file used by validator `genesis.expected_hash_file`.
# network_id_file = "genesis.expected_hash"

## Configure the Torii endpoint via this file. Environment variable overrides exist for developer tooling but are not meant for operator workflows.
# torii_url = "http://127.0.0.1:8080"
## Timeout in milliseconds for Torii HTTP requests (status, query, submit, etc.).
# torii_request_timeout_ms = 30_000

[basic_auth]
# web_login =
# password =

[account]
## Network context is required and has no default. Select a public network profile
## (`taira` or `minamoto`), or set the I105 chain discriminant of any other network.
## When both are set they must agree.
# profile = "taira"
# chain_discriminant = 753
# public_key =
## Configure exactly one private-key source.
# private_key =
# private_key_file =

[transaction]
# time_to_live_ms = 100_000
# status_timeout_ms = 100_000
## Whether to append a random nonce to every submitted transaction (helps avoid hash clashes in demos/tests).
# nonce = false
