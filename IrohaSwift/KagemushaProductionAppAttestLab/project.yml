name: KagemushaProductionAppAttestLab
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.0"
    ONLY_ACTIVE_ARCH: YES
    SUPPORTED_PLATFORMS: iphoneos
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1"
targets:
  KagemushaProductionAppAttestLab:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - sdk: DeviceCheck.framework
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: "${KAGEMUSHA_APP_ATTEST_LAB_ROOT}/App/KagemushaProductionAppAttestLab.entitlements"
        PRODUCT_BUNDLE_IDENTIFIER: org.hyperledger.iroha.kagemusha.appattestlab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
schemes:
  KagemushaProductionAppAttestLab:
    build:
      targets:
        KagemushaProductionAppAttestLab: all
    run:
      config: Debug
