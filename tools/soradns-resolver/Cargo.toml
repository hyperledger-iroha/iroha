[package]
name = "soradns-resolver"
autobins = false
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
default = []
dev-tools = []

[[bin]]
name = "soradns-resolver"
path = "src/main.rs"

[[bin]]
name = "soradns_transparency_report"
path = "src/bin/soradns_transparency_report.rs"
required-features = ["dev-tools"]

[[bin]]
name = "soradns_transparency_tail"
path = "src/bin/soradns_transparency_tail.rs"
required-features = ["dev-tools"]

[dependencies]
clap = { workspace = true, features = ["derive"] }
eyre = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "net", "io-util", "time"] }
futures = { workspace = true, features = ["std"] }
blake3 = { workspace = true }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
norito_derive = { workspace = true }
hex = { workspace = true, features = ["alloc"] }
url = { workspace = true }
once_cell = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
base64 = { workspace = true, features = ["alloc"] }
axum = { workspace = true, default-features = false, features = ["http1", "json", "macros", "tokio", "tower-log", "query"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-rustls = { workspace = true }
rustls = { version = "0.23.35", default-features = false, features = ["std"] }
hickory-proto = { version = "0.26.1", default-features = false }
iroha_primitives = { workspace = true }
iroha_data_model = { workspace = true, default-features = false, features = ["application-model"] }
iroha_crypto = { workspace = true, default-features = false, features = ["application"] }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
tempfile = { workspace = true }

[dev-dependencies]
expect-test = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "net", "io-util"] }
assert_cmd = "2.1.1"
