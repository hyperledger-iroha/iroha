[package]
name = "sora-vpn-helper"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
description = "Local Sora VPN controller scaffold for Electron packaging"

[[bin]]
name = "sora-vpn-controller"
path = "src/main.rs"

[dependencies]
blake3 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
hex = { workspace = true }
iroha_crypto = { workspace = true, features = ["application"], default-features = false }
iroha_data_model = { workspace = true, features = ["application-model"], default-features = false }
nix = { version = "0.30.1", features = ["signal"] }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
quinn = { version = "0.11.9", default-features = false, features = ["rustls", "runtime-tokio"] }
rand = { workspace = true }
rustls = { workspace = true }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt", "signal", "time"] }
