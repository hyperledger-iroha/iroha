[package]
name = "kotlin-fixture-gen"
autobins = false
version = "0.1.0"
edition = "2024"
publish = false

[features]
dev-tools = []

[[bin]]
name = "kotlin-fixture-gen"
path = "src/main.rs"
required-features = ["dev-tools"]

[dependencies]
iroha_data_model = { path = "../../crates/iroha_data_model", default-features = false, features = ["application-model", "transparent_api"] }
iroha_crypto = { path = "../../crates/iroha_crypto", default-features = false, features = ["node-crypto"] }
norito = { path = "../../crates/norito", default-features = false, features = ["node-codec"] }
hex = { version = "0.4.3", default-features = false, features = ["std"] }
