[package]
name = "iroha_native_source_delivery"
autobins = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Retained native filesystem transaction for Python source delivery"
publish = false

[lints]
workspace = true

[features]
# The internal delivery executable is an explicit release/CI tool, never a default
# workspace binary (scripts/check_workspace_target_inventory.py).
dev-tools = []

[[bin]]
name = "iroha_native_source_delivery"
path = "src/main.rs"
required-features = ["dev-tools"]

[dependencies]
iroha_fs.workspace = true
norito = { workspace = true, default-features = false, features = ["json"] }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
hex = { workspace = true, features = ["alloc"] }

[dev-dependencies]
tempfile = { workspace = true }
