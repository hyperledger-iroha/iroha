apiVersion: v1
kind: Namespace
metadata:
  name: soranet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: soranet-relay-config
  namespace: soranet
data:
  relay.json: |
    {
      "mode": "Entry",
      "listen": "0.0.0.0:4433",
      "admin_listen": "127.0.0.1:9090",
      "admin_auth_token_path": "/etc/soranet/relay/secrets/admin-token",
      "tls": {
        "self_signed_subject": "relay.soranet.local"
      },
      "pow": {
        "required": true,
        "difficulty": 6,
        "max_future_skew_secs": 600,
        "min_ticket_ttl_secs": 45,
        "revocation_store_path": "/var/lib/soranet-relay/ticket_revocations.norito"
      },
      "padding": {
        "cell_size": 1024,
        "max_idle_millis": 200,
        "global_rate_limit_bytes_per_sec": 262144,
        "burst_bytes": 524288
      },
      "congestion": {
        "max_circuits_per_client": 12,
        "handshake_cooldown_millis": 250
      },
      "compliance": {
        "enable": true,
        "log_path": "/var/log/soranet/relay_compliance.jsonl",
        "hash_salt_path": "/etc/soranet/relay/secrets/compliance-hash-salt.hex",
        "max_log_bytes": 67108864,
        "max_backup_files": 7,
        "pipeline_spool_dir": "/var/spool/soranet/audit"
      },
      "handshake": {
        "descriptor_manifest_path": "/etc/soranet/relay/secrets/relay-descriptor-manifest.json",
        "descriptor_commit_hex": "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef",
        "kem": [
          { "id": "ml-kem-768", "required": true },
          { "id": "ml-kem-1024", "required": false }
        ],
        "signatures": [
          { "id": "dilithium3", "required": true }
        ],
        "grease": [
          { "typ": 32528, "value_hex": "deadbeef" },
          { "typ": 32529, "value_hex": "cafebabe" }
        ]
      },
      "guard_directory": {
        "snapshot_path": "/etc/soranet/relay/guards/current_snapshot.norito",
        "expected_snapshot_digest_hex": "fedcba98765432100123456789abcdef0123456789abcdef0123456789abcdef",
        "allow_missing_entry": false
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: soranet-relay-manifest
  namespace: soranet
type: Opaque
stringData:
  # Replace before deployment with at least 32 random printable ASCII bytes.
  # This deliberately invalid short value makes an uncustomized deployment fail closed.
  admin-token: "REPLACE_ME"
  # Replace with 32 random bytes encoded as exactly 64 lowercase hex characters.
  compliance-hash-salt.hex: "REPLACE_WITH_64_LOWERCASE_HEX_BYTES"
  relay-descriptor-manifest.json: |
    {
      "version": 1,
      "identity": {
        "ed25519_private_key_hex": "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff",
        "ml_kem_private_key_hex": "",
        "ml_kem_public_hex": ""
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soranet-relay
  namespace: soranet
spec:
  # A relay identity owns one single-use ticket ledger. Scale by deploying
  # distinct relay identities, never by cloning this pod and its local ledger.
  replicas: 1
  # Do not let a rolling update overlap two processes that claim the same
  # relay identity and replay ledger.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: soranet-relay
  template:
    metadata:
      labels:
        app: soranet-relay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Kubernetes Secret projections are symlinks. Copy them once into a
      # fresh emptyDir so the relay can enforce direct-file identity, owner,
      # link-count, and permission checks on the files it actually reads.
      initContainers:
        - name: materialize-private-files
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -eu
            - -c
            - |
              umask 077
              cp /var/run/soranet-relay-secret-source/admin-token /private/admin-token
              cp /var/run/soranet-relay-secret-source/compliance-hash-salt.hex /private/compliance-hash-salt.hex
              cp /var/run/soranet-relay-secret-source/relay-descriptor-manifest.json /private/relay-descriptor-manifest.json
              chown 65532:65532 /private/admin-token /private/compliance-hash-salt.hex /private/relay-descriptor-manifest.json
              chmod 0400 /private/admin-token /private/compliance-hash-salt.hex /private/relay-descriptor-manifest.json
              chown 0:0 /private
              chmod 0755 /private
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: manifest-source
              mountPath: /var/run/soranet-relay-secret-source
              readOnly: true
            - name: manifest
              mountPath: /private
      containers:
        - name: relay
          image: ghcr.io/sora-nexus/soranet-relay:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/etc/soranet/relay/relay.json"
          env:
            - name: RUST_LOG
              value: "soranet_relay=info,quinn=warn"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: quic
              containerPort: 4433
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/soranet/relay
            - name: manifest
              mountPath: /etc/soranet/relay/secrets
              readOnly: true
            - name: audit-spool
              mountPath: /var/spool/soranet/audit
              readOnly: false
            - name: relay-logs
              mountPath: /var/log/soranet
              readOnly: false
            - name: relay-state
              mountPath: /var/lib/soranet-relay
              readOnly: false
      volumes:
        - name: config
          configMap:
            name: soranet-relay-config
        - name: manifest
          emptyDir:
            medium: Memory
        - name: manifest-source
          secret:
            secretName: soranet-relay-manifest
            defaultMode: 0400
        - name: audit-spool
          emptyDir: {}
        - name: relay-logs
          emptyDir: {}
        - name: relay-state
          persistentVolumeClaim:
            claimName: soranet-relay-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soranet-relay-state
  namespace: soranet
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: soranet-relay
  namespace: soranet
spec:
  selector:
    app: soranet-relay
  ports:
    - name: quic
      port: 4433
      targetPort: quic
      protocol: UDP
