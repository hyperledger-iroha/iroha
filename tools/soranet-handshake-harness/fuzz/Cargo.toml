[package]
name = "soranet-handshake-harness-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata.cargo-fuzz]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4.13", features = ["arbitrary-derive"] }
arbitrary = { version = "1.5.0", features = ["derive"] }
rand = { version = "0.10.3", features = ["std", "std_rng"] }
soranet-handshake-harness = { path = ".." }

[workspace]
members = ["."]

[patch.crates-io]
# Preserve applicable root workspace source and allocation custody patches.
num-bigint = { path = "../../../vendor/num-bigint-0.5.1" }
[[bin]]
name = "handshake_state_machine"
path = "fuzz_targets/handshake_state_machine.rs"
test = false
doc = false
bench = false
