[package]
name = "soranet-handshake-harness"
autobins = false
autotests = false
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
description = "Reference harness for SoraNet handshake fixtures"

[features]
# Command-line binary; the library used by xtask and the fixture tests does not
# need its argument parsing or file handling.
dev-tools = ["dep:clap", "dep:hex", "dep:tempfile", "dep:soranet_pq"]

[[bin]]
name = "soranet-handshake-harness"
path = "src/main.rs"
required-features = ["dev-tools"]

[dependencies]
clap = { version = "4.5.51", features = ["derive"], optional = true }
hex = { version = "0.4.3", optional = true }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
tempfile = { version = "3.23.0", optional = true }
iroha_crypto = { workspace = true, default-features = false, features = ["application"] }
soranet_pq = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = "2.1.1"

[[test]]
name = "fixtures_verify"
path = "tests/fixtures_verify.rs"
