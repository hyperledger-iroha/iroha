version: "3.9"
services:
  iroha-iroha3-taira-0:
    image: hyperledger/iroha:latest
    command: ["iroha3d", "--sora", "--config", "/config/config.toml"]
    volumes:
      - ./config.toml:/config/config.toml:ro
      - ./genesis.json:/config/genesis.json:ro
      - ./genesis.signed.nrt:/config/genesis.signed.nrt:ro
      - ./sorafs_sites.json:/config/sorafs_sites.json:ro
      - /run/secrets/iroha:/run/secrets/iroha:ro
    ports:
      - "8080:8080"
      - "1337:1337"
    networks:
      profile:
        ipv4_address: 172.28.0.10
