# Example configuration for sorafs_gateway_self_cert.sh
# Replace every angle-bracket placeholder with reviewed runtime deployment data.
# Do not commit private keys or runtime credentials.

workspace = /srv/iroha
signing_key = /run/secrets/sorafs/gateway-attestor.hex
signer = <gateway-attestor-account>
gateway = https://<regional-gateway-host>/
out = /var/lib/sorafs/self-cert/<release-id>

# Required release-authenticity tuple. The signature is raw Ed25519 (64 bytes)
# and the public key is raw Ed25519 (32 bytes).
release_manifest = /srv/releases/<release-id>/release_manifest.json
release_manifest_signature = /srv/releases/<release-id>/release_manifest.ed25519.sig
release_manifest_public_key = /srv/releases/<release-id>/release_manifest.ed25519.pub
trusted_signing_fingerprint = <reviewed-64-lowercase-hex-sha256>
release_manifest_verifier = /opt/iroha/bin/sorafs-validate
trusted_release_manifest_verifier_sha256 = <reviewed-64-lowercase-hex-sha256>
