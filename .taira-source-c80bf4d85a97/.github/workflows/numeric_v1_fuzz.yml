name: Numeric V1 strict fuzz smoke

on:
  pull_request:
    paths:
      - ".github/workflows/numeric_v1_fuzz.yml"
      - "crates/iroha_primitives/src/bigint.rs"
      - "crates/iroha_primitives/src/numeric.rs"
      - "crates/iroha_primitives/src/numeric_abi.rs"
      - "crates/kotodama_lang/src/**"
      - "crates/kotodama_lang/tests/**"
      - "crates/ivm/fuzz/**"
      - "crates/ivm/build.rs"
      - "crates/ivm/examples/numeric_v1_fixture.rs"
      - "crates/ivm/src/numeric.rs"
      - "crates/ivm/src/numeric_v1.rs"
      - "crates/ivm/src/numeric_gas.rs"
      - "crates/ivm/src/numeric_tlv.rs"
      - "crates/ivm/src/pointer_abi.rs"
      - "crates/ivm/src/syscalls.rs"
      - "crates/ivm/spec/syscalls.toml"
      - "crates/ivm/tests/**"
      - "crates/ivm_abi/src/**"
      - "docs/source/kotodama_numeric_v1.md"
      - "fixtures/numeric_v1_golden.json"
      - "pytests/scripts/fuzz_smoke_test.py"
      - "scripts/fuzz_smoke.sh"
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: numeric-v1-fuzz-${{ github.sha }}
  cancel-in-progress: false

jobs:
  numeric_v1_fuzz:
    name: Numeric V1 libFuzzer gate
    # Sanitizing the complete IVM dependency graph is memory intensive; use
    # the same managed Linux pool as the repository's full workspace gates.
    runs-on: [self-hosted, Linux, iroha2]
    # A clean sanitizer build of the IVM graph can exceed 45 minutes even
    # though the libFuzzer execution itself is capped at 60 seconds.
    timeout-minutes: 120
    env:
      RUNS: "10000"
      FUZZ_MAX_TOTAL_TIME: "60"
      FUZZ_RSS_LIMIT_MB: "3072"
      FUZZ_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact source commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: nightly-2025-05-08

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
          shared-key: numeric-v1-fuzz-nightly-2025-05-08
          workspaces: "crates/ivm/fuzz -> target"

      - name: Install pinned cargo-fuzz
        run: |
          cargo +nightly-2025-05-08 install cargo-fuzz \
            --version 0.13.2 \
            --locked
          cargo-fuzz --version

      - name: Run fail-closed Numeric V1 fuzz smoke
        run: scripts/fuzz_smoke.sh --strict --numeric-v1-only

      - name: Archive crash artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: numeric-v1-fuzz-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: crates/ivm/fuzz/artifacts/numeric_v1
          if-no-files-found: ignore
          retention-days: 30
