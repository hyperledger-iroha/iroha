groups:
  - name: sorafs-gateway-compliance
    interval: 1m
    rules:
      - alert: SoraFSGatewayComplianceUnavailable
        expr: min by (cluster) (torii_sorafs_gateway_compliance_ready) < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SoraFS gateway compliance serving policy is unavailable"
          description: |
            At least one gateway in cluster {{ $labels.cluster }} has lacked a
            fresh verified serving catalog for five minutes. Serving must remain
            fail closed; restore the last-known-good catalog before promotion.
      - alert: SoraFSGatewayComplianceCatalogExpiring
        expr: (min by (cluster) (torii_sorafs_gateway_compliance_serving_catalog_valid_until_seconds - time()) < 900) and on (cluster) (min by (cluster) (torii_sorafs_gateway_compliance_ready) == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SoraFS gateway compliance catalog expires within 15 minutes"
          description: |
            The verified serving catalog in cluster {{ $labels.cluster }} has
            less than 15 minutes of validity. Complete threshold approval and
            regional acknowledgement before the serving path fails closed.
      - alert: SoraFSGatewayComplianceCatalogSequenceSkew
        expr: (max by (cluster) (torii_sorafs_gateway_compliance_serving_catalog_sequence) - min by (cluster) (torii_sorafs_gateway_compliance_serving_catalog_sequence)) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SoraFS gateway compliance catalog sequence differs across replicas"
          description: |
            Ready gateway replicas in cluster {{ $labels.cluster }} are serving
            different catalog sequences. Pause promotion and reconcile regional
            acknowledgements, checkpoint lineage, and last-known-good state.
      - alert: SoraFSGatewayComplianceControlErrorRatioHigh
        expr: sum by (cluster, operation) (rate(torii_sorafs_gateway_compliance_requests_total{outcome!="success"}[5m])) / clamp_min(sum by (cluster, operation) (rate(torii_sorafs_gateway_compliance_requests_total[5m])), 0.000000001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SoraFS gateway compliance control error ratio is high"
          description: |
            Control operation {{ $labels.operation }} in cluster
            {{ $labels.cluster }} has exceeded a five-percent error ratio for
            ten minutes. Inspect bounded failure classes and operator auth.
      - alert: SoraFSGatewayComplianceServingFailure
        expr: sum by (cluster, class) (increase(torii_sorafs_gateway_compliance_failures_total{surface="serving"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "SoraFS gateway compliance serving evaluation failed closed"
          description: |
            A serving evaluation in cluster {{ $labels.cluster }} failed with
            class {{ $labels.class }} in the last five minutes. Confirm catalog
            freshness and controller persistence before resuming traffic.
