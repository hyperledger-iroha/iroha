groups:
  - name: sorafs-orderbook
    interval: 1m
    rules:
      - alert: SoraFSOrderbookFinalizedProjectionUnavailable
        expr: min by (cluster) (torii_sorafs_orderbook_finalized_projection_ready) < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SoraFS finalized orderbook projection is unavailable"
          description: |
            Torii has not published one complete immutable finalized orderbook
            projection for cluster {{ $labels.cluster }}. Matching, depth, and
            settlement panels are not release evidence until the ready gauge
            returns to one.
      - alert: SoraFSOrderbookFinalizedProjectionStale
        expr: (max by (cluster) (time() - torii_sorafs_orderbook_finalized_projection_timestamp_seconds) > 120) and on (cluster) (min by (cluster) (torii_sorafs_orderbook_finalized_projection_ready) == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SoraFS finalized orderbook projection is stale"
          description: |
            The last complete orderbook projection for cluster
            {{ $labels.cluster }} is more than two minutes behind the current
            time. Check finality, the bounded event scan, and Torii readiness.
      - alert: SoraFSOrderbookFinalizedProjectionFailure
        expr: sum by (cluster, reason) (increase(torii_sorafs_orderbook_finalized_projection_failures_total[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "SoraFS finalized orderbook projection failed"
          description: |
            A fail-closed orderbook projection refresh failed for reason
            {{ $labels.reason }} in cluster {{ $labels.cluster }}. Inspect the
            finalized query path; do not substitute a process-local book.
      - alert: SoraFSOrderbookFinalizedProjectionSkew
        expr: ((max by (cluster) (torii_sorafs_orderbook_finalized_projection_height) - min by (cluster) (torii_sorafs_orderbook_finalized_projection_height)) > 2) and on (cluster) (min by (cluster) (torii_sorafs_orderbook_finalized_projection_ready) == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SoraFS finalized orderbook projections are skewed"
          description: |
            Ready Torii replicas in cluster {{ $labels.cluster }} differ by
            more than two finalized heights. Check peer finality and complete
            reconciliation before using the projection as rollout evidence.
      - alert: SoraFSOrderbookMatchingLagHigh
        expr: (max by (cluster) (torii_sorafs_orderbook_matcher_lag_seconds) > 2) and on (cluster) (min by (cluster) (torii_sorafs_orderbook_finalized_projection_ready) == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SoraFS orderbook matching lag is high"
          description: |
            The authoritative book in cluster {{ $labels.cluster }} has remained
            ahead of its last exhaustive bounded matcher scan for more than two
            seconds. Check transaction forwarding and finality before accepting
            additional order flow.
      - alert: SoraFSOrderbookSettlementBacklogHigh
        expr: ((max by (cluster) (torii_sorafs_orderbook_settlement_backlog) > 100) or (max by (cluster) (torii_sorafs_orderbook_oldest_settlement_age_seconds) > 900)) and on (cluster) (min by (cluster) (torii_sorafs_orderbook_finalized_projection_ready) == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SoraFS settlement backlog is high"
          description: |
            Authoritative open settlement channels for cluster
            {{ $labels.cluster }} exceeded the backlog or age threshold. Drain
            receipt submission and pause new channels if the queue grows.
      - alert: SoraFSOrderbookApiErrorRatioHigh
        expr: sum by (cluster, route) (rate(torii_sorafs_orderbook_api_requests_total{outcome="error"}[5m])) / clamp_min(sum by (cluster, route) (rate(torii_sorafs_orderbook_api_requests_total[5m])), 0.000000001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SoraFS orderbook API error ratio is high"
          description: |
            Orderbook API route {{ $labels.route }} in cluster
            {{ $labels.cluster }} reported an error ratio above 5% for five
            minutes. Inspect validation, signer, and finalized-query failures.
      - alert: SoraFSOrderbookEscrowRunwayLow
        expr: (max by (cluster) (torii_sorafs_orderbook_settlement_backlog) > 0) and on (cluster) (min by (cluster) (torii_sorafs_orderbook_escrow_runway_seconds) < 86400) and on (cluster) (min by (cluster) (torii_sorafs_orderbook_finalized_projection_ready) == 1)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "SoraFS orderbook escrow runway below one day"
          description: |
            At least one authoritative open settlement channel in cluster
            {{ $labels.cluster }} expires within one day. Drain or expire the
            channel before remaining custody can no longer settle cleanly.
