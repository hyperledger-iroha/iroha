[package]
name = "regenerate_codec_samples"
version = "2.0.0-rc.2.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
color-eyre = "0.6.5"
iroha_data_model = { path = "../../crates/iroha_data_model", default-features = false, features = ["json"] }
iroha_test_samples = { path = "../../crates/iroha_test_samples" }
iroha_primitives = { path = "../../crates/iroha_primitives", default-features = false, features = ["json"] }
norito = {path = "../../crates/norito"}

[workspace]

# This helper is its own workspace, so it does not inherit the repository root's
# patched stable-compatible Halo2 crates pulled in through `iroha_data_model`.
[patch.crates-io]
halo2-axiom = { path = "../../vendor/halo2-axiom" }
halo2curves-axiom = { path = "../../vendor/halo2curves-axiom" }
