[package]
name = "norito_derive"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true, features = ["default", "full"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }
heck = { workspace = true }

[features]
default = []
trybuild-tests = ["dep:trybuild"]

[dependencies.trybuild]
workspace = true
optional = true

[dev-dependencies]
norito = {path = "../norito"}

[[test]]
name = "ui"
required-features = ["trybuild-tests"]
