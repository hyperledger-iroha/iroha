[package]
name = "iroha-da-replay-cache-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
iroha_model_base = { path = "../crates/iroha_model_base" }
libfuzzer-sys = { version = "=0.4.13", features = ["arbitrary-derive"] }
arbitrary = { version = "=1.5.0", features = ["derive"] }
iroha_core = { path = "../crates/iroha_core" }
sorafs_car = { path = "../crates/sorafs_car", features = ["manifest"] }
sorafs_manifest = { path = "../crates/sorafs_manifest", features = ["pqc"] }
flate2 = "=1.1.10"
zstd = "=0.14.3"
iroha_data_model = { path = "../crates/iroha_data_model" }
norito = { path = "../crates/norito" }
iroha_crypto = { path = "../crates/iroha_crypto", default-features = false }
rand = { version = "=0.10.3", default-features = false, features = ["std"] }
rand_chacha = { version = "=0.10.0", default-features = false, features = ["std"] }

[workspace]
members = ["."]
resolver = "2"

[patch.crates-io]
# Preserve applicable root workspace source and allocation custody patches.
bytes = { path = "../vendor/bytes" }
http-body-util = { path = "../vendor/http-body-util" }
concread = { path = "../vendor/concread" }
num-bigint = { path = "../vendor/num-bigint-0.5.1" }
aes = { path = "../vendor/aes" }
ark-ff = { path = "../vendor/ark-ff-0.5.0" }
ark-bls12-381 = { path = "../vendor/ark-bls12-381-0.5.0" }
halo2curves = { path = "../vendor/halo2curves-0.10.0" }
metal = { path = "../vendor/metal-0.33.0" }
[[bin]]
name = "da_replay_cache"
path = "da_replay_cache.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proof_stream_transport"
path = "proof_stream_transport.rs"
test = false
doc = false
bench = false

[[bin]]
name = "da_ingest_schema"
path = "da_ingest_schema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "soranet_handshake"
path = "soranet_handshake.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
