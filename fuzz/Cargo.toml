[package]
name = "iroha-da-replay-cache-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "=0.4.10", features = ["arbitrary-derive"] }
arbitrary = { version = "=1.4.2", features = ["derive"] }
iroha_core = { path = "../crates/iroha_core" }
sorafs_car = { path = "../crates/sorafs_car", features = ["manifest"] }
sorafs_manifest = { path = "../crates/sorafs_manifest" }
flate2 = "=1.1.5"
zstd = "=0.13.3"
base64 = "=0.22.1"
iroha_data_model = { path = "../crates/iroha_data_model" }
norito = { path = "../crates/norito" }
iroha_crypto = { path = "../crates/iroha_crypto", default-features = false }
rand = { version = "=0.9.3", default-features = false, features = ["std"] }
rand_chacha = { version = "=0.9.0", default-features = false, features = ["std"] }

[workspace]
members = ["."]
resolver = "2"

# Standalone fuzz resolution must retain the workspace's source overrides.
# In particular, SoraFS uses the vendored Halo2 serialization implementations.
[patch.crates-io]
halo2-axiom = { path = "../vendor/halo2-axiom" }
halo2curves-axiom = { path = "../vendor/halo2curves-axiom" }

[patch."https://github.com/axiom-crypto/halo2-lib.git"]
halo2-base = { path = "../vendor/halo2-base" }

[[bin]]
name = "da_replay_cache"
path = "da_replay_cache.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proof_stream_transport"
path = "proof_stream_transport.rs"
test = false
doc = false
bench = false

[[bin]]
name = "da_ingest_schema"
path = "da_ingest_schema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "soranet_handshake"
path = "soranet_handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lane_relay_envelope"
path = "lane_relay_envelope.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
