version: "3.9"

services:
  taira-validator:
    container_name: ${TAIRA_CONTAINER_NAME:-taira-validator-1}
    image: ${TAIRA_IMAGE:-hyperledger/iroha:taira-latest}
    pull_policy: missing
    init: true
    restart: unless-stopped
    environment:
      RUST_LOG: ${TAIRA_RUST_LOG:-info}
      # Uncomment when mounting a custom genesis file below.
      # IROHA_TAIRA_GENESIS: /config/genesis.json
      # Uncomment when mounting an explicit signed genesis payload below.
      # IROHA_TAIRA_SIGNED_GENESIS: /config/genesis.signed.nrt
    ports:
      - "${TAIRA_P2P_PORT:-1337}:1337"
      - "${TAIRA_TORII_PORT:-18080}:8080"
    volumes:
      - type: bind
        source: "${TAIRA_CONFIG_PATH:?set TAIRA_CONFIG_PATH to the rendered validator config}"
        target: /config/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${TAIRA_STORAGE_PATH:?set TAIRA_STORAGE_PATH to the existing validator storage directory}"
        target: /storage
        bind:
          create_host_path: false
      - type: bind
        source: "${TAIRA_KAGEMUSHA_RELEASE_POLICY_PATH:?set TAIRA_KAGEMUSHA_RELEASE_POLICY_PATH to the reviewed authenticated release policy}"
        target: /etc/iroha/kagemusha/release-policy.norito
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${TAIRA_KAGEMUSHA_ARTIFACT_DIR:?set TAIRA_KAGEMUSHA_ARTIFACT_DIR to the reviewed V4 artifact directory}"
        target: /var/lib/iroha/kagemusha/v4
        read_only: true
        bind:
          create_host_path: false
      # Uncomment to override the bundled public genesis.
      # - "${TAIRA_GENESIS_PATH:-/etc/iroha/taira-validator-1/genesis.json}:/config/genesis.json:ro"
      # Uncomment to inject a signed genesis block for disconnected/local smoke boots.
      # - "${TAIRA_SIGNED_GENESIS_PATH:-/etc/iroha/taira-validator-1/genesis.signed.nrt}:/config/genesis.signed.nrt:ro"
      # Uncomment after setting [sorafs.gateway.site_bindings].path =
      # "/config/sorafs_sites.json" in the rendered validator config.
      # - "${TAIRA_SORAFS_SITE_BINDINGS_PATH:-/etc/iroha/taira-validator-1/sorafs_sites.json}:/config/sorafs_sites.json:ro"
    healthcheck:
      # `/livez` is process-only. Container/LB admission must use the complete
      # mandatory-offline readiness contract exposed by `/readyz`.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
