# Copy this file to a runtime-only path such as
# `/run/secrets/taira-canary-client.toml`, replace the placeholder key material,
# and keep the populated file out of the repo.
#
# Set `torii_url` to the exact public node under test. Replace both account-key
# placeholders before using `iroha taira write-canary`; the CLI owns onboarding,
# faucet funding, blocking submission, and receipt verification. The first-release
# `/v1` API does not use an `x-iroha-api-version` request header.

chain = "fc56984b-2be7-431d-840e-21514d1883f0"
network_id = "82531ce8eae8bff6beeca4698bfd13a3bc8bec5f0ee0d23d428c97fc17ab0f3b"
torii_url = "https://taira.sora.org/"

[account]
domain = "universal"
profile = "taira"
public_key = "REPLACE_WITH_CANARY_PUBLIC_KEY"
private_key = "REPLACE_WITH_CANARY_PRIVATE_KEY"

[transaction]
time_to_live_ms = 120000
status_timeout_ms = 120000
nonce = false
