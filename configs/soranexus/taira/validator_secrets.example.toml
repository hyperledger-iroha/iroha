# Copy this file to a user-local path such as
# `configs/soranexus/taira/validator_secrets.local.toml`, replace every
# placeholder, and keep the populated file out of the repo.
#
# Pair this with `validator_roster.local.toml` when rendering validator configs:
#   python3 scripts/render_taira_validator_bundle.py \
#     --roster configs/soranexus/taira/validator_roster.local.toml \
#     --secrets configs/soranexus/taira/validator_secrets.local.toml \
#     --output-dir dist/taira-validators
#
# The checked-in `config.toml` is a template only. Populate the shared Taira
# onboarding/faucet authority and streaming identity here so the renderer can
# inject those runtime-only values into every generated validator config.

[shared]
torii_onboarding_authority = "REPLACE_WITH_TAIRA_ONBOARDING_AUTHORITY"
torii_onboarding_private_key = "REPLACE_WITH_TAIRA_ONBOARDING_PRIVATE_KEY"
torii_faucet_authority = "REPLACE_WITH_TAIRA_FAUCET_AUTHORITY"
torii_faucet_private_key = "REPLACE_WITH_TAIRA_FAUCET_PRIVATE_KEY"
streaming_identity_public_key = "REPLACE_WITH_STREAMING_IDENTITY_PUBLIC_KEY"
streaming_identity_private_key = "REPLACE_WITH_STREAMING_IDENTITY_PRIVATE_KEY"

[[validators]]
slug = "taira-validator-1"
private_key = "REPLACE_WITH_BLS_PRIVATE_KEY_1"

[[validators]]
slug = "taira-validator-2"
private_key = "REPLACE_WITH_BLS_PRIVATE_KEY_2"

[[validators]]
slug = "taira-validator-3"
private_key = "REPLACE_WITH_BLS_PRIVATE_KEY_3"

[[validators]]
slug = "taira-validator-4"
private_key = "REPLACE_WITH_BLS_PRIVATE_KEY_4"
