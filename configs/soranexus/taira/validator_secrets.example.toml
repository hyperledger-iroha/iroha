# Copy this file to a user-local path such as
# `configs/soranexus/taira/validator_secrets.local.toml`, replace every
# placeholder, and keep the populated file out of the repo.
#
# Pair this with `validator_roster.local.toml` when rendering validator configs:
#   python3 scripts/render_taira_validator_bundle.py \
#     --roster configs/soranexus/taira/validator_roster.local.toml \
#     --secrets configs/soranexus/taira/validator_secrets.local.toml \
#     --output-dir dist/taira-validators
#
# The checked-in `config.toml` is a template only. Populate the shared Taira
# onboarding/faucet authority, onboarding API token, streaming identity, and the public SoraFS
# admission-council roots/quorum here so the renderer can inject the deployment
# values into every generated validator config.

[shared]
account_onboarding_authority = "REPLACE_WITH_TAIRA_ONBOARDING_AUTHORITY"
account_onboarding_private_key = "REPLACE_WITH_TAIRA_ONBOARDING_PRIVATE_KEY"
torii_faucet_authority = "REPLACE_WITH_TAIRA_FAUCET_AUTHORITY"
torii_faucet_private_key = "REPLACE_WITH_TAIRA_FAUCET_PRIVATE_KEY"
kagemusha_commands_private_key = "REPLACE_WITH_TAIRA_KAGEMUSHA_COMMANDS_PRIVATE_KEY"
# Kagemusha release policy, catalog, and qualification-seal paths are public
# deployment inputs selected by `--kagemusha-release-root`; never add them or
# release-attestation signing keys to this runtime-secrets file.
# Public identity of the provider-backed Soracloud mutation signer. The
# provider referenced by `handle` owns the private key; never place it here.
soracloud_runtime_signer_handle = "REPLACE_WITH_SORACLOUD_RUNTIME_SIGNER_HANDLE"
soracloud_runtime_signer_authority = "REPLACE_WITH_SORACLOUD_RUNTIME_SIGNER_AUTHORITY"
soracloud_runtime_signer_algorithm = "REPLACE_WITH_SORACLOUD_RUNTIME_SIGNER_ALGORITHM"
soracloud_runtime_signer_public_key_hex = "REPLACE_WITH_SORACLOUD_RUNTIME_SIGNER_PUBLIC_KEY_HEX"
soracloud_runtime_signer_revision = "REPLACE_WITH_SORACLOUD_RUNTIME_SIGNER_REVISION"
soracloud_runtime_signer_policy_digest_hex = "REPLACE_WITH_SORACLOUD_RUNTIME_SIGNER_POLICY_DIGEST_HEX"
streaming_identity_public_key = "REPLACE_WITH_STREAMING_IDENTITY_PUBLIC_KEY"
streaming_identity_private_key = "REPLACE_WITH_STREAMING_IDENTITY_PRIVATE_KEY"
sorafs_council_public_keys = [
  "REPLACE_WITH_TAIRA_SORAFS_COUNCIL_PUBLIC_KEY_1",
  "REPLACE_WITH_TAIRA_SORAFS_COUNCIL_PUBLIC_KEY_2",
  "REPLACE_WITH_TAIRA_SORAFS_COUNCIL_PUBLIC_KEY_3",
]
sorafs_council_signature_threshold = 2

# Each client receives an independent token confined to its exact application
# dataspace. Never reuse a token across credential entries.
[[shared.account_onboarding_credentials]]
id = "boi-mobile"
api_token = "REPLACE_WITH_CRYPTOGRAPHICALLY_RANDOM_BOI_ONBOARDING_API_TOKEN"
scope_dataspace = "is2"

[[shared.account_onboarding_credentials]]
id = "dpn-api"
api_token = "REPLACE_WITH_CRYPTOGRAPHICALLY_RANDOM_DPN_ONBOARDING_API_TOKEN"
scope_dataspace = "dpn"

[[validators]]
slug = "taira-validator-1"
private_key = "REPLACE_WITH_BLS_PRIVATE_KEY_1"
soranet_transport_public_key = "REPLACE_WITH_SORANET_TRANSPORT_PUBLIC_KEY_1"
soranet_transport_private_key = "REPLACE_WITH_SORANET_TRANSPORT_PRIVATE_KEY_1"
receipt_public_key = "REPLACE_WITH_SECP256K1_RECEIPT_PUBLIC_KEY_1"
receipt_private_key = "REPLACE_WITH_SECP256K1_RECEIPT_PRIVATE_KEY_1"

