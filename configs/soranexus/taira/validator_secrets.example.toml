soranet_transport_private_key = "REPLACE_WITH_SORANET_TRANSPORT_PRIVATE_KEY_2"
receipt_public_key = "REPLACE_WITH_SECP256K1_RECEIPT_PUBLIC_KEY_2"
receipt_private_key = "REPLACE_WITH_SECP256K1_RECEIPT_PRIVATE_KEY_2"

