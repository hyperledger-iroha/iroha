# Copy this file to a user-local path such as
# `configs/soranexus/taira/validator_secrets.local.toml`, replace every
# placeholder, and keep the populated file out of the repo.
#
# Pair this with `validator_roster.local.toml` when rendering validator configs:
#   python3 scripts/render_taira_validator_bundle.py \
#     --roster configs/soranexus/taira/validator_roster.local.toml \
#     --secrets configs/soranexus/taira/validator_secrets.local.toml \
#     --output-dir dist/taira-validators
#
# The checked-in `config.toml` is a template only. Populate the shared Taira
# onboarding/faucet authority, onboarding API token, streaming identity, and the public SoraFS
# admission-council roots/quorum here so the renderer can inject the deployment
# values into every generated validator config.

[shared]
account_onboarding_authority = "REPLACE_WITH_TAIRA_ONBOARDING_AUTHORITY"
account_onboarding_private_key = "REPLACE_WITH_TAIRA_ONBOARDING_PRIVATE_KEY"
account_onboarding_api_token = "REPLACE_WITH_CRYPTOGRAPHICALLY_RANDOM_API_TOKEN"
account_onboarding_credential_id = "taira-operator"
account_onboarding_scope_dataspace = "is"
torii_faucet_authority = "REPLACE_WITH_TAIRA_FAUCET_AUTHORITY"
torii_faucet_private_key = "REPLACE_WITH_TAIRA_FAUCET_PRIVATE_KEY"
kagemusha_commands_private_key = "REPLACE_WITH_TAIRA_KAGEMUSHA_COMMANDS_PRIVATE_KEY"
offline_asset_alias = "ds#boi.is"
offline_asset_definition_id = "REPLACE_WITH_REGISTERED_SCALE_2_DS_ASSET_DEFINITION_ID"
offline_asset_scale = 2
offline_escrow_account = "REPLACE_WITH_TAIRA_OFFLINE_ESCROW_ACCOUNT"
streaming_identity_public_key = "REPLACE_WITH_STREAMING_IDENTITY_PUBLIC_KEY"
streaming_identity_private_key = "REPLACE_WITH_STREAMING_IDENTITY_PRIVATE_KEY"
sorafs_council_public_keys = [
  "REPLACE_WITH_TAIRA_SORAFS_COUNCIL_PUBLIC_KEY_1",
  "REPLACE_WITH_TAIRA_SORAFS_COUNCIL_PUBLIC_KEY_2",
  "REPLACE_WITH_TAIRA_SORAFS_COUNCIL_PUBLIC_KEY_3",
]
sorafs_council_signature_threshold = 2

[[validators]]
slug = "taira-validator-1"
private_key = "REPLACE_WITH_BLS_PRIVATE_KEY_1"

[[validators]]
slug = "taira-validator-2"
private_key = "REPLACE_WITH_BLS_PRIVATE_KEY_2"

[[validators]]
slug = "taira-validator-3"
private_key = "REPLACE_WITH_BLS_PRIVATE_KEY_3"

[[validators]]
slug = "taira-validator-4"
private_key = "REPLACE_WITH_BLS_PRIVATE_KEY_4"
