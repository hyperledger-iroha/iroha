# Copy this file to a user-local path such as
# `configs/soranexus/taira/validator_roster.local.toml`, replace every
# placeholder and fixture public key, and keep the populated file out of the repo. Keep the matching
# validator private keys and shared authorities in your runtime secret store,
# not here. This roster is retained only as the topology input for the edge
# nginx renderer; it is not a validator deployment source.
#
# For the shared nginx edge on one machine, keep `edge_torii_upstream`
# aligned with the live Torii listener ports and render the edge config from
# the same roster:
#   python3 scripts/render_taira_edge_nginx_conf.py \
#     --roster configs/soranexus/taira/validator_roster.local.toml \
#     --output dist/taira-edge/taira.sora.org.conf
#
# Dedicated Soracloud runtime aliases can be pinned to local service listeners
# from this same roster. Keep these in the local copy, uncomment and adjust the
# upstream for the shared edge host, and rerender nginx before cutover:
#
# [[soracloud_alias_routes]]
# alias = "solswap-indexer.sora"
# edge_upstream = "127.0.0.1:8788"
#
# All four validators use the public Torii root `https://taira.sora.org`.
# Their native-selected BLS public keys route finality attestations to distinct
# pinned upstreams. The public keys below are development fixture examples;
# replace them with the actual generated role keys before native admission.

