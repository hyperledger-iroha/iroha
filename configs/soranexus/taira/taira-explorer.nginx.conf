# Generated by scripts/render_taira_edge_nginx_conf.py from the Taira validator roster.
# Shared-edge stress runs require the main nginx.conf to set:
#   worker_rlimit_nofile 65536;
#   events { worker_connections 16384; }
# Deploy on the shared edge host serving:
# - taira.sora.org (Torii endpoint / convenience host)
# - taira-explorer.sora.org (Explorer web UI)
# - validator-specific public Torii hostnames from the roster
# - *.sorafs.taira.sora.org (origin-isolated SoraFS site hosts)
# - <alias>.mon.taira.sora.net (public Soracloud browser gateway hosts)

map $host $taira_mon_alias_host {
  default "";
  ~^(?<taira_mon_alias_host_capture>.+)\.mon\.taira\.sora\.net$ $taira_mon_alias_host_capture;
}

map $http_origin $taira_public_torii_cors_origin {
  default "";
  "https://test.soraswap.org" $http_origin;
  "http://127.0.0.1:3000" $http_origin;
  "http://localhost:3000" $http_origin;
}

upstream taira_validator_1_upstream {
  server 127.0.0.1:29080;
  keepalive 64;
}

upstream taira_validator_2_upstream {
  server 127.0.0.1:29081;
  keepalive 64;
}

upstream taira_validator_3_upstream {
  server 127.0.0.1:29082;
  keepalive 64;
}

upstream taira_validator_4_upstream {
  server 127.0.0.1:29083;
  keepalive 64;
}

upstream taira_public_edge_upstream {
  server 127.0.0.1:29080 max_fails=1 fail_timeout=5s;
  keepalive 64;
}

server {
  listen 80;
  listen [::]:80;
  server_name taira.sora.org taira-explorer.sora.org mon.taira.sora.net taira-validator-1.sora.org taira-validator-2.sora.org taira-validator-3.sora.org taira-validator-4.sora.org *.sorafs.taira.sora.org ~^.+\.mon\.taira\.sora\.net$;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name taira.sora.org;
  client_max_body_size 1g;

  ssl_certificate /etc/letsencrypt/live/taira.sora.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taira.sora.org/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Gate every non-probe request on the selected validator's complete
  # offline readiness. nginx OSS only has passive transport health checks,
  # so an internal auth subrequest is required to reject a live-but-unready
  # validator before proxying any application or value-moving request.
  auth_request /.taira-internal/offline-readiness;

  location = /.taira-internal/offline-readiness {
    internal;
    auth_request off;
    proxy_pass http://taira_validator_1_upstream/readyz;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header X-API-Token "";
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_send_timeout 3s;
  }

  location = /livez {
    auth_request off;
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /health {
    auth_request off;
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /readyz {
    auth_request off;
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /status {
    auth_request off;
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /v1/offline/readiness {
    auth_request off;
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Access-Control-Expose-Headers;
  proxy_hide_header Access-Control-Max-Age;
  add_header Access-Control-Allow-Origin $taira_public_torii_cors_origin always;
  add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers "accept, authorization, content-type" always;
  add_header Access-Control-Max-Age "3600" always;
  add_header Vary "Origin" always;

  # A CORS preflight is answered locally without proxying, reading chain
  # state, or submitting value. It remains available while admission is
  # closed so clients can report the subsequent readiness failure cleanly.
  if ($request_method = OPTIONS) {
    return 204;
  }

  # IrohaConnect session tokens and MCP Connect tools are node-local; keep
  # session creation, management/status, and websocket authorization on one Torii process.
  location = /v1/connect/session {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /v1/connect/session/ {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /v1/connect/status {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /v1/connect/ws {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /v1/mcp {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /v1/app-api/ {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /v1/sorafs/storage/ {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /v1/sorafs/pin/ {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /v1/sorafs/cid/ {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /sorafs/cid/ {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ~ ^/soradns/(?<soradns_alias>[^/]+)(?<soradns_rest>/.*)?$ {
    set $soradns_target_path $soradns_rest;
    if ($soradns_target_path = "") {
      set $soradns_target_path /;
    }

    proxy_pass http://taira_public_edge_upstream$soradns_target_path$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $soradns_alias;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503 http_504 invalid_header non_idempotent;
    proxy_next_upstream_tries 4;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ / {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503 http_504 invalid_header non_idempotent;
    proxy_next_upstream_tries 4;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }
}

