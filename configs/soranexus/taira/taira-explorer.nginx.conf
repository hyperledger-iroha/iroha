# Deploy on the shared edge host serving:
# - taira.sora.org (Torii endpoint / convenience host)
# - taira-explorer.sora.org (Explorer web UI)
# - taira-validator-{1,2,3,4}.sora.org (direct per-validator Torii hostnames)
# - *.sorafs.taira.sora.org (origin-isolated SoraFS site hosts)
#
# This shared-host variant is useful when all public validators are on one box
# and each validator listens on its own local Torii port. If validators run on
# separate machines, install the same per-host TLS/reverse-proxy pattern on the
# owning validator host instead of centralizing those names here.
#
# The frontend build is from sibling repo ../iroha2-block-explorer-web.
# The certificate referenced below must cover:
# - taira.sora.org
# - taira-explorer.sora.org
# - taira-validator-1.sora.org
# - taira-validator-2.sora.org
# - taira-validator-3.sora.org
# - taira-validator-4.sora.org
# - *.sorafs.taira.sora.org
#
# Wildcard issuance requires DNS-01. The cert path can still point at a single
# bundle if your ACME client stores all SANs under one lineage.
# - /etc/letsencrypt/live/taira.sora.org/{fullchain.pem,privkey.pem}

upstream taira_validator_1_upstream {
  server 127.0.0.1:18080;
  keepalive 64;
}

upstream taira_validator_2_upstream {
  server 127.0.0.1:18081;
  keepalive 64;
}

upstream taira_validator_3_upstream {
  server 127.0.0.1:18082;
  keepalive 64;
}

upstream taira_validator_4_upstream {
  server 127.0.0.1:18083;
  keepalive 64;
}

server {
  listen 80;
  listen [::]:80;
  server_name taira.sora.org taira-explorer.sora.org taira-validator-1.sora.org taira-validator-2.sora.org taira-validator-3.sora.org taira-validator-4.sora.org *.sorafs.taira.sora.org;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name taira.sora.org *.sorafs.taira.sora.org;
  # SoraFS storage pins send the staged site as a single JSON body, so the
  # public edge needs explicit headroom for multi-megabyte uploads.
  client_max_body_size 64m;

  ssl_certificate /etc/letsencrypt/live/taira.sora.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taira.sora.org/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location = /v1/connect/ws {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /v1/mcp {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }
}

