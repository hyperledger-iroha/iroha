# Deploy on the shared edge host serving:
# - taira.sora.org (Torii endpoint / convenience host)
# - taira-explorer.sora.org (Explorer web UI)
# - taira-validator-{1,2,3,4}.sora.org (direct per-validator Torii hostnames)
# - *.sorafs.taira.sora.org (origin-isolated SoraFS site hosts)
#
# This shared-host variant is useful when all public validators are on one box
# and each validator listens on its own local Torii port. If validators run on
# separate machines, install the same per-host TLS/reverse-proxy pattern on the
# owning validator host instead of centralizing those names here.
#
# The frontend build is from sibling repo ../iroha2-block-explorer-web.
# The certificate referenced below must cover:
# - taira.sora.org
# - taira-explorer.sora.org
# - taira-validator-1.sora.org
# - taira-validator-2.sora.org
# - taira-validator-3.sora.org
# - taira-validator-4.sora.org
# - *.sorafs.taira.sora.org
#
# Wildcard issuance requires DNS-01. The cert path can still point at a single
# bundle if your ACME client stores all SANs under one lineage.
# - /etc/letsencrypt/live/taira.sora.org/{fullchain.pem,privkey.pem}

upstream taira_validator_1_upstream {
  server 127.0.0.1:18080;
  keepalive 64;
}

upstream taira_validator_2_upstream {
  server 127.0.0.1:18081;
  keepalive 64;
}

upstream taira_validator_3_upstream {
  server 127.0.0.1:18082;
  keepalive 64;
}

upstream taira_validator_4_upstream {
  server 127.0.0.1:18083;
  keepalive 64;
}

# Shared public hostnames must not pin MCP/general API traffic to one validator.
# MCP initialize is a POST, so failover has to allow non-idempotent retries
# when a validator listener is down. Public SoraFS/app-api traffic now follows
# the same shared upstream because provider enrollment and remote hydration are
# expected to work symmetrically across the public validator set.
upstream taira_public_edge_upstream {
  server 127.0.0.1:18080 max_fails=1 fail_timeout=5s;
  server 127.0.0.1:18081 max_fails=1 fail_timeout=5s;
  server 127.0.0.1:18082 max_fails=1 fail_timeout=5s;
  server 127.0.0.1:18083 max_fails=1 fail_timeout=5s;
  keepalive 64;
}

server {
  listen 80;
  listen [::]:80;
  server_name taira.sora.org taira-explorer.sora.org taira-validator-1.sora.org taira-validator-2.sora.org taira-validator-3.sora.org taira-validator-4.sora.org *.sorafs.taira.sora.org;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name taira.sora.org;
  # SoraFS storage pins send the staged site as a single JSON body, so the
  # public edge needs explicit headroom for multi-megabyte uploads.
  client_max_body_size 512m;

  ssl_certificate /etc/letsencrypt/live/taira.sora.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taira.sora.org/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location = /v1/connect/ws {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503 http_504 invalid_header non_idempotent;
    proxy_next_upstream_tries 4;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /v1/mcp {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503 http_504 invalid_header non_idempotent;
    proxy_next_upstream_tries 4;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /v1/app-api/ {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /v1/sorafs/storage/ {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /v1/sorafs/pin/ {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /v1/sorafs/cid/ {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /sorafs/cid/ {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  # Compatibility gateway for clients that cannot resolve vanity Soracloud
  # hosts directly. Strip /soradns/<alias> and proxy the request as if it were
  # addressed to the alias host itself; deploys should mutate Soracloud route
  # bindings behind a stable vanity host, not nginx host lists or DNS records.
  location ~ ^/soradns/(?<soradns_alias>[^/]+)(?<soradns_rest>/.*)?$ {
    set $soradns_target_path $soradns_rest;
    if ($soradns_target_path = "") {
      set $soradns_target_path /;
    }

    proxy_pass http://taira_public_edge_upstream$soradns_target_path$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $soradns_alias;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503 http_504 invalid_header non_idempotent;
    proxy_next_upstream_tries 4;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503 http_504 invalid_header non_idempotent;
    proxy_next_upstream_tries 4;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }
}

