server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name taira-explorer.sora.org;
  client_max_body_size 1g;

  ssl_certificate /etc/letsencrypt/live/taira.sora.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taira.sora.org/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/iroha2-block-explorer-web/dist;
  index index.html;

  # Gate every non-probe request on the selected validator's complete
  # offline readiness. nginx OSS only has passive transport health checks,
  # so an internal auth subrequest is required to reject a live-but-unready
  # validator before proxying any application or value-moving request.
  auth_request /.taira-internal/offline-readiness;

  location = /.taira-internal/offline-readiness {
    internal;
    auth_request off;
    proxy_pass http://taira_validator_1_upstream/readyz;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header X-API-Token "";
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_send_timeout 3s;
  }

  location = /livez {
    auth_request off;
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host taira.sora.org;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /health {
    auth_request off;
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host taira.sora.org;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /readyz {
    auth_request off;
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host taira.sora.org;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /status {
    auth_request off;
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host taira.sora.org;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /v1/offline/readiness {
    auth_request off;
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host taira.sora.org;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # IrohaConnect session tokens and MCP Connect tools are node-local; keep
  # session creation, management/status, and websocket authorization on one Torii process.
  location = /v1/connect/session {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host taira.sora.org;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /v1/connect/session/ {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host taira.sora.org;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /v1/connect/status {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host taira.sora.org;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /v1/connect/ws {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host taira.sora.org;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /v1/mcp {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host taira.sora.org;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /v1/ {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira-validator-1.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host taira.sora.org;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503 http_504 invalid_header non_idempotent;
    proxy_next_upstream_tries 4;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }
}
