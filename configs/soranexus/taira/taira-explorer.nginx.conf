# Generated by scripts/render_taira_edge_nginx_conf.py from the Taira validator roster.
# Deploy on the shared edge host serving:
# - taira.sora.org (Torii endpoint / convenience host)
# - taira-explorer.sora.org (Explorer web UI)
# - validator-specific public Torii hostnames from the roster
# - *.sorafs.taira.sora.org (origin-isolated SoraFS site hosts)
# - <alias>.mon.taira.sora.org (public Soracloud browser gateway hosts)

upstream taira_validator_1_upstream {
  server 127.0.0.1:18080;
  keepalive 64;
}

upstream taira_validator_2_upstream {
  server 127.0.0.1:18081;
  keepalive 64;
}

upstream taira_validator_3_upstream {
  server 127.0.0.1:18082;
  keepalive 64;
}

upstream taira_validator_4_upstream {
  server 127.0.0.1:18083;
  keepalive 64;
}

upstream taira_public_edge_upstream {
  server 127.0.0.1:18080 max_fails=1 fail_timeout=5s;
  server 127.0.0.1:18081 max_fails=1 fail_timeout=5s;
  server 127.0.0.1:18082 max_fails=1 fail_timeout=5s;
  server 127.0.0.1:18083 max_fails=1 fail_timeout=5s;
  keepalive 64;
}

server {
  listen 80;
  listen [::]:80;
  server_name taira.sora.org taira-explorer.sora.org mon.taira.sora.org taira-validator-1.sora.org taira-validator-2.sora.org taira-validator-3.sora.org taira-validator-4.sora.org *.sorafs.taira.sora.org ~^.+\.mon\.taira\.sora\.org$;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ~^.+\.mon\.taira\.sora\.org$;
  client_max_body_size 512m;

  # Each pretty host receives an exact certificate at Soracloud alias bind time.
  # Do not use a wildcard certificate here: `*.mon.taira.sora.org` does not
  # cover multi-label aliases such as solswap-indexer.sora.mon.taira.sora.org.
  ssl_certificate /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location ^~ / {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503 http_504 invalid_header non_idempotent;
    proxy_next_upstream_tries 4;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }
}

