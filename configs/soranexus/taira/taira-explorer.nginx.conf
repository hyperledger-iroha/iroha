server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name taira-explorer.sora.org;
  # Keep the explorer-side API proxy aligned with the Torii host so large
  # SoraFS uploads can pass through whichever public hostname is used.
  client_max_body_size 64m;

  ssl_certificate /etc/letsencrypt/live/taira.sora.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taira.sora.org/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/iroha2-block-explorer-web/dist;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /status {
    proxy_pass http://taira_validator_1_upstream/status;
    proxy_http_version 1.1;
    proxy_set_header Host taira.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /v1/connect/ws {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host taira.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /v1/mcp {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  # Explorer -> Torii pass-through for API + SSE routes.
  location ^~ /v1/ {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host taira.sora.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }
}
