version: "3.9"

# Apply only on taira-validator-1:
# docker compose -f docker-compose.validator.yml \
#   -f docker-compose.peer1-privacy.yml up -d
services:
  taira-validator:
    user: "1001:1001"
    entrypoint:
      - /opt/iroha/configs/soranexus/taira/taira-validator-peer1-privacy.sh
    environment:
      TAIRA_BOOTLE_LANTERN_EXPECTED_POLICY_RECORD_DIGEST: ${TAIRA_BOOTLE_LANTERN_EXPECTED_POLICY_RECORD_DIGEST:?set the reviewed export-public policy record digest}
      TAIRA_BOOTLE_LANTERN_EXPECTED_QUALIFICATION_POLICY_DIGEST: ${TAIRA_BOOTLE_LANTERN_EXPECTED_QUALIFICATION_POLICY_DIGEST:?set the reviewed export-public qualification digest}
    volumes:
      - "${TAIRA_BOOTLE_LANTERN_CREDENTIALS_PATH:?set the canonical peer-1 credential directory}:/run/credentials/taira-bootle-lantern:ro"
    tmpfs:
      - /run/iroha:uid=1001,gid=1001,mode=0700,noexec,nosuid,nodev
    stop_grace_period: 60s
