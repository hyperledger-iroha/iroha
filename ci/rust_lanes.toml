[lanes.integration]
description = "Cross-component, multi-peer integration coverage."
packages = ["integration_tests"]

# Only these package tests start external nodes. Sibling executable tests use
# Cargo's CARGO_BIN_EXE_* paths and do not need downloaded release artifacts.
# Authenticated message-control tests run under Cargo and cannot build child
# programs. Their explicit artifact is built separately with the test feature;
# it never replaces the shipping daemon. Qualified corridor bundles below keep
# their own build and provenance protocols.
[package_binaries]
iroha_test_network = ["iroha3d", "iroha", "iroha3d_message_control"]
izanami = ["iroha3d", "iroha"]
integration_tests = ["iroha3d", "iroha", "iroha3d_message_control"]

# Non-Cargo consumers participate in the same artifact-union calculation.
# Package triggers use the expanded reverse-dependency closure. Unknown/shared
# inputs and ci/full select every consumer; ordinary prose changes do not.
# Ordinary foundation-only edits (including iroha_crypto and norito) run the
# binary-free reverse closure and defer package-triggered external consumers.
# Mixed source changes and direct consumer inputs retain their own selection.
[consumers.consistency]
packages = ["iroha_cli", "iroha_kagami", "iroha_swarm"]
paths = ["defaults/**", "scripts/tests/consistency.sh"]
binaries = ["iroha", "kagami"]

[consumers.kotodama_docs]
packages = ["ivm", "kotodama_lang"]
# Source projections use the checker's exact fence/heredoc parser and Git base.
# New, changed, deleted, or malformed executable inputs require the compiler;
# prose and docs/history evidence do not. Inventory edits also select this job.
kotodama_document_inventory = "specs/kotodama_v1_docs.json"
paths = ["fixtures/documentation/**"]
binaries = ["koto"]

[consumers.pytests]
packages = ["irohad", "iroha_cli", "iroha_torii"]
paths = ["pytests/iroha_cli_tests/**", "pytests/iroha_torii_tests/**"]
binaries = ["iroha3d", "iroha", "kagami"]

# These runners qualify their own source-bound or debug-only program bundles.
# Empty downloaded-artifact lists are permitted only with an explicit runner;
# CI must preserve those owners rather than substitute the PR shipping bundle.
[consumers.sora_parliament_lifecycle]
packages = ["integration_tests"]
paths = ["crates/iroha_crypto/benches/parliament_crypto*", "dashboards/alerts/sora_parliament_rules.yml", "dashboards/alerts/tests/sora_parliament_rules.test.yml"]
binaries = []
qualified_runner = "ci/check_sora_parliament_lifecycle.sh"

[consumers.nexus_cross_dataspace_localnet]
packages = ["integration_tests"]
paths = []
binaries = []
qualified_runner = "ci/check_nexus_cross_dataspace_localnet.sh"

[consumers.nexus_cross_lane_proofs]
packages = ["integration_tests"]
paths = []
binaries = []
qualified_runner = "ci/check_nexus_cross_lane_proofs.sh"

[paths]
# Generated work products never seed a compile lane, including when nested in a
# package directory. The always-on generated-artifact guard independently
# rejects any forbidden tracked output.
generated = [
  ".cache/**",
  ".cargo-target/**",
  ".generated/**",
  ".pytest_cache/**",
  ".ruff_cache/**",
  ".swiftpm-build/**",
  "**/.build/**",
  "**/.gradle/**",
  "**/.kotlin/**",
  "**/__pycache__/**",
  "**/node_modules/**",
  "**/target/**",
  "_apalache-out/**",
  "artifacts/**",
  "build/**",
  "coverage/**",
  "run/**",
  "target/**",
  "test/**",
]

# These inputs can affect arbitrary crates or generated build state. They
# deliberately fail closed to every Rust lane.
all = [
  ".cargo/**",
  ".github/workflows/**",
  ".gitignore",
  "Cargo.lock",
  "Cargo.toml",
  "benches/**",
  "ci/**",
  "configs/**",
  "contracts/**",
  "data_model/**",
  "defaults/**",
  "dist/.gitkeep",
  "examples/**",
  "fixtures/**",
  "fuzz/**",
  "generated-files.toml",
  "hooks/**",
  "rust-toolchain*",
  "rustfmt.toml",
  "scripts/**",
  "vendor/**",
]

# Package ownership is resolved before these rules, so the Rust package nested
# under `python/` and Rust generators nested under `tools/` remain classified.
ignore = [
  ".agents/**",
  ".github/ISSUE_TEMPLATE/**",
  ".github/PULL_REQUEST_TEMPLATE*",
  "*.md",
  "CODE_OF_CONDUCT*",
  "CONTRIBUTING*",
  "LICENSE*",
  "SECURITY*",
  "IrohaSwift/**",
  "csharp/**",
  "docs/**",
  "java/**",
  "javascript/**",
  "kotlin/**",
  "pytests/**",
  "python/**",
  "specs/**",
]

# Non-package shared paths can select one or more seed lanes. Reverse
# dependencies of every seeded package are added by the classifier.
[paths.lanes]
foundation = ["codec/**"]
execution = ["data_model_schema/**"]
node = ["genesis.*"]
services = ["deploy/soranet/**", "deploy/sorafs/**"]
tooling = ["tools/**"]
integration = ["demo/**"]
