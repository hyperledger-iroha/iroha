version = 1

# These packages compile daemon executables even without an external-binary
# requirement. Foundation-only PRs defer them along with node-launching tests;
# their affected library dependencies and local CLI checks remain selected.
daemon_packages = ["irohad"]

# This manifest is intentionally exhaustive. `scripts/rust_ci.py validate` fails
# whenever a workspace package is missing, duplicated, or no longer exists.
[lanes.foundation]
description = "Foundational codecs, primitives, derives, schemas, and support libraries."
packages = [
  "build-support",
  "iroha_audio",
  "iroha_config_base",
  "iroha_crypto",
  "iroha_derive",
  "iroha_derive_primitives",
  "iroha_ffi",
  "iroha_ffi_proc_macro",
  "iroha_file_mmap",
  "iroha_i18n",
  "iroha_macro",
  "iroha_model_base",
  "iroha_primitives",
  "iroha_primitives_derive",
  "iroha_schema",
  "iroha_schema_derive",
  "iroha_service_model",
  "iroha_telemetry",
  "iroha_telemetry_derive",
  "iroha_version",
  "iroha_version_derive",
  "mv",
  "norito",
  "norito_derive",
]

[lanes.execution]
description = "Data model, IVM, smart-contract, executor, and proof execution."
packages = [
  "fastpq_isi",
  "fastpq_prover",
  "iroha_data_model",
  "iroha_data_model_derive",
