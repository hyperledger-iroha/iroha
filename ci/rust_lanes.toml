version = 1

# This manifest is intentionally exhaustive. `scripts/rust_ci.py validate` fails
# whenever a workspace package is missing, duplicated, or no longer exists.
[lanes.foundation]
description = "Foundational codecs, primitives, derives, schemas, and support libraries."
packages = [
  "build-support",
  "iroha_audio",
  "iroha_config_base",
  "iroha_crypto",
  "iroha_derive",
  "iroha_derive_primitives",
  "iroha_ffi",
  "iroha_ffi_proc_macro",
  "iroha_file_mmap",
  "iroha_i18n",
  "iroha_macro",
  "iroha_primitives",
  "iroha_primitives_derive",
  "iroha_schema",
  "iroha_schema_derive",
  "iroha_telemetry",
  "iroha_telemetry_derive",
  "iroha_version",
  "iroha_version_derive",
  "mv",
  "norito",
  "norito_derive",
]

[lanes.execution]
description = "Data model, IVM, smart-contract, executor, and proof execution."
packages = [
  "fastpq_isi",
  "fastpq_prover",
  "iroha_data_model",
  "iroha_data_model_derive",
  "iroha_executor",
  "iroha_executor_data_model",
  "iroha_executor_data_model_derive",
  "iroha_executor_derive",
  "iroha_smart_contract",
  "iroha_smart_contract_codec",
  "iroha_smart_contract_derive",
  "iroha_smart_contract_utils",
  "iroha_trigger",
  "iroha_trigger_derive",
  "iroha_zkp_halo2",
  "ivm",
  "ivm_abi",
  "ivm_artifact_admission",
  "kaigi_zk",
  "kotodama_lang",
  "zk_ace_prover",
]

[lanes.node]
description = "Node, Torii, client, configuration, networking, and node test support."
packages = [
  "iroha",
  "iroha_cli",
  "iroha_config",
  "iroha_core",
  "iroha_futures",
  "iroha_genesis",
  "iroha_kagami",
  "iroha_logger",
  "iroha_monitor",
  "iroha_p2p",
  "iroha_swarm",
  "iroha_test_network",
  "iroha_test_samples",
  "iroha_torii",
  "iroha_torii_shared",
  "irohad",
]

[lanes.services]
description = "SoraFS, SoraNet, bridge, binding, settlement, and application services."
packages = [
  "connect_norito_bridge",
  "iroha_js_host",
  "iroha_sccp",
  "mochi-core",
  "mochi-integration",
  "mochi-ui",
  "musubi",
  "settlement_router",
  "sora-vpn-backend",
  "sora-vpn-helper",
  "soradns-resolver",
  "sorafs_car",
  "sorafs_chunker",
  "sorafs_manifest",
  "sorafs_node",
  "sorafs_orchestrator",
  "soranet-handshake-harness",
  "soranet-puzzle-service",
  "soranet-relay",
  "soranet_pq",
]

[lanes.tooling]
description = "Code generators, developer tools, samples, benchmarks, and Python bindings."
packages = [
  "enum_trait_bench",
  "executor_custom_data_model",
  "iroha_python_rs",
  "iroha_schema_gen",
  "izanami",
  "kotlin-fixture-gen",
  "mint_rose_trigger_data_model",
  "norito_codegen_exporter",
  "telemetry-schema-diff",
  "xtask",
]

[lanes.hardware]
description = "Platform-specific acceleration and hardware discovery."
packages = [
  "find_cuda_helper",
  "gpuzstd_cuda",
  "gpuzstd_metal",
  "jsonstage1_cuda",
  "jsonstage1_metal",
  "sm3-neon",
  "sm4-neon",
]

[lanes.integration]
description = "Cross-component, multi-peer integration coverage."
packages = ["integration_tests"]

[paths]
# Generated work products never seed a compile lane, including when nested in a
# package directory. The always-on generated-artifact guard independently
# rejects any forbidden tracked output.
generated = [
  ".cache/**",
  ".cargo-target/**",
  ".generated/**",
  ".pytest_cache/**",
  ".ruff_cache/**",
  ".swiftpm-build/**",
  "**/.build/**",
  "**/.gradle/**",
  "**/.kotlin/**",
  "**/__pycache__/**",
  "**/node_modules/**",
  "**/target/**",
  "_apalache-out/**",
  "android_work/**",
  "artifacts/**",
  "build/**",
  "coverage/**",
  "run/**",
  "target/**",
  "test/**",
]

# These inputs can affect arbitrary crates or generated build state. They
# deliberately fail closed to every Rust lane.
all = [
  ".cargo/**",
  ".github/workflows/**",
  ".gitignore",
  "Cargo.lock",
  "Cargo.toml",
  "benches/**",
  "ci/**",
  "configs/**",
  "contracts/**",
  "data_model/**",
  "defaults/**",
  "dist/.gitkeep",
  "examples/**",
  "fixtures/**",
  "fuzz/**",
  "generated-files.toml",
  "hooks/**",
  "rust-toolchain*",
  "rustfmt.toml",
  "scripts/**",
  "vendor/**",
]

# Package ownership is resolved before these rules, so the Rust package nested
# under `python/` and Rust generators nested under `tools/` remain classified.
ignore = [
  ".agents/**",
  ".github/ISSUE_TEMPLATE/**",
  ".github/PULL_REQUEST_TEMPLATE*",
  "*.md",
  "CODE_OF_CONDUCT*",
  "CONTRIBUTING*",
  "LICENSE*",
  "SECURITY*",
  "IrohaSwift/**",
  "csharp/**",
  "docs/**",
  "java/**",
  "javascript/**",
  "kotlin/**",
  "pytests/**",
  "python/**",
]

# Non-package shared paths can select one or more seed lanes. Reverse
# dependencies of every seeded package are added by the classifier.
[paths.lanes]
foundation = ["codec/**"]
execution = ["data_model_schema/**"]
node = ["genesis.*"]
services = ["deploy/soranet/**", "deploy/sorafs/**"]
tooling = ["tools/**"]
integration = ["demo/**"]
